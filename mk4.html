<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>mk4 — Mesh Morph</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0f;
            color: #fff;
            min-height: 100vh;
            overflow: hidden;
            touch-action: none;
        }

        canvas { display: block; width: 100%; height: 100vh; cursor: default; }

        .back-link {
            position: fixed; top: 1rem; left: 1rem;
            color: #666; text-decoration: none; font-size: 0.9rem; z-index: 100;
        }
        .back-link:hover { color: #aaa; }

        .layout-bar {
            position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%);
            display: flex; gap: 6px; z-index: 100;
            background: rgba(20, 20, 35, 0.9);
            backdrop-filter: blur(12px);
            padding: 8px 12px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }

        .layout-btn {
            padding: 8px 16px;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 8px;
            font-size: 12px; font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            background: rgba(255,255,255,0.05);
            color: rgba(255,255,255,0.7);
        }
        .layout-btn:hover {
            background: rgba(255,255,255,0.1);
            border-color: rgba(255,255,255,0.3);
        }
        .layout-btn.active {
            background: linear-gradient(135deg, rgba(99,102,241,0.4), rgba(139,92,246,0.4));
            border-color: rgba(139,92,246,0.6);
            color: #fff;
            box-shadow: 0 2px 10px rgba(99,102,241,0.3);
        }

        .info-label {
            position: fixed; top: 1rem; right: 1rem;
            color: #444; font-size: 0.75rem; z-index: 100;
            font-family: ui-monospace, monospace;
            text-align: right;
        }

        /* Chunk 5: vertex editor panel */
        .edit-panel {
            position: fixed;
            top: 3rem;
            right: 1rem;
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: stretch;
            min-width: 130px;
        }
        .edit-panel .layout-btn {
            text-align: left;
            width: 100%;
        }
        .edit-controls {
            display: none;
            flex-direction: column;
            gap: 6px;
            padding: 8px;
            background: rgba(20, 20, 35, 0.9);
            backdrop-filter: blur(12px);
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .edit-controls.visible { display: flex; }
        .layout-btn.flash {
            background: rgba(111, 202, 143, 0.3);
            border-color: rgba(111, 202, 143, 0.6);
            color: #6fca8f;
        }
    </style>
</head>
<body>
    <a href="index.html" class="back-link">&larr; Back</a>
    <canvas id="canvas"></canvas>
    <div class="info-label" id="info">mk4 &middot; chunk 8 &middot; hidden cells</div>

    <div class="edit-panel">
        <button class="layout-btn" id="editToggle">Edit</button>
        <div class="edit-controls" id="editControls">
            <button class="layout-btn" data-save="L1">Save &rarr; Canonical</button>
            <button class="layout-btn" data-save="L2">Save &rarr; Hex</button>
            <button class="layout-btn" data-save="L3">Save &rarr; Spiral</button>
            <button class="layout-btn" data-save="L4">Save &rarr; Sidebar</button>
            <button class="layout-btn" data-save="L5">Save &rarr; Diagonal</button>
            <button class="layout-btn" data-save="L6">Save &rarr; Bento</button>
            <button class="layout-btn" data-save="L7">Save &rarr; Hollow</button>
            <button class="layout-btn" id="exportBtn">Export JSON</button>
        </div>
    </div>

    <div class="layout-bar" id="layoutBar">
        <button class="layout-btn active" data-layout="L1">Canonical</button>
        <button class="layout-btn" data-layout="L2">Hex</button>
        <button class="layout-btn" data-layout="L3">Spiral</button>
        <button class="layout-btn" data-layout="L4">Sidebar</button>
        <button class="layout-btn" data-layout="L5">Diagonal</button>
        <button class="layout-btn" data-layout="L6">Bento</button>
        <button class="layout-btn" data-layout="L7">Hollow</button>
    </div>

    <script>
    (function() {
        'use strict';

        // =======================================================================
        //  mk4 — MESH MORPH
        //
        //  Architecture:
        //
        //    A half-edge mesh with FIXED TOPOLOGY is the source of truth.
        //    Layouts are different positionings of the same vertices, plus
        //    a per-layout rest area for each face. Transitions linearly
        //    interpolate vertex positions and rest areas. A per-frame
        //    soft-body relaxation pass keeps each cell within its comfort
        //    range (water balloon, not over-hydrated pizza).
        //
        //    Topology never changes → no pops, no vertex correspondence
        //    problem, no assignment problem, no Voronoi at runtime.
        //
        //  Chunk plan (this file is chunk 0):
        //
        //    [0] Scaffold — page chrome, no-op buttons, empty animate loop.
        //    [1] Half-edge mesh + Voronoi seed. Implement HEM. Use a
        //        one-shot Voronoi computation to populate the canonical
        //        mesh from a seed config. Render faces statically.
        //    [2] Layouts as vertex arrays. Float32Array(2*V) per layout.
        //        Two hard-coded layouts. Instant teleport on button click.
        //    [3] Linear interpolation. Lerp vertex positions over ~1200ms.
        //        Topology stays clean by construction; motion still slidey.
        //    [3.5] Rest area plumbing. Add restArea / slack / min / max to
        //        each face. Lerp rest areas alongside vertex positions.
        //        No forces yet.
        //    [4] Soft-body relaxation. Per-frame area-correction forces.
        //        This is where the water-balloon feel arrives.
        //    [5] Vertex editor. Drag vertices, save layouts, export JSON.
        //    [6] Author 4 real layouts using the editor.
        //    [7] Polish — colors, borders, hover, arrival ramp,
        //        per-cell slack tuning, easing.
        // =======================================================================

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const info = document.getElementById('info');

        let W = 0, H = 0, dpr = 1;
        function resize() {
            dpr = window.devicePixelRatio || 1;
            W = window.innerWidth;
            H = window.innerHeight;
            canvas.width = W * dpr;
            canvas.height = H * dpr;
            canvas.style.width = W + 'px';
            canvas.style.height = H + 'px';
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }
        window.addEventListener('resize', resize);
        resize();

        // Layout switching — chunk 0 is no-op, just toggles the active class.
        // Chunks 2+ wire this up to actual layout transitions.
        let currentLayout = 'L1';
        const buttons = document.querySelectorAll('.layout-btn');
        buttons.forEach(btn => {
            btn.addEventListener('click', () => {
                currentLayout = btn.dataset.layout;
                buttons.forEach(b => b.classList.toggle('active', b === btn));
            });
        });

        // ========================= CHUNK 1: HALF-EDGE MESH ====================
        //
        // The HEM is the source of truth: vertices, half-edges, faces with
        // twin/next pointers, and one outer face wrapping the boundary.
        // Built from a one-shot Voronoi computation seeded by canonicalSeeds.
        // Topology of this mesh is FIXED for the lifetime of the page —
        // every layout and every transition shares it.
        //
        //   Vertex   { x, y, id, outHE }
        //   HalfEdge { origin, twin, next, face, id }
        //   Face     { id, halfEdge, isOuter }
        //
        // Convention: cell polygons are wound in screen-CW order (matches the
        // bounding-box winding [(0,0),(W,0),(W,H),(0,H)]). Each interior
        // half-edge has its face on the right when walking origin→dest. The
        // outer face's half-edges run the opposite way around the perimeter.

        function clipPolygonByHalfPlane(poly, mx, my, nx, ny) {
            // Sutherland-Hodgman: keep points where (P - (mx,my)) · (nx,ny) <= 0.
            const out = [];
            const n = poly.length;
            if (n === 0) return out;
            for (let i = 0; i < n; i++) {
                const p = poly[i];
                const q = poly[(i + 1) % n];
                const dp = (p[0] - mx) * nx + (p[1] - my) * ny;
                const dq = (q[0] - mx) * nx + (q[1] - my) * ny;
                if (dp <= 0) out.push(p);
                if ((dp <= 0) !== (dq <= 0)) {
                    const t = dp / (dp - dq);
                    out.push([p[0] + t * (q[0] - p[0]), p[1] + t * (q[1] - p[1])]);
                }
            }
            return out;
        }

        function computeVoronoiPolygons(seeds, W, H) {
            // For each seed, clip the canvas rect by the perpendicular bisector
            // with every other seed. O(n²) per cell, fine at n=12.
            const cells = [];
            for (let i = 0; i < seeds.length; i++) {
                let poly = [[0, 0], [W, 0], [W, H], [0, H]];
                for (let j = 0; j < seeds.length; j++) {
                    if (i === j) continue;
                    const dx = seeds[j].x - seeds[i].x;
                    const dy = seeds[j].y - seeds[i].y;
                    const mx = (seeds[i].x + seeds[j].x) / 2;
                    const my = (seeds[i].y + seeds[j].y) / 2;
                    poly = clipPolygonByHalfPlane(poly, mx, my, dx, dy);
                    if (poly.length === 0) break;
                }
                cells.push(poly);
            }
            return cells;
        }

        function buildHEM(cellPolygons) {
            // Builds a half-edge mesh from a list of cell polygons. Cells share
            // vertices via spatial-snap dedup; an outer face wraps the boundary.
            const hem = {
                vertices: [],
                halfEdges: [],
                faces: [],
                outerFace: null,
            };

            // Snap-to-grid vertex dedup. Voronoi vertices computed from
            // different cells differ by float noise; snap to 0.01 px.
            const SNAP = 100;
            const vertMap = new Map();
            function getVertex(x, y) {
                const key = Math.round(x * SNAP) + ',' + Math.round(y * SNAP);
                let v = vertMap.get(key);
                if (v) return v;
                v = { x, y, id: hem.vertices.length, outHE: null };
                hem.vertices.push(v);
                vertMap.set(key, v);
                return v;
            }

            const heByOriginDest = new Map();  // 'origId,destId' → halfEdge
            for (let i = 0; i < cellPolygons.length; i++) {
                const poly = cellPolygons[i];
                if (poly.length < 3) continue;

                // Resolve and dedup the polygon's vertex list.
                const verts = [];
                for (const p of poly) {
                    const v = getVertex(p[0], p[1]);
                    if (verts.length === 0 || verts[verts.length - 1] !== v) {
                        verts.push(v);
                    }
                }
                while (verts.length > 1 && verts[0] === verts[verts.length - 1]) {
                    verts.pop();
                }
                if (verts.length < 3) continue;

                const face = { id: hem.faces.length, halfEdge: null, isOuter: false };
                hem.faces.push(face);

                const n = verts.length;
                const ring = [];
                for (let k = 0; k < n; k++) {
                    const v0 = verts[k];
                    const he = {
                        origin: v0,
                        twin: null,
                        next: null,
                        face: face,
                        id: hem.halfEdges.length,
                    };
                    hem.halfEdges.push(he);
                    ring.push(he);
                    if (!v0.outHE) v0.outHE = he;
                }
                for (let k = 0; k < n; k++) {
                    ring[k].next = ring[(k + 1) % n];
                    const destId = verts[(k + 1) % n].id;
                    heByOriginDest.set(verts[k].id + ',' + destId, ring[k]);
                }
                face.halfEdge = ring[0];
            }

            // Wire twins; create outer half-edges for unmatched boundary edges.
            const outerHEs = [];
            const interiorHEs = hem.halfEdges.slice();
            for (const he of interiorHEs) {
                if (he.twin) continue;
                const v0 = he.origin;
                const v1 = he.next.origin;
                const twin = heByOriginDest.get(v1.id + ',' + v0.id);
                if (twin) {
                    he.twin = twin;
                    twin.twin = he;
                } else {
                    const outerHE = {
                        origin: v1,
                        twin: he,
                        next: null,
                        face: null,
                        id: hem.halfEdges.length,
                    };
                    hem.halfEdges.push(outerHE);
                    outerHEs.push(outerHE);
                    he.twin = outerHE;
                }
            }

            // Outer face. Its half-edges loop around the perimeter in the
            // opposite winding to the interior cells.
            const outerFace = { id: -1, halfEdge: null, isOuter: true };
            hem.faces.push(outerFace);
            hem.outerFace = outerFace;
            for (const he of outerHEs) he.face = outerFace;

            // Each outer HE goes from v_a to v_b along the boundary; its next
            // is the unique outer HE whose origin is v_b.
            const outerByOrigin = new Map();
            for (const he of outerHEs) outerByOrigin.set(he.origin.id, he);
            for (const he of outerHEs) {
                const dest = he.twin.origin;
                he.next = outerByOrigin.get(dest.id) || null;
            }
            if (outerHEs.length > 0) outerFace.halfEdge = outerHEs[0];

            return hem;
        }

        function facePolygon(face) {
            // Walk a face's half-edges, return its vertex list.
            const verts = [];
            let he = face.halfEdge;
            if (!he) return verts;
            do {
                verts.push(he.origin);
                he = he.next;
                if (!he) break;
            } while (he !== face.halfEdge);
            return verts;
        }

        // Hand-picked canonical seed configuration: 12 seeds in a jittered
        // 4×3 grid as fractions of (W, H). The Voronoi tessellation of these
        // seeds defines the canonical mesh's topology — fixed for life.
        function canonicalSeeds(W, H) {
            return [
                { x: W * 0.15, y: H * 0.20 },
                { x: W * 0.40, y: H * 0.18 },
                { x: W * 0.65, y: H * 0.22 },
                { x: W * 0.88, y: H * 0.20 },
                { x: W * 0.13, y: H * 0.50 },
                { x: W * 0.38, y: H * 0.48 },
                { x: W * 0.62, y: H * 0.52 },
                { x: W * 0.87, y: H * 0.50 },
                { x: W * 0.18, y: H * 0.80 },
                { x: W * 0.42, y: H * 0.82 },
                { x: W * 0.66, y: H * 0.78 },
                { x: W * 0.90, y: H * 0.80 },
            ];
        }

        let canonicalMesh = null;
        function buildCanonicalMesh() {
            const seeds = canonicalSeeds(W, H);
            const polys = computeVoronoiPolygons(seeds, W, H);
            canonicalMesh = buildHEM(polys);
        }
        // Build now and rebuild on resize. Chunk 0's resize() runs first
        // (updates W/H), then this listener rebuilds the mesh.
        window.addEventListener('resize', buildCanonicalMesh);
        buildCanonicalMesh();

        // Distinct color per face — golden-angle hue, dark-theme palette.
        function faceColor(id) {
            const hue = (id * 137.508) % 360;
            return 'hsl(' + hue.toFixed(1) + ', 42%, 38%)';
        }

        function renderMesh(mesh) {
            for (const face of mesh.faces) {
                if (face.isOuter) continue;
                // Chunk 8: visibility lerps in [0, 1]; skip near-zero,
                // and force visible in edit mode so the user can drag
                // hidden cells.
                const vis = (face.visibility != null) ? face.visibility : 1;
                const effectiveVis = (typeof editMode !== 'undefined' && editMode) ? 1 : vis;
                if (effectiveVis < 0.005) continue;

                const verts = facePolygon(face);
                if (verts.length < 3) continue;

                ctx.beginPath();
                ctx.moveTo(verts[0].x, verts[0].y);
                for (let i = 1; i < verts.length; i++) {
                    ctx.lineTo(verts[i].x, verts[i].y);
                }
                ctx.closePath();
                ctx.globalAlpha = effectiveVis;
                ctx.fillStyle = faceColor(face.id);
                ctx.fill();
                ctx.strokeStyle = 'rgba(255,255,255,0.08)';
                ctx.lineWidth = 1;
                ctx.stroke();
                ctx.globalAlpha = 1;
            }
        }

        // ========================= CHUNK 2: LAYOUTS AS VERTEX ARRAYS ==========
        //
        // A Layout is a Float32Array(2 * V) of vertex positions, indexed
        // by vertex.id (so layout[2i] = x, layout[2i+1] = y of vertex i).
        // Switching layouts overwrites the mesh's vertex positions and the
        // next animate frame renders the new arrangement. The half-edge
        // structure is untouched — same vertex objects, same twin/next
        // pointers, same faces. Only positions move.
        //
        // The four layouts here (L2..L4) are deterministic transforms of
        // L1, kept temporarily as test fixtures so we can verify the
        // teleport mechanism and cell-identity preservation. They get
        // replaced by hand-authored layouts in chunk 6.

        function captureLayout(mesh) {
            const arr = new Float32Array(mesh.vertices.length * 2);
            for (let i = 0; i < mesh.vertices.length; i++) {
                arr[i * 2]     = mesh.vertices[i].x;
                arr[i * 2 + 1] = mesh.vertices[i].y;
            }
            return arr;
        }

        function applyLayout(mesh, layout) {
            for (let i = 0; i < mesh.vertices.length; i++) {
                mesh.vertices[i].x = layout[i * 2];
                mesh.vertices[i].y = layout[i * 2 + 1];
            }
        }

        const layouts = {};
        // Chunk 8: parallel dict of cell-id arrays — cells listed here are
        // hidden when the named layout is the transition target. Populated
        // by chunk 7's procedural defaults.
        const layoutHidden = {};
        function buildLayouts() {
            // L1: canonical positions, captured straight from the mesh.
            layouts.L1 = captureLayout(canonicalMesh);

            const N = canonicalMesh.vertices.length;
            const cx = W / 2, cy = H / 2;

            // L2: uniform shrink toward center (cells huddle in, leaves
            // a margin around the edges).
            layouts.L2 = new Float32Array(N * 2);
            for (let i = 0; i < N; i++) {
                const x = layouts.L1[i * 2], y = layouts.L1[i * 2 + 1];
                layouts.L2[i * 2]     = cx + (x - cx) * 0.65;
                layouts.L2[i * 2 + 1] = cy + (y - cy) * 0.65;
            }

            // L3: horizontal squeeze (cells become tall and narrow,
            // bunched in a vertical column at center).
            layouts.L3 = new Float32Array(N * 2);
            for (let i = 0; i < N; i++) {
                const x = layouts.L1[i * 2], y = layouts.L1[i * 2 + 1];
                layouts.L3[i * 2]     = cx + (x - cx) * 0.5;
                layouts.L3[i * 2 + 1] = y;
            }

            // L4: small rotation about center (12°). Rigid transform —
            // guaranteed to preserve cell validity.
            const ang = 12 * Math.PI / 180;
            const cs = Math.cos(ang), sn = Math.sin(ang);
            layouts.L4 = new Float32Array(N * 2);
            for (let i = 0; i < N; i++) {
                const dx = layouts.L1[i * 2] - cx;
                const dy = layouts.L1[i * 2 + 1] - cy;
                layouts.L4[i * 2]     = cx + dx * cs - dy * sn;
                layouts.L4[i * 2 + 1] = cy + dx * sn + dy * cs;
            }
        }
        buildLayouts();

        // Rebuild layouts after each resize-driven mesh rebuild, then
        // re-apply the user's current selection so resize doesn't snap
        // them back to L1. Order matters: buildLayouts must run after
        // chunk 1's buildCanonicalMesh (registration order is preserved).
        window.addEventListener('resize', () => {
            buildLayouts();
            if (layouts[currentLayout]) {
                applyLayout(canonicalMesh, layouts[currentLayout]);
            }
        });

        // Wire the layout buttons. Chunk 0 already added a handler that
        // updates `currentLayout` and toggles .active; this adds a second
        // handler that goes to the layout. `goToLayout` starts as instant
        // teleport (chunk 2) and gets reassigned by chunk 3 to a smooth
        // lerp transition.
        let goToLayout = (name) => {
            if (layouts[name]) applyLayout(canonicalMesh, layouts[name]);
        };
        buttons.forEach(btn => {
            btn.addEventListener('click', () => {
                goToLayout(btn.dataset.layout);
            });
        });

        // ========================= CHUNK 3: LINEAR INTERPOLATION ==============
        //
        // Replaces chunk 2's instant teleport with a timed lerp from
        // wherever the mesh is right now to the target layout. Topology
        // stays clean by construction (no Voronoi recompute, no vertex
        // reassignment, no per-frame tessellation — every vertex just
        // slides from its start position to its target). Motion is still
        // slidey because there are no rest areas / cell forces yet —
        // that's chunks 3.5 and 4.
        //
        // Re-clicking mid-transition is interruptible: it snapshots the
        // current (interpolated) positions as the new start and lerps to
        // the new target from there. No jump, no double-back.

        const TRANSITION_DURATION = 1200;  // ms
        let transitionStart = null;        // Float32Array snapshot
        let transitionTarget = null;       // Float32Array (one of layouts.*)
        let transitionStartTime = 0;
        let transitioning = false;
        // Chunk 8: per-face visibility lerp state. Float32Array(F) each.
        let transitionVisStart = null;
        let transitionVisTarget = null;

        function easeInOutCubic(t) {
            return t < 0.5
                ? 4 * t * t * t
                : 1 - Math.pow(-2 * t + 2, 3) / 2;
        }

        function startTransition(name) {
            // Chunk 8: signature changed from (target Float32Array) to
            // (name string) so we can look up layoutHidden[name] for the
            // visibility lerp target.
            const target = layouts[name];
            if (!target) return;
            transitionStart = captureLayout(canonicalMesh);
            transitionTarget = target;
            // Chunk 3.5: snapshot rest-area endpoints alongside positions.
            // captureRestAreas reads current f.restArea (mid-lerp safe);
            // captureRestAreasFromLayout computes the area each face would
            // have at the target without mutating anything.
            transitionRestStart = captureRestAreas(canonicalMesh);
            transitionRestTarget = captureRestAreasFromLayout(canonicalMesh, target);
            // Chunk 8: snapshot current per-face visibility, compute target
            // visibility from layoutHidden[name]. Cells in the hidden list
            // get target=0 (fade out); others get target=1 (fade in if they
            // were hidden in the previous layout).
            transitionVisStart = captureVisibilities(canonicalMesh);
            transitionVisTarget = computeTargetVisibilities(name);
            transitionStartTime = performance.now();
            transitioning = true;
        }

        function updateTransition(now) {
            if (!transitioning) return;
            const elapsed = now - transitionStartTime;
            const tRaw = Math.min(1, elapsed / TRANSITION_DURATION);
            const tEased = easeInOutCubic(tRaw);

            // Lerp vertex positions.
            const start = transitionStart;
            const target = transitionTarget;
            const verts = canonicalMesh.vertices;
            for (let i = 0; i < verts.length; i++) {
                const sx = start[i * 2],     sy = start[i * 2 + 1];
                const tx = target[i * 2],    ty = target[i * 2 + 1];
                verts[i].x = sx + (tx - sx) * tEased;
                verts[i].y = sy + (ty - sy) * tEased;
            }

            // Chunk 3.5: lerp per-face rest areas in lockstep with the
            // position lerp. Updates restArea + derived comfort bounds.
            // No forces yet — chunk 4 reads these.
            const rs = transitionRestStart;
            const rt = transitionRestTarget;
            // Chunk 8: lerp per-face visibility alongside.
            const vs = transitionVisStart;
            const vt = transitionVisTarget;
            for (const f of canonicalMesh.faces) {
                if (f.isOuter) continue;
                const a0 = rs[f.id];
                const a1 = rt[f.id];
                f.restArea = a0 + (a1 - a0) * tEased;
                f.minArea = f.restArea * (1 - f.slack);
                f.maxArea = f.restArea * (1 + f.slack);
                const v0 = vs[f.id];
                const v1 = vt[f.id];
                f.visibility = v0 + (v1 - v0) * tEased;
            }

            if (tRaw >= 1) {
                transitioning = false;
                transitionStart = null;
                transitionTarget = null;
                transitionRestStart = null;
                transitionRestTarget = null;
                transitionVisStart = null;
                transitionVisTarget = null;
            }
        }

        // Replace chunk 2's teleport with smooth transitions.
        goToLayout = (name) => {
            if (layouts[name]) startTransition(name);
        };

        // ========================= CHUNK 3.5: REST AREA PLUMBING =============
        //
        // Each interior face gains a `restArea`: the natural size that
        // face "wants" to be right now. At steady state, restArea matches
        // the face's actual geometric area, so the comfort range is
        // centered on where the cell already is. Each face also gets a
        // `slack` (default ±25%) and derived `minArea` / `maxArea`.
        //
        // During a transition, restArea lerps alongside vertex positions
        // toward the area the face would have in the target layout. This
        // is the "magic water" piece — natural size is itself animatable,
        // so a cell that's small in one layout and large in another is
        // genuinely small or large in each (not stretched or compressed).
        //
        // No forces yet — the fields are populated but not consulted.
        // Chunk 4 lights up the relaxation pass that uses (restArea,
        // minArea, maxArea) to push back when a cell is squashed or
        // stretched outside its comfort range.

        const DEFAULT_SLACK = 0.25;  // ±25% comfort range

        function signedFaceArea(face) {
            // Geometric area from current mesh vertex positions.
            let a = 0;
            let he = face.halfEdge;
            do {
                const v0 = he.origin;
                const v1 = he.next.origin;
                a += v0.x * v1.y - v1.x * v0.y;
                he = he.next;
            } while (he !== face.halfEdge);
            return a / 2;
        }

        function faceAreaInLayout(face, layout) {
            // Geometric area as if the mesh's vertices were placed at
            // `layout` positions. Pure read — does not mutate the mesh.
            let a = 0;
            let he = face.halfEdge;
            do {
                const v0 = he.origin;
                const v1 = he.next.origin;
                const x0 = layout[v0.id * 2],     y0 = layout[v0.id * 2 + 1];
                const x1 = layout[v1.id * 2],     y1 = layout[v1.id * 2 + 1];
                a += x0 * y1 - x1 * y0;
                he = he.next;
            } while (he !== face.halfEdge);
            return a / 2;
        }

        function initFaceRestAreas(mesh) {
            // Set each interior face's restArea to its current geometric
            // area. Default slack, derived comfort bounds. Chunk 8 also
            // initializes visibility to 1 if it hasn't been set yet (so
            // existing visibility from the current layout survives the
            // re-init triggered by edit-mode toggles, etc.).
            for (const f of mesh.faces) {
                if (f.isOuter) continue;
                f.restArea = signedFaceArea(f);
                f.slack = DEFAULT_SLACK;
                f.minArea = f.restArea * (1 - f.slack);
                f.maxArea = f.restArea * (1 + f.slack);
                if (f.visibility == null) f.visibility = 1;
            }
        }
        initFaceRestAreas(canonicalMesh);
        // After resize: chunks 0/1/2 listeners run first (W/H, mesh,
        // layouts, currentLayout reapply), then this fires last so
        // restArea matches the post-resize layout the user is sitting on.
        window.addEventListener('resize', () => initFaceRestAreas(canonicalMesh));

        function captureRestAreas(mesh) {
            // Snapshot current rest areas indexed by face.id.
            const interior = mesh.faces.filter(f => !f.isOuter);
            const arr = new Float32Array(interior.length);
            for (const f of interior) arr[f.id] = f.restArea;
            return arr;
        }

        function captureRestAreasFromLayout(mesh, layout) {
            // Compute the rest areas each face would have if its vertices
            // were placed according to `layout`. Used at startTransition
            // to fix the target rest areas for the lerp.
            const interior = mesh.faces.filter(f => !f.isOuter);
            const arr = new Float32Array(interior.length);
            for (const f of interior) arr[f.id] = faceAreaInLayout(f, layout);
            return arr;
        }

        // Transient transition state for the rest-area lerp. Populated at
        // startTransition, used by updateTransition, released on completion.
        let transitionRestStart = null;
        let transitionRestTarget = null;

        // ========================= CHUNK 4: SOFT-BODY RELAXATION =============
        //
        // Per-frame relaxation pass that pushes back when a cell's
        // current geometric area drifts outside its comfort range
        // [minArea, maxArea]. This is the water-balloon mechanism:
        // cells resist being squashed or stretched past their natural
        // size, and the resistance reads as "settling" rather than
        // "sliding."
        //
        // Algorithm (per iteration, per face):
        //   1. Compute current area A and geometric centroid C in
        //      one walk over the face's half-edges.
        //   2. Pick target area = nearest comfort-range edge:
        //        if A > maxArea: target = maxArea  (must shrink)
        //        if A < minArea: target = minArea  (must grow)
        //        else: no force, the cell is comfortable.
        //   3. The uniform radial scale that achieves the target is
        //      sqrt(target / A) (since area scales with scale²).
        //   4. Damp by gain α to avoid over-correction across the
        //      coupled mesh: effectiveScale = 1 + α * (scale - 1).
        //   5. For each boundary vertex v of the face, accumulate
        //      a displacement of (v - C) * (effectiveScale - 1).
        //   6. After all faces processed, sum displacements at each
        //      vertex (shared vertices receive contributions from
        //      every incident cell) and apply.
        //
        // RELAX_ITERS iterations per frame so corrections propagate a
        // bit through the mesh. With α = 0.5 and 2 iters, mild stress
        // is smoothed within a single frame; severe stress takes a
        // few frames to settle but the system never explodes.
        //
        // No memory across frames. updateTransition overwrites vertex
        // positions every frame to the pure lerp output, so relaxation
        // is always a fresh per-frame correction layered on the lerp
        // trajectory — never an accumulating drift.
        //
        // Endpoints (t=0 and t=1): cells are exactly at restArea by
        // construction, so the relaxation is a strict no-op. No drift,
        // no force ramping needed at the boundaries of the transition.

        const RELAX_ITERS = 2;
        const RELAX_GAIN  = 0.5;  // damping factor per iteration

        // Reusable per-vertex displacement accumulators (avoid GC).
        let _relaxDX = null;
        let _relaxDY = null;
        function _ensureRelaxBuffers(n) {
            if (!_relaxDX || _relaxDX.length < n) {
                _relaxDX = new Float32Array(n);
                _relaxDY = new Float32Array(n);
            }
        }

        function relaxMesh(mesh) {
            const V = mesh.vertices.length;
            _ensureRelaxBuffers(V);
            const dx = _relaxDX, dy = _relaxDY;

            for (let iter = 0; iter < RELAX_ITERS; iter++) {
                for (let i = 0; i < V; i++) { dx[i] = 0; dy[i] = 0; }

                for (const f of mesh.faces) {
                    if (f.isOuter) continue;

                    // Area + centroid in one walk.
                    let area = 0, cx = 0, cy = 0, n = 0;
                    let he = f.halfEdge;
                    do {
                        const v0 = he.origin;
                        const v1 = he.next.origin;
                        area += v0.x * v1.y - v1.x * v0.y;
                        cx += v0.x;
                        cy += v0.y;
                        n++;
                        he = he.next;
                    } while (he !== f.halfEdge);
                    area *= 0.5;
                    cx /= n;
                    cy /= n;

                    // Pick the comfort-range edge we need to head toward.
                    let target;
                    if (area > f.maxArea)      target = f.maxArea;
                    else if (area < f.minArea) target = f.minArea;
                    else                        continue;  // comfortable

                    if (area <= 0) continue;  // degenerate guard

                    const targetScale    = Math.sqrt(target / area);
                    const effectiveScale = 1 + RELAX_GAIN * (targetScale - 1);
                    const k = effectiveScale - 1;
                    if (k === 0) continue;

                    // Push every boundary vertex radially from the centroid.
                    he = f.halfEdge;
                    do {
                        const v = he.origin;
                        dx[v.id] += (v.x - cx) * k;
                        dy[v.id] += (v.y - cy) * k;
                        he = he.next;
                    } while (he !== f.halfEdge);
                }

                const verts = mesh.vertices;
                for (let i = 0; i < V; i++) {
                    verts[i].x += dx[i];
                    verts[i].y += dy[i];
                }
            }
        }

        // ========================= CHUNK 5: VERTEX EDITOR ====================
        //
        // In-page authoring: drag vertices to position them, save to a
        // layout slot, export all layouts as JSON to paste back into
        // chunk 6's hard-coded layouts.
        //
        // Edit mode disables transitions and the relaxation pass so the
        // user has direct control over vertex positions. Layout buttons
        // in edit mode become instant teleport (load that slot for
        // editing). Outside edit mode, everything is back to chunk 4
        // behavior.
        //
        // Persistence: localStorage caches in-progress work as fractions
        // of (W, H), so refresh AND resize don't lose anything. The
        // Export button copies the same fraction-form JSON to clipboard
        // for committing into chunk 6.

        const STORAGE_KEY = 'mk4-layouts-v1';
        const HANDLE_RADIUS = 5;
        const HIT_RADIUS = 12;

        let editMode = false;
        let draggedVertex = null;
        let hoveredVertex = null;

        // ---- Persistence (fractions of W,H, not pixels) ----

        function saveLayoutsToStorage() {
            try {
                const data = {};
                for (const name of Object.keys(layouts)) {
                    const arr = layouts[name];
                    const frac = new Array(arr.length);
                    for (let i = 0; i < arr.length; i += 2) {
                        frac[i]     = arr[i]     / W;
                        frac[i + 1] = arr[i + 1] / H;
                    }
                    data[name] = frac;
                }
                localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
            } catch (e) {
                console.warn('mk4: failed to save layouts to localStorage', e);
            }
        }

        function loadLayoutsFromStorage() {
            // Reads stored fractions and rehydrates as Float32Array(2*V).
            // Resize-safe: stored values are scaled to current (W, H).
            try {
                const json = localStorage.getItem(STORAGE_KEY);
                if (!json) return false;
                const data = JSON.parse(json);
                const expected = canonicalMesh.vertices.length * 2;
                let any = false;
                for (const name of Object.keys(data)) {
                    const frac = data[name];
                    if (!Array.isArray(frac) || frac.length !== expected) continue;
                    const arr = new Float32Array(expected);
                    for (let i = 0; i < frac.length; i += 2) {
                        arr[i]     = frac[i]     * W;
                        arr[i + 1] = frac[i + 1] * H;
                    }
                    layouts[name] = arr;
                    any = true;
                }
                if (any && layouts[currentLayout]) {
                    applyLayout(canonicalMesh, layouts[currentLayout]);
                    initFaceRestAreas(canonicalMesh);
                }
                return any;
            } catch (e) {
                console.warn('mk4: failed to load layouts from localStorage', e);
                return false;
            }
        }

        function saveCurrentToSlot(name) {
            layouts[name] = captureLayout(canonicalMesh);
            saveLayoutsToStorage();
        }

        function exportLayoutsJSON() {
            // Same fraction form as storage; rounded to 4 decimals.
            const data = {};
            for (const name of Object.keys(layouts)) {
                const arr = layouts[name];
                const frac = [];
                for (let i = 0; i < arr.length; i += 2) {
                    frac.push(+(arr[i]     / W).toFixed(4));
                    frac.push(+(arr[i + 1] / H).toFixed(4));
                }
                data[name] = frac;
            }
            return JSON.stringify(data, null, 2);
        }

        // ---- Hit-test, drag, hover ----

        function vertexAtPoint(x, y) {
            let closest = null;
            let bestDist = HIT_RADIUS;
            for (const v of canonicalMesh.vertices) {
                const d = Math.hypot(x - v.x, y - v.y);
                if (d < bestDist) {
                    bestDist = d;
                    closest = v;
                }
            }
            return closest;
        }

        function updateCursor() {
            if (!editMode) { canvas.style.cursor = 'default'; return; }
            if (draggedVertex)      canvas.style.cursor = 'grabbing';
            else if (hoveredVertex) canvas.style.cursor = 'grab';
            else                    canvas.style.cursor = 'crosshair';
        }

        function canvasPos(e) {
            const rect = canvas.getBoundingClientRect();
            return { x: e.clientX - rect.left, y: e.clientY - rect.top };
        }

        canvas.addEventListener('mousedown', (e) => {
            if (!editMode) return;
            const p = canvasPos(e);
            draggedVertex = vertexAtPoint(p.x, p.y);
            updateCursor();
        });

        canvas.addEventListener('mousemove', (e) => {
            if (!editMode) return;
            const p = canvasPos(e);
            if (draggedVertex) {
                draggedVertex.x = p.x;
                draggedVertex.y = p.y;
            } else {
                hoveredVertex = vertexAtPoint(p.x, p.y);
            }
            updateCursor();
        });

        canvas.addEventListener('mouseup', () => {
            if (!editMode) return;
            draggedVertex = null;
            updateCursor();
        });

        canvas.addEventListener('mouseleave', () => {
            draggedVertex = null;
            hoveredVertex = null;
            updateCursor();
        });

        // ---- Render handles (called from animate when editMode) ----

        function renderHandles() {
            for (const v of canonicalMesh.vertices) {
                const isActive  = v === draggedVertex;
                const isHovered = v === hoveredVertex && !draggedVertex;
                const r = (isActive || isHovered) ? HANDLE_RADIUS * 1.6 : HANDLE_RADIUS;
                ctx.beginPath();
                ctx.arc(v.x, v.y, r, 0, Math.PI * 2);
                ctx.fillStyle = isActive
                    ? '#fff'
                    : isHovered ? 'rgba(255,255,255,0.95)' : 'rgba(255,255,255,0.85)';
                ctx.fill();
                ctx.strokeStyle = 'rgba(0,0,0,0.7)';
                ctx.lineWidth = 1;
                ctx.stroke();
            }
        }

        // ---- Edit panel UI wiring ----

        const editToggle  = document.getElementById('editToggle');
        const editControls = document.getElementById('editControls');

        function setEditMode(on) {
            editMode = on;
            editToggle.classList.toggle('active', on);
            editControls.classList.toggle('visible', on);
            if (on) {
                // Stop any in-flight transition immediately and capture
                // wherever the mesh is RIGHT NOW as the new "rest" so
                // editing starts from a comfortable, force-free state.
                transitioning = false;
                initFaceRestAreas(canonicalMesh);
            }
            updateCursor();
        }
        editToggle.addEventListener('click', () => setEditMode(!editMode));

        document.querySelectorAll('[data-save]').forEach(btn => {
            btn.addEventListener('click', () => {
                saveCurrentToSlot(btn.dataset.save);
                btn.classList.add('flash');
                setTimeout(() => btn.classList.remove('flash'), 600);
            });
        });

        const exportBtn = document.getElementById('exportBtn');
        exportBtn.addEventListener('click', () => {
            const json = exportLayoutsJSON();
            const flash = () => {
                exportBtn.classList.add('flash');
                setTimeout(() => exportBtn.classList.remove('flash'), 600);
            };
            if (navigator.clipboard) {
                navigator.clipboard.writeText(json).then(flash, () => {
                    console.log(json); flash();
                });
            } else {
                console.log(json); flash();
            }
        });

        // ---- Override goToLayout: teleport in edit mode, transition out ----

        const _chunk3GoToLayout = goToLayout;
        goToLayout = (name) => {
            if (editMode) {
                if (layouts[name]) {
                    applyLayout(canonicalMesh, layouts[name]);
                    initFaceRestAreas(canonicalMesh);
                    // Chunk 8: sync visibilities to the new layout on
                    // edit-mode teleport. (Edit mode renders all cells
                    // visibly anyway, but we keep visibility data
                    // accurate so exiting edit mode is consistent.)
                    if (typeof applyLayoutVisibilities === 'function') {
                        applyLayoutVisibilities(name);
                    }
                }
            } else {
                _chunk3GoToLayout(name);
            }
        };

        // ---- Initial load + resize-driven reload from storage ----

        loadLayoutsFromStorage();
        // Runs after chunks 0/1/2/3.5's resize listeners, so the mesh has
        // been rebuilt and rest areas reset before we re-rehydrate stored
        // layouts and re-apply currentLayout.
        window.addEventListener('resize', loadLayoutsFromStorage);

        // ========================= CHUNK 7: PROCEDURAL LAYOUTS ==============
        //
        // Procedural layout generators ported from morph.html. Each
        // generator returns 12 cell specs in canonical-id order (cell 0
        // is the canonical top-left of the 4×3 grid, cell 11 the
        // bottom-right). buildLayoutFromCellSpecs then converts the
        // specs to vertex positions by averaging each vertex's
        // contribution from its incident cells.
        //
        // Note on the averaging method: a cell's "own" scale gets
        // partially overridden by its neighbors' scales at shared
        // vertices. This means uniform-scale layouts (hex, spiral,
        // sidebar, diagonal) work cleanly, while mixed-scale layouts
        // (bento with one big hero) get diluted: the hero is bigger
        // than its neighbors but not as much as the bare scale would
        // imply. Acceptable trade-off for procedural generation.
        //
        // Layouts that need true hidden cells (rim with hollow center,
        // sidebar with void claiming the right side) are deferred to a
        // future chunk that adds per-face visibility lerping. The mk4
        // versions of sidebar and diagonal use natural whitespace from
        // packing cells into one part of the canvas, leaving the rest
        // visually empty without hiding anything.
        //
        // localStorage takes precedence: if you've saved real layouts
        // via the chunk 5 editor, those win on init AND on resize.
        //
        // Cell id → canonical centroid (as fraction of W, H):
        //   0 (0.16, 0.20)   1 (0.42, 0.20)   2 (0.67, 0.22)   3 (0.88, 0.17)
        //   4 (0.13, 0.50)   5 (0.35, 0.49)   6 (0.59, 0.50)   7 (0.84, 0.50)
        //   8 (0.17, 0.80)   9 (0.44, 0.80)  10 (0.68, 0.80)  11 (0.89, 0.82)

        function buildLayoutFromCellSpecs(specs, mesh, canonicalLayout, W, H) {
            // For each interior face, compute its canonical centroid, then
            // accumulate (target_centroid + offset_from_canonical * scale)
            // at each boundary vertex. Shared vertices average across all
            // incident cells, so neighboring cells negotiate the position.
            const V = mesh.vertices.length;
            const arr = new Float32Array(V * 2);
            const counts = new Int32Array(V);

            for (const f of mesh.faces) {
                if (f.isOuter) continue;
                const spec = specs[f.id];
                if (!spec) continue;

                // Canonical centroid of this face.
                let ccx = 0, ccy = 0, n = 0;
                let he = f.halfEdge;
                do {
                    const v = he.origin;
                    ccx += canonicalLayout[v.id * 2];
                    ccy += canonicalLayout[v.id * 2 + 1];
                    n++;
                    he = he.next;
                } while (he !== f.halfEdge);
                ccx /= n;
                ccy /= n;

                const tX = spec.tx * W;
                const tY = spec.ty * H;
                const sx = spec.sx, sy = spec.sy;
                he = f.halfEdge;
                do {
                    const v = he.origin;
                    const ox = canonicalLayout[v.id * 2]     - ccx;
                    const oy = canonicalLayout[v.id * 2 + 1] - ccy;
                    arr[v.id * 2]     += tX + ox * sx;
                    arr[v.id * 2 + 1] += tY + oy * sy;
                    counts[v.id]++;
                    he = he.next;
                } while (he !== f.halfEdge);
            }

            for (let i = 0; i < V; i++) {
                if (counts[i] > 0) {
                    arr[i * 2]     /= counts[i];
                    arr[i * 2 + 1] /= counts[i];
                }
            }
            return arr;
        }

        // ---- Procedural generators ----
        //
        // Each function returns an array of 12 { tx, ty, sx, sy } specs
        // in canonical-id order. tx/ty are fractions of (W, H); sx/sy
        // are scales relative to the canonical centroid offset.

        // HEX — hexagonal close-packing, 4×3 with row-offset.
        // Even rows aligned to columns; odd row shifted half a column.
        function hexLayout(W, H) {
            const r = [];
            for (let row = 0; row < 3; row++) {
                const yFrac = 0.20 + row * 0.30;
                const xOff  = (row % 2) * 0.11;
                for (let col = 0; col < 4; col++) {
                    r.push({
                        tx: 0.105 + col * 0.22 + xOff,
                        ty: yFrac,
                        sx: 0.85, sy: 0.95,
                    });
                }
            }
            return r;
        }

        // SWIRL — each cell rotated around the canvas center from its
        // canonical position, with rotation angle proportional to radius
        // (cells further from center spin more). Topologically friendly:
        // every cell stays close to its canonical neighborhood. Reads as
        // "spiral-ish" without the topology damage that a true Fermat
        // spiral causes when forced onto a fixed 4×3 mesh.
        function spiralLayout(W, H) {
            const r = [];
            const cx = 0.5, cy = 0.5;
            const ar = H / W;  // y is "shorter" — keep angles round in pixel space
            for (let row = 0; row < 3; row++) {
                for (let col = 0; col < 4; col++) {
                    const x = 0.125 + col * 0.25;
                    const y = 0.20  + row * 0.30;
                    // Distance from canvas center in pixel space.
                    const dxp = (x - cx) / ar;
                    const dyp = (y - cy);
                    const radius = Math.hypot(dxp, dyp);
                    const baseAngle = Math.atan2(dyp, dxp);
                    // More spin further out: ~0.5 rad at the corners.
                    const newAngle  = baseAngle + radius * 1.4;
                    const newRadius = radius * 0.85;
                    r.push({
                        tx: cx + newRadius * Math.cos(newAngle) * ar,
                        ty: cy + newRadius * Math.sin(newAngle),
                        sx: 0.85, sy: 0.85,
                    });
                }
            }
            return r;
        }

        // SIDEBAR — cells condensed into a narrow vertical strip on
        // the left, the right ~75% naturally empty. No void cell
        // needed: just compress the x range and let whitespace happen.
        function sidebarLayout(W, H) {
            const r = [];
            for (let row = 0; row < 3; row++) {
                for (let col = 0; col < 4; col++) {
                    r.push({
                        tx: 0.05 + col * 0.05,   // x in [0.05, 0.20]
                        ty: 0.16 + row * 0.34,
                        sx: 0.30, sy: 0.95,
                    });
                }
            }
            return r;
        }

        // DIAGONAL — cells packed into the upper-left triangular half,
        // the lower-right naturally empty. Each cell's target is its
        // canonical position, scaled toward (0, 0).
        function diagonalLayout(W, H) {
            const r = [];
            for (let row = 0; row < 3; row++) {
                for (let col = 0; col < 4; col++) {
                    const cx = 0.125 + col * 0.25;
                    const cy = 0.20  + row * 0.30;
                    r.push({
                        tx: cx * 0.55,
                        ty: cy * 0.55,
                        sx: 0.55, sy: 0.55,
                    });
                }
            }
            return r;
        }

        // BENTO — cell 6 grows as a central hero; the others stay near
        // canonical positions at slightly reduced scale. Mixed scales
        // get diluted by the averaging method, so the hero is visibly
        // bigger but not as dramatic as the bare 1.5 scale would imply.
        function bentoLayout(W, H) {
            const r = [];
            for (let row = 0; row < 3; row++) {
                for (let col = 0; col < 4; col++) {
                    const i = row * 4 + col;
                    if (i === 6) {
                        r.push({ tx: 0.55, ty: 0.50, sx: 1.50, sy: 1.50 });
                    } else {
                        r.push({
                            tx: 0.125 + col * 0.25,
                            ty: 0.20  + row * 0.30,
                            sx: 0.85, sy: 0.85,
                        });
                    }
                }
            }
            return r;
        }

        // HOLLOW — cells around the perimeter, cells 5 and 6 hidden in
        // the center to create a true hollow ring (the chunk 8 visibility
        // subsystem fades them out during the transition into this layout).
        // Cells 5 and 6 keep canonical-ish positions so the visible
        // perimeter cells' inner edges form a clean inner boundary around
        // the hidden cells. The visible 10 cells are pushed slightly
        // toward the canvas edges.
        function hollowLayout(W, H) {
            return [
                { tx: 0.10, ty: 0.13, sx: 0.85, sy: 0.85 },  //  0
                { tx: 0.34, ty: 0.10, sx: 0.85, sy: 0.85 },  //  1
                { tx: 0.66, ty: 0.10, sx: 0.85, sy: 0.85 },  //  2
                { tx: 0.90, ty: 0.13, sx: 0.85, sy: 0.85 },  //  3
                { tx: 0.07, ty: 0.50, sx: 0.85, sy: 0.85 },  //  4
                { tx: 0.35, ty: 0.49, sx: 0.85, sy: 0.85 },  //  5  hidden, holds center
                { tx: 0.59, ty: 0.50, sx: 0.85, sy: 0.85 },  //  6  hidden, holds center
                { tx: 0.93, ty: 0.50, sx: 0.85, sy: 0.85 },  //  7
                { tx: 0.10, ty: 0.87, sx: 0.85, sy: 0.85 },  //  8
                { tx: 0.34, ty: 0.90, sx: 0.85, sy: 0.85 },  //  9
                { tx: 0.66, ty: 0.90, sx: 0.85, sy: 0.85 },  // 10
                { tx: 0.90, ty: 0.87, sx: 0.85, sy: 0.85 },  // 11
            ];
        }

        function applyProceduralDefaults() {
            // Storage takes precedence — only fill slots NOT saved by
            // the chunk 5 editor. L1 is always the canonical mesh.
            let stored = {};
            try {
                stored = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
            } catch (e) {}

            if (!stored.L2) layouts.L2 = buildLayoutFromCellSpecs(hexLayout(W, H),      canonicalMesh, layouts.L1, W, H);
            if (!stored.L3) layouts.L3 = buildLayoutFromCellSpecs(spiralLayout(W, H),   canonicalMesh, layouts.L1, W, H);
            if (!stored.L4) layouts.L4 = buildLayoutFromCellSpecs(sidebarLayout(W, H),  canonicalMesh, layouts.L1, W, H);
            if (!stored.L5) layouts.L5 = buildLayoutFromCellSpecs(diagonalLayout(W, H), canonicalMesh, layouts.L1, W, H);
            if (!stored.L6) layouts.L6 = buildLayoutFromCellSpecs(bentoLayout(W, H),    canonicalMesh, layouts.L1, W, H);
            if (!stored.L7) layouts.L7 = buildLayoutFromCellSpecs(hollowLayout(W, H),   canonicalMesh, layouts.L1, W, H);

            // Chunk 8: populate per-layout hidden lists. Only Hollow has
            // hidden cells; the rest are all-visible. Storage doesn't
            // override the hidden list (editor saves preserve hidden).
            layoutHidden.L1 = [];
            layoutHidden.L2 = [];
            layoutHidden.L3 = [];
            layoutHidden.L4 = [];
            layoutHidden.L5 = [];
            layoutHidden.L6 = [];
            layoutHidden.L7 = [5, 6];

            if (layouts[currentLayout]) {
                applyLayout(canonicalMesh, layouts[currentLayout]);
                initFaceRestAreas(canonicalMesh);
                // Chunk 8: sync visibility state to the current layout.
                if (typeof applyLayoutVisibilities === 'function') {
                    applyLayoutVisibilities(currentLayout);
                }
            }
        }
        applyProceduralDefaults();
        window.addEventListener('resize', applyProceduralDefaults);

        // ========================= CHUNK 8: HIDDEN / VOID CELLS =============
        //
        // Per-face visibility lerping. Each face has a `visibility` value
        // in [0, 1]; rendered alpha = visibility, and faces with visibility
        // below ~0.005 are skipped entirely. Layouts can declare a list of
        // hidden cells via the `layoutHidden[name]` parallel dict; cells
        // listed there fade out during the transition INTO that layout
        // and fade back in during the transition OUT.
        //
        // The hidden cells are still topologically present — they have
        // vertices, share edges with neighbors, get pushed by relaxation
        // — they just aren't drawn. This is exactly the "void cell"
        // mechanism from morph.html, used to create layouts where parts
        // of the canvas read as empty (rim, hollow center, sidebar+void).
        //
        // Where the helpers are wired in:
        //   - chunk 1 renderMesh    : alpha + skip
        //   - chunk 3 startTransition: snapshot/compute viz endpoints
        //   - chunk 3 updateTransition: lerp viz alongside restArea
        //   - chunk 3.5 initFaceRestAreas: default visibility = 1
        //   - chunk 5 goToLayout    : sync viz on edit-mode teleport
        //   - chunk 7 applyProceduralDefaults: populate layoutHidden + sync

        function captureVisibilities(mesh) {
            const interior = mesh.faces.filter(f => !f.isOuter);
            const arr = new Float32Array(interior.length);
            for (const f of interior) arr[f.id] = (f.visibility != null) ? f.visibility : 1;
            return arr;
        }

        function computeTargetVisibilities(name) {
            // Returns a Float32Array(F) with 0 for hidden cells, 1 for visible.
            const interior = canonicalMesh.faces.filter(f => !f.isOuter);
            const arr = new Float32Array(interior.length);
            const hidden = layoutHidden[name] || [];
            const hiddenSet = new Set(hidden);
            for (const f of interior) arr[f.id] = hiddenSet.has(f.id) ? 0 : 1;
            return arr;
        }

        function applyLayoutVisibilities(name) {
            // Snap visibility to the layout's hidden list. Used by teleport
            // paths (edit mode, init, resize) — transition paths use the
            // lerp in updateTransition instead.
            const hidden = layoutHidden[name] || [];
            const hiddenSet = new Set(hidden);
            for (const f of canonicalMesh.faces) {
                if (f.isOuter) continue;
                f.visibility = hiddenSet.has(f.id) ? 0 : 1;
            }
        }

        // Initial sync (chunk 7's applyProceduralDefaults already called
        // applyLayoutVisibilities through the typeof guard, so this is a
        // belt-and-suspenders pass for cases where chunk 7 ran before
        // this function existed).
        applyLayoutVisibilities(currentLayout);

        // ========================= CHUNK 7 LANDS HERE =========================
        // Polish — colors, hover, easing, arrival ramp.

        // Animation loop. requestAnimationFrame passes a high-resolution
        // timestamp; we forward it to updateTransition for the lerp clock.
        // Chunk 1:   renders the static canonical mesh.
        // Chunk 3:   ticks the active transition (lerps vertex positions).
        // Chunk 3.5: lerps per-face rest areas alongside positions.
        // Chunk 4:   relaxes the mesh — pushes back when a cell drifts
        //            outside its comfort range. No-op when all cells
        //            are at restArea.
        // Chunk 5:   in edit mode, skip transition + relax (user has
        //            direct vertex control), and overlay drag handles.
        function animate(now) {
            if (now == null) now = performance.now();
            ctx.clearRect(0, 0, W, H);
            if (canonicalMesh) {
                if (!editMode) {
                    updateTransition(now);
                    relaxMesh(canonicalMesh);
                }
                renderMesh(canonicalMesh);
                if (editMode) renderHandles();
            }
            requestAnimationFrame(animate);
        }
        animate();
    })();
    </script>
</body>
</html>
