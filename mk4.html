        // above ORs the pin into the focus check — one symmetric ramp,
        // no double-stacking.
        //
        // Pin survives layout transitions (cell identity is the persistent
        // thing, not position). Pin is independent of edit mode (chunk 5
        // takes over the cursor in edit mode and click events are
        // edit-mode-filtered).

        let pinnedCellId = null;

        canvas.addEventListener('click', (e) => {
            if (editMode) return;
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            const face = faceAtPoint(canonicalMesh, x, y);
            if (face) {
                // Toggle: clicking the pinned cell unpins it.
                pinnedCellId = (pinnedCellId === face.id) ? null : face.id;
            } else {
                // Click on empty space (or a hidden cell) releases.
                pinnedCellId = null;
            }
        });

        // ========================= CHUNK 12: IDLE BREATHING ===================
        //
        // Subtle per-cell sinusoidal modulation of restArea, so the
        // mesh "breathes" when idle. Recovers some of the live feel
        // that morph.html had via its per-frame pressure loop, without
        // the chaos that loop produced during transitions.
        //
        // Each cell has a phase offset (set once at init, golden-angle
        // distributed so cells aren't synchronized). Each frame:
        //
        //   breathMul = 1 + BREATH_AMP * sin(time * BREATH_FREQ + phase)
        //
        // The relax pass (chunk 4) composes this as a third multiplier
        // alongside hoverMul (chunk 9): effRest = restArea * hover * breath.
        //
        // BREATH_AMP = 0.02 means ±2% area variation. With default slack
        // 0.25, this is well within the comfort range, so the relax
        // doesn't fire forces against the breath — cells just glide
        // through their cycle. Only when stacked on a stressed cell
        // (mid-transition or hovered) does the breath visibly compose.
        //
        // Skipped in edit mode (vertex positions are user-controlled).

        const BREATH_AMP  = 0.02;   // ±2% area variation per cell
        const BREATH_FREQ = 0.0015; // rad/ms = 1.5 rad/s → period ≈ 4.2s
                                    // Bump to 0.003 for ~2s, 0.004 for ~1.5s.

        function updateBreath(now) {
            // Per-frame sinusoidal modulation, golden-angle phase offset
            // so cells breathe out of sync.
            for (const f of canonicalMesh.faces) {
                if (f.isOuter) continue;
                const phase = (f.breathPhase != null) ? f.breathPhase : 0;
                f.breathMul = 1 + BREATH_AMP * Math.sin(now * BREATH_FREQ + phase);
            }
        }

        // ========================= CHUNK 13: CONTAINER SHAPES =================
        //
        // The mesh is computed and rendered against the full rectangular
        // canvas. This chunk adds visual clipping to a non-rectangular
        // container shape: cells extend slightly past the container in
        // some places, but only the inside is drawn (Tier A — visual
        // clipping only). The mesh topology and vertex positions are
        // unchanged; the relax / hover / breath / transitions all run
        // unchanged. Only the renderer wraps face drawing in a clip.
        //
        // Container shapes:
        //   rect    — default; no clip; identical to chunks 1-12
        //   rounded — rounded rectangle, corner radius = min(W,H) * 0.04
        //   circle  — inscribed circle, radius = min(W,H) * 0.45
        //
        // The shape outline is rendered AFTER the cells, as a thin
        // border, so the user can see the container edge.
        //
        // Tier B (geometric mesh fitting onto container shape) is
        // deferred. If clipping looks too harsh on circle/rounded,
        // we'd need to generalize chunk 1's Sutherland-Hodgman from
        // rect-clipping to arbitrary-polygon-clipping.

        const CONTAINER_SHAPES = ['rect', 'rounded', 'circle'];
        let containerShape = 'rect';

        function buildContainerPath(W, H, shape) {
            // Returns a Path2D for the current shape, sized to (W, H).
            const p = new Path2D();
            if (shape === 'rounded') {
                const r = Math.min(W, H) * 0.04;
                // Manual rounded rect (broader browser support than
                // ctx.roundRect, which is recent).
                p.moveTo(r, 0);
                p.lineTo(W - r, 0);
                p.quadraticCurveTo(W, 0, W, r);
                p.lineTo(W, H - r);
                p.quadraticCurveTo(W, H, W - r, H);
                p.lineTo(r, H);
                p.quadraticCurveTo(0, H, 0, H - r);
                p.lineTo(0, r);
                p.quadraticCurveTo(0, 0, r, 0);
                p.closePath();
            } else if (shape === 'circle') {
                const cx = W / 2, cy = H / 2;
                const radius = Math.min(W, H) * 0.45;
                p.arc(cx, cy, radius, 0, Math.PI * 2);
                p.closePath();
            } else {
                // rect — full canvas
                p.rect(0, 0, W, H);
            }
            return p;
        }

        function strokeContainerOutline(ctx, W, H, shape) {
            // Draws the container edge as a thin border so the user
            // can see where the clip is. Skipped for 'rect' since the
            // canvas edge is already the container edge.
            if (shape === 'rect') return;
            const p = buildContainerPath(W, H, shape);
            ctx.strokeStyle = 'rgba(255,255,255,0.18)';
            ctx.lineWidth = 1.5;
            ctx.stroke(p);
        }

        // Shape toggle button — cycles through CONTAINER_SHAPES.
        const shapeToggle = document.getElementById('shapeToggle');
        shapeToggle.addEventListener('click', () => {
            const idx = CONTAINER_SHAPES.indexOf(containerShape);
            containerShape = CONTAINER_SHAPES[(idx + 1) % CONTAINER_SHAPES.length];
            shapeToggle.textContent = 'Shape: ' + containerShape;
        });

        // ========================= CHUNK 14: RENDER-TIME WARPING ==============
        //
        // Tier B for chunk 13 — actually fit cells to the container shape
        // instead of just clipping. The mesh STATE stays in unwarped rect
        // coordinates throughout (so relax / lerp / hover / breath all
        // run unchanged on the rect mesh); the renderer applies a per-
        // vertex warp at draw time so cells are visibly inside the shape.
        // Hit-test for hover/click unwarps the cursor before testing.
        //
        // The warp: for each vertex P, compute offset D = P - C from
        // canvas center. The "rect radius" along direction D is dRect
        // (distance from center to rect perimeter along D). The "shape
        // radius" along the same direction is dShape (constant for
        // circle, equal to dRect for rect, geometric for rounded). Then
        //   P' = C + D * (dShape / dRect)
        // Center → center; rect perimeter → shape perimeter; intermediate
        // points scale linearly along their ray.
        //
        // Identity warp for shape='rect' (dShape == dRect). For circle,
        // the whole mesh shrinks toward center to fit inside the
        // inscribed circle. For rounded, only points near the corners
        // get nudged inward.

        function rectRadiusAlong(dx, dy, W, H) {
            // Distance from canvas center to the rect perimeter along
            // the direction (dx, dy). Smallest positive parameter s
            // such that (cx + s*dx, cy + s*dy) hits a rect edge,
            // multiplied by the input direction's magnitude.
            const cx = W / 2, cy = H / 2;
            let s = Infinity;
            if (dx > 0) s = Math.min(s, (W - cx) / dx);
            if (dx < 0) s = Math.min(s, -cx / dx);
            if (dy > 0) s = Math.min(s, (H - cy) / dy);
            if (dy < 0) s = Math.min(s, -cy / dy);
            return s * Math.hypot(dx, dy);
        }

        function shapeRadiusAlong(dx, dy, W, H, shape) {
            // The container shape's radius (distance from center to
            // perimeter) along direction (dx, dy).
            if (shape === 'circle') {
                return Math.min(W, H) * 0.45;
            }
            if (shape === 'rounded') {
                // Rounded rect with corner radius r. The perimeter along
                // a ray from center is the rect perimeter MINUS the
                // amount cut off by the rounding at the nearest corner.
                // For rays that exit through a flat edge, identical to
                // rect. For rays that exit through a rounded corner,
                // solve a small quadratic for the ray-circle intersection
                // with the corner arc.
                const cx = W / 2, cy = H / 2;
                const r = Math.min(W, H) * 0.04;
                // First find where the ray hits the rect-minus-corners.
                // Parametric: ray = (cx + t*dx, cy + t*dy). Find smallest
                // positive t where this is on a flat edge (not in a
                // rounded corner region). If the closest hit is in a
                // corner, do the arc intersection instead.
                let t = Infinity;
                let exitX, exitY;
                if (dx > 0) { const tt = (W - cx) / dx; if (tt < t) { t = tt; exitX = W; exitY = cy + t*dy; } }
                if (dx < 0) { const tt = -cx / dx;       if (tt < t) { t = tt; exitX = 0; exitY = cy + t*dy; } }
                if (dy > 0) { const tt = (H - cy) / dy; if (tt < t) { t = tt; exitX = cx + t*dx; exitY = H; } }
                if (dy < 0) { const tt = -cy / dy;       if (tt < t) { t = tt; exitX = cx + t*dx; exitY = 0; } }
                // Determine if the exit point is in a corner region:
                // within r of both a horizontal and vertical edge.
                const nearLeft   = exitX < r;
                const nearRight  = exitX > W - r;
                const nearTop    = exitY < r;
                const nearBottom = exitY > H - r;
                const inCorner   = (nearLeft || nearRight) && (nearTop || nearBottom);
                if (!inCorner) {
                    return t * Math.hypot(dx, dy);
                }
                // Ray hits a corner arc. Corner center:
                const ccx = nearLeft ? r : (W - r);
                const ccy = nearTop  ? r : (H - r);
                // Find intersection of ray (cx + t*dx, cy + t*dy) with
                // circle of radius r centered at (ccx, ccy).
                // (cx + t*dx - ccx)^2 + (cy + t*dy - ccy)^2 = r^2
                const ex = cx - ccx, ey = cy - ccy;
                const a = dx*dx + dy*dy;
                const b = 2 * (ex*dx + ey*dy);
                const c = ex*ex + ey*ey - r*r;
                const disc = b*b - 4*a*c;
                if (disc < 0) return t * Math.hypot(dx, dy);  // shouldn't happen
                const sqd = Math.sqrt(disc);
                const t1 = (-b - sqd) / (2*a);
                const t2 = (-b + sqd) / (2*a);
                // Choose the larger positive (the exit, not the entry)
                const tArc = (t2 > 0) ? t2 : t1;
                return tArc * Math.hypot(dx, dy);
            }
            // rect — return rect radius (identity warp)
            return rectRadiusAlong(dx, dy, W, H);
        }

        function warpVertex(x, y, W, H, shape) {
            if (shape === 'rect') return { x, y };
            const cx = W / 2, cy = H / 2;
            const dx = x - cx;
            const dy = y - cy;
            if (dx === 0 && dy === 0) return { x: cx, y: cy };
            const dRect  = rectRadiusAlong(dx, dy, W, H);
            const dShape = shapeRadiusAlong(dx, dy, W, H, shape);
            const scale  = dShape / dRect;
            return { x: cx + dx * scale, y: cy + dy * scale };
        }

        function unwarpVertex(x, y, W, H, shape) {
            // Inverse of warpVertex: given a screen-space point, find
            // the unwarped mesh-space point. Direction is preserved by
            // the warp, so the same dShape/dRect computation applies in
            // reverse.
            if (shape === 'rect') return { x, y };
            const cx = W / 2, cy = H / 2;
            const dx = x - cx;
            const dy = y - cy;
            if (dx === 0 && dy === 0) return { x: cx, y: cy };
            const dRect  = rectRadiusAlong(dx, dy, W, H);
            const dShape = shapeRadiusAlong(dx, dy, W, H, shape);
            const scale  = dRect / dShape;  // inverted ratio
            return { x: cx + dx * scale, y: cy + dy * scale };
        }

        // ========================= CHUNK 7 LANDS HERE =========================
        // Polish — colors, hover, easing, arrival ramp.

        // Animation loop. requestAnimationFrame passes a high-resolution
        // timestamp; we forward it to updateTransition for the lerp clock.
        // Chunk 1:   renders the static canonical mesh.
        // Chunk 3:   ticks the active transition (lerps vertex positions).
        // Chunk 3.5: lerps per-face rest areas alongside positions.
        // Chunk 4:   relaxes the mesh — pushes back when a cell drifts
        //            outside its comfort range. No-op when all cells
        //            are at restArea.
        // Chunk 5:   in edit mode, skip transition + relax (user has
        //            direct vertex control), and overlay drag handles.
        function animate(now) {
            if (now == null) now = performance.now();
            ctx.clearRect(0, 0, W, H);
            if (canonicalMesh) {
                if (!editMode) {
                    updateTransition(now);
                    if (typeof updateHover  === 'function') updateHover();
                    if (typeof updateBreath === 'function') updateBreath(now);
                    relaxMesh(canonicalMesh);
                }
                renderMesh(canonicalMesh);
                if (editMode) renderHandles();
            }
            requestAnimationFrame(animate);
        }
        animate();
    })();
    </script>
</body>
