<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>mk4 — Mesh Morph</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0f;
            color: #fff;
            min-height: 100vh;
            overflow: hidden;
            touch-action: none;
        }

        canvas { display: block; width: 100%; height: 100vh; cursor: default; }

        .back-link {
            position: fixed; top: 1rem; left: 1rem;
            color: #666; text-decoration: none; font-size: 0.9rem; z-index: 100;
        }
        .back-link:hover { color: #aaa; }

        .layout-bar {
            position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%);
            display: flex; gap: 6px; z-index: 100;
            background: rgba(20, 20, 35, 0.9);
            backdrop-filter: blur(12px);
            padding: 8px 12px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }

        .layout-btn {
            padding: 8px 16px;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 8px;
            font-size: 12px; font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            background: rgba(255,255,255,0.05);
            color: rgba(255,255,255,0.7);
        }
        .layout-btn:hover {
            background: rgba(255,255,255,0.1);
            border-color: rgba(255,255,255,0.3);
        }
        .layout-btn.active {
            background: linear-gradient(135deg, rgba(99,102,241,0.4), rgba(139,92,246,0.4));
            border-color: rgba(139,92,246,0.6);
            color: #fff;
            box-shadow: 0 2px 10px rgba(99,102,241,0.3);
        }

        .info-label {
            position: fixed; top: 1rem; right: 1rem;
            color: #444; font-size: 0.75rem; z-index: 100;
            font-family: ui-monospace, monospace;
            text-align: right;
        }
    </style>
</head>
<body>
    <a href="index.html" class="back-link">&larr; Back</a>
    <canvas id="canvas"></canvas>
    <div class="info-label" id="info">mk4 &middot; chunk 2 &middot; layout teleport</div>

    <div class="layout-bar" id="layoutBar">
        <button class="layout-btn active" data-layout="L1">Layout 1</button>
        <button class="layout-btn" data-layout="L2">Layout 2</button>
        <button class="layout-btn" data-layout="L3">Layout 3</button>
        <button class="layout-btn" data-layout="L4">Layout 4</button>
    </div>

    <script>
    (function() {
        'use strict';

        // =======================================================================
        //  mk4 — MESH MORPH
        //
        //  Architecture:
        //
        //    A half-edge mesh with FIXED TOPOLOGY is the source of truth.
        //    Layouts are different positionings of the same vertices, plus
        //    a per-layout rest area for each face. Transitions linearly
        //    interpolate vertex positions and rest areas. A per-frame
        //    soft-body relaxation pass keeps each cell within its comfort
        //    range (water balloon, not over-hydrated pizza).
        //
        //    Topology never changes → no pops, no vertex correspondence
        //    problem, no assignment problem, no Voronoi at runtime.
        //
        //  Chunk plan (this file is chunk 0):
        //
        //    [0] Scaffold — page chrome, no-op buttons, empty animate loop.
        //    [1] Half-edge mesh + Voronoi seed. Implement HEM. Use a
        //        one-shot Voronoi computation to populate the canonical
        //        mesh from a seed config. Render faces statically.
        //    [2] Layouts as vertex arrays. Float32Array(2*V) per layout.
        //        Two hard-coded layouts. Instant teleport on button click.
        //    [3] Linear interpolation. Lerp vertex positions over ~1200ms.
        //        Topology stays clean by construction; motion still slidey.
        //    [3.5] Rest area plumbing. Add restArea / slack / min / max to
        //        each face. Lerp rest areas alongside vertex positions.
        //        No forces yet.
        //    [4] Soft-body relaxation. Per-frame area-correction forces.
        //        This is where the water-balloon feel arrives.
        //    [5] Vertex editor. Drag vertices, save layouts, export JSON.
        //    [6] Author 4 real layouts using the editor.
        //    [7] Polish — colors, borders, hover, arrival ramp,
        //        per-cell slack tuning, easing.
        // =======================================================================

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const info = document.getElementById('info');

        let W = 0, H = 0, dpr = 1;
        function resize() {
            dpr = window.devicePixelRatio || 1;
            W = window.innerWidth;
            H = window.innerHeight;
            canvas.width = W * dpr;
            canvas.height = H * dpr;
            canvas.style.width = W + 'px';
            canvas.style.height = H + 'px';
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }
        window.addEventListener('resize', resize);
        resize();

        // Layout switching — chunk 0 is no-op, just toggles the active class.
        // Chunks 2+ wire this up to actual layout transitions.
        let currentLayout = 'L1';
        const buttons = document.querySelectorAll('.layout-btn');
        buttons.forEach(btn => {
            btn.addEventListener('click', () => {
                currentLayout = btn.dataset.layout;
                buttons.forEach(b => b.classList.toggle('active', b === btn));
            });
        });

        // ========================= CHUNK 1: HALF-EDGE MESH ====================
        //
        // The HEM is the source of truth: vertices, half-edges, faces with
        // twin/next pointers, and one outer face wrapping the boundary.
        // Built from a one-shot Voronoi computation seeded by canonicalSeeds.
        // Topology of this mesh is FIXED for the lifetime of the page —
        // every layout and every transition shares it.
        //
        //   Vertex   { x, y, id, outHE }
        //   HalfEdge { origin, twin, next, face, id }
        //   Face     { id, halfEdge, isOuter }
        //
        // Convention: cell polygons are wound in screen-CW order (matches the
        // bounding-box winding [(0,0),(W,0),(W,H),(0,H)]). Each interior
        // half-edge has its face on the right when walking origin→dest. The
        // outer face's half-edges run the opposite way around the perimeter.

        function clipPolygonByHalfPlane(poly, mx, my, nx, ny) {
            // Sutherland-Hodgman: keep points where (P - (mx,my)) · (nx,ny) <= 0.
            const out = [];
            const n = poly.length;
            if (n === 0) return out;
            for (let i = 0; i < n; i++) {
                const p = poly[i];
                const q = poly[(i + 1) % n];
                const dp = (p[0] - mx) * nx + (p[1] - my) * ny;
                const dq = (q[0] - mx) * nx + (q[1] - my) * ny;
                if (dp <= 0) out.push(p);
                if ((dp <= 0) !== (dq <= 0)) {
                    const t = dp / (dp - dq);
                    out.push([p[0] + t * (q[0] - p[0]), p[1] + t * (q[1] - p[1])]);
                }
            }
            return out;
        }

        function computeVoronoiPolygons(seeds, W, H) {
            // For each seed, clip the canvas rect by the perpendicular bisector
            // with every other seed. O(n²) per cell, fine at n=12.
            const cells = [];
            for (let i = 0; i < seeds.length; i++) {
                let poly = [[0, 0], [W, 0], [W, H], [0, H]];
                for (let j = 0; j < seeds.length; j++) {
                    if (i === j) continue;
                    const dx = seeds[j].x - seeds[i].x;
                    const dy = seeds[j].y - seeds[i].y;
                    const mx = (seeds[i].x + seeds[j].x) / 2;
                    const my = (seeds[i].y + seeds[j].y) / 2;
                    poly = clipPolygonByHalfPlane(poly, mx, my, dx, dy);
                    if (poly.length === 0) break;
                }
                cells.push(poly);
            }
            return cells;
        }

        function buildHEM(cellPolygons) {
            // Builds a half-edge mesh from a list of cell polygons. Cells share
            // vertices via spatial-snap dedup; an outer face wraps the boundary.
            const hem = {
                vertices: [],
                halfEdges: [],
                faces: [],
                outerFace: null,
            };

            // Snap-to-grid vertex dedup. Voronoi vertices computed from
            // different cells differ by float noise; snap to 0.01 px.
            const SNAP = 100;
            const vertMap = new Map();
            function getVertex(x, y) {
                const key = Math.round(x * SNAP) + ',' + Math.round(y * SNAP);
                let v = vertMap.get(key);
                if (v) return v;
                v = { x, y, id: hem.vertices.length, outHE: null };
                hem.vertices.push(v);
                vertMap.set(key, v);
                return v;
            }

            const heByOriginDest = new Map();  // 'origId,destId' → halfEdge
            for (let i = 0; i < cellPolygons.length; i++) {
                const poly = cellPolygons[i];
                if (poly.length < 3) continue;

                // Resolve and dedup the polygon's vertex list.
                const verts = [];
                for (const p of poly) {
                    const v = getVertex(p[0], p[1]);
                    if (verts.length === 0 || verts[verts.length - 1] !== v) {
                        verts.push(v);
                    }
                }
                while (verts.length > 1 && verts[0] === verts[verts.length - 1]) {
                    verts.pop();
                }
                if (verts.length < 3) continue;

                const face = { id: hem.faces.length, halfEdge: null, isOuter: false };
                hem.faces.push(face);

                const n = verts.length;
                const ring = [];
                for (let k = 0; k < n; k++) {
                    const v0 = verts[k];
                    const he = {
                        origin: v0,
                        twin: null,
                        next: null,
                        face: face,
                        id: hem.halfEdges.length,
                    };
                    hem.halfEdges.push(he);
                    ring.push(he);
                    if (!v0.outHE) v0.outHE = he;
                }
                for (let k = 0; k < n; k++) {
                    ring[k].next = ring[(k + 1) % n];
                    const destId = verts[(k + 1) % n].id;
                    heByOriginDest.set(verts[k].id + ',' + destId, ring[k]);
                }
                face.halfEdge = ring[0];
            }

            // Wire twins; create outer half-edges for unmatched boundary edges.
            const outerHEs = [];
            const interiorHEs = hem.halfEdges.slice();
            for (const he of interiorHEs) {
                if (he.twin) continue;
                const v0 = he.origin;
                const v1 = he.next.origin;
                const twin = heByOriginDest.get(v1.id + ',' + v0.id);
                if (twin) {
                    he.twin = twin;
                    twin.twin = he;
                } else {
                    const outerHE = {
                        origin: v1,
                        twin: he,
                        next: null,
                        face: null,
                        id: hem.halfEdges.length,
                    };
                    hem.halfEdges.push(outerHE);
                    outerHEs.push(outerHE);
                    he.twin = outerHE;
                }
            }

            // Outer face. Its half-edges loop around the perimeter in the
            // opposite winding to the interior cells.
            const outerFace = { id: -1, halfEdge: null, isOuter: true };
            hem.faces.push(outerFace);
            hem.outerFace = outerFace;
            for (const he of outerHEs) he.face = outerFace;

            // Each outer HE goes from v_a to v_b along the boundary; its next
            // is the unique outer HE whose origin is v_b.
            const outerByOrigin = new Map();
            for (const he of outerHEs) outerByOrigin.set(he.origin.id, he);
            for (const he of outerHEs) {
                const dest = he.twin.origin;
                he.next = outerByOrigin.get(dest.id) || null;
            }
            if (outerHEs.length > 0) outerFace.halfEdge = outerHEs[0];

            return hem;
        }

        function facePolygon(face) {
            // Walk a face's half-edges, return its vertex list.
            const verts = [];
            let he = face.halfEdge;
            if (!he) return verts;
            do {
                verts.push(he.origin);
                he = he.next;
                if (!he) break;
            } while (he !== face.halfEdge);
            return verts;
        }

        // Hand-picked canonical seed configuration: 12 seeds in a jittered
        // 4×3 grid as fractions of (W, H). The Voronoi tessellation of these
        // seeds defines the canonical mesh's topology — fixed for life.
        function canonicalSeeds(W, H) {
            return [
                { x: W * 0.15, y: H * 0.20 },
                { x: W * 0.40, y: H * 0.18 },
                { x: W * 0.65, y: H * 0.22 },
                { x: W * 0.88, y: H * 0.20 },
                { x: W * 0.13, y: H * 0.50 },
                { x: W * 0.38, y: H * 0.48 },
                { x: W * 0.62, y: H * 0.52 },
                { x: W * 0.87, y: H * 0.50 },
                { x: W * 0.18, y: H * 0.80 },
                { x: W * 0.42, y: H * 0.82 },
                { x: W * 0.66, y: H * 0.78 },
                { x: W * 0.90, y: H * 0.80 },
            ];
        }

        let canonicalMesh = null;
        function buildCanonicalMesh() {
            const seeds = canonicalSeeds(W, H);
            const polys = computeVoronoiPolygons(seeds, W, H);
            canonicalMesh = buildHEM(polys);
        }
        // Build now and rebuild on resize. Chunk 0's resize() runs first
        // (updates W/H), then this listener rebuilds the mesh.
        window.addEventListener('resize', buildCanonicalMesh);
        buildCanonicalMesh();

        // Distinct color per face — golden-angle hue, dark-theme palette.
        function faceColor(id) {
            const hue = (id * 137.508) % 360;
            return 'hsl(' + hue.toFixed(1) + ', 42%, 38%)';
        }

        function renderMesh(mesh) {
            for (const face of mesh.faces) {
                if (face.isOuter) continue;
                const verts = facePolygon(face);
                if (verts.length < 3) continue;

                ctx.beginPath();
                ctx.moveTo(verts[0].x, verts[0].y);
                for (let i = 1; i < verts.length; i++) {
                    ctx.lineTo(verts[i].x, verts[i].y);
                }
                ctx.closePath();
                ctx.fillStyle = faceColor(face.id);
                ctx.fill();
                ctx.strokeStyle = 'rgba(255,255,255,0.08)';
                ctx.lineWidth = 1;
                ctx.stroke();
            }
        }

        // ========================= CHUNK 2: LAYOUTS AS VERTEX ARRAYS ==========
        //
        // A Layout is a Float32Array(2 * V) of vertex positions, indexed
        // by vertex.id (so layout[2i] = x, layout[2i+1] = y of vertex i).
        // Switching layouts overwrites the mesh's vertex positions and the
        // next animate frame renders the new arrangement. The half-edge
        // structure is untouched — same vertex objects, same twin/next
        // pointers, same faces. Only positions move.
        //
        // The four layouts here (L2..L4) are deterministic transforms of
        // L1, kept temporarily as test fixtures so we can verify the
        // teleport mechanism and cell-identity preservation. They get
        // replaced by hand-authored layouts in chunk 6.

        function captureLayout(mesh) {
            const arr = new Float32Array(mesh.vertices.length * 2);
            for (let i = 0; i < mesh.vertices.length; i++) {
                arr[i * 2]     = mesh.vertices[i].x;
                arr[i * 2 + 1] = mesh.vertices[i].y;
            }
            return arr;
        }

        function applyLayout(mesh, layout) {
            for (let i = 0; i < mesh.vertices.length; i++) {
                mesh.vertices[i].x = layout[i * 2];
                mesh.vertices[i].y = layout[i * 2 + 1];
            }
        }

        const layouts = {};
        function buildLayouts() {
            // L1: canonical positions, captured straight from the mesh.
            layouts.L1 = captureLayout(canonicalMesh);

            const N = canonicalMesh.vertices.length;
            const cx = W / 2, cy = H / 2;

            // L2: uniform shrink toward center (cells huddle in, leaves
            // a margin around the edges).
            layouts.L2 = new Float32Array(N * 2);
            for (let i = 0; i < N; i++) {
                const x = layouts.L1[i * 2], y = layouts.L1[i * 2 + 1];
                layouts.L2[i * 2]     = cx + (x - cx) * 0.65;
                layouts.L2[i * 2 + 1] = cy + (y - cy) * 0.65;
            }

            // L3: horizontal squeeze (cells become tall and narrow,
            // bunched in a vertical column at center).
            layouts.L3 = new Float32Array(N * 2);
            for (let i = 0; i < N; i++) {
                const x = layouts.L1[i * 2], y = layouts.L1[i * 2 + 1];
                layouts.L3[i * 2]     = cx + (x - cx) * 0.5;
                layouts.L3[i * 2 + 1] = y;
            }

            // L4: small rotation about center (12°). Rigid transform —
            // guaranteed to preserve cell validity.
            const ang = 12 * Math.PI / 180;
            const cs = Math.cos(ang), sn = Math.sin(ang);
            layouts.L4 = new Float32Array(N * 2);
            for (let i = 0; i < N; i++) {
                const dx = layouts.L1[i * 2] - cx;
                const dy = layouts.L1[i * 2 + 1] - cy;
                layouts.L4[i * 2]     = cx + dx * cs - dy * sn;
                layouts.L4[i * 2 + 1] = cy + dx * sn + dy * cs;
            }
        }
        buildLayouts();

        // Rebuild layouts after each resize-driven mesh rebuild, then
        // re-apply the user's current selection so resize doesn't snap
        // them back to L1. Order matters: buildLayouts must run after
        // chunk 1's buildCanonicalMesh (registration order is preserved).
        window.addEventListener('resize', () => {
            buildLayouts();
            if (layouts[currentLayout]) {
                applyLayout(canonicalMesh, layouts[currentLayout]);
            }
        });

        // Wire the layout buttons to teleport. Chunk 0 already added a
        // handler that updates `currentLayout` and toggles .active; this
        // adds a second handler that actually applies the layout.
        buttons.forEach(btn => {
            btn.addEventListener('click', () => {
                const name = btn.dataset.layout;
                if (layouts[name]) applyLayout(canonicalMesh, layouts[name]);
            });
        });

        // ========================= CHUNK 3 LANDS HERE =========================
        // Linear interpolation animation between layouts.

        // ========================= CHUNK 3.5 LANDS HERE =======================
        // Per-face rest area + comfort range + lerping.

        // ========================= CHUNK 4 LANDS HERE =========================
        // Soft-body relaxation (the water-balloon pass).

        // ========================= CHUNK 5 LANDS HERE =========================
        // In-page vertex editor.

        // ========================= CHUNK 6 LANDS HERE =========================
        // Authored layouts.

        // ========================= CHUNK 7 LANDS HERE =========================
        // Polish — colors, hover, easing, arrival ramp.

        // Animation loop. Chunk 1 renders the static canonical mesh; later
        // chunks add layout state, lerping, relaxation forces, etc.
        function animate() {
            ctx.clearRect(0, 0, W, H);
            if (canonicalMesh) renderMesh(canonicalMesh);
            requestAnimationFrame(animate);
        }
        animate();
    })();
    </script>
</body>
</html>
