<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>mk8 — Voronoi × Morph</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            min-height: 100vh;
            overflow: hidden;
            touch-action: none;
        }

        .app {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .canvas-container {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        #voronoiCanvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }

        .tooltip {
            position: absolute;
            background: rgba(0, 0, 0, 0.9);
            color: #fff;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            pointer-events: none;
            opacity: 0;
            transform: translateY(5px);
            transition: opacity 0.2s, transform 0.2s;
            z-index: 100;
            white-space: nowrap;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        .tooltip.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* FPS Counter Overlay */
        .fps-overlay {
            position: absolute;
            bottom: 16px;
            left: 16px;
            z-index: 2147483647;
            user-select: none;
            font-family: ui-monospace, 'SF Mono', 'Monaco', 'Consolas', monospace;
        }

        .fps-container {
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(4px);
            color: white;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            overflow: hidden;
            min-width: 200px;
        }

        .fps-container.minimized {
            min-width: auto;
        }

        .fps-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 12px;
            cursor: pointer;
            transition: background 0.15s;
        }

        .fps-header:hover {
            background: rgba(255,255,255,0.1);
        }

        .fps-header-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .fps-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .fps-title {
            font-size: 12px;
            font-weight: 600;
        }

        .fps-header-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .fps-current {
            font-size: 14px;
            font-weight: 700;
        }

        .fps-toggle {
            font-size: 10px;
            color: rgba(255,255,255,0.4);
        }

        .fps-body {
            padding: 4px 12px 12px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        .fps-stats-row {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            color: rgba(255,255,255,0.4);
            margin-bottom: 8px;
        }

        .fps-stat-value {
            color: white;
        }

        .fps-stat-value.good { color: #22c55e; }
        .fps-stat-value.bad { color: #ef4444; }

        .fps-frame-info {
            font-size: 10px;
            color: rgba(255,255,255,0.4);
            margin-bottom: 8px;
        }

        .fps-frame-value {
            color: white;
        }

        .fps-frame-target {
            color: rgba(255,255,255,0.3);
            margin-left: 8px;
        }

        .fps-graph-container {
            position: relative;
            background: rgba(0,0,0,0.5);
            border-radius: 4px;
            overflow: hidden;
        }

        .fps-graph-svg {
            display: block;
        }

        .fps-graph-label {
            position: absolute;
            right: 4px;
            font-size: 8px;
            color: rgba(255,255,255,0.3);
        }

        .fps-graph-label.top { top: 0; }
        .fps-graph-label.bottom { bottom: 0; }

        .fps-good { color: #22c55e; }
        .fps-ok { color: #eab308; }
        .fps-bad { color: #ef4444; }

        .controls {
            background: rgba(20, 20, 35, 0.95);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255,255,255,0.1);
            padding: 12px 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px 16px;
            align-items: flex-end;
        }

        .control-section {
            display: contents;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 100px;
        }

        .control-group.wide {
            min-width: 130px;
        }

        .control-group label {
            font-size: 9px;
            color: rgba(255,255,255,0.5);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        .control-row {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        input[type="range"] {
            flex: 1;
            height: 4px;
            border-radius: 2px;
            background: rgba(255,255,255,0.15);
            outline: none;
            -webkit-appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #6366f1;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(99,102,241,0.4);
            transition: transform 0.15s;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.15);
        }

        .control-value {
            font-size: 11px;
            color: #fff;
            font-weight: 600;
            min-width: 28px;
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        .btn-group {
            display: flex;
            gap: 8px;
            margin-left: auto;
        }

        .btn {
            padding: 8px 14px;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: #fff;
            box-shadow: 0 4px 15px rgba(99,102,241,0.3);
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(99,102,241,0.4);
        }

        .btn-secondary {
            background: rgba(255,255,255,0.1);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.15);
        }

        .btn-secondary:hover {
            background: rgba(255,255,255,0.15);
        }

        .btn-secondary.active {
            background: rgba(99,102,241,0.3);
            border-color: rgba(99,102,241,0.5);
        }

        .divider {
            width: 1px;
            height: 36px;
            background: rgba(255,255,255,0.1);
        }

        /* Preset buttons (radio-style) */
        .preset-group {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .preset-label {
            font-size: 11px;
            color: rgba(255,255,255,0.6);
            margin-right: 4px;
        }

        .preset-btn {
            padding: 6px 12px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 20px;
            font-size: 11px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            background: rgba(255,255,255,0.05);
            color: rgba(255,255,255,0.7);
        }

        .preset-btn:hover {
            background: rgba(255,255,255,0.1);
            border-color: rgba(255,255,255,0.3);
        }

        .preset-btn.active {
            background: linear-gradient(135deg, rgba(99,102,241,0.4), rgba(139,92,246,0.4));
            border-color: rgba(139,92,246,0.6);
            color: #fff;
            box-shadow: 0 2px 10px rgba(99,102,241,0.3);
        }

        @media (max-width: 1100px) {
            .control-group.hide-tablet {
                display: none;
            }
        }

        @media (max-width: 800px) {
            .controls {
                padding: 10px 12px;
                gap: 10px 12px;
            }
            .control-group.hide-mobile {
                display: none;
            }
            .btn-group {
                width: 100%;
                margin-left: 0;
                justify-content: flex-end;
            }
            .divider {
                display: none;
            }
        }
    </style>
</head>
<body>
    <a href="index.html" style="position:fixed;top:1rem;left:1rem;color:#888;text-decoration:none;font-size:0.85rem;z-index:1000;">&larr; Back</a>
    <div class="app">
        <div class="canvas-container">
            <canvas id="voronoiCanvas"></canvas>
            <div class="tooltip" id="tooltip"></div>
            <div class="fps-overlay" id="fpsOverlay">
                <div class="fps-container" id="fpsContainer">
                    <div class="fps-header" id="fpsHeader">
                        <div class="fps-header-left">
                            <div class="fps-indicator" id="fpsIndicator"></div>
                            <span class="fps-title">FPS</span>
                        </div>
                        <div class="fps-header-right">
                            <span class="fps-current" id="fpsValue">60</span>
                            <span class="fps-toggle" id="fpsToggle">▼</span>
                        </div>
                    </div>
                    <div class="fps-body" id="fpsBody">
                        <div class="fps-stats-row">
                            <span>Avg: <span class="fps-stat-value" id="fpsAvg">60</span></span>
                            <span>Min: <span class="fps-stat-value bad" id="fpsMin">-</span></span>
                            <span>Max: <span class="fps-stat-value good" id="fpsMax">-</span></span>
                        </div>
                        <div class="fps-frame-info">
                            Frame: <span class="fps-frame-value" id="frameTimeValue">0.0ms</span>
                            <span class="fps-frame-target" id="fpsTarget">(16.7ms target)</span>
                        </div>
                        <div class="fps-graph-container">
                            <svg id="fpsGraph" class="fps-graph-svg" width="180" height="40">
                                <line x1="0" y1="20" x2="180" y2="20" stroke="#333" stroke-dasharray="2,2" />
                                <line id="fps60Line" x1="0" y1="20" x2="180" y2="20" stroke="#22c55e" stroke-dasharray="4,2" opacity="0.5" />
                                <path id="fpsAreaPath" fill="url(#fpsGradient)" opacity="0.3" />
                                <path id="fpsLinePath" fill="none" stroke="#22c55e" stroke-width="1.5" stroke-linejoin="round" />
                                <defs>
                                    <linearGradient id="fpsGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                                        <stop id="fpsGradientStop" offset="0%" stop-color="#22c55e" />
                                        <stop offset="100%" stop-color="transparent" />
                                    </linearGradient>
                                </defs>
                            </svg>
                            <div class="fps-graph-label top">120</div>
                            <div class="fps-graph-label bottom">0</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="controls">
            <!-- Grid Settings -->
            <div class="control-group">
                <label>Cells</label>
                <div class="control-row">
                    <input type="range" id="cellCount" min="4" max="30" value="12">
                    <span class="control-value" id="cellCountVal">12</span>
                </div>
            </div>
            <div class="control-group">
                <label>Gap</label>
                <div class="control-row">
                    <input type="range" id="gap" min="0" max="30" value="27">
                    <span class="control-value" id="gapVal">27</span>
                </div>
            </div>
            <div class="control-group">
                <label>Corners</label>
                <div class="control-row">
                    <input type="range" id="cornerRadius" min="0" max="40" value="23">
                    <span class="control-value" id="cornerRadiusVal">23</span>
                </div>
            </div>

            <div class="divider"></div>

            <!-- Hover Effect -->
            <div class="control-group">
                <label>Hover Size</label>
                <div class="control-row">
                    <input type="range" id="maxExpansion" min="0" max="400" value="400">
                    <span class="control-value" id="maxExpansionVal">400</span>
                </div>
            </div>
            <div class="control-group">
                <label>In Speed</label>
                <div class="control-row">
                    <input type="range" id="expansionSpeed" min="0" max="100" value="8">
                    <span class="control-value" id="expansionSpeedVal">8</span>
                </div>
            </div>
            <div class="control-group">
                <label>Out Speed</label>
                <div class="control-row">
                    <input type="range" id="retractionSpeed" min="0" max="100" value="2">
                    <span class="control-value" id="retractionSpeedVal">2</span>
                </div>
            </div>
            <div class="control-group">
                <label>Displace</label>
                <div class="control-row">
                    <input type="range" id="displaceRatio" min="0" max="100" value="100">
                    <span class="control-value" id="displaceRatioVal">1.00</span>
                </div>
            </div>
            <div class="control-group">
                <label>Falloff</label>
                <div class="control-row">
                    <input type="range" id="displaceFalloff" min="100" max="800" value="300">
                    <span class="control-value" id="displaceFalloffVal">300</span>
                </div>
            </div>
            <div class="control-group">
                <label>Dim Others</label>
                <div class="control-row">
                    <input type="range" id="nonHoveredOpacity" min="0" max="100" value="36">
                    <span class="control-value" id="nonHoveredOpacityVal">0.36</span>
                </div>
            </div>
            <div class="control-group hide-mobile">
                <label>Image Zoom</label>
                <div class="control-row">
                    <input type="range" id="nonHoverImageZoom" min="10" max="80" value="30" step="1">
                    <span class="control-value" id="nonHoverImageZoomVal">3.0</span>
                </div>
            </div>
            <div class="control-group hide-mobile">
                <label>Zoom Speed</label>
                <div class="control-row">
                    <input type="range" id="imageZoomSpeed" min="1" max="400" value="50">
                    <span class="control-value" id="imageZoomSpeedVal">50</span>
                </div>
            </div>

            <div class="divider"></div>

            <!-- Layout Presets -->
            <div class="preset-group">
                <span class="preset-label">Layout:</span>
                <button class="preset-btn active" data-layout="bento">Bento</button>
                <button class="preset-btn" data-layout="hex">Hex</button>
                <button class="preset-btn" data-layout="voronoi">Voronoi</button>
                <button class="preset-btn" data-layout="spiral">Spiral</button>
                <button class="preset-btn" data-layout="readerL">Hero L</button>
                <button class="preset-btn" data-layout="readerR">Hero R</button>
                <button class="preset-btn" data-layout="rim">Rim</button>
                <button class="preset-btn" data-layout="sidebar">Sidebar</button>
            </div>

            <div class="divider"></div>

            <!-- Content Zone -->
            <div class="control-group">
                <label>Zone Margin</label>
                <div class="control-row">
                    <input type="range" id="contentZoneMargin" min="0" max="40" value="15">
                    <span class="control-value" id="contentZoneMarginVal">15%</span>
                </div>
            </div>
            <div class="control-group">
                <label>Zone Angle</label>
                <div class="control-row">
                    <input type="range" id="contentZoneRotation" min="0" max="315" value="0" step="45">
                    <span class="control-value" id="contentZoneRotationVal">0°</span>
                </div>
            </div>
            <div class="control-group">
                <label>Position</label>
                <div class="control-row">
                    <input type="range" id="contentZonePosition" min="-100" max="100" value="0">
                    <span class="control-value" id="contentZonePositionVal">0%</span>
                </div>
            </div>
            <div class="control-group hide-tablet">
                <label>Bleed Buffer</label>
                <div class="control-row">
                    <input type="range" id="bleedBuffer" min="20" max="200" value="158">
                    <span class="control-value" id="bleedBufferVal">158</span>
                </div>
            </div>
            <div class="control-group hide-tablet">
                <label>Trans Speed</label>
                <div class="control-row">
                    <input type="range" id="transitionSpeed" min="1" max="20" value="6">
                    <span class="control-value" id="transitionSpeedVal">6</span>
                </div>
            </div>

            <div class="divider"></div>

            <!-- Buttons -->
            <div class="btn-group">
                <button class="btn btn-secondary" id="toggleContentZone">Zone</button>
                <button class="btn btn-secondary" id="toggleDebug">Debug</button>
                <button class="btn btn-secondary" id="loadUnsplash">Unsplash</button>
                <button class="btn btn-primary" id="regenerate">Regenerate</button>
            </div>
        </div>
    </div>

    <script>
    (function() {
        'use strict';

        // ========== CONFIGURATION ==========
        const config = {
            // Grid settings
            cellCount: 12,
            gap: 27,
            cornerRadius: 23,

            // Inflation system
            maxExpansion: 400,           // How much the hovered cell inflates (affects neighbor push)
            expansionSpeed: 8,           // How fast cells inflate (1-100 scale, higher = faster)
            retractionSpeed: 2,          // How fast cells retract after hover ends (1-100 scale)
            displaceRatio: 1.0,          // 0 = no neighbor push, 1 = max neighbor push
            displaceFalloff: 300,        // How far displacement reaches (px) - lower = more local, higher = affects distant cells

            // Visual transitions
            nonHoverImageZoom: 3.0,      // Non-hover image zoom level
            imageZoomSpeed: 50,          // How fast image zoom transitions (1-400 scale)
            nonHoveredOpacity: 0.36,     // Opacity for non-hovered cells
            opacityTransitionSpeed: 0.15, // How fast opacity transitions

            // Toggles
            physicsEnabled: true,
            debugMode: false,

            // Content zone / soft boundary
            // Now an OPTIONAL global clip. Default off in mk8 — void cells are
            // the successor mechanism for whitespace. Leave toggleable for
            // nostalgia + cases where you actually want a hard-clip bar shape.
            contentZoneEnabled: false,   // Enable/disable content zone (default off)
            contentZoneMargin: 0.15,     // Margin as fraction of zone dimension
            contentZoneRotation: 0,      // Rotation in degrees (0 = horizontal, 90 = vertical)
            contentZonePosition: 0,      // Position offset (-1 to 1, perpendicular to bar orientation)
            bleedBuffer: 158,            // Pixel buffer beyond content zone (how far hovered cell can extend)

            // Layout + transition
            currentLayout: 'bento',      // Active layout name (see `layouts` below)
            transitionDuration: 1200,    // Base ms for a full layout transition
            transitionSpeed: 6,          // Hover displacement speed (1-20)
        };

        // ========== SAMPLE DATA ==========
        const cellData = [
            { title: 'Cosmic Dreams', link: '#cosmic', color: '#6366f1' },
            { title: 'Ocean Depths', link: '#ocean', color: '#06b6d4' },
            { title: 'Forest Whispers', link: '#forest', color: '#10b981' },
            { title: 'Solar Flare', link: '#solar', color: '#f59e0b' },
            { title: 'Cherry Blossom', link: '#cherry', color: '#ec4899' },
            { title: 'Arctic Aurora', link: '#arctic', color: '#8b5cf6' },
            { title: 'Desert Gold', link: '#desert', color: '#eab308' },
            { title: 'Midnight Jazz', link: '#jazz', color: '#3b82f6' },
            { title: 'Ember Glow', link: '#ember', color: '#ef4444' },
            { title: 'Mint Fresh', link: '#mint', color: '#14b8a6' },
            { title: 'Lavender Fields', link: '#lavender', color: '#a855f7' },
            { title: 'Coral Reef', link: '#coral', color: '#f97316' },
            { title: 'Storm Cloud', link: '#storm', color: '#64748b' },
            { title: 'Neon Nights', link: '#neon', color: '#d946ef' },
            { title: 'Sage Garden', link: '#sage', color: '#84cc16' },
            { title: 'Ruby Dreams', link: '#ruby', color: '#dc2626' },
            { title: 'Sapphire Sky', link: '#sapphire', color: '#2563eb' },
            { title: 'Amber Waves', link: '#amber', color: '#d97706' },
            { title: 'Violet Hour', link: '#violet', color: '#7c3aed' },
            { title: 'Teal Depths', link: '#teal', color: '#0d9488' },
            { title: 'Rose Petals', link: '#rose', color: '#e11d48' },
            { title: 'Lime Zest', link: '#lime', color: '#65a30d' },
            { title: 'Indigo Night', link: '#indigo', color: '#4f46e5' },
            { title: 'Peach Sunset', link: '#peach', color: '#fb923c' },
            { title: 'Cyan Wave', link: '#cyan', color: '#22d3d8' },
            { title: 'Magenta Pulse', link: '#magenta', color: '#c026d3' },
            { title: 'Bronze Age', link: '#bronze', color: '#a16207' },
            { title: 'Steel Blue', link: '#steel', color: '#475569' },
            { title: 'Crimson Tide', link: '#crimson', color: '#be123c' },
            { title: 'Emerald City', link: '#emerald', color: '#059669' }
        ];

        // ========== STATE ==========
        let canvas, ctx;
        let width, height;
        let cells = [];
        let hoveredCell = -1;
        let mouseX = -9999, mouseY = -9999;
        let tooltip;
        let animationId;
        let lastTime = 0;

        // ========== FPS TRACKING ==========
        const FPS_HISTORY_SIZE = 60;
        const FPS_UPDATE_INTERVAL = 100; // Update display every N milliseconds
        const MAX_GRAPH_FPS = 120;
        const GRAPH_WIDTH = 180;
        const GRAPH_HEIGHT = 40;

        let fpsElements = null;
        let fpsHistory = [];
        let allFpsValues = [];
        let fpsFrameHistory = [];
        let lastFpsUpdateTime = 0;
        let isMinimized = false;

        function getFpsColor(fps) {
            return fps >= 55 ? '#22c55e' : fps >= 30 ? '#eab308' : '#ef4444';
        }

        function getFpsClass(fps) {
            return fps >= 55 ? 'fps-good' : fps >= 30 ? 'fps-ok' : 'fps-bad';
        }

        function generatePath(history) {
            if (history.length < 2) return '';
            return 'M ' + history.map((v, i) => {
                const x = (i / (FPS_HISTORY_SIZE - 1)) * GRAPH_WIDTH;
                const y = GRAPH_HEIGHT - (Math.min(v, MAX_GRAPH_FPS) / MAX_GRAPH_FPS) * GRAPH_HEIGHT;
                return `${x},${y}`;
            }).join(' L ');
        }

        function generateAreaPath(history) {
            if (history.length < 2) return '';
            const linePath = history.map((v, i) => {
                const x = (i / (FPS_HISTORY_SIZE - 1)) * GRAPH_WIDTH;
                const y = GRAPH_HEIGHT - (Math.min(v, MAX_GRAPH_FPS) / MAX_GRAPH_FPS) * GRAPH_HEIGHT;
                return `${x},${y}`;
            }).join(' L ');
            return `M 0,${GRAPH_HEIGHT} L ${linePath} L ${GRAPH_WIDTH},${GRAPH_HEIGHT} Z`;
        }

        function initFpsCounter() {
            fpsElements = {
                container: document.getElementById('fpsContainer'),
                header: document.getElementById('fpsHeader'),
                body: document.getElementById('fpsBody'),
                toggle: document.getElementById('fpsToggle'),
                indicator: document.getElementById('fpsIndicator'),
                value: document.getElementById('fpsValue'),
                avg: document.getElementById('fpsAvg'),
                min: document.getElementById('fpsMin'),
                max: document.getElementById('fpsMax'),
                frameTime: document.getElementById('frameTimeValue'),
                target: document.getElementById('fpsTarget'),
                linePath: document.getElementById('fpsLinePath'),
                areaPath: document.getElementById('fpsAreaPath'),
                gradientStop: document.getElementById('fpsGradientStop'),
                fps60Line: document.getElementById('fps60Line')
            };

            // Set 60 FPS line position
            const y60 = GRAPH_HEIGHT - (60 / MAX_GRAPH_FPS) * GRAPH_HEIGHT;
            fpsElements.fps60Line.setAttribute('y1', y60);
            fpsElements.fps60Line.setAttribute('y2', y60);

            // Toggle minimize/expand on header click
            fpsElements.header.addEventListener('click', () => {
                isMinimized = !isMinimized;
                fpsElements.body.style.display = isMinimized ? 'none' : 'block';
                fpsElements.toggle.textContent = isMinimized ? '▶' : '▼';
                fpsElements.container.classList.toggle('minimized', isMinimized);
            });

            // Initialize history
            for (let i = 0; i < FPS_HISTORY_SIZE; i++) {
                fpsHistory.push(60);
            }
        }

        function updateFpsCounter(deltaMs) {
            const instantFps = 1000 / deltaMs;

            // Track frame-by-frame FPS for averaging
            fpsFrameHistory.push(instantFps);
            if (fpsFrameHistory.length > 60) fpsFrameHistory.shift();

            const currentTime = performance.now();
            if (currentTime - lastFpsUpdateTime < FPS_UPDATE_INTERVAL) return;
            lastFpsUpdateTime = currentTime;

            // Calculate current FPS from recent frames
            const recentFps = fpsFrameHistory.slice(-10);
            const currentFps = recentFps.length > 0
                ? recentFps.reduce((a, b) => a + b, 0) / recentFps.length : 0;
            const avgFps = fpsFrameHistory.length > 0
                ? fpsFrameHistory.reduce((a, b) => a + b, 0) / fpsFrameHistory.length : 0;

            // Track all FPS values for min/max
            allFpsValues.push(currentFps);
            if (allFpsValues.length > 600) allFpsValues.shift();
            const validValues = allFpsValues.filter(v => v > 0 && v < 1000);

            const fps = Math.round(currentFps);
            const avg = Math.round(avgFps);
            const min = validValues.length > 0 ? Math.round(Math.min(...validValues)) : 0;
            const max = validValues.length > 0 ? Math.round(Math.max(...validValues)) : 0;

            // Update history for graph
            fpsHistory.shift();
            fpsHistory.push(fps);

            // Update display
            const color = getFpsColor(fps);
            fpsElements.value.textContent = fps;
            fpsElements.value.style.color = color;
            fpsElements.indicator.style.backgroundColor = color;

            fpsElements.avg.textContent = avg;
            fpsElements.min.textContent = min || '-';
            fpsElements.max.textContent = max || '-';

            fpsElements.frameTime.textContent = deltaMs.toFixed(2) + 'ms';
            fpsElements.target.textContent = `(${(1000 / fps || 0).toFixed(1)}ms target)`;

            // Update SVG graph
            fpsElements.linePath.setAttribute('d', generatePath(fpsHistory));
            fpsElements.linePath.setAttribute('stroke', color);
            fpsElements.areaPath.setAttribute('d', generateAreaPath(fpsHistory));
            fpsElements.gradientStop.setAttribute('stop-color', color);
        }

        // ========== EASING UTILITIES ==========
        // Attempt to compute the t value for a given x on cubic bezier curve
        // Returns x directly since we use symmetric ease curves
        function cubicBezierEase(t, p1, p2) {
            // Attempt to compute cubic bezier with control points (0,0), (p1,p1), (p2,p2), (1,1)
            // For ease-in-out this gives smooth acceleration and deceleration
            // Using approximate formula for common easing curves
            const t2 = t * t;
            const t3 = t2 * t;
            const mt = 1 - t;
            const mt2 = mt * mt;
            const mt3 = mt2 * mt;

            // Cubic bezier: B(t) = (1-t)³P0 + 3(1-t)²tP1 + 3(1-t)t²P2 + t³P3
            // With P0=0, P1=p1, P2=p2, P3=1
            return 3 * mt2 * t * p1 + 3 * mt * t2 * p2 + t3;
        }

        // Ease-out: starts fast, slows down at end (good for arriving at target)
        function easeOut(t) {
            return cubicBezierEase(t, 0.0, 0.58);
        }

        // Ease-in: starts slow, accelerates at end (good for catching up)
        function easeIn(t) {
            return cubicBezierEase(t, 0.42, 1.0);
        }

        // Ease-in-out: slow start, fast middle, slow end (good for smooth transitions)
        function easeInOut(t) {
            return cubicBezierEase(t, 0.42, 0.58);
        }

        // Smooth ease-out with slight overshoot feel (Material Design style)
        function easeOutSmooth(t) {
            // Deceleration curve - fast start, gentle landing
            return 1 - Math.pow(1 - t, 3);
        }

        // ========== TRANSITION ENGINE ==========
        // Ported from morph.html. Replaces FlockTransition entirely.
        // Transition is continuous interpolation of per-cell layout state
        // (position + weight + role + void) from start → target, with 2-opt
        // non-crossing assignment so cells don't thread through each other.
        // Hover is suppressed during transitions so motion stays readable.

        // Transition state — module-level, simpler than an instance
        let transitioning = false;     // true while layout is in flight
        let transitionStart = 0;       // timestamp (ms) when transition began

        // Per-role duration multiplier. The rule (max of start-role and
        // target-role) means a cell promoting or demoting uses the slower of
        // the two speeds, so hero→carousel and carousel→hero both animate
        // at hero pace — the hierarchy stays legible.
        const roleDurationMultiplier = {
            void:     1.20,
            hero:     1.15,
            content:  1.00,
            carousel: 0.80,
        };

        function getRoleMultiplier(role, isVoid) {
            if (isVoid) return roleDurationMultiplier.void;
            return roleDurationMultiplier[role || 'content'] || 1.0;
        }

        function easeInOutCubic(t) {
            return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
        }

        // ========== LAYOUT GENERATORS ==========
        // Each generator: (W, H, count) → [{x, y, w, role?, void?}, ...]
        // w defaults to 1 (uniform). role ∈ {'content','hero','carousel'}.
        // void cells claim space but render invisibly (whitespace anchors).

        const layouts = {

            // BENTO — recursive rectangle subdivision, seed at each rect center
            bento(W, H, count) {
                const m = 60;
                const rects = [{ x: m, y: m, w: W - m * 2, h: H - m * 2 }];
                while (rects.length < count) {
                    rects.sort((a, b) => (b.w * b.h) - (a.w * a.h));
                    const r = rects.shift();
                    const splitH = r.w > r.h;
                    const ratio = 0.35 + Math.random() * 0.3;
                    if (splitH) {
                        const splitX = r.w * ratio;
                        rects.push({ x: r.x, y: r.y, w: splitX, h: r.h });
                        rects.push({ x: r.x + splitX, y: r.y, w: r.w - splitX, h: r.h });
                    } else {
                        const splitY = r.h * ratio;
                        rects.push({ x: r.x, y: r.y, w: r.w, h: splitY });
                        rects.push({ x: r.x, y: r.y + splitY, w: r.w, h: r.h - splitY });
                    }
                }
                const selected = rects.slice(0, count);
                const totalArea = selected.reduce((s, r) => s + r.w * r.h, 0);
                const avgArea = totalArea / count;
                return selected.map(r => ({
                    x: r.x + r.w / 2,
                    y: r.y + r.h / 2,
                    w: Math.sqrt(r.w * r.h / avgArea),
                }));
            },

            // HEX — hexagonal close-packing centered on canvas
            hex(W, H, count) {
                const aspect = W / H;
                let bestCols = 1, bestRows = count;
                let bestDiff = Infinity;
                for (let c = 1; c <= count; c++) {
                    const r = Math.ceil(count / c);
                    const diff = Math.abs((c / r) * 0.866 - aspect);
                    if (diff < bestDiff) { bestDiff = diff; bestCols = c; bestRows = r; }
                }
                const m = 60;
                const cellW = (W - m * 2) / bestCols;
                const cellH = (H - m * 2) / bestRows;
                const results = [];
                for (let row = 0; row < bestRows && results.length < count; row++) {
                    const cols = row % 2 === 0 ? bestCols : bestCols - 1;
                    const offset = row % 2 === 0 ? 0 : cellW * 0.5;
                    for (let col = 0; col < cols && results.length < count; col++) {
                        results.push({
                            x: m + offset + cellW * (col + 0.5),
                            y: m + cellH * (row + 0.5),
                            w: 1,
                        });
                    }
                }
                return results;
            },

            // VORONOI — random seeds with Lloyd relaxation for organic feel
            voronoi(W, H, count) {
                const m = 80;
                let pts = [];
                for (let i = 0; i < count; i++) {
                    pts.push({
                        x: m + Math.random() * (W - m * 2),
                        y: m + Math.random() * (H - m * 2),
                        w: 0.6 + Math.random() * 0.8,
                    });
                }
                const bounds = [[0, 0], [W, 0], [W, H], [0, H]];
                for (let iter = 0; iter < 20; iter++) {
                    const polys = [];
                    for (let i = 0; i < pts.length; i++) {
                        let poly = bounds.map(p => [...p]);
                        for (let j = 0; j < pts.length; j++) {
                            if (i === j) continue;
                            const dx = pts[j].x - pts[i].x;
                            const dy = pts[j].y - pts[i].y;
                            const dist = Math.sqrt(dx * dx + dy * dy);
                            if (dist < 0.001) continue;
                            poly = clipPolygon(poly,
                                (pts[i].x + pts[j].x) / 2,
                                (pts[i].y + pts[j].y) / 2,
                                -dx / dist, -dy / dist);
                            if (poly.length < 3) break;
                        }
                        polys.push(poly);
                    }
                    for (let i = 0; i < pts.length; i++) {
                        if (polys[i].length < 3) continue;
                        const c = getPolygonCentroid(polys[i]);
                        pts[i].x += (c.x - pts[i].x) * 0.7;
                        pts[i].y += (c.y - pts[i].y) * 0.7;
                    }
                }
                return pts;
            },

            // SPIRAL — Fermat / golden angle spiral from center
            spiral(W, H, count) {
                const cx = W / 2, cy = H / 2;
                const maxR = Math.min(W, H) * 0.42;
                const goldenAngle = Math.PI * (3 - Math.sqrt(5));
                const results = [];
                for (let i = 0; i < count; i++) {
                    const frac = i / (count - 1 || 1);
                    const r = maxR * Math.sqrt(frac);
                    const theta = i * goldenAngle;
                    results.push({
                        x: cx + r * Math.cos(theta),
                        y: cy + r * Math.sin(theta),
                        w: 1.5 - frac * 0.8,
                    });
                }
                return results;
            },

            // RIM — cells around the outer edge, void in center
            rim(W, H, count) {
                const m = 40;
                const rimThickness = Math.min(W, H) * 0.22;
                const results = [];
                let attempts = 0;
                const minDist = (2 * (W + H) * rimThickness / count) ** 0.5 * 0.5;
                while (results.length < count && attempts < 3000) {
                    const x = m + Math.random() * (W - m * 2);
                    const y = m + Math.random() * (H - m * 2);
                    const distFromEdge = Math.min(x - m, y - m, (W - m) - x, (H - m) - y);
                    if (distFromEdge < rimThickness) {
                        let valid = true;
                        for (const p of results) {
                            if ((p.x - x) ** 2 + (p.y - y) ** 2 < minDist * minDist) { valid = false; break; }
                        }
                        if (valid) results.push({ x, y, w: 1 });
                    }
                    attempts++;
                }
                while (results.length < count) {
                    const edge = Math.floor(Math.random() * 4);
                    const t = Math.random();
                    const inset = m + Math.random() * rimThickness * 0.5;
                    if (edge === 0) results.push({ x: m + t * (W - m * 2), y: inset, w: 1 });
                    else if (edge === 1) results.push({ x: W - inset, y: m + t * (H - m * 2), w: 1 });
                    else if (edge === 2) results.push({ x: m + t * (W - m * 2), y: H - inset, w: 1 });
                    else results.push({ x: inset, y: m + t * (H - m * 2), w: 1 });
                }
                results.push({ x: W / 2, y: H / 2, w: 3.0, void: true });
                return results;
            },

            // SIDEBAR — cells condensed into left strip, void claims right side
            sidebar(W, H, count) {
                const sidebarW = W * 0.25;
                const m = 30;
                const results = [];
                const cellH = (H - m * 2) / Math.ceil(count / 2);
                const cols = 2;
                const colW = (sidebarW - m * 2) / cols;
                for (let i = 0; i < count; i++) {
                    const col = i % cols;
                    const row = Math.floor(i / cols);
                    results.push({
                        x: m + colW * (col + 0.5) + (Math.random() - 0.5) * colW * 0.2,
                        y: m + cellH * (row + 0.5) + (Math.random() - 0.5) * cellH * 0.2,
                        w: 0.7,
                    });
                }
                results.push({ x: W * 0.65, y: H / 2, w: 3.5, void: true });
                return results;
            },

            // READER L — text column on left, hero center-right, carousel around
            readerL(W, H, count) {
                const results = [];
                results.push({ x: W * 0.55, y: H * 0.42, w: 2.3, role: 'hero' });
                const topY = H * 0.12;
                const bottomY = H * 0.85;
                const rightX = W * 0.92;
                const positions = [
                    [W * 0.45, topY], [W * 0.62, topY], [W * 0.78, topY], [W * 0.92, topY],
                    [rightX, H * 0.32], [rightX, H * 0.52], [rightX, H * 0.72],
                    [W * 0.42, bottomY], [W * 0.56, bottomY], [W * 0.7, bottomY], [W * 0.85, bottomY],
                ];
                for (let i = 0; i < count - 1 && i < positions.length; i++) {
                    results.push({ x: positions[i][0], y: positions[i][1], w: 0.7, role: 'carousel' });
                }
                results.push({ x: W * 0.14, y: H * 0.5, w: 2.6, void: true });
                return results;
            },

            // READER R — text column on right, hero center-left, carousel around
            readerR(W, H, count) {
                const results = [];
                results.push({ x: W * 0.45, y: H * 0.42, w: 2.3, role: 'hero' });
                const topY = H * 0.12;
                const bottomY = H * 0.85;
                const leftX = W * 0.08;
                const positions = [
                    [W * 0.08, topY], [W * 0.22, topY], [W * 0.38, topY], [W * 0.55, topY],
                    [leftX, H * 0.32], [leftX, H * 0.52], [leftX, H * 0.72],
                    [W * 0.15, bottomY], [W * 0.3, bottomY], [W * 0.44, bottomY], [W * 0.58, bottomY],
                ];
                for (let i = 0; i < count - 1 && i < positions.length; i++) {
                    results.push({ x: positions[i][0], y: positions[i][1], w: 0.7, role: 'carousel' });
                }
                results.push({ x: W * 0.86, y: H * 0.5, w: 2.6, void: true });
                return results;
            },
        };

        // Ensure the cells[] array has one void slot. If the layout didn't
        // specify a void, add a negligible one tucked in a corner so the
        // assignment logic always sees a 1:1 mapping.
        function normalizeLayout(seedArr) {
            const hasVoid = seedArr.some(s => s.void);
            if (!hasVoid) {
                seedArr.push({ x: 10, y: 10, w: 0.01, void: true });
            }
            return seedArr;
        }

        // Greedy nearest-neighbor assignment with role partitioning.
        // Void↔void first, then hero↔hero, carousel↔carousel, then any.
        // Returns an array of the same length as `current` where slot i
        // holds the target seed spec that cell i should move to.
        function assignSeeds(current, targets) {
            const result = new Array(current.length);
            const assigned = new Set();
            const claimed = new Set();

            function pairPool(curPool, tgtPool) {
                const pairs = [];
                for (const ci of curPool) {
                    if (assigned.has(ci)) continue;
                    for (const tj of tgtPool) {
                        if (claimed.has(tj)) continue;
                        const dx = current[ci].layoutX - targets[tj].x;
                        const dy = current[ci].layoutY - targets[tj].y;
                        pairs.push({ ci, tj, dist: dx * dx + dy * dy });
                    }
                }
                pairs.sort((a, b) => a.dist - b.dist);
                for (const { ci, tj } of pairs) {
                    if (assigned.has(ci) || claimed.has(tj)) continue;
                    result[ci] = targets[tj];
                    assigned.add(ci);
                    claimed.add(tj);
                }
            }

            const curIdx = current.map((_, i) => i);
            const tgtIdx = targets.map((_, i) => i);

            const curVoid = curIdx.filter(i => current[i].isVoid);
            const curHero = curIdx.filter(i => !current[i].isVoid && current[i].role === 'hero');
            const curCar  = curIdx.filter(i => !current[i].isVoid && current[i].role !== 'hero');

            const tgtVoid = tgtIdx.filter(i => targets[i].void);
            const tgtHero = tgtIdx.filter(i => !targets[i].void && targets[i].role === 'hero');
            const tgtCar  = tgtIdx.filter(i => !targets[i].void && (targets[i].role || 'content') !== 'hero');

            pairPool(curVoid, tgtVoid);
            pairPool(curHero, tgtHero);
            pairPool(curCar, tgtCar);
            // Cross-role fallback when role counts don't match
            pairPool(curIdx, tgtIdx);

            // Final fallback — anyone left without an assignment stays put
            for (let i = 0; i < current.length; i++) {
                if (!result[i]) {
                    result[i] = {
                        x: current[i].layoutX,
                        y: current[i].layoutY,
                        w: current[i].weight,
                        void: current[i].isVoid,
                        role: current[i].role,
                    };
                }
            }

            refineAssignmentNoCrossings(current, result);
            return result;
        }

        // 2-opt: swap same-role pairs whenever that shortens total path length.
        // Guaranteed to produce a non-crossing matching within each role by
        // triangle inequality. Prevents cells from threading through each
        // other mid-flight — that was the "ghosting" feel during transitions.
        function refineAssignmentNoCrossings(current, result) {
            const n = current.length;
            const maxIterations = 30;
            for (let iter = 0; iter < maxIterations; iter++) {
                let improved = false;
                for (let i = 0; i < n; i++) {
                    if (!result[i] || current[i].isVoid) continue;
                    for (let j = i + 1; j < n; j++) {
                        if (!result[j] || current[j].isVoid) continue;
                        const roleI = result[i].role || 'content';
                        const roleJ = result[j].role || 'content';
                        if (roleI !== roleJ) continue;
                        const ci = current[i], cj = current[j];
                        const ti = result[i], tj = result[j];
                        const currCost = Math.hypot(ci.layoutX - ti.x, ci.layoutY - ti.y)
                                       + Math.hypot(cj.layoutX - tj.x, cj.layoutY - tj.y);
                        const swapCost = Math.hypot(ci.layoutX - tj.x, ci.layoutY - tj.y)
                                       + Math.hypot(cj.layoutX - ti.x, cj.layoutY - ti.y);
                        if (swapCost + 0.5 < currCost) {
                            const tmp = result[i];
                            result[i] = result[j];
                            result[j] = tmp;
                            improved = true;
                        }
                    }
                }
                if (!improved) break;
            }
        }

        // Kick off a transition to a named layout. Snapshots current
        // layoutX/Y/weight/role/void as start, assigns targets with the
        // role-aware matcher, sets transitioning=true.
        function startTransition(layoutName) {
            if (!layouts[layoutName]) return;
            if (transitioning) return; // Don't interrupt an in-flight transition

            const raw = layouts[layoutName](width, height, config.cellCount);
            const targets = normalizeLayout(raw);

            // Ensure cells.length >= targets.length. Pad with void slots.
            while (cells.length < targets.length) {
                const idx = cells.length;
                const c = new Cell(10, 10, idx);
                c.isVoid = true;
                c.startVoid = true;
                c.targetVoid = true;
                cells.push(c);
            }

            const assigned = assignSeeds(cells, targets);

            for (let i = 0; i < cells.length; i++) {
                const cell = cells[i];
                cell.startX = cell.layoutX;
                cell.startY = cell.layoutY;
                cell.startWeight = cell.weight;
                cell.startRole = cell.role;
                cell.startVoid = cell.isVoid;

                const t = assigned[i];
                cell.targetX = t.x;
                cell.targetY = t.y;
                cell.targetWeight = t.w || 1;
                cell.targetRole = t.role || 'content';
                cell.targetVoid = !!t.void;
            }

            transitioning = true;
            transitionStart = performance.now();
            config.currentLayout = layoutName;
            updatePresetUI(layoutName);

            // Suppress hover during transit so motion reads cleanly.
            hoveredCell = -1;
        }

        // Advance per-cell layoutX/Y/weight toward targetX/Y/targetWeight.
        // Each cell eases at its own rate set by max(startRole, targetRole),
        // so role changes feel graceful instead of jerky.
        function updateTransition(now) {
            if (!transitioning) return;

            const elapsed = now - transitionStart;
            let anyMoving = false;

            for (let i = 0; i < cells.length; i++) {
                const cell = cells[i];
                const startMult = getRoleMultiplier(cell.startRole, cell.startVoid);
                const targetMult = getRoleMultiplier(cell.targetRole, cell.targetVoid);
                const dur = config.transitionDuration * Math.max(startMult, targetMult);
                const rawT = Math.min(1, elapsed / dur);
                const t = easeInOutCubic(rawT);

                if (rawT < 1) anyMoving = true;

                cell.layoutX = cell.startX + (cell.targetX - cell.startX) * t;
                cell.layoutY = cell.startY + (cell.targetY - cell.startY) * t;
                cell.weight = cell.startWeight + (cell.targetWeight - cell.startWeight) * t;
                // Role / void flip halfway through (so duration targets apply
                // cleanly to the whichever role is "current" at each step).
                if (rawT < 0.5) {
                    cell.role = cell.startRole;
                    cell.isVoid = cell.startVoid;
                } else {
                    cell.role = cell.targetRole;
                    cell.isVoid = cell.targetVoid;
                }
            }

            if (!anyMoving) {
                transitioning = false;
                // Final snap to targets to avoid sub-pixel drift.
                for (const cell of cells) {
                    cell.layoutX = cell.targetX;
                    cell.layoutY = cell.targetY;
                    cell.weight = cell.targetWeight;
                    cell.role = cell.targetRole;
                    cell.isVoid = cell.targetVoid;
                }
                // Once the layout is stable, recompute the base Voronoi so
                // the hover system uses the new resting tessellation.
                computeBaseVoronoi();
            }
        }

        // ========== CELL CLASS ==========
        class Cell {
            constructor(x, y, index) {
                this.index = index;

                // layoutX/Y — where the current layout says this cell lives.
                // During a transition these interpolate from startX/Y → targetX/Y.
                // When no transition is active, they're stable and hover alone
                // drives visible displacement.
                this.layoutX = x;
                this.layoutY = y;
                this.x = x;
                this.y = y;

                // Transition endpoints (written by startTransition, read by updateTransition)
                this.startX = x;
                this.startY = y;
                this.targetX = x;
                this.targetY = y;

                // Power-diagram weight. The layout generator sets targetWeight;
                // weight interpolates toward it during the transition, and the
                // pressure loop (enforceMinAreas) can boost it further each frame
                // to keep crushed cells above their minimum area.
                this.weight = 1;
                this.startWeight = 1;
                this.targetWeight = 1;

                // Role carries semantic meaning used by the transition engine:
                //   'content'  = default
                //   'hero'     = large illustration cell (reader layouts)
                //   'carousel' = small browsing tile (reader layouts)
                // Role controls per-cell transition duration (roleDurationMultiplier).
                this.role = 'content';
                this.startRole = 'content';
                this.targetRole = 'content';

                // Void cells claim space in the Voronoi tessellation but render
                // invisibly. They're the whitespace mechanism — a text column,
                // an empty corner, a sidebar — carved out by the same primitive
                // as the content cells. Anchored: never hoverable, never pushed.
                this.isVoid = false;
                this.startVoid = false;
                this.targetVoid = false;

                // Parametric position along bar (0-1)
                // Used for consistent cell ordering during transitions
                this.parametricT = 0;

                // Scale animation (progress-based with easeIn)
                this.scale = 1.0;              // Current scale
                this.targetScale = 1.0;        // Target scale
                this.scaleStart = 1.0;         // Starting scale for animation
                this.scaleProgress = 1.0;      // Animation progress (0-1)
                this.lastTargetScale = 1.0;    // Track target changes

                // Displacement animation (exponential smoothing - no resets)
                this.displacedX = x;           // Current displaced position
                this.displacedY = y;
                this.targetDisplacedX = x;     // Target displaced position
                this.targetDisplacedY = y;

                this.basePolygon = null;   // Computed once at init - NEVER changes
                this.baseCentroid = null;  // Center of base polygon
                this.polygon = null;       // For hit testing
                this.displayPolygon = null; // What gets rendered

                // Zoom animation (progress-based)
                this.zoom = config.nonHoverImageZoom;
                this.targetZoom = config.nonHoverImageZoom;
                this.zoomStart = config.nonHoverImageZoom;
                this.zoomProgress = 1.0;
                this.lastTargetZoom = config.nonHoverImageZoom;

                // Opacity animation (progress-based)
                this.opacity = config.nonHoveredOpacity;
                this.targetOpacity = config.nonHoveredOpacity;
                this.opacityStart = config.nonHoveredOpacity;
                this.opacityProgress = 1.0;
                this.lastTargetOpacity = config.nonHoveredOpacity;

                // Interaction feel
                this.hoverMix = 0; // Smoothed hover strength for outlines/bleed

                const data = cellData[index % cellData.length];
                this.title = data.title;
                this.link = data.link;
                this.color = data.color;
                this.pattern = null;
            }

            update(dt, isHovered) {
                // Exponential smoothing - smoothly chase targets without resets
                // When switching cells, just changes target - no jarring restarts
                // Note: layout transitions move layoutX/Y (via updateTransition);
                // this method smooths displacedX/Y toward targetDisplacedX/Y.

                // === HOVER STATE SMOOTHING ===
                const targetHover = isHovered ? 1 : 0;
                const hoverRate = 1 - Math.exp(-Math.max(0.001, dt) * 0.12);
                this.hoverMix += (targetHover - this.hoverMix) * hoverRate;

                // === SCALE ANIMATION ===
                // Progress-based with easeIn: slow start, fast end - cell catches up to image
                if (this.targetScale !== this.lastTargetScale) {
                    this.scaleStart = this.scale;
                    this.scaleProgress = 0;
                    this.lastTargetScale = this.targetScale;
                }

                if (this.scaleProgress < 1) {
                    // Speed 1-100 maps to slower to faster transitions
                    const progressRate = 1 + config.expansionSpeed * 0.12;
                    this.scaleProgress = Math.min(1, this.scaleProgress + progressRate * dt / 1000);
                    // easeIn: slow start, fast end - cell growth catches up to the rushing image
                    const easedProgress = easeIn(this.scaleProgress);
                    this.scale = this.scaleStart + (this.targetScale - this.scaleStart) * easedProgress;
                } else {
                    this.scale = this.targetScale;
                }

                // === DISPLACEMENT ANIMATION ===
                const t = config.expansionSpeed / 100;
                const displaceLerp = 0.01 + t * t * 0.34;
                this.displacedX += (this.targetDisplacedX - this.displacedX) * displaceLerp;
                this.displacedY += (this.targetDisplacedY - this.displacedY) * displaceLerp;

                // Snap when very close
                const distSq = Math.pow(this.displacedX - this.targetDisplacedX, 2) +
                               Math.pow(this.displacedY - this.targetDisplacedY, 2);
                if (distSq < 0.25) {
                    this.displacedX = this.targetDisplacedX;
                    this.displacedY = this.targetDisplacedY;
                }

                // === ZOOM ANIMATION ===
                if (this.targetZoom !== this.lastTargetZoom) {
                    this.zoomStart = this.zoom;
                    this.zoomProgress = 0;
                    this.lastTargetZoom = this.targetZoom;
                }

                if (this.zoomProgress < 1) {
                    // Image zoom: speed 1-400 maps to slower to faster transitions
                    const progressRate = 0.5 + config.imageZoomSpeed * 0.05;
                    this.zoomProgress = Math.min(1, this.zoomProgress + progressRate * dt / 1000);
                    // easeOut: fast start, slow end - image rushes to fill the cell
                    const easedProgress = easeOut(this.zoomProgress);
                    this.zoom = this.zoomStart + (this.targetZoom - this.zoomStart) * easedProgress;
                } else {
                    this.zoom = this.targetZoom;
                }

                // === OPACITY ANIMATION ===
                if (this.targetOpacity !== this.lastTargetOpacity) {
                    this.opacityStart = this.opacity;
                    this.opacityProgress = 0;
                    this.lastTargetOpacity = this.targetOpacity;
                }

                if (this.opacityProgress < 1) {
                    // Faster opacity animation for snappier hover response
                    const progressRate = 12; // Fast transition (~80ms to complete)
                    this.opacityProgress = Math.min(1, this.opacityProgress + progressRate * dt / 1000);
                    const easedProgress = easeInOut(this.opacityProgress);
                    this.opacity = this.opacityStart + (this.targetOpacity - this.opacityStart) * easedProgress;
                } else {
                    this.opacity = this.targetOpacity;
                }

                // Ensure hovered cells snap to full opacity quickly
                if (isHovered && this.targetOpacity === 1.0 && this.opacity > 0.95) {
                    this.opacity = 1.0;
                    this.opacityProgress = 1.0;
                }
            }

            createPattern() {
                const size = 300;
                const patternCanvas = document.createElement('canvas');
                patternCanvas.width = size;
                patternCanvas.height = size;
                const pctx = patternCanvas.getContext('2d');

                // Gradient background
                const gradient = pctx.createLinearGradient(0, 0, size, size);
                gradient.addColorStop(0, this.color);
                gradient.addColorStop(1, this.adjustColor(this.color, -40));
                pctx.fillStyle = gradient;
                pctx.fillRect(0, 0, size, size);

                // Decorative circles
                pctx.globalAlpha = 0.08;
                for (let i = 0; i < 5; i++) {
                    const cx = Math.random() * size;
                    const cy = Math.random() * size;
                    const r = 30 + Math.random() * 60;
                    pctx.beginPath();
                    pctx.arc(cx, cy, r, 0, Math.PI * 2);
                    pctx.fillStyle = '#fff';
                    pctx.fill();
                }

                // Cell number
                pctx.globalAlpha = 0.2;
                pctx.fillStyle = '#fff';
                pctx.font = `bold ${size * 0.35}px system-ui, sans-serif`;
                pctx.textAlign = 'center';
                pctx.textBaseline = 'middle';
                pctx.fillText(this.index + 1, size / 2, size / 2);

                this.pattern = patternCanvas;
            }

            adjustColor(hex, amount) {
                const num = parseInt(hex.slice(1), 16);
                const r = Math.min(255, Math.max(0, (num >> 16) + amount));
                const g = Math.min(255, Math.max(0, ((num >> 8) & 0xff) + amount));
                const b = Math.min(255, Math.max(0, (num & 0xff) + amount));
                return `#${((r << 16) | (g << 8) | b).toString(16).padStart(6, '0')}`;
            }
        }

        // ========== TRUE EDGE-BASED VORONOI ==========
        // Edges are LINES between cells (not clipped surfaces)
        // Vertices are computed as intersections of edges
        // This ensures consistent topology and shared boundaries

        let voronoiEdges = [];      // Edges between cell pairs
        let cellEdgeMap = [];       // For each cell, list of edge indices + neighbor info

        // Helper to compute rotated zone bounds
        // The zone is a "band" that can rotate in 45° increments
        // Uses 8 discrete rulesets for reliable clipping at each angle
        // Returns { bounds: [[x,y],...], clipPlanes: [{px,py,nx,ny},...], cellBounds: {xMin,xMax,yMin,yMax} }
        function getZoneBounds(includeBuffer = false) {
            const margin = config.contentZoneEnabled ? config.contentZoneMargin : 0;
            const buffer = includeBuffer ? config.bleedBuffer : 0;

            // Calculate center with position offset
            // Position is perpendicular to bar orientation
            const rawAngle = config.contentZoneRotation;
            const snappedAngle = Math.round(rawAngle / 45) * 45 % 360;
            const rotation = snappedAngle * Math.PI / 180;

            // Position offset direction is perpendicular to the bar
            // For horizontal bar (0°): offset is vertical (up/down)
            // For vertical bar (90°): offset is horizontal (left/right)
            // For diagonal (45°): offset is horizontal (as specified by user)
            const positionOffset = config.contentZonePosition;
            let offsetX = 0, offsetY = 0;

            const normalizedAngle = ((snappedAngle % 180) + 180) % 180;
            if (normalizedAngle === 0) {
                // Horizontal bar - offset vertically
                offsetY = positionOffset * (height / 2) * 0.8;
            } else if (normalizedAngle === 90) {
                // Vertical bar - offset horizontally
                offsetX = positionOffset * (width / 2) * 0.8;
            } else {
                // Diagonal bars - offset horizontally (screen is wide)
                offsetX = positionOffset * (width / 2) * 0.8;
            }

            const cx = width / 2 + offsetX;
            const cy = height / 2 + offsetY;

            const cos = Math.cos(rotation);
            const sin = Math.sin(rotation);

            // Band length: screen diagonal ensures full coverage at any angle
            const diagonal = Math.sqrt(width * width + height * height);
            const halfLength = diagonal / 2 + buffer;

            // Band thickness depends on angle sector
            // 0°/180°: use height, 90°/270°: use width, 45°/135°/225°/315°: use diagonal blend
            let effectiveSize;
            // normalizedAngle already computed above for position offset

            if (normalizedAngle === 0) {
                // Horizontal band
                effectiveSize = height;
            } else if (normalizedAngle === 90) {
                // Vertical band
                effectiveSize = width;
            } else {
                // Diagonal bands (45°, 135°)
                // For diagonals, use the smaller dimension to maintain reasonable thickness
                effectiveSize = Math.min(width, height) * 1.2;
            }

            const halfThickness = (effectiveSize / 2) * (1 - margin) + buffer;

            // Create band rectangle in local coords (length along X, thickness along Y)
            const localCorners = [
                [-halfLength, -halfThickness],
                [halfLength, -halfThickness],
                [halfLength, halfThickness],
                [-halfLength, halfThickness]
            ];

            // Rotate and translate to screen center
            const corners = localCorners.map(([lx, ly]) => [
                cx + lx * cos - ly * sin,
                cy + lx * sin + ly * cos
            ]);

            // Build clip planes with correct inward normals for each edge
            // Edge order: top, right, bottom, left (in rotated space)
            // Normals must point INTO the rectangle
            const clipPlanes = [];

            // For each edge, compute the inward-pointing normal
            // The rectangle winds CW in screen coords, so inward is to the LEFT of edge direction
            for (let i = 0; i < 4; i++) {
                const p1 = corners[i];
                const p2 = corners[(i + 1) % 4];
                const ex = p2[0] - p1[0];
                const ey = p2[1] - p1[1];
                const len = Math.sqrt(ex * ex + ey * ey);
                if (len < 0.001) continue;

                // For CW winding, inward normal is (ey, -ex) / len
                // For CCW winding, inward normal is (-ey, ex) / len
                // Our corners are defined CCW in local space, but screen Y is inverted...
                // Let's verify by checking if center is on positive side
                const midX = (p1[0] + p2[0]) / 2;
                const midY = (p1[1] + p2[1]) / 2;

                // Try one normal direction
                let nx = -ey / len;
                let ny = ex / len;

                // Check if center is on positive side (inside)
                const centerDist = (cx - midX) * nx + (cy - midY) * ny;
                if (centerDist < 0) {
                    // Wrong direction, flip it
                    nx = -nx;
                    ny = -ny;
                }

                clipPlanes.push({ px: midX, py: midY, nx, ny });
            }

            // Cell generation bounds - shrink from zone for seed placement
            let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
            for (const [x, y] of corners) {
                minX = Math.min(minX, x);
                maxX = Math.max(maxX, x);
                minY = Math.min(minY, y);
                maxY = Math.max(maxY, y);
            }

            const cellBounds = {
                xMin: Math.max(40, minX + 60),
                xMax: Math.min(width - 40, maxX - 60),
                yMin: Math.max(40, minY + 60),
                yMax: Math.min(height - 40, maxY - 60)
            };

            return { bounds: corners, clipPlanes, cellBounds, snappedAngle };
        }

        function computeBaseVoronoi() {
            const zone = getZoneBounds(true);
            const buffer = config.bleedBuffer;

            // Build edges between all cell pairs
            voronoiEdges = [];
            cellEdgeMap = cells.map(() => []);

            for (let i = 0; i < cells.length; i++) {
                for (let j = i + 1; j < cells.length; j++) {
                    const cellA = cells[i];
                    const cellB = cells[j];

                    const dx = cellB.layoutX - cellA.layoutX;
                    const dy = cellB.layoutY - cellA.layoutY;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < 0.001) continue;

                    const edgeIdx = voronoiEdges.length;

                    // Edge as a LINE: point on line (midpoint) + direction (perpendicular to cell-cell line)
                    const midX = (cellA.layoutX + cellB.layoutX) / 2;
                    const midY = (cellA.layoutY + cellB.layoutY) / 2;

                    // Edge direction (along the edge, perpendicular to cell-cell)
                    const edgeDirX = -dy / dist;
                    const edgeDirY = dx / dist;

                    // Normal pointing from B toward A
                    const nx = -dx / dist;
                    const ny = -dy / dist;

                    voronoiEdges.push({
                        cellA: i,
                        cellB: j,
                        midX, midY,
                        dirX: edgeDirX,
                        dirY: edgeDirY,
                        nx, ny,
                        dist
                    });

                    // Map edges to cells with angle for sorting
                    const angleFromA = Math.atan2(cellB.layoutY - cellA.layoutY, cellB.layoutX - cellA.layoutX);
                    const angleFromB = Math.atan2(cellA.layoutY - cellB.layoutY, cellA.layoutX - cellB.layoutX);

                    cellEdgeMap[i].push({ edgeIdx, neighborIdx: j, angle: angleFromA, side: 'A' });
                    cellEdgeMap[j].push({ edgeIdx, neighborIdx: i, angle: angleFromB, side: 'B' });
                }
            }

            // Sort each cell's edges by angle (counter-clockwise order)
            for (let i = 0; i < cells.length; i++) {
                cellEdgeMap[i].sort((a, b) => a.angle - b.angle);
            }

            // Compute base polygons for centroid reference
            // Uses the weighted bisector (power diagram) so cells with different
            // weights claim proportionally different areas at rest.
            for (let i = 0; i < cells.length; i++) {
                const cell = cells[i];
                let polygon = zone.bounds.map(p => [...p]);

                for (let j = 0; j < cells.length; j++) {
                    if (i === j) continue;
                    const other = cells[j];
                    const b = weightedBisector(
                        cell.layoutX, cell.layoutY, cell.weight,
                        other.layoutX, other.layoutY, other.weight
                    );
                    if (!b) continue;
                    polygon = clipPolygon(polygon, b.mx, b.my, b.nx, b.ny);
                    if (polygon.length < 3) break;
                }

                cell.basePolygon = polygon.length >= 3 ? polygon : null;
                cell.baseCentroid = getPolygonCentroid(cell.basePolygon);
            }

            updateDisplayPolygons();
        }

        // Compute shifted edge as a LINE (point + direction)
        function getShiftedEdge(edge, shift) {
            return {
                // Point on the shifted line
                px: edge.midX + edge.nx * shift,
                py: edge.midY + edge.ny * shift,
                // Direction along the edge (unchanged)
                dx: edge.dirX,
                dy: edge.dirY,
                // Normal (unchanged)
                nx: edge.nx,
                ny: edge.ny
            };
        }

        // Intersect two lines, each defined by point (px,py) and direction (dx,dy)
        function intersectLines(line1, line2) {
            const denom = line1.dx * line2.dy - line1.dy * line2.dx;
            if (Math.abs(denom) < 0.0001) return null; // Parallel

            const t = ((line2.px - line1.px) * line2.dy - (line2.py - line1.py) * line2.dx) / denom;
            return [line1.px + t * line1.dx, line1.py + t * line1.dy];
        }

        // Compute and constrain displacement targets BEFORE Cell.update runs
        // This ensures animation never chases invalid positions that would cause concaves
        function computeDisplacementTargets() {
            // Constraint constants
            const minSeedSeparation = 48;
            const minBisectorDist = 15;
            const maxIterations = 3;
            const safetyBuffer = 30;

            // Compute TARGET displaced positions based on hovered cell
            for (let i = 0; i < cells.length; i++) {
                const cell = cells[i];

                // Default: return to base position
                cell.targetDisplacedX = cell.layoutX;
                cell.targetDisplacedY = cell.layoutY;

                // If no cell is hovered, all targets are base position
                if (hoveredCell < 0 || i === hoveredCell) {
                    continue;
                }

                // Push this seed away from the hovered cell
                const hovered = cells[hoveredCell];
                const dx = cell.layoutX - hovered.layoutX;
                const dy = cell.layoutY - hovered.layoutY;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < 1) continue;

                // Use the HOVERED cell's TARGET scale so neighbors get their final
                // (constrained) target positions immediately. Both hover scale and
                // neighbor displacement animate at the same rate (expansionSpeed),
                // keeping them visually in sync. Using current scale causes constant
                // animation restarts as targets change each frame by >0.5px.
                const scaleExtra = Math.max(0, hovered.targetScale - 1.0);

                // Distance-based falloff to keep far cells calmer/supple
                const falloff = Math.exp(-(dist * dist) / (2 * config.displaceFalloff * config.displaceFalloff));

                // Neighbors move effortlessly - no artificial friction
                const pushAmount = scaleExtra * config.maxExpansion * config.displaceRatio * falloff;

                cell.targetDisplacedX = cell.layoutX + (dx / dist) * pushAmount;
                cell.targetDisplacedY = cell.layoutY + (dy / dist) * pushAmount;
            }
            // No artificial constraints - neighbors move effortlessly
        }

        // Display polygons with neighbor displacement via seed movement
        // Moving seeds recomputes Voronoi naturally while maintaining perfect tessellation
        // Optional `weightOverrides` is a parallel array to cells[] with
        // per-cell weights (e.g. the pressure-boosted output of
        // enforceMinAreas). Falls back to cell.weight when absent.
        function updateDisplayPolygons(weightOverrides) {
            const zone = getZoneBounds(false);
            const zoneWithBuffer = getZoneBounds(true);
            const gap = config.gap;

            // Build array for Voronoi computation from current animated positions
            // Weight carries through so the power diagram gives hero/carousel
            // cells their intended sizes even during hover displacement.
            const displacedSeeds = cells.map((cell, i) => ({
                x: cell.displacedX,
                y: cell.displacedY,
                w: (weightOverrides && weightOverrides[i]) || cell.weight || 1,
                isVoid: cell.isVoid,
            }));

            // Rebuild Voronoi polygons using displaced seeds — weighted bisectors
            for (let i = 0; i < cells.length; i++) {
                const cell = cells[i];
                const seed = displacedSeeds[i];

                // Start with rotated zone bounds (with buffer)
                let polygon = zoneWithBuffer.bounds.map(p => [...p]);

                // Clip against weighted bisector with each other cell
                for (let j = 0; j < cells.length; j++) {
                    if (i === j) continue;
                    const other = displacedSeeds[j];
                    const b = weightedBisector(seed.x, seed.y, seed.w, other.x, other.y, other.w);
                    if (!b) continue;
                    polygon = clipPolygon(polygon, b.mx, b.my, b.nx, b.ny);
                    if (polygon.length < 3) break;
                }

                if (polygon.length < 3) {
                    cell.polygon = cell.basePolygon;
                    cell.displayPolygon = cell.basePolygon;
                    continue;
                }

                // Compute centroid and validate polygon integrity
                const centroid = getPolygonCentroid(polygon);

                // Check polygon area - if it's too small or negative, cell is over-deformed
                // (Using local name `polyAreaSigned` to avoid shadowing the
                // module-level polygonArea() helper added for enforceMinAreas.)
                let polyAreaSigned = 0;
                for (let k = 0; k < polygon.length; k++) {
                    const k1 = (k + 1) % polygon.length;
                    polyAreaSigned += polygon[k][0] * polygon[k1][1];
                    polyAreaSigned -= polygon[k1][0] * polygon[k][1];
                }
                polyAreaSigned = polyAreaSigned / 2;

                // Get base polygon area for comparison
                let baseArea = 0;
                if (cell.basePolygon) {
                    for (let k = 0; k < cell.basePolygon.length; k++) {
                        const k1 = (k + 1) % cell.basePolygon.length;
                        baseArea += cell.basePolygon[k][0] * cell.basePolygon[k1][1];
                        baseArea -= cell.basePolygon[k1][0] * cell.basePolygon[k][1];
                    }
