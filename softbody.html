<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soft Body Constraint Solver</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0f;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        canvas {
            display: block;
        }

        .back-link {
            position: fixed;
            top: 1rem;
            left: 1rem;
            color: #666;
            text-decoration: none;
            font-size: 0.9rem;
            z-index: 100;
        }

        .back-link:hover {
            color: #aaa;
        }

        .info {
            position: fixed;
            bottom: 1rem;
            left: 1rem;
            color: #444;
            font-size: 0.8rem;
            z-index: 100;
        }

        .controls {
            position: fixed;
            top: 1rem;
            right: 1rem;
            background: rgba(20, 20, 30, 0.9);
            padding: 1rem;
            border-radius: 8px;
            color: #888;
            font-size: 0.85rem;
            z-index: 100;
            min-width: 220px;
        }

        .controls h3 {
            color: #aaa;
            font-size: 0.9rem;
            margin-bottom: 0.75rem;
            font-weight: 500;
        }

        .control-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }

        .control-row label {
            flex: 1;
        }

        .control-row input[type="range"] {
            width: 80px;
        }

        .control-row span {
            width: 40px;
            text-align: right;
            font-family: monospace;
            font-size: 0.8rem;
        }

        button {
            width: 100%;
            padding: 0.5rem;
            margin-top: 0.5rem;
            background: #2a2a3a;
            border: 1px solid #3a3a4a;
            color: #aaa;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
        }

        button:hover {
            background: #3a3a4a;
            color: #ccc;
        }

        .divider {
            height: 1px;
            background: #3a3a4a;
            margin: 0.75rem 0;
        }
    </style>
</head>
<body>
    <a href="index.html" class="back-link">&larr; Back</a>

    <div class="controls">
        <h3>Constraints</h3>
        <div class="control-row">
            <label>Iterations</label>
            <input type="range" id="iterations" min="1" max="30" value="15">
            <span id="iterationsVal">15</span>
        </div>
        <div class="control-row">
            <label>Cell Gap</label>
            <input type="range" id="cellGap" min="0" max="20" value="4">
            <span id="cellGapVal">4</span>
        </div>
        <div class="control-row">
            <label>Vertices</label>
            <input type="range" id="vertexCount" min="6" max="24" value="12">
            <span id="vertexCountVal">12</span>
        </div>
        <div class="divider"></div>
        <h3>Tuning</h3>
        <div class="control-row">
            <label>Edge Stretch</label>
            <input type="range" id="edgeStretch" min="1" max="3" step="0.1" value="1.8">
            <span id="edgeStretchVal">1.8</span>
        </div>
        <div class="control-row">
            <label>Area Strength</label>
            <input type="range" id="areaStrength" min="0.05" max="0.8" step="0.05" value="0.3">
            <span id="areaStrengthVal">0.3</span>
        </div>
        <div class="control-row">
            <label>Aspect Limit</label>
            <input type="range" id="aspectLimit" min="1.5" max="5" step="0.5" value="2.5">
            <span id="aspectLimitVal">2.5</span>
        </div>
        <div class="control-row">
            <label>Convex Push</label>
            <input type="range" id="convexPush" min="1" max="10" step="0.5" value="3">
            <span id="convexPushVal">3</span>
        </div>
        <div class="control-row">
            <label>Sphere Return</label>
            <input type="range" id="sphereReturn" min="0" max="0.1" step="0.005" value="0.02">
            <span id="sphereReturnVal">0.02</span>
        </div>
        <div class="divider"></div>
        <button id="resetBtn">Reset</button>
        <button id="addBtn">Add Cell</button>
        <button id="removeBtn">Remove Cell</button>
    </div>

    <div class="info">
        Drag cells. No physics — just constraint solving. Shapes emerge from pressure.
    </div>

    <canvas id="canvas"></canvas>

    <script>
        // ============================================
        // PURE CONSTRAINT SOLVER
        // No velocity, no momentum, no bouncing
        // Cells just find equilibrium positions
        // ============================================

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        const config = {
            iterations: 20,         // Constraint solving iterations per frame
            cellGap: 5,             // Minimum gap between cells
            vertexCount: 12,        // Vertices per cell (fewer = simpler physics)
            baseRadius: 50,         // Default cell radius
            // Tuning parameters
            edgeStretch: 1.8,       // Max edge length multiplier (1.0 = no stretch)
            areaStrength: 0.3,      // How aggressively area is preserved (0-1)
            aspectLimit: 2.5,       // Max aspect ratio before correction
            convexPush: 3,          // How far to push concave vertices
            sphereReturn: 0.02,     // How fast free cells return to sphere
        };

        let container = { x: 0, y: 0, width: 0, height: 0 };

        // ============================================
        // SOFT CELL - Just vertices and constraints
        // ============================================

        class SoftCell {
            constructor(x, y, radius, color) {
                this.color = color;
                this.radius = radius;
                this.targetArea = Math.PI * radius * radius;

                // Create ring of vertices (just positions, no velocity)
                this.verts = [];
                const n = config.vertexCount;
                for (let i = 0; i < n; i++) {
                    const angle = (i / n) * Math.PI * 2;
                    this.verts.push({
                        x: x + Math.cos(angle) * radius,
                        y: y + Math.sin(angle) * radius
                    });
                }

                this.restLength = (2 * Math.PI * radius) / n;
            }

            centroid() {
                let cx = 0, cy = 0;
                for (const v of this.verts) {
                    cx += v.x;
                    cy += v.y;
                }
                const n = this.verts.length;
                return { x: cx / n, y: cy / n };
            }

            area() {
                let a = 0;
                const n = this.verts.length;
                for (let i = 0; i < n; i++) {
                    const j = (i + 1) % n;
                    a += this.verts[i].x * this.verts[j].y;
                    a -= this.verts[j].x * this.verts[i].y;
                }
                return Math.abs(a) / 2;
            }

            // Constraint: edge lengths - prevent collapse AND prevent over-stretch
            constrainEdges() {
                const n = this.verts.length;
                const minLen = this.restLength * 0.4;
                const maxLen = this.restLength * config.edgeStretch;

                for (let i = 0; i < n; i++) {
                    const v1 = this.verts[i];
                    const v2 = this.verts[(i + 1) % n];

                    const dx = v2.x - v1.x;
                    const dy = v2.y - v1.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < 0.001) continue;

                    let targetDist = dist;
                    if (dist < minLen) targetDist = minLen;
                    if (dist > maxLen) targetDist = maxLen;

                    if (targetDist !== dist) {
                        const diff = (dist - targetDist) / dist;
                        const offsetX = dx * diff * 0.5;
                        const offsetY = dy * diff * 0.5;

                        safeMove(v1, v1.x + offsetX, v1.y + offsetY, this);
                        safeMove(v2, v2.x - offsetX, v2.y - offsetY, this);
                    }
                }
            }

            // HARD Constraint: CONVEXITY - no inward curves allowed
            // If vertex is concave, SNAP it to valid position immediately
            constrainConvexity() {
                const n = this.verts.length;
                const c = this.centroid();

                for (let i = 0; i < n; i++) {
                    const prev = this.verts[(i - 1 + n) % n];
                    const curr = this.verts[i];
                    const next = this.verts[(i + 1) % n];

                    // Cross product to check if vertex is concave
                    const ax = curr.x - prev.x;
                    const ay = curr.y - prev.y;
                    const bx = next.x - curr.x;
                    const by = next.y - curr.y;
                    const cross = ax * by - ay * bx;

                    // Only fix actually concave vertices (cross < 0)
                    // Don't over-correct - allow natural deformation at contact points
                    if (cross < 0) {
                        // Midpoint between neighbors
                        const midX = (prev.x + next.x) / 2;
                        const midY = (prev.y + next.y) / 2;

                        // Direction from centroid to midpoint
                        const dx = midX - c.x;
                        const dy = midY - c.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);

                        if (dist > 0.001) {
                            // Place vertex just beyond midpoint
                            const newX = midX + (dx / dist) * config.convexPush;
                            const newY = midY + (dy / dist) * config.convexPush;
                            safeMove(curr, newX, newY, this);
                        } else {
                            safeMove(curr, midX, midY, this);
                        }
                    }
                }
            }

            // HARD Constraint: No self-intersection
            // Check if polygon crosses itself - if so, reset to sphere
            checkAndFixSelfIntersection() {
                const n = this.verts.length;

                // Check all pairs of non-adjacent edges
                for (let i = 0; i < n; i++) {
                    const a1 = this.verts[i];
                    const a2 = this.verts[(i + 1) % n];

                    for (let j = i + 2; j < n; j++) {
                        if (j === (i - 1 + n) % n) continue; // Skip adjacent
                        if (i === 0 && j === n - 1) continue; // Skip first-last (adjacent)

                        const b1 = this.verts[j];
                        const b2 = this.verts[(j + 1) % n];

                        if (this.edgesIntersect(a1, a2, b1, b2)) {
                            // CATASTROPHIC: Reset to sphere immediately
                            this.resetToSphere();
                            return true;
                        }
                    }
                }
                return false;
            }

            // Check if two line segments intersect
            edgesIntersect(a1, a2, b1, b2) {
                const d1 = this.crossProduct(b2.x - b1.x, b2.y - b1.y, a1.x - b1.x, a1.y - b1.y);
                const d2 = this.crossProduct(b2.x - b1.x, b2.y - b1.y, a2.x - b1.x, a2.y - b1.y);
                const d3 = this.crossProduct(a2.x - a1.x, a2.y - a1.y, b1.x - a1.x, b1.y - a1.y);
                const d4 = this.crossProduct(a2.x - a1.x, a2.y - a1.y, b2.x - a1.x, b2.y - a1.y);

                if (((d1 > 0 && d2 < 0) || (d1 < 0 && d2 > 0)) &&
                    ((d3 > 0 && d4 < 0) || (d3 < 0 && d4 > 0))) {
                    return true;
                }
                return false;
            }

            crossProduct(ax, ay, bx, by) {
                return ax * by - ay * bx;
            }

            // Emergency reset to sphere
            resetToSphere() {
                const c = this.centroid();
                const targetRadius = Math.sqrt(this.targetArea / Math.PI);
                const n = this.verts.length;

                for (let i = 0; i < n; i++) {
                    const angle = (i / n) * Math.PI * 2;
                    this.verts[i].x = c.x + Math.cos(angle) * targetRadius;
                    this.verts[i].y = c.y + Math.sin(angle) * targetRadius;
                }
            }

            // HARD Constraint: limit aspect ratio - max 2.5:1
            constrainAspectRatio() {
                let minX = Infinity, maxX = -Infinity;
                let minY = Infinity, maxY = -Infinity;
                for (const v of this.verts) {
                    minX = Math.min(minX, v.x);
                    maxX = Math.max(maxX, v.x);
                    minY = Math.min(minY, v.y);
                    maxY = Math.max(maxY, v.y);
                }

                const width = maxX - minX;
                const height = maxY - minY;
                const maxRatio = config.aspectLimit;
                const c = this.centroid();

                // Apply HARD constraint - scale down the long axis IMMEDIATELY
                if (width > height * maxRatio && height > 5) {
                    const targetWidth = height * maxRatio;
                    const scale = targetWidth / width;
                    for (const v of this.verts) {
                        const newX = c.x + (v.x - c.x) * scale;
                        safeMove(v, newX, v.y, this);
                    }
                } else if (height > width * maxRatio && width > 5) {
                    const targetHeight = width * maxRatio;
                    const scale = targetHeight / height;
                    for (const v of this.verts) {
                        const newY = c.y + (v.y - c.y) * scale;
                        safeMove(v, v.x, newY, this);
                    }
                }

                // Also check diagonal stretch - use actual vertex distances
                let maxDist = 0;
                let minDist = Infinity;
                for (const v of this.verts) {
                    const dx = v.x - c.x;
                    const dy = v.y - c.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    maxDist = Math.max(maxDist, dist);
                    minDist = Math.min(minDist, dist);
                }

                // If max radius is more than 3x min radius, something is wrong
                if (maxDist > minDist * 3 && minDist > 1) {
                    // Pull extreme vertices inward
                    const targetMax = minDist * 2.5;
                    for (const v of this.verts) {
                        const dx = v.x - c.x;
                        const dy = v.y - c.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist > targetMax) {
                            const scale = targetMax / dist;
                            const newX = c.x + dx * scale;
                            const newY = c.y + dy * scale;
                            safeMove(v, newX, newY, this);
                        }
                    }
                }
            }

            // Constraint: gently return to sphere when free (not touching anything)
            constrainReturnToSphere(isFree) {
                if (!isFree) return;

                const c = this.centroid();
                const targetRadius = Math.sqrt(this.targetArea / Math.PI);

                for (const v of this.verts) {
                    const dx = v.x - c.x;
                    const dy = v.y - c.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < 0.001) continue;

                    // Gently pull toward target radius
                    const diff = (dist - targetRadius) * config.sphereReturn;
                    const newX = v.x - (dx / dist) * diff;
                    const newY = v.y - (dy / dist) * diff;
                    safeMove(v, newX, newY, this);
                }
            }

            // Constraint: ALWAYS maintain target area (incompressible)
            constrainArea() {
                const currentArea = this.area();
                if (currentArea < 1) {
                    this.resetToSphere();
                    return;
                }

                const c = this.centroid();

                // ALWAYS push toward target area, not just at extremes
                const ratio = Math.sqrt(this.targetArea / currentArea);

                // Scale all vertices from centroid to achieve target area
                if (Math.abs(ratio - 1) > 0.01) {
                    // Blend toward correct area (not instant, but strong)
                    const scale = 1 + (ratio - 1) * config.areaStrength;

                    for (const v of this.verts) {
                        const newX = c.x + (v.x - c.x) * scale;
                        const newY = c.y + (v.y - c.y) * scale;
                        safeMove(v, newX, newY, this);
                    }
                }
            }

            // Constraint: stay inside container
            constrainWalls() {
                const margin = 2;
                for (const v of this.verts) {
                    v.x = Math.max(container.x + margin, Math.min(container.x + container.width - margin, v.x));
                    v.y = Math.max(container.y + margin, Math.min(container.y + container.height - margin, v.y));
                }
            }

            containsPoint(px, py) {
                let inside = false;
                const n = this.verts.length;
                for (let i = 0, j = n - 1; i < n; j = i++) {
                    const vi = this.verts[i];
                    const vj = this.verts[j];
                    if (((vi.y > py) !== (vj.y > py)) &&
                        (px < (vj.x - vi.x) * (py - vi.y) / (vj.y - vi.y) + vi.x)) {
                        inside = !inside;
                    }
                }
                return inside;
            }

            translate(dx, dy) {
                for (const v of this.verts) {
                    safeMove(v, v.x + dx, v.y + dy, this);
                }
            }
        }

        // ============================================
        // COLLISION CONSTRAINTS
        // ============================================

        function pointInPolygon(px, py, verts) {
            let inside = false;
            const n = verts.length;
            for (let i = 0, j = n - 1; i < n; j = i++) {
                const vi = verts[i];
                const vj = verts[j];
                if (((vi.y > py) !== (vj.y > py)) &&
                    (px < (vj.x - vi.x) * (py - vi.y) / (vj.y - vi.y) + vi.x)) {
                    inside = !inside;
                }
            }
            return inside;
        }

        function closestEdgeToPoint(px, py, verts) {
            let minDist = Infinity;
            let closestPoint = { x: px, y: py };
            let edgeNormal = { x: 0, y: 1 };

            const n = verts.length;
            for (let i = 0; i < n; i++) {
                const v1 = verts[i];
                const v2 = verts[(i + 1) % n];

                const ex = v2.x - v1.x;
                const ey = v2.y - v1.y;
                const len2 = ex * ex + ey * ey;
                if (len2 < 0.0001) continue;

                let t = ((px - v1.x) * ex + (py - v1.y) * ey) / len2;
                t = Math.max(0, Math.min(1, t));

                const closestX = v1.x + ex * t;
                const closestY = v1.y + ey * t;
                const dx = px - closestX;
                const dy = py - closestY;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < minDist) {
                    minDist = dist;
                    closestPoint = { x: closestX, y: closestY };
                    const len = Math.sqrt(len2);
                    // For CCW polygon, outward normal is (ey, -ex)
                    edgeNormal = { x: ey / len, y: -ex / len };
                }
            }

            return { dist: minDist, point: closestPoint, normal: edgeNormal };
        }

        // Global list of all cells for collision checking
        // (set before solve() runs)
        let allCells = [];

        // Check if a point would be inside any other cell
        function wouldPenetrateOther(x, y, ignoreCell) {
            for (const other of allCells) {
                if (other === ignoreCell) continue;
                if (pointInPolygon(x, y, other.verts)) {
                    return other;
                }
            }
            return null;
        }

        // Safe move: move vertex but stop at other cell's boundary
        function safeMove(vertex, newX, newY, ownerCell) {
            // Check if new position would be inside another cell
            const blocker = wouldPenetrateOther(newX, newY, ownerCell);

            if (!blocker) {
                // Safe - apply full move
                vertex.x = newX;
                vertex.y = newY;
                return;
            }

            // Would penetrate - find safe position on blocker's boundary
            const edge = closestEdgeToPoint(newX, newY, blocker.verts);

            // Place vertex at boundary + gap, along normal
            vertex.x = edge.point.x + edge.normal.x * (config.cellGap + 1);
            vertex.y = edge.point.y + edge.normal.y * (config.cellGap + 1);
        }

        // Minimum distance between cell surfaces
        function maintainSurfaceGap(cellA, cellB) {
            const gap = config.cellGap;

            for (const v of cellA.verts) {
                const edge = closestEdgeToPoint(v.x, v.y, cellB.verts);
                if (edge.dist < gap) {
                    // Move to maintain gap
                    v.x = edge.point.x + edge.normal.x * gap;
                    v.y = edge.point.y + edge.normal.y * gap;
                }
            }

            for (const v of cellB.verts) {
                const edge = closestEdgeToPoint(v.x, v.y, cellA.verts);
                if (edge.dist < gap) {
                    v.x = edge.point.x + edge.normal.x * gap;
                    v.y = edge.point.y + edge.normal.y * gap;
                }
            }
        }

        // Cell-cell collision constraint
        function constrainCells(cellA, cellB) {
            const cA = cellA.centroid();
            const cB = cellB.centroid();
            const dist = Math.sqrt((cA.x - cB.x) ** 2 + (cA.y - cB.y) ** 2);
            if (dist > cellA.radius + cellB.radius + 60) return;

            // Maintain gap between surfaces
            maintainSurfaceGap(cellA, cellB);
        }

        // ============================================
        // MAIN SOLVE LOOP
        // ============================================

        let cells = [];

        // Check if cell is touching any wall
        function isTouchingWall(cell) {
            const margin = 10;
            for (const v of cell.verts) {
                if (v.x < container.x + margin || v.x > container.x + container.width - margin ||
                    v.y < container.y + margin || v.y > container.y + container.height - margin) {
                    return true;
                }
            }
            return false;
        }

        // Check if two cells are close
        function areCellsClose(cellA, cellB) {
            const cA = cellA.centroid();
            const cB = cellB.centroid();
            const dist = Math.sqrt((cA.x - cB.x) ** 2 + (cA.y - cB.y) ** 2);
            return dist < cellA.radius + cellB.radius + 20;
        }

        function solve() {
            // Set global cell list for collision checks
            allCells = cells;

            // First pass: determine which cells are "free"
            const isFree = cells.map((cell, i) => {
                if (isTouchingWall(cell)) return false;
                for (let j = 0; j < cells.length; j++) {
                    if (i !== j && areCellsClose(cell, cells[j])) return false;
                }
                return true;
            });

            for (let iter = 0; iter < config.iterations; iter++) {
                // HARD constraints first - these are non-negotiable
                for (const cell of cells) {
                    cell.checkAndFixSelfIntersection();  // Nuclear option if intersecting
                    cell.constrainConvexity();           // Snap concave vertices
                    cell.constrainAspectRatio();         // Limit stretch
                }

                // Shape constraints
                for (let i = 0; i < cells.length; i++) {
                    const cell = cells[i];
                    cell.constrainEdges();
                    cell.constrainArea();
                    cell.constrainReturnToSphere(isFree[i]);
                }

                // Cell-cell constraints
                for (let i = 0; i < cells.length; i++) {
                    for (let j = i + 1; j < cells.length; j++) {
                        constrainCells(cells[i], cells[j]);
                    }
                }

                // Wall constraints
                for (const cell of cells) {
                    cell.constrainWalls();
                }

                // HARD constraints again after all modifications
                for (const cell of cells) {
                    cell.constrainConvexity();
                    cell.constrainAspectRatio();
                    cell.checkAndFixSelfIntersection();
                }
            }
        }

        // ============================================
        // RENDERING
        // ============================================

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Container
            ctx.strokeStyle = '#2a2a3a';
            ctx.lineWidth = 3;
            ctx.strokeRect(container.x, container.y, container.width, container.height);
            ctx.fillStyle = '#0c0c12';
            ctx.fillRect(container.x + 1, container.y + 1, container.width - 2, container.height - 2);

            // Cells
            for (const cell of cells) {
                drawCell(cell);
            }
        }

        function drawCell(cell) {
            const verts = cell.verts;
            if (verts.length < 3) return;

            ctx.beginPath();
            const firstMid = {
                x: (verts[0].x + verts[verts.length - 1].x) / 2,
                y: (verts[0].y + verts[verts.length - 1].y) / 2
            };
            ctx.moveTo(firstMid.x, firstMid.y);

            for (let i = 0; i < verts.length; i++) {
                const curr = verts[i];
                const next = verts[(i + 1) % verts.length];
                const midX = (curr.x + next.x) / 2;
                const midY = (curr.y + next.y) / 2;
                ctx.quadraticCurveTo(curr.x, curr.y, midX, midY);
            }
            ctx.closePath();

            // Fill
            const c = cell.centroid();
            const gradient = ctx.createRadialGradient(
                c.x - cell.radius * 0.2, c.y - cell.radius * 0.2, 0,
                c.x, c.y, cell.radius * 1.3
            );
            gradient.addColorStop(0, lightenColor(cell.color, 0.15));
            gradient.addColorStop(0.6, cell.color);
            gradient.addColorStop(1, darkenColor(cell.color, 0.25));
            ctx.fillStyle = gradient;
            ctx.fill();

            // Stroke
            ctx.strokeStyle = lightenColor(cell.color, 0.25);
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        function darkenColor(hex, factor) {
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            return `rgb(${Math.floor(r * (1 - factor))}, ${Math.floor(g * (1 - factor))}, ${Math.floor(b * (1 - factor))})`;
        }

        function lightenColor(hex, factor) {
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            return `rgb(${Math.min(255, r + (255 - r) * factor)}, ${Math.min(255, g + (255 - g) * factor)}, ${Math.min(255, b + (255 - b) * factor)})`;
        }

        // ============================================
        // INTERACTION
        // ============================================

        let draggedCell = null;
        let lastMouse = { x: 0, y: 0 };

        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            for (let i = cells.length - 1; i >= 0; i--) {
                if (cells[i].containsPoint(x, y)) {
                    draggedCell = cells[i];
                    cells.splice(i, 1);
                    cells.push(draggedCell);
                    lastMouse = { x, y };
                    break;
                }
            }
        });

        canvas.addEventListener('mousemove', (e) => {
            if (!draggedCell) return;
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            draggedCell.translate(x - lastMouse.x, y - lastMouse.y);
            lastMouse = { x, y };
        });

        canvas.addEventListener('mouseup', () => { draggedCell = null; });
        canvas.addEventListener('mouseleave', () => { draggedCell = null; });

        // ============================================
        // SETUP
        // ============================================

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            container.x = 50;
            container.y = 50;
            container.width = canvas.width - 320;
            container.height = canvas.height - 100;
        }

        function initCells() {
            cells = [];
            const colors = ['#e74c3c', '#3498db', '#2ecc71', '#f39c12', '#9b59b6', '#1abc9c'];
            const count = 5;

            for (let i = 0; i < count; i++) {
                const x = container.x + 100 + (i % 3) * 120;
                const y = container.y + 100 + Math.floor(i / 3) * 120;
                const radius = config.baseRadius + (Math.random() - 0.5) * 10;
                cells.push(new SoftCell(x, y, radius, colors[i % colors.length]));
            }
        }

        function animate() {
            solve();
            render();
            requestAnimationFrame(animate);
        }

        // Controls
        document.getElementById('iterations').addEventListener('input', (e) => {
            config.iterations = +e.target.value;
            document.getElementById('iterationsVal').textContent = e.target.value;
        });

        document.getElementById('cellGap').addEventListener('input', (e) => {
            config.cellGap = +e.target.value;
            document.getElementById('cellGapVal').textContent = e.target.value;
        });

        document.getElementById('vertexCount').addEventListener('input', (e) => {
            config.vertexCount = +e.target.value;
            document.getElementById('vertexCountVal').textContent = e.target.value;
            initCells(); // Reset to apply new vertex count
        });

        document.getElementById('edgeStretch').addEventListener('input', (e) => {
            config.edgeStretch = +e.target.value;
            document.getElementById('edgeStretchVal').textContent = e.target.value;
        });

        document.getElementById('areaStrength').addEventListener('input', (e) => {
            config.areaStrength = +e.target.value;
            document.getElementById('areaStrengthVal').textContent = e.target.value;
        });

        document.getElementById('aspectLimit').addEventListener('input', (e) => {
            config.aspectLimit = +e.target.value;
            document.getElementById('aspectLimitVal').textContent = e.target.value;
        });

        document.getElementById('convexPush').addEventListener('input', (e) => {
            config.convexPush = +e.target.value;
            document.getElementById('convexPushVal').textContent = e.target.value;
        });

        document.getElementById('sphereReturn').addEventListener('input', (e) => {
            config.sphereReturn = +e.target.value;
            document.getElementById('sphereReturnVal').textContent = e.target.value;
        });

        document.getElementById('resetBtn').addEventListener('click', initCells);

        document.getElementById('addBtn').addEventListener('click', () => {
            const colors = ['#e74c3c', '#3498db', '#2ecc71', '#f39c12', '#9b59b6', '#1abc9c'];
            const x = container.x + container.width / 2 + (Math.random() - 0.5) * 100;
            const y = container.y + 100;
            cells.push(new SoftCell(x, y, config.baseRadius, colors[cells.length % colors.length]));
        });

        document.getElementById('removeBtn').addEventListener('click', () => {
            if (cells.length > 1) cells.pop();
        });

        // Init
        window.addEventListener('resize', resize);
        resize();
        initCells();
        animate();
    </script>
</body>
</html>
