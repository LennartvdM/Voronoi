            <input type="range" id="gravAngleSlider" min="0" max="6.28" step="0.1" value="1.57">
            <input type="number" id="gravAngleNum" min="0" max="6.28" step="0.1" value="1.57">

<script>
'use strict';

// ═══════════════════════════════════════════════════════════════
//  MK5 — VOROBOIDS — Chunk 0
//
//  Core proof: atomic cells with pairwise bisector contact.
//  Each cell is an independent body (position, area, circle).
//  When two cells overlap, a bisector clips both.
//  When they separate, each reverts to its rest shape.
//  No global tessellation. No shared mesh. Just atoms + contact.
// ═══════════════════════════════════════════════════════════════

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const info = document.getElementById('info');

let W = 0, H = 0, dpr = 1;
function resize() {
    dpr = window.devicePixelRatio || 1;
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);
resize();

// ─── Config ──────────────────────────────────────────────────
let GAP = 4;           // minimum pixel gap between cell surfaces
const CORNER_RADIUS = 12;
const AREA_ITERS = 3;  // area-correction iterations
let GRAVITY_REACH = 0.35; // how much cells stretch toward neighbors (cosmetic only)
let BORDER_PULL = 0;      // how much cells stretch toward viewport borders (angle only, distance irrelevant)
let BORDER_FOCUS = 1;     // taper curve for border push (0.3=sharp teardrop, 1=linear, 5=wide capsule)
let VOID_PULL = 0;        // how much cells stretch toward void objects (like border pull)

// ─── Void objects ────────────────────────────────────────────
// Rigid shapes that cells incline toward but must settle outside.
// Permeable during motion, authoritative at rest.
class VoidObject {
    constructor(x, y, w, h) {
        this.x = x;      // center x
        this.y = y;       // center y
        this.w = w;       // half-width
        this.h = h;       // half-height
    }

    // Signed distance from point to box boundary.
    // Negative = inside, positive = outside.
    signedDist(px, py) {
        const dx = Math.abs(px - this.x) - this.w;
        const dy = Math.abs(py - this.y) - this.h;
        if (dx > 0 && dy > 0) return Math.sqrt(dx * dx + dy * dy);
        return Math.max(dx, dy);
    }

    // Nearest point on the box boundary from an external point
    nearestBoundaryPoint(px, py) {
        // Clamp to box, then project to nearest edge
        const cx = Math.max(this.x - this.w, Math.min(this.x + this.w, px));
        const cy = Math.max(this.y - this.h, Math.min(this.y + this.h, py));

        // If clamped point equals input, point is inside — push to nearest edge
        if (Math.abs(cx - px) < 0.01 && Math.abs(cy - py) < 0.01) {
            const dLeft = px - (this.x - this.w);
            const dRight = (this.x + this.w) - px;
            const dTop = py - (this.y - this.h);
            const dBot = (this.y + this.h) - py;
            const dMin = Math.min(dLeft, dRight, dTop, dBot);
            if (dMin === dLeft) return { x: this.x - this.w, y: py, nx: -1, ny: 0 };
            if (dMin === dRight) return { x: this.x + this.w, y: py, nx: 1, ny: 0 };
            if (dMin === dTop) return { x: px, y: this.y - this.h, nx: 0, ny: -1 };
            return { x: px, y: this.y + this.h, nx: 0, ny: 1 };
        }

        // Outside — nearest point is the clamped point
        const dx = px - cx, dy = py - cy;
        const d = Math.sqrt(dx * dx + dy * dy) || 1;
        return { x: cx, y: cy, nx: dx / d, ny: dy / d };
    }

    // Is point inside the box?
    contains(px, py) {
        return Math.abs(px - this.x) <= this.w && Math.abs(py - this.y) <= this.h;
    }
}

let voidObjects = [];
let placingVoid = false;
let voidDragStart = null;

const COLORS = [
    '#6366f1', '#8b5cf6', '#ec4899', '#f43f5e',
    '#f97316', '#eab308', '#22c55e', '#14b8a6',
    '#06b6d4', '#3b82f6', '#a78bfa', '#fb923c',
];

// Gravity: pulls cell centers without affecting size.
// Cells settle under gravity, contact solver prevents compression.
let GRAVITY_STRENGTH = 0;    // pixels/frame²
let GRAVITY_ANGLE = Math.PI / 2; // radians (default: downward)
const VELOCITY_DAMPING = 0.92;   // per-frame velocity decay

// ─── Cell class ──────────────────────────────────────────────
// The atom. Self-contained. Independently movable. Separable.
class Cell {
    constructor(id, x, y, weight, color) {
        this.id = id;
        this.x = x;
        this.y = y;
        this.weight = weight || 1;   // relative size (1=normal, 2=4x area, 0.5=0.25x)
        this.color = color || COLORS[id % COLORS.length];

        // Area is computed from weight in updateAreas()
        this.area = 100;
        this.baseArea = 100;

        // Velocity for gravity-driven physics
        this.vx = 0;
        this.vy = 0;

        // Target position/weight from layout (for transitions)
        this.targetX = x;
        this.targetY = y;
        this.targetWeight = this.weight;

        // Current rendered polygon
        this.polygon = null;
        this._debugPulls = null;
        this.restPoly = null;

        // Hover state
        this.hoverMix = 0;

        // Role: 'content' | 'hero' | 'carousel' | 'void'
        this.role = 'content';
        this.visible = true;
    }

    // Generate rest-shape polygon, stretched toward nearby neighbors.
    // Each vertex is pulled toward nearby cell centers — cells "reach"
    // into gaps and create natural tension at boundaries.
    // IMPORTANT: pull is capped so the vertex never extends past
    // the midpoint to any neighbor. This keeps the stretch self-limiting
    // even at extreme GRAVITY_REACH values.
    generateRestPoly(nVerts, neighbors) {
        const r = Math.sqrt(this.area / Math.PI);
        const rBase = Math.sqrt(this.baseArea / Math.PI);
        const poly = [];
        if (debugMode) this._debugPulls = [];

        // ── Find border direction: radial from viewport center ──
        // Vector from viewport center through cell center, projected
        // to where it hits the border. This gives each cell a natural
        // "outward" direction: top-left cells push top-left, right
        // cells push right, etc.
        const vcx = W / 2, vcy = H / 2;
        let odx = this.x - vcx, ody = this.y - vcy;
        const odist = Math.sqrt(odx * odx + ody * ody);
        if (odist < 1) { odx = 0; ody = -1; } // center fallback: push up
        else { odx /= odist; ody /= odist; }

        // Ray-cast from cell center in outward direction to find border hit
        let borderT = Infinity;
        if (odx > 0.001)  borderT = Math.min(borderT, (W - this.x) / odx);
        if (odx < -0.001) borderT = Math.min(borderT, -this.x / odx);
        if (ody > 0.001)  borderT = Math.min(borderT, (H - this.y) / ody);
        if (ody < -0.001) borderT = Math.min(borderT, -this.y / ody);

        const borderNx = odx, borderNy = ody;
        const borderDist = borderT;
        const borderPx = this.x + odx * borderT;
        const borderPy = this.y + ody * borderT;

        for (let i = 0; i < nVerts; i++) {
            const a = (i / nVerts) * Math.PI * 2;
            const cosA = Math.cos(a), sinA = Math.sin(a);
            const baseX = this.x + cosA * r;
            const baseY = this.y + sinA * r;
            let pullX = 0, pullY = 0;
            let borderPullX = 0, borderPullY = 0;
            let cellPullX = 0, cellPullY = 0;

            // ── Cell-to-cell gravitational stretch ───────────
            if (neighbors && neighbors.length > 0) {
                for (const nb of neighbors) {
                    const dx = nb.x - this.x;
                    const dy = nb.y - this.y;
                    const dist = Math.sqrt(dx * dx + dy * dy) || 1;
                    const rNbBase = Math.sqrt(nb.baseArea / Math.PI);
                    const rSum = rBase + rNbBase;

                    if (dist > rSum * 2.5) continue;

                    const ndx = dx / dist, ndy = dy / dist;
                    const facing = cosA * ndx + sinA * ndy;
                    if (facing <= 0) continue;

                    const proximity = 1 - Math.min(dist / (rSum * 2), 1);
                    const strength = facing * facing * proximity * GRAVITY_REACH;

                    cellPullX += ndx * strength * rBase;
                    cellPullY += ndy * strength * rBase;
                }
            }
            pullX += cellPullX;
            pullY += cellPullY;

            // ── Border pull — directional push with taper ─────
            // Each border-facing vertex gets pushed in the border
            // direction. Push magnitude tapers from full at the tip
            // to zero at the equator. The taper is always monotonic,
            // so the shape is CONVEX BY CONSTRUCTION — no focal
            // point, no convergence, no possibility of concavity.
            //
            // BORDER_FOCUS controls the taper curve:
            //   0.3 = sharp teardrop (power taper, narrow tip)
            //   1   = linear taper (cone-like)
            //   2   = quadratic (rounder teardrop)
            //   5+  = wide, approaching capsule
            if (BORDER_PULL > 0) {
                const facing = cosA * borderNx + sinA * borderNy;
                if (facing > 0) {
                    // Taper: facing^(1/BORDER_FOCUS)
                    // Monotonic from 0 (equator) to 1 (tip).
                    const taper = Math.pow(facing, 1 / Math.max(0.1, BORDER_FOCUS));
                    const bPull = BORDER_PULL * rBase * 0.5 * taper;

                    // Push in border direction — same direction for all vertices
                    borderPullX = borderNx * bPull;
                    borderPullY = borderNy * bPull;
                    pullX += borderPullX;
                    pullY += borderPullY;
                }
            }

            // ── Void object pull ──────────────────────────────
            // Cells stretch toward void objects the same way they
            // stretch toward borders — directional push with taper.
            if (VOID_PULL > 0 && voidObjects.length > 0) {
                for (const v of voidObjects) {
                    const bp = v.nearestBoundaryPoint(this.x, this.y);
                    const dx = bp.x - this.x, dy = bp.y - this.y;
                    const dist = Math.sqrt(dx * dx + dy * dy) || 1;
                    const vnx = dx / dist, vny = dy / dist;

                    // Facing: how much does this vertex point toward the void?
                    const facing = cosA * vnx + sinA * vny;
                    if (facing > 0) {
                        const taper = Math.pow(facing, 1 / Math.max(0.1, BORDER_FOCUS));
                        const vPull = VOID_PULL * rBase * 0.5 * taper;
                        pullX += vnx * vPull;
                        pullY += vny * vPull;
                    }
                }
            }

            // Store debug vectors
            if (debugMode) {
                this._debugPulls.push({
                    bx: baseX, by: baseY,
                    cpx: cellPullX, cpy: cellPullY,
                    bpx: borderPullX, bpy: borderPullY,
                    px: pullX, py: pullY,
                    borderNx, borderNy, borderPx, borderPy,
                });
            }

            // ── Cap: combined pull must not overshoot ────────
            // Vertex can't extend past 40% of the gap to nearest
            // neighbor in the pull direction. Border distance is
            // IRRELEVANT — the lerp already prevents focal overshoot.
            const pullMag = Math.sqrt(pullX * pullX + pullY * pullY);
            if (pullMag > 0.01) {
                const pullDirX = pullX / pullMag;
                const pullDirY = pullY / pullMag;

                let maxReach = Infinity;

                // Cap against neighbors only
                if (neighbors) {
                    for (const nb of neighbors) {
                        const dx = nb.x - this.x;
                        const dy = nb.y - this.y;
                        const dot = dx * pullDirX + dy * pullDirY;
                        if (dot > 0) {
                            const rNbBase = Math.sqrt(nb.baseArea / Math.PI);
                            const gapToNb = dot - rBase - rNbBase;
                            maxReach = Math.min(maxReach, rBase + Math.max(gapToNb * 0.4, 0));
                        }
                    }
                }

                if (maxReach < Infinity && pullMag > maxReach) {
                    const scale = maxReach / pullMag;
                    pullX *= scale;
                    pullY *= scale;
                }
            }

            poly.push([baseX + pullX, baseY + pullY]);
        }

        // ── Enforce convexity — HARD constraint ─────────────
        // Any vertex creating a concave angle gets snapped to the
        // midpoint of its neighbors. Excess volume that would
        // squeeze past the focal bottleneck redistributes into the
        // cell body. Multiple passes handle cascading fixes.
        enforceConvexity(poly, this.x, this.y);

        // Area normalization: stretch redistributes area, doesn't add it.
        const stretchedArea = polygonArea(poly);
        if (stretchedArea > 1 && Math.abs(stretchedArea - this.area) > this.area * 0.01) {
            const correction = Math.sqrt(this.area / stretchedArea);
            for (let i = 0; i < poly.length; i++) {
                poly[i][0] = this.x + (poly[i][0] - this.x) * correction;
                poly[i][1] = this.y + (poly[i][1] - this.y) * correction;
            }
        }

        // Enforce convexity AGAIN after area normalization —
        // scaling a thin convex shape can create self-intersection
        enforceConvexity(poly, this.x, this.y);

        return poly;
    }

    effectiveRadius() {
        return Math.sqrt(this.area / Math.PI);
    }

    containsPoint(px, py) {
        if (!this.polygon || this.polygon.length < 3) return false;
        return pointInPolygon(px, py, this.polygon);
    }
}

// ─── Geometry helpers ────────────────────────────────────────

function pointInPolygon(px, py, poly) {
    let inside = false;
    const n = poly.length;
    for (let i = 0, j = n - 1; i < n; j = i++) {
        const xi = poly[i][0], yi = poly[i][1];
        const xj = poly[j][0], yj = poly[j][1];
        if (((yi > py) !== (yj > py)) &&
            (px < (xj - xi) * (py - yi) / (yj - yi) + xi)) {
            inside = !inside;
        }
    }
    return inside;
}

function polygonArea(poly) {
    let a = 0;
    const n = poly.length;
    for (let i = 0; i < n; i++) {
        const j = (i + 1) % n;
        a += poly[i][0] * poly[j][1];
        a -= poly[j][0] * poly[i][1];
    }
    return Math.abs(a) / 2;
}

function polygonCentroid(poly) {
    let cx = 0, cy = 0, a = 0;
    const n = poly.length;
    for (let i = 0; i < n; i++) {
        const j = (i + 1) % n;
        const cross = poly[i][0] * poly[j][1] - poly[j][0] * poly[i][1];
        cx += (poly[i][0] + poly[j][0]) * cross;
        cy += (poly[i][1] + poly[j][1]) * cross;
        a += cross;
    }
    a /= 2;
    if (Math.abs(a) < 1) return { x: poly[0][0], y: poly[0][1] };
    cx /= (6 * a);
    cy /= (6 * a);
    return { x: cx, y: cy };
}

// Sutherland-Hodgman half-plane clip.
// Keeps points where (P - M) · N <= 0.
function clipByHalfPlane(poly, mx, my, nx, ny) {
    const out = [];
    const n = poly.length;
    if (n === 0) return out;
    for (let i = 0; i < n; i++) {
        const p = poly[i];
        const q = poly[(i + 1) % n];
        const dp = (p[0] - mx) * nx + (p[1] - my) * ny;
        const dq = (q[0] - mx) * nx + (q[1] - my) * ny;
        if (dp <= 0) out.push(p);
        if ((dp <= 0) !== (dq <= 0)) {
            const t = dp / (dp - dq);
            out.push([p[0] + t * (q[0] - p[0]), p[1] + t * (q[1] - p[1])]);
        }
    }
    return out;
}

function scalePoly(poly, cx, cy, scale) {
    for (let i = 0; i < poly.length; i++) {
        poly[i] = [
            cx + (poly[i][0] - cx) * scale,
            cy + (poly[i][1] - cy) * scale,
        ];
    }
}

function copyPoly(poly) {
    return poly.map(p => [p[0], p[1]]);
}

// Enforce convexity via convex hull + aspect ratio clamp.
// Always runs (no early-out). Uses hull centroid for ray casting.
// Also clamps aspect ratio to prevent hyper-elongation from
// area normalization amplifying thin shapes.
function enforceConvexity(poly, cx, cy) {
    const n = poly.length;
    if (n < 3) return;

    // ── Aspect ratio clamp ─────────────────────────────
    // Prevent hyper-elongation. Compute bounding box, if aspect
    // exceeds MAX_ASPECT, compress the long axis toward CELL CENTER.
    // All shape operations use cell center as the invariant point
    // to prevent polygon drift that drags centers.
    const MAX_ASPECT = 2.5;
    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    for (const p of poly) {
        minX = Math.min(minX, p[0]); maxX = Math.max(maxX, p[0]);
        minY = Math.min(minY, p[1]); maxY = Math.max(maxY, p[1]);
    }
    const extW = maxX - minX, extH = maxY - minY;
    if (extW > extH * MAX_ASPECT && extH > 1) {
        const target = extH * MAX_ASPECT;
        const scale = target / extW;
        for (const p of poly) p[0] = cx + (p[0] - cx) * scale;
    } else if (extH > extW * MAX_ASPECT && extW > 1) {
        const target = extW * MAX_ASPECT;
        const scale = target / extH;
        for (const p of poly) p[1] = cy + (p[1] - cy) * scale;
    }

    // ── Convex hull ────────────────────────────────────
    const pts = poly.map(p => ({ x: p[0], y: p[1] }));
    pts.sort((a, b) => a.x - b.x || a.y - b.y);
    const hull = [];
    for (const p of pts) {
        while (hull.length >= 2) {
            const a = hull[hull.length - 2], b = hull[hull.length - 1];
            if ((b.x - a.x) * (p.y - a.y) - (b.y - a.y) * (p.x - a.x) <= 0) hull.pop();
            else break;
        }
        hull.push(p);
    }
    const lower = hull.length + 1;
    for (let i = pts.length - 2; i >= 0; i--) {
        const p = pts[i];
        while (hull.length >= lower) {
            const a = hull[hull.length - 2], b = hull[hull.length - 1];
            if ((b.x - a.x) * (p.y - a.y) - (b.y - a.y) * (p.x - a.x) <= 0) hull.pop();
            else break;
        }
        hull.push(p);
    }
    hull.pop();
    if (hull.length < 3) return;

    // ── Resample onto hull ─────────────────────────────
    // Use CELL CENTER (cx, cy) as ray origin. Non-border-facing
    // vertices always stay on the base circle around the cell
    // center, so the cell center is always inside the hull.
    // Using hull centroid caused polygon drift.
    const hLen = hull.length;
    for (let i = 0; i < n; i++) {
        const angle = Math.atan2(poly[i][1] - cy, poly[i][0] - cx);
        const rdx = Math.cos(angle), rdy = Math.sin(angle);

        let bestT = Infinity;
        for (let j = 0; j < hLen; j++) {
            const k = (j + 1) % hLen;
            const ex = hull[k].x - hull[j].x, ey = hull[k].y - hull[j].y;
            const denom = rdx * ey - rdy * ex;
            if (Math.abs(denom) < 0.0001) continue;

            const fx = hull[j].x - cx, fy = hull[j].y - cy;
            const t = (fx * ey - fy * ex) / denom;
            const s = (fx * rdy - fy * rdx) / denom;

            if (t > 0.001 && s >= -0.001 && s <= 1.001 && t < bestT) {
                bestT = t;
            }
        }

        if (bestT < Infinity) {
            poly[i][0] = cx + rdx * bestT;
            poly[i][1] = cy + rdy * bestT;
        }
    }
}

// ─── Area computation ────────────────────────────────────────
// Distributes viewport area among cells proportional to weight².
// Total claimable area = viewport * fillFraction / cellCount,
// then each cell gets its share proportional to w².
function updateAreas(cells) {
    if (cells.length === 0) return;
    const viewportArea = W * H;
    const fillFraction = 0.5; // cells claim ~50% of viewport
    const totalBudget = viewportArea * fillFraction;

    // Sum of w² for all visible cells
    let totalW2 = 0;
    for (const c of cells) {
        if (c.visible) totalW2 += c.weight * c.weight;
    }
    if (totalW2 < 0.001) totalW2 = 1;

    for (const c of cells) {
        const w2 = c.weight * c.weight;
        c.baseArea = (w2 / totalW2) * totalBudget;
        // Hover boost on top of base
        c.area = c.baseArea * (1 + c.hoverMix * 0.6);
    }
}

// ─── Layout system ───────────────────────────────────────────
// Layouts are functions that return per-cell specs:
//   [{x, y, weight, role, visible}]
// The flock mind applies these as targets.

const LAYOUTS = {
    // Circle (default) — equal weights, arranged in a ring
    circle(cells, W, H) {
        const cx = W / 2, cy = H / 2;
        const n = cells.length;
        const spread = Math.min(W, H) * 0.25;
        return cells.map((_, i) => ({
            x: cx + Math.cos((i / n) * Math.PI * 2) * spread,
            y: cy + Math.sin((i / n) * Math.PI * 2) * spread,
            weight: 1, role: 'content', visible: true,
        }));
    },

    // Hero + grid — one big cell, rest small
    hero(cells, W, H) {
        const n = cells.length;
        const specs = [];
        for (let i = 0; i < n; i++) {
            if (i === 0) {
                specs.push({
                    x: W * 0.35, y: H * 0.45,
                    weight: 2.2, role: 'hero', visible: true,
                });
            } else {
                const col = (i - 1) % 3;
                const row = Math.floor((i - 1) / 3);
                specs.push({
                    x: W * 0.65 + (col - 1) * W * 0.12,
                    y: H * 0.25 + row * H * 0.2,
                    weight: 0.7, role: 'carousel', visible: true,
                });
            }
        }
        return specs;
    },

    // Bento — varied sizes in a grid-like arrangement
    bento(cells, W, H) {
        const n = cells.length;
        const weights = [1.8, 1.2, 1.0, 1.4, 0.8, 1.1, 0.9, 1.3, 1.0, 0.7, 1.1, 0.8];
        const cols = Math.ceil(Math.sqrt(n * (W / H)));
        const rows = Math.ceil(n / cols);
        const specs = [];
        for (let i = 0; i < n; i++) {
            const col = i % cols;
            const row = Math.floor(i / cols);
            const margin = 0.08;
            specs.push({
                x: W * (margin + (col + 0.5) * (1 - 2 * margin) / cols),
                y: H * (margin + (row + 0.5) * (1 - 2 * margin) / rows),
                weight: weights[i % weights.length],
                role: 'content', visible: true,
            });
        }
        return specs;
    },

    // Sidebar — cells on left strip, right side empty
    sidebar(cells, W, H) {
        const n = cells.length;
        const specs = [];
        for (let i = 0; i < n; i++) {
            const row = i;
            specs.push({
                x: W * 0.12,
                y: H * (0.08 + (row + 0.5) * 0.84 / n),
                weight: 0.8, role: 'carousel', visible: true,
            });
        }
        return specs;
    },

    // Spiral — golden angle from center, decreasing weights
    spiral(cells, W, H) {
        const n = cells.length;
        const cx = W / 2, cy = H / 2;
        const golden = Math.PI * (3 - Math.sqrt(5));
        const maxR = Math.min(W, H) * 0.38;
        const specs = [];
        for (let i = 0; i < n; i++) {
            const r = maxR * Math.sqrt((i + 0.5) / n);
            const a = i * golden;
            specs.push({
                x: cx + Math.cos(a) * r,
                y: cy + Math.sin(a) * r,
                weight: 1.5 - (i / n) * 0.8,
                role: i === 0 ? 'hero' : 'content', visible: true,
            });
        }
        return specs;
    },
};

let currentLayout = 'circle';

function applyLayout(name) {
    const gen = LAYOUTS[name];
    if (!gen) return;
    currentLayout = name;
    const specs = gen(cells, W, H);
    for (let i = 0; i < cells.length && i < specs.length; i++) {
        const s = specs[i];
        cells[i].targetX = s.x;
        cells[i].targetY = s.y;
        cells[i].targetWeight = s.weight;
        cells[i].role = s.role || 'content';
        cells[i].visible = s.visible !== false;
    }
    // Update layout bar active state
    document.querySelectorAll('.layout-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.layout === name);
    });
}

// ─── Contact solver ──────────────────────────────────────────
// The heart of MK5. Pairwise bisector clipping.
//
// Key rule: CELLS DON'T SHRINK. When a cell can't achieve its
// target area through rest-poly expansion alone, it pushes back
// by shifting bisectors outward (per-pair bias) and by physically
// repelling overlapping neighbors. Minimum area is enforced hard.

const VERTS = 24;          // circle vertex resolution
const MIN_AREA_FRAC = 0.8; // cell never goes below 80% of target area
const BIAS_RATE = 0.15;    // how fast bisector bias adapts per frame
const REPEL_STRENGTH = 8;  // pixels/frame of repulsion force

function solveCells(cells, dt) {
    const n = cells.length;

    // ── Phase 0: Repulsion ───────────────────────────────────
    // If two cells are closer than their combined radii, push
    // them apart BEFORE clipping. This prevents the bisector
    // from landing inside a cell's center.
    for (let i = 0; i < n; i++) {
        for (let j = i + 1; j < n; j++) {
            const a = cells[i], b = cells[j];
            const dx = b.x - a.x;
            const dy = b.y - a.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < 0.001) { b.x += 1; continue; }

            const rA = a.effectiveRadius();
            const rB = b.effectiveRadius();
            const minDist = (rA + rB) * 0.45 + GAP;

            if (dist < minDist) {
                const overlap = minDist - dist;
                const push = overlap * REPEL_STRENGTH * dt * 0.1;
                const nx = dx / dist, ny = dy / dist;

                // Weight pushback by inverse area — smaller cells are lighter
                const totalArea = a.area + b.area;
                const ratioA = b.area / totalArea; // A moves more if B is bigger
                const ratioB = a.area / totalArea;

                if (!a._dragging) { a.x -= nx * push * ratioA; a.y -= ny * push * ratioA; }
                if (!b._dragging) { b.x += nx * push * ratioB; b.y += ny * push * ratioB; }
            }
        }
    }

    // ── Phase 1: Generate rest polygons ──────────────────────
    // Pass all OTHER cells as neighbors so the rest shape stretches
    // toward them. This is purely cosmetic — centers don't move.
    //
    // Temporal smoothing: blend each vertex of the new rest poly
    // toward the previous frame's rest poly. This prevents the
    // stretch from snapping on/off at boundary distances, which
    // caused cells to flicker between "sharp" and "relaxed."
    // The rest poly always has exactly VERTS vertices, so the
    // blend is 1:1 per vertex — no count mismatch.
    const SMOOTH_RATE = 0.25; // per-frame blend toward new rest poly
    for (const c of cells) {
        const neighbors = cells.filter(o => o !== c);
        const freshPoly = c.generateRestPoly(VERTS, neighbors);

        if (c._prevRestPoly && c._prevRestPoly.length === VERTS) {
            for (let i = 0; i < VERTS; i++) {
                freshPoly[i][0] = c._prevRestPoly[i][0] + (freshPoly[i][0] - c._prevRestPoly[i][0]) * SMOOTH_RATE;
                freshPoly[i][1] = c._prevRestPoly[i][1] + (freshPoly[i][1] - c._prevRestPoly[i][1]) * SMOOTH_RATE;
            }
        }

        // Enforce convexity AFTER temporal smoothing — the blend
        // can create concavity even if both inputs were convex.
        // This is the final gate: nothing past here is ever concave.
        enforceConvexity(freshPoly, c.x, c.y);

        c._prevRestPoly = freshPoly.map(p => [p[0], p[1]]);
        c.restPoly = freshPoly;
        c.polygon = copyPoly(c.restPoly);
    }

    // ── Phase 2: Pairwise bisector clip with bias ────────────
    // Each pair has a bias value that shifts the bisector when
    // one cell is being compressed too much. Bias persists
    // across frames (stored on cell pairs via a map).
    for (let iter = 0; iter < AREA_ITERS; iter++) {
        // Reset polygons to (potentially scaled) rest polys
        for (const c of cells) {
            c.polygon = copyPoly(c.restPoly);
        }

        for (let i = 0; i < n; i++) {
            for (let j = i + 1; j < n; j++) {
                const a = cells[i], b = cells[j];
                const dx = b.x - a.x;
                const dy = b.y - a.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                const rA = a.effectiveRadius();
                const rB = b.effectiveRadius();

                // Skip if too far apart — range accounts for gravitational stretch
                const interactionRange = (rA + rB) * (1.6 + GRAVITY_REACH * 0.5) + GAP;
                if (dist > interactionRange) continue;
                if (dist < 0.001) continue;

                // Weighted bisector position
                // bias shifts it: positive bias favors A (pushes bisector toward B)
                // BUT bias is suppressed when either cell is hovered — hover
                // expansion is intentional and neighbors should yield.
                const wA = Math.sqrt(a.area);
                const wB = Math.sqrt(b.area);
                const biasKey = Math.min(a.id, b.id) * 10000 + Math.max(a.id, b.id);
                if (!pairBias.has(biasKey)) pairBias.set(biasKey, 0);
                const eitherHovered = a.hoverMix > 0.1 || b.hoverMix > 0.1;
                const bias = eitherHovered ? 0 : pairBias.get(biasKey);

                const t = wA / (wA + wB);
                const biasShift = bias * dist * 0.5;
                const mx = a.x + dx * t + (dx / dist) * biasShift;
                const my = a.y + dy * t + (dy / dist) * biasShift;

                const nx = dx / dist;
                const ny = dy / dist;

                a.polygon = clipByHalfPlane(a.polygon,
                    mx - nx * GAP / 2, my - ny * GAP / 2, nx, ny);
                b.polygon = clipByHalfPlane(b.polygon,
                    mx + nx * GAP / 2, my + ny * GAP / 2, -nx, -ny);
            }
        }

        // Area correction: expand rest poly if clipped too small
        if (iter < AREA_ITERS - 1) {
            for (const c of cells) {
                if (c.polygon.length < 3) continue;
                const actual = polygonArea(c.polygon);
                if (actual < c.area * 0.97) {
                    const scale = Math.sqrt(c.area / Math.max(actual, 1));
                    scalePoly(c.restPoly, c.x, c.y, Math.min(scale, 1.4));
                }
            }
        }
    }

    // ── Phase 3: Update pair biases ──────────────────────────
    // After all clipping, check each cell's achieved area.
    // If undersized, shift biases on all its contacts to favor it.
    const areaRatios = new Map();
    for (const c of cells) {
        if (c.polygon.length < 3) { areaRatios.set(c.id, 0); continue; }
        areaRatios.set(c.id, polygonArea(c.polygon) / c.area);
    }

    for (let i = 0; i < n; i++) {
        for (let j = i + 1; j < n; j++) {
            const a = cells[i], b = cells[j];
            const biasKey = Math.min(a.id, b.id) * 10000 + Math.max(a.id, b.id);
            if (!pairBias.has(biasKey)) continue;

            const ratioA = areaRatios.get(a.id) || 0;
            const ratioB = areaRatios.get(b.id) || 0;

            let bias = pairBias.get(biasKey);

            // If either cell is hovered, fast-decay bias — hover expansion
            // is intentional and neighbors should yield, not fight back.
            if (a.hoverMix > 0.1 || b.hoverMix > 0.1) {
                bias *= 0.5;
            } else {
                // If A is undersized, push bisector toward B (positive bias)
                // If B is undersized, push bisector toward A (negative bias)
                if (ratioA < MIN_AREA_FRAC) bias += BIAS_RATE * (MIN_AREA_FRAC - ratioA);
                if (ratioB < MIN_AREA_FRAC) bias -= BIAS_RATE * (MIN_AREA_FRAC - ratioB);

                // Decay bias toward zero when both cells are happy
                if (ratioA > 0.95 && ratioB > 0.95) bias *= 0.9;
            }

            // Clamp bias
            bias = Math.max(-0.4, Math.min(0.4, bias));
            pairBias.set(biasKey, bias);
        }
    }

    // ── Phase 4: Viewport clip ───────────────────────────────
    for (const c of cells) {
        if (c.polygon.length < 3) continue;
        const margin = 2;
        c.polygon = clipByHalfPlane(c.polygon, margin, 0, -1, 0);
        c.polygon = clipByHalfPlane(c.polygon, W - margin, 0, 1, 0);
        c.polygon = clipByHalfPlane(c.polygon, 0, margin, 0, -1);
        c.polygon = clipByHalfPlane(c.polygon, 0, H - margin, 0, 1);
    }

    // ── Phase 4b: Void object clip ─────────────────────────────
    // Clip cell polygons against void boundaries. The polygon is
    // cut so no part of it overlaps any void. For each cell/void
    // pair, clip against the void edge nearest to the cell center.
    // This removes the part of the cell extending into the void.
    for (const c of cells) {
        if (c.polygon.length < 3) continue;
        for (const v of voidObjects) {
            // Find which void edge is nearest to cell center
            const dLeft = c.x - (v.x - v.w);
            const dRight = (v.x + v.w) - c.x;
            const dTop = c.y - (v.y - v.h);
            const dBot = (v.y + v.h) - c.y;

            // Only clip if the cell is close enough to the void
            const r = c.effectiveRadius();
            if (c.x < v.x - v.w - r || c.x > v.x + v.w + r ||
                c.y < v.y - v.h - r || c.y > v.y + v.h + r) continue;

            if (v.contains(c.x, c.y)) {
                // Center inside void: clip against nearest edge.
                // Normal points OUTWARD (away from void center)
                // to keep the polygon slice on the OUTSIDE.
                const dMin = Math.min(dLeft, dRight, dTop, dBot);
                if (dMin === dLeft) {
                    c.polygon = clipByHalfPlane(c.polygon, v.x - v.w, v.y, 1, 0);
                } else if (dMin === dRight) {
                    c.polygon = clipByHalfPlane(c.polygon, v.x + v.w, v.y, -1, 0);
                } else if (dMin === dTop) {
                    c.polygon = clipByHalfPlane(c.polygon, v.x, v.y - v.h, 0, 1);
                } else {
                    c.polygon = clipByHalfPlane(c.polygon, v.x, v.y + v.h, 0, -1);
                }
            } else {
                // Center outside void: clip against each void edge
                // the polygon might overlap. BOTH axes must be checked
                // to prevent "shadow" clipping along the void's axes.
                // Left edge: cell is left of void AND vertically overlaps
                if (c.x < v.x && c.x + r > v.x - v.w &&
                    c.y + r > v.y - v.h && c.y - r < v.y + v.h) {
                    c.polygon = clipByHalfPlane(c.polygon, v.x - v.w, v.y, 1, 0);
                }
                // Right edge
                if (c.x > v.x && c.x - r < v.x + v.w &&
                    c.y + r > v.y - v.h && c.y - r < v.y + v.h) {
                    c.polygon = clipByHalfPlane(c.polygon, v.x + v.w, v.y, -1, 0);
                }
                // Top edge
                if (c.y < v.y && c.y + r > v.y - v.h &&
                    c.x + r > v.x - v.w && c.x - r < v.x + v.w) {
                    c.polygon = clipByHalfPlane(c.polygon, v.x, v.y - v.h, 0, 1);
                }
                // Bottom edge
                if (c.y > v.y && c.y - r < v.y + v.h &&
                    c.x + r > v.x - v.w && c.x - r < v.x + v.w) {
                    c.polygon = clipByHalfPlane(c.polygon, v.x, v.y + v.h, 0, -1);
                }
            }
        }
    }

    // ── Phase 5: Hard minimum area enforcement ───────────────
    // If after everything a cell is still too small, push it
    // away from the densest direction. Last resort.
    for (const c of cells) {
        if (c.polygon.length < 3) continue;
        const actual = polygonArea(c.polygon);
        const minArea = c.area * MIN_AREA_FRAC;
        if (actual < minArea && !c._dragging) {
            // Find average direction to nearby cells, flee from it
            let fleeDx = 0, fleeDy = 0;
            for (const other of cells) {
                if (other === c) continue;
                const dx = c.x - other.x;
                const dy = c.y - other.y;
                const d = Math.sqrt(dx * dx + dy * dy) || 1;
                const rSum = c.effectiveRadius() + other.effectiveRadius();
                if (d < rSum * 2) {
                    fleeDx += (dx / d) * (rSum / d);
                    fleeDy += (dy / d) * (rSum / d);
                }
            }
            const fleeDist = Math.sqrt(fleeDx * fleeDx + fleeDy * fleeDy);
            if (fleeDist > 0.01) {
                const push = REPEL_STRENGTH * dt * (1 - actual / minArea);
                c.x += (fleeDx / fleeDist) * push;
                c.y += (fleeDy / fleeDist) * push;
            }
        }
    }
}

// Persistent per-pair bisector bias (survives across frames)
const pairBias = new Map();

// ─── Rendering ───────────────────────────────────────────────

function drawRoundedPolygon(ctx, polygon, radius) {
    if (!polygon || polygon.length < 3) return;

    let area = 0;
    for (let i = 0; i < polygon.length; i++) {
        const j = (i + 1) % polygon.length;
        area += polygon[i][0] * polygon[j][1];
        area -= polygon[j][0] * polygon[i][1];
    }
    area = Math.abs(area) / 2;

    if (area < 100 || radius <= 0) {
        ctx.beginPath();
        ctx.moveTo(polygon[0][0], polygon[0][1]);
        for (let i = 1; i < polygon.length; i++)
            ctx.lineTo(polygon[i][0], polygon[i][1]);
        ctx.closePath();
        return;
    }

    const n = polygon.length;
    const radii = [];
    for (let i = 0; i < n; i++) {
        const prev = polygon[(i - 1 + n) % n];
        const curr = polygon[i];
        const next = polygon[(i + 1) % n];

        const d1 = Math.hypot(prev[0] - curr[0], prev[1] - curr[1]);
        const d2 = Math.hypot(next[0] - curr[0], next[1] - curr[1]);
        const maxR = Math.min(d1, d2) * 0.5;

        const v1x = prev[0] - curr[0], v1y = prev[1] - curr[1];
        const v2x = next[0] - curr[0], v2y = next[1] - curr[1];
        const len1 = Math.hypot(v1x, v1y) || 1;
        const len2 = Math.hypot(v2x, v2y) || 1;
        const dot = (v1x * v2x + v1y * v2y) / (len1 * len2);
        const angle = Math.acos(Math.max(-1, Math.min(1, dot)));
        const maxByAngle = Math.min(d1, d2) * Math.tan(angle / 2);

        radii[i] = Math.max(0, Math.min(radius, maxR, maxByAngle));
    }

    ctx.beginPath();
    let started = false;
    for (let i = 0; i < n; i++) {
        const prev = polygon[(i - 1 + n) % n];
        const curr = polygon[i];
        const next = polygon[(i + 1) % n];
        const r = radii[i];

        const d1 = Math.hypot(prev[0] - curr[0], prev[1] - curr[1]);
        const d2 = Math.hypot(next[0] - curr[0], next[1] - curr[1]);

        if (r < 0.5 || d1 < 0.5 || d2 < 0.5) {
            if (!started) { ctx.moveTo(curr[0], curr[1]); started = true; }
            else ctx.lineTo(curr[0], curr[1]);
        } else {
            const dx1 = (prev[0] - curr[0]) / d1, dy1 = (prev[1] - curr[1]) / d1;
            const dx2 = (next[0] - curr[0]) / d2, dy2 = (next[1] - curr[1]) / d2;
            const sx = curr[0] + dx1 * r, sy = curr[1] + dy1 * r;
            const ex = curr[0] + dx2 * r, ey = curr[1] + dy2 * r;

            if (!started) { ctx.moveTo(sx, sy); started = true; }
            else ctx.lineTo(sx, sy);
            ctx.arcTo(curr[0], curr[1], ex, ey, r);
        }
    }
    ctx.closePath();
}

function darken(hex, f) {
    const r = parseInt(hex.slice(1, 3), 16);
    const g = parseInt(hex.slice(3, 5), 16);
    const b = parseInt(hex.slice(5, 7), 16);
    return `rgb(${r * (1 - f)|0},${g * (1 - f)|0},${b * (1 - f)|0})`;
}

function lighten(hex, f) {
    const r = parseInt(hex.slice(1, 3), 16);
    const g = parseInt(hex.slice(3, 5), 16);
    const b = parseInt(hex.slice(5, 7), 16);
    return `rgb(${Math.min(255, r + (255 - r) * f)|0},${Math.min(255, g + (255 - g) * f)|0},${Math.min(255, b + (255 - b) * f)|0})`;
}

function drawCell(cell) {
    const poly = cell.polygon;
    if (!poly || poly.length < 3) return;

    const c = polygonCentroid(poly);
    const r = cell.effectiveRadius();

    ctx.save();
    ctx.globalAlpha = 1.0;

    // Fill with radial gradient
    drawRoundedPolygon(ctx, poly, CORNER_RADIUS);
    const grad = ctx.createRadialGradient(
        c.x - r * 0.15, c.y - r * 0.15, 0,
        c.x, c.y, r * 1.2
    );
    grad.addColorStop(0, lighten(cell.color, 0.2));
    grad.addColorStop(0.6, cell.color);
    grad.addColorStop(1, darken(cell.color, 0.3));
    ctx.fillStyle = grad;
    ctx.fill();

    // Border — inner stroke
    drawRoundedPolygon(ctx, poly, CORNER_RADIUS);
    ctx.save();
    ctx.clip();
    drawRoundedPolygon(ctx, poly, CORNER_RADIUS);
    const borderW = cell.hoverMix > 0.1 ? 2 : 1;
    ctx.lineWidth = borderW * 2; // doubled, half clipped outside
    ctx.strokeStyle = `rgba(255,255,255,${0.15 + cell.hoverMix * 0.25})`;
    ctx.stroke();
    ctx.restore();

    // Hover glow
    if (cell.hoverMix > 0.05) {
        drawRoundedPolygon(ctx, poly, CORNER_RADIUS);
        ctx.shadowColor = cell.color;
        ctx.shadowBlur = 20 * cell.hoverMix;
        ctx.strokeStyle = `rgba(255,255,255,${0.1 * cell.hoverMix})`;
        ctx.lineWidth = 1;
        ctx.stroke();
        ctx.shadowBlur = 0;
    }

    // Label
    ctx.fillStyle = `rgba(255,255,255,${0.4 + cell.hoverMix * 0.4})`;
    ctx.font = '600 11px ui-monospace, monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(cell.id, c.x, c.y);

    ctx.restore();
}

let debugMode = false;

function render(cells) {
    ctx.clearRect(0, 0, W, H);
    // Draw non-hovered first, hovered last. Skip invisible (void) cells.
    const visible = cells.filter(c => c.visible);
    const hovered = visible.filter(c => c.hoverMix > 0.5);
    const rest = visible.filter(c => c.hoverMix <= 0.5);
    for (const c of rest) drawCell(c);
    for (const c of hovered) drawCell(c);

    // Draw void objects
    for (const v of voidObjects) {
        ctx.save();
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
        ctx.lineWidth = 1;
        ctx.setLineDash([6, 4]);
        ctx.strokeRect(v.x - v.w, v.y - v.h, v.w * 2, v.h * 2);
        ctx.setLineDash([]);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.03)';
        ctx.fillRect(v.x - v.w, v.y - v.h, v.w * 2, v.h * 2);
        ctx.restore();
    }

    // Draw void placement preview
    if (placingVoid && voidDragStart) {
        ctx.save();
        ctx.strokeStyle = 'rgba(255, 200, 50, 0.5)';
        ctx.lineWidth = 2;
        ctx.setLineDash([4, 4]);
        const sx = Math.min(voidDragStart.x, mouseX);
        const sy = Math.min(voidDragStart.y, mouseY);
        const sw = Math.abs(mouseX - voidDragStart.x);
        const sh = Math.abs(mouseY - voidDragStart.y);
        ctx.strokeRect(sx, sy, sw, sh);
        ctx.setLineDash([]);
        ctx.restore();
    }

    if (debugMode) renderDebug(cells);
}

function renderDebug(cells) {
    for (const c of cells) {
        if (!c._debugPulls) continue;

        // Draw line from cell center to nearest border point
        const d0 = c._debugPulls[0];
        if (d0) {
            ctx.beginPath();
            ctx.moveTo(c.x, c.y);
            ctx.lineTo(d0.borderPx, d0.borderPy);
            ctx.strokeStyle = 'rgba(255, 255, 0, 0.6)';
            ctx.lineWidth = 2;
            ctx.setLineDash([6, 4]);
            ctx.stroke();
            ctx.setLineDash([]);

            // Mark nearest border point
            ctx.beginPath();
            ctx.arc(d0.borderPx, d0.borderPy, 5, 0, Math.PI * 2);
            ctx.fillStyle = 'yellow';
            ctx.fill();

        }

        // Draw per-vertex vectors
        for (const d of c._debugPulls) {
            // Cell-to-cell pull (cyan)
            if (Math.abs(d.cpx) > 0.5 || Math.abs(d.cpy) > 0.5) {
                ctx.beginPath();
                ctx.moveTo(d.bx, d.by);
                ctx.lineTo(d.bx + d.cpx, d.by + d.cpy);
                ctx.strokeStyle = 'rgba(0, 255, 255, 0.5)';
                ctx.lineWidth = 1;
                ctx.stroke();
            }

            // Border pull (yellow)
            if (Math.abs(d.bpx) > 0.5 || Math.abs(d.bpy) > 0.5) {
                ctx.beginPath();
                ctx.moveTo(d.bx, d.by);
                ctx.lineTo(d.bx + d.bpx, d.by + d.bpy);
                ctx.strokeStyle = 'rgba(255, 255, 0, 0.7)';
                ctx.lineWidth = 1.5;
                ctx.stroke();
            }

            // Combined pull (white)
            if (Math.abs(d.px) > 0.5 || Math.abs(d.py) > 0.5) {
                ctx.beginPath();
                ctx.moveTo(d.bx, d.by);
                ctx.lineTo(d.bx + d.px, d.by + d.py);
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
                ctx.lineWidth = 1;
                ctx.stroke();

                // Arrowhead
                ctx.beginPath();
                ctx.arc(d.bx + d.px, d.by + d.py, 2, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
                ctx.fill();
            }
        }

        // Draw rest poly outline (before clipping)
        if (c.restPoly && c.restPoly.length > 2) {
            ctx.beginPath();
            ctx.moveTo(c.restPoly[0][0], c.restPoly[0][1]);
            for (let i = 1; i < c.restPoly.length; i++)
                ctx.lineTo(c.restPoly[i][0], c.restPoly[i][1]);
            ctx.closePath();
            ctx.strokeStyle = 'rgba(255, 100, 100, 0.4)';
            ctx.lineWidth = 1;
            ctx.setLineDash([3, 3]);
            ctx.stroke();
            ctx.setLineDash([]);
        }

        // Cell center dot
        ctx.beginPath();
        ctx.arc(c.x, c.y, 3, 0, Math.PI * 2);
        ctx.fillStyle = 'white';
        ctx.fill();
    }
}

// ─── Interaction ─────────────────────────────────────────────

let cells = [];
let dragCell = null;
let dragOffX = 0, dragOffY = 0;
let hoveredCell = null;
let mouseX = -999, mouseY = -999;

function findCellAt(px, py) {
    // Check in reverse (top cells first)
    for (let i = cells.length - 1; i >= 0; i--) {
        if (cells[i].containsPoint(px, py)) return cells[i];
    }
    return null;
}

canvas.addEventListener('pointerdown', e => {
    const rect = canvas.getBoundingClientRect();
    const px = e.clientX - rect.left;
    const py = e.clientY - rect.top;

    // Void placement mode: start drawing rectangle
    if (placingVoid) {
        voidDragStart = { x: px, y: py };
        canvas.setPointerCapture(e.pointerId);
        return;
    }

    const cell = findCellAt(px, py);
    if (cell) {
        dragCell = cell;
        dragCell._dragging = true;
        dragOffX = cell.x - px;
        dragOffY = cell.y - py;
        canvas.setPointerCapture(e.pointerId);
    }
});

canvas.addEventListener('pointermove', e => {
    const rect = canvas.getBoundingClientRect();
    mouseX = e.clientX - rect.left;
    mouseY = e.clientY - rect.top;
    if (dragCell) {
        dragCell.x = mouseX + dragOffX;
        dragCell.y = mouseY + dragOffY;
    }
});

canvas.addEventListener('pointerup', e => {
    // Finish void placement
    if (placingVoid && voidDragStart) {
        const rect = canvas.getBoundingClientRect();
        const px = e.clientX - rect.left;
        const py = e.clientY - rect.top;
        const cx = (voidDragStart.x + px) / 2;
        const cy = (voidDragStart.y + py) / 2;
        const hw = Math.abs(px - voidDragStart.x) / 2;
        const hh = Math.abs(py - voidDragStart.y) / 2;
        if (hw > 10 && hh > 10) {
            voidObjects.push(new VoidObject(cx, cy, hw, hh));
        }
        voidDragStart = null;
        return;
    }

    if (dragCell) dragCell._dragging = false;
    dragCell = null;
});
canvas.addEventListener('pointerleave', () => { mouseX = -999; mouseY = -999; });

// ─── Init & Loop ─────────────────────────────────────────────

function initCells(count) {
    cells = [];
    const cx = W / 2, cy = H / 2;
    const spread = Math.min(W, H) * 0.25;
    for (let i = 0; i < count; i++) {
        const angle = (i / count) * Math.PI * 2;
        const x = cx + Math.cos(angle) * spread;
        const y = cy + Math.sin(angle) * spread;
        cells.push(new Cell(i, x, y, 1));
    }
    applyLayout(currentLayout);
    updateAreas(cells);
}

let lastTime = 0;
function animate(time) {
    const dt = Math.min((time - lastTime) / 16, 3);
    lastTime = time;

    // ── Gravity: pull cell centers, don't affect size ───
    if (GRAVITY_STRENGTH > 0) {
        const gx = Math.cos(GRAVITY_ANGLE) * GRAVITY_STRENGTH;
        const gy = Math.sin(GRAVITY_ANGLE) * GRAVITY_STRENGTH;
        for (const c of cells) {
            if (c._dragging) continue;
            c.vx += gx * dt;
            c.vy += gy * dt;
            c.vx *= VELOCITY_DAMPING;
            c.vy *= VELOCITY_DAMPING;
            c.x += c.vx * dt;
            c.y += c.vy * dt;
            // Keep inside viewport
            const r = c.effectiveRadius();
            if (c.x < r) { c.x = r; c.vx = Math.abs(c.vx) * 0.3; }
            if (c.x > W - r) { c.x = W - r; c.vx = -Math.abs(c.vx) * 0.3; }
            if (c.y < r) { c.y = r; c.vy = Math.abs(c.vy) * 0.3; }
            if (c.y > H - r) { c.y = H - r; c.vy = -Math.abs(c.vy) * 0.3; }
        }
    }

    // ── Move toward targets (layout transition) ────────
    // Only when gravity is off — gravity replaces target seeking
    if (GRAVITY_STRENGTH === 0) {
        const posRate = 1 - Math.exp(-dt * 0.12);
        for (const c of cells) {
            if (!c._dragging) {
                c.x += (c.targetX - c.x) * posRate;
                c.y += (c.targetY - c.y) * posRate;
            }
        }
    }

    // Weight always interpolates toward target
    const weightRate = 1 - Math.exp(-dt * 0.08);
    for (const c of cells) {
        c.weight += (c.targetWeight - c.weight) * weightRate;
    }

    // ── Void settling drift ─────────────────────────
    // No hard centroid expulsion — centers can pass through voids
    // freely. But when a cell's center IS inside a void, add a
    // gentle velocity nudge outward. The settling is emergent:
    // the polygon gets clipped by the void (in the solver), area
    // loss creates pressure, and this drift helps it resolve.
    const SETTLE_DRIFT = 1.5;
    for (const c of cells) {
        if (c._dragging) continue;
        for (const v of voidObjects) {
            if (v.contains(c.x, c.y)) {
                const bp = v.nearestBoundaryPoint(c.x, c.y);
                c.vx += bp.nx * SETTLE_DRIFT * dt;
                c.vy += bp.ny * SETTLE_DRIFT * dt;
            }
        }
    }

    // ── Update hover ─────────────────────────────────
    const newHovered = dragCell || findCellAt(mouseX, mouseY);
    for (const c of cells) {
        const target = (c === newHovered && c.visible) ? 1 : 0;
        c.hoverMix += (target - c.hoverMix) * (1 - Math.exp(-dt * (target > 0.5 ? 0.3 : 0.08)));
    }

    // ── Compute areas from weights ───────────────────
    updateAreas(cells);

    // ── Solve contacts ───────────────────────────────
    solveCells(cells, dt);

    // Render
    render(cells);

    // Info
    info.textContent = `mk5 · voroboids · ${cells.length} cells · ${pairBias.size} contacts · gap ${GAP}px`;

    requestAnimationFrame(animate);
}

// ─── Controls ────────────────────────────────────────────────

document.getElementById('addBtn').addEventListener('click', () => {
    const id = cells.length;
    const x = W / 2 + (Math.random() - 0.5) * 200;
    const y = H / 3;
    cells.push(new Cell(id, x, y, 1));
    applyLayout(currentLayout);
});

document.getElementById('removeBtn').addEventListener('click', () => {
    if (cells.length > 1) {
        cells.pop();
        pairBias.clear(); // stale pairs
    }
});

document.getElementById('resetBtn').addEventListener('click', () => {
    pairBias.clear();
    initCells(10);
});

document.getElementById('gapBtn').addEventListener('click', () => {
    const gaps = [0, 2, 4, 8, 16];
    const idx = (gaps.indexOf(GAP) + 1) % gaps.length;
    GAP = gaps[idx];
    document.getElementById('gapBtn').textContent = `Gap: ${GAP}`;
});

// Pull (gravity reach) — slider + number field stay in sync
const pullSlider = document.getElementById('pullSlider');
const pullNum = document.getElementById('pullNum');
function setPull(val) {
    GRAVITY_REACH = val;
    pullSlider.value = Math.min(val, parseFloat(pullSlider.max));
    pullNum.value = val;
}
pullSlider.addEventListener('input', () => setPull(parseFloat(pullSlider.value)));
pullNum.addEventListener('input', () => setPull(parseFloat(pullNum.value) || 0));

// Border pull — slider + number field stay in sync
const borderSlider = document.getElementById('borderSlider');
const borderNum = document.getElementById('borderNum');
function setBorder(val) {
    BORDER_PULL = val;
    borderSlider.value = Math.min(val, parseFloat(borderSlider.max));
    borderNum.value = val;
}
borderSlider.addEventListener('input', () => setBorder(parseFloat(borderSlider.value)));
borderNum.addEventListener('input', () => setBorder(parseFloat(borderNum.value) || 0));

// Focus (focal distance) — slider + number field
const focusSlider = document.getElementById('focusSlider');
const focusNum = document.getElementById('focusNum');
function setFocus(val) {
    BORDER_FOCUS = val;
    focusSlider.value = Math.min(val, parseFloat(focusSlider.max));
    focusNum.value = val;
}
focusSlider.addEventListener('input', () => setFocus(parseFloat(focusSlider.value)));
focusNum.addEventListener('input', () => setFocus(parseFloat(focusNum.value) || 1));

// Void pull
const voidPullSlider = document.getElementById('voidPullSlider');
const voidPullNum = document.getElementById('voidPullNum');
function setVoidPull(val) {
    VOID_PULL = val;
    voidPullSlider.value = Math.min(val, parseFloat(voidPullSlider.max));
    voidPullNum.value = val;
}
voidPullSlider.addEventListener('input', () => setVoidPull(parseFloat(voidPullSlider.value)));
voidPullNum.addEventListener('input', () => setVoidPull(parseFloat(voidPullNum.value) || 0));

// Void placement mode
document.getElementById('voidBtn').addEventListener('click', () => {
    placingVoid = !placingVoid;
    document.getElementById('voidBtn').classList.toggle('active', placingVoid);
    canvas.style.cursor = placingVoid ? 'crosshair' : 'default';
});
document.getElementById('clearVoidsBtn').addEventListener('click', () => {
    voidObjects = [];
});

// Gravity controls
const gravSlider = document.getElementById('gravSlider');
const gravNum = document.getElementById('gravNum');
function setGrav(val) {
    GRAVITY_STRENGTH = val;
    gravSlider.value = Math.min(val, parseFloat(gravSlider.max));
    gravNum.value = val;
}
gravSlider.addEventListener('input', () => setGrav(parseFloat(gravSlider.value)));
gravNum.addEventListener('input', () => setGrav(parseFloat(gravNum.value) || 0));

const gravAngleSlider = document.getElementById('gravAngleSlider');
const gravAngleNum = document.getElementById('gravAngleNum');
function setGravAngle(val) {
    GRAVITY_ANGLE = val;
    gravAngleSlider.value = Math.min(val, parseFloat(gravAngleSlider.max));
    gravAngleNum.value = val;
}
gravAngleSlider.addEventListener('input', () => setGravAngle(parseFloat(gravAngleSlider.value)));
gravAngleNum.addEventListener('input', () => setGravAngle(parseFloat(gravAngleNum.value) || 0));

// Layout buttons
document.querySelectorAll('.layout-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        const name = btn.dataset.layout;
        if (name && LAYOUTS[name]) {
            applyLayout(name);
        }
    });
});

// Debug toggle
document.getElementById('debugBtn').addEventListener('click', () => {
    debugMode = !debugMode;
    document.getElementById('debugBtn').classList.toggle('active', debugMode);
});

// ─── Start ───────────────────────────────────────────────────
initCells(10);
requestAnimationFrame(animate);

</script>
</body>
