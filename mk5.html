<!DOCTYPE html>
<html lang="en">
<head>

        }

            position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%);
            display: flex; gap: 6px; z-index: 100;
            background: rgba(20, 20, 35, 0.9);

            border: 1px solid rgba(255,255,255,0.1);

<body>

        </div>
        <div class="slider-group">
            <label>Border</label>
            <input type="range" id="borderSlider" min="0" max="5" step="0.05" value="0">

        </div>
        <div class="slider-group">
            <label>Focus</label>
            <input type="range" id="focusSlider" min="1" max="20" step="0.5" value="3">
            <input type="number" id="focusNum" min="0.5" max="50" step="0.5" value="3">
        </div>

<script>
'use strict';

// ═══════════════════════════════════════════════════════════════
//  MK5 — VOROBOIDS — Chunk 0
//
//  Core proof: atomic cells with pairwise bisector contact.
//  Each cell is an independent body (position, area, circle).
//  When two cells overlap, a bisector clips both.
//  When they separate, each reverts to its rest shape.
//  No global tessellation. No shared mesh. Just atoms + contact.
// ═══════════════════════════════════════════════════════════════

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const info = document.getElementById('info');

let W = 0, H = 0, dpr = 1;
function resize() {
    dpr = window.devicePixelRatio || 1;
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);
resize();

// ─── Config ──────────────────────────────────────────────────
let GAP = 4;           // minimum pixel gap between cell surfaces
const CORNER_RADIUS = 12;
const AREA_ITERS = 3;  // area-correction iterations
let GRAVITY_REACH = 0.35; // how much cells stretch toward neighbors (cosmetic only)
let BORDER_PULL = 0;      // how much cells stretch toward viewport borders (angle only, distance irrelevant)
let BORDER_FOCUS = 3;     // focal distance for border convergence (multiplier of rBase: 1=sharp, 10+=gentle)
const COLORS = [
    '#6366f1', '#8b5cf6', '#ec4899', '#f43f5e',
    '#f97316', '#eab308', '#22c55e', '#14b8a6',
    '#06b6d4', '#3b82f6', '#a78bfa', '#fb923c',
];

// ─── Cell class ──────────────────────────────────────────────
// The atom. Self-contained. Independently movable. Separable.
class Cell {
    constructor(id, x, y, radius) {
        this.id = id;
        this.x = x;
        this.y = y;
        this.radius = radius;
        this.area = Math.PI * radius * radius;
        this.color = COLORS[id % COLORS.length];

        // Current rendered polygon — updated each frame by solver
        this.polygon = null;
        // Debug: per-vertex pull vectors
        this._debugPulls = null; // [{px, py, bx, by, nx, ny}] per vertex
        // Rest polygon before contact clipping (for area correction)
        this.restPoly = null;

        // Hover state
        this.hoverMix = 0;
        this.baseArea = this.area;
    }

    // Generate rest-shape polygon, stretched toward nearby neighbors.
    // Each vertex is pulled toward nearby cell centers — cells "reach"
    // into gaps and create natural tension at boundaries.
    // IMPORTANT: pull is capped so the vertex never extends past
    // the midpoint to any neighbor. This keeps the stretch self-limiting
    // even at extreme GRAVITY_REACH values.
    generateRestPoly(nVerts, neighbors) {
        const r = Math.sqrt(this.area / Math.PI);
        const rBase = Math.sqrt(this.baseArea / Math.PI);
        const poly = [];
        if (debugMode) this._debugPulls = [];

        // ── Find border direction: radial from viewport center ──
        // Vector from viewport center through cell center, projected
        // to where it hits the border. This gives each cell a natural
        // "outward" direction: top-left cells push top-left, right
        // cells push right, etc.
        const vcx = W / 2, vcy = H / 2;
        let odx = this.x - vcx, ody = this.y - vcy;
        const odist = Math.sqrt(odx * odx + ody * ody);
        if (odist < 1) { odx = 0; ody = -1; } // center fallback: push up
        else { odx /= odist; ody /= odist; }

        // Ray-cast from cell center in outward direction to find border hit
        let borderT = Infinity;
        if (odx > 0.001)  borderT = Math.min(borderT, (W - this.x) / odx);
        if (odx < -0.001) borderT = Math.min(borderT, -this.x / odx);
        if (ody > 0.001)  borderT = Math.min(borderT, (H - this.y) / ody);
        if (ody < -0.001) borderT = Math.min(borderT, -this.y / ody);

        const borderNx = odx, borderNy = ody;
        const borderDist = borderT;
        const borderPx = this.x + odx * borderT;
        const borderPy = this.y + ody * borderT;

        for (let i = 0; i < nVerts; i++) {
            const a = (i / nVerts) * Math.PI * 2;
            const cosA = Math.cos(a), sinA = Math.sin(a);
            const baseX = this.x + cosA * r;
            const baseY = this.y + sinA * r;
            let pullX = 0, pullY = 0;
            let borderPullX = 0, borderPullY = 0;
            let cellPullX = 0, cellPullY = 0;

            // ── Cell-to-cell gravitational stretch ───────────
            if (neighbors && neighbors.length > 0) {
                for (const nb of neighbors) {
                    const dx = nb.x - this.x;
                    const dy = nb.y - this.y;
                    const dist = Math.sqrt(dx * dx + dy * dy) || 1;
                    const rNbBase = Math.sqrt(nb.baseArea / Math.PI);
                    const rSum = rBase + rNbBase;

                    if (dist > rSum * 2.5) continue;

                    const ndx = dx / dist, ndy = dy / dist;
                    const facing = cosA * ndx + sinA * ndy;
                    if (facing <= 0) continue;

                    const proximity = 1 - Math.min(dist / (rSum * 2), 1);
                    const strength = facing * facing * proximity * GRAVITY_REACH;

                    cellPullX += ndx * strength * rBase;
                    cellPullY += ndy * strength * rBase;
                }
            }
            pullX += cellPullX;
            pullY += cellPullY;

            // ── Border pull with focal convergence ────────────
            // Border-facing vertices LERP toward a focal point on
            // the border vector. A lerp can NEVER overshoot — the
            // vertex approaches the focal point but never passes it.
            // This makes concavity from border pull impossible at
            // the source, not just patched after the fact.
            if (BORDER_PULL > 0) {
                const facing = cosA * borderNx + sinA * borderNy;
                if (facing > -0.2) {
                    const focalDist = rBase * BORDER_FOCUS;
                    const focalX = this.x + borderNx * focalDist;
                    const focalY = this.y + borderNy * focalDist;

                    // Weight: 0 at equator, 1 at tip
                    const weight = Math.min(1, (facing + 0.2) / 0.3);

                    // Convergence: how much of the way from base to focal.
                    // Normalized so BORDER_PULL=5 ≈ 90% toward focal.
                    // NEVER exceeds 0.95 — vertex can't reach the focal point.
                    const convergence = Math.min(0.95, weight * BORDER_PULL * 0.18);

                    // Lerp: vertex moves from base position toward focal point.
                    // This is geometrically guaranteed to never overshoot.
                    borderPullX = (focalX - baseX) * convergence;
                    borderPullY = (focalY - baseY) * convergence;
                    pullX += borderPullX;
                    pullY += borderPullY;
                    pullY += borderPullY;
                }
            }

            // Store debug vectors
            if (debugMode) {
                const focalDist = rBase * BORDER_FOCUS;
                this._debugPulls.push({
                    bx: baseX, by: baseY,
                    cpx: cellPullX, cpy: cellPullY,
                    bpx: borderPullX, bpy: borderPullY,
                    px: pullX, py: pullY,
                    borderNx, borderNy, borderPx, borderPy,
                    focalX: this.x + borderNx * focalDist,
                    focalY: this.y + borderNy * focalDist,
                });
            }

            // ── Cap: combined pull must not overshoot ────────
            // Vertex can't extend past 40% of the gap to nearest
            // neighbor in the pull direction, OR past 50% of the
            // distance to the border.
            const pullMag = Math.sqrt(pullX * pullX + pullY * pullY);
            if (pullMag > 0.01) {
                const pullDirX = pullX / pullMag;
                const pullDirY = pullY / pullMag;

                let maxReach = Infinity;

                // Cap against neighbors
                if (neighbors) {
                    for (const nb of neighbors) {
                        const dx = nb.x - this.x;
                        const dy = nb.y - this.y;
                        const dot = dx * pullDirX + dy * pullDirY;
                        if (dot > 0) {
                            const rNbBase = Math.sqrt(nb.baseArea / Math.PI);
                            const gapToNb = dot - rBase - rNbBase;
                            maxReach = Math.min(maxReach, rBase + Math.max(gapToNb * 0.4, 0));
                        }
                    }
                }

                // Cap against border
                let borderT = Infinity;
                if (pullDirX > 0.001)  borderT = Math.min(borderT, (W - this.x) / pullDirX);
                if (pullDirX < -0.001) borderT = Math.min(borderT, -this.x / pullDirX);
                if (pullDirY > 0.001)  borderT = Math.min(borderT, (H - this.y) / pullDirY);
                if (pullDirY < -0.001) borderT = Math.min(borderT, -this.y / pullDirY);
                if (borderT < Infinity) {
                    maxReach = Math.min(maxReach, (borderT - rBase) * 0.5 + rBase);
                }

                if (maxReach < Infinity && pullMag > maxReach) {
                    const scale = maxReach / pullMag;
                    pullX *= scale;
                    pullY *= scale;
                }
            }

            poly.push([baseX + pullX, baseY + pullY]);
        }

        // ── Enforce convexity — HARD constraint ─────────────
        // Any vertex creating a concave angle gets snapped to the
        // midpoint of its neighbors. Excess volume that would
        // squeeze past the focal bottleneck redistributes into the
        // cell body. Multiple passes handle cascading fixes.
        enforceConvexity(poly, this.x, this.y);

        // Area normalization: stretch redistributes area, doesn't add it.
        const stretchedArea = polygonArea(poly);
        if (stretchedArea > 1 && Math.abs(stretchedArea - this.area) > this.area * 0.01) {
            const correction = Math.sqrt(this.area / stretchedArea);
            for (let i = 0; i < poly.length; i++) {
                poly[i][0] = this.x + (poly[i][0] - this.x) * correction;
                poly[i][1] = this.y + (poly[i][1] - this.y) * correction;
            }
        }

        // Enforce convexity AGAIN after area normalization —
        // scaling a thin convex shape can create self-intersection
        enforceConvexity(poly, this.x, this.y);

        return poly;
    }

    effectiveRadius() {
        return Math.sqrt(this.area / Math.PI);
    }

    containsPoint(px, py) {
        if (!this.polygon || this.polygon.length < 3) return false;
        return pointInPolygon(px, py, this.polygon);
    }
}

// ─── Geometry helpers ────────────────────────────────────────

function pointInPolygon(px, py, poly) {
    let inside = false;
    const n = poly.length;
    for (let i = 0, j = n - 1; i < n; j = i++) {
        const xi = poly[i][0], yi = poly[i][1];
        const xj = poly[j][0], yj = poly[j][1];
        if (((yi > py) !== (yj > py)) &&
            (px < (xj - xi) * (py - yi) / (yj - yi) + xi)) {
            inside = !inside;
        }
    }
    return inside;
}

function polygonArea(poly) {
    let a = 0;
    const n = poly.length;
    for (let i = 0; i < n; i++) {
        const j = (i + 1) % n;
        a += poly[i][0] * poly[j][1];
        a -= poly[j][0] * poly[i][1];
    }
    return Math.abs(a) / 2;
}

function polygonCentroid(poly) {
    let cx = 0, cy = 0, a = 0;
    const n = poly.length;
    for (let i = 0; i < n; i++) {
        const j = (i + 1) % n;
        const cross = poly[i][0] * poly[j][1] - poly[j][0] * poly[i][1];
        cx += (poly[i][0] + poly[j][0]) * cross;
        cy += (poly[i][1] + poly[j][1]) * cross;
        a += cross;
    }
    a /= 2;
    if (Math.abs(a) < 1) return { x: poly[0][0], y: poly[0][1] };
    cx /= (6 * a);
    cy /= (6 * a);
    return { x: cx, y: cy };
}

// Sutherland-Hodgman half-plane clip.
// Keeps points where (P - M) · N <= 0.
function clipByHalfPlane(poly, mx, my, nx, ny) {
    const out = [];
    const n = poly.length;
    if (n === 0) return out;
    for (let i = 0; i < n; i++) {
        const p = poly[i];
        const q = poly[(i + 1) % n];
        const dp = (p[0] - mx) * nx + (p[1] - my) * ny;
        const dq = (q[0] - mx) * nx + (q[1] - my) * ny;
        if (dp <= 0) out.push(p);
        if ((dp <= 0) !== (dq <= 0)) {
            const t = dp / (dp - dq);
            out.push([p[0] + t * (q[0] - p[0]), p[1] + t * (q[1] - p[1])]);
        }
    }
    return out;
}

function scalePoly(poly, cx, cy, scale) {
    for (let i = 0; i < poly.length; i++) {
        poly[i] = [
            cx + (poly[i][0] - cx) * scale,
            cy + (poly[i][1] - cy) * scale,
        ];
    }
}

function copyPoly(poly) {
    return poly.map(p => [p[0], p[1]]);
}

// Enforce convexity — NUCLEAR OPTION.
// ALWAYS computes the convex hull (no early-out — the check was
// letting concave polygons through). Uses the hull's own centroid
// for ray casting (not cell center, which can be outside the hull
// when pulls are extreme). Resamples N vertices onto the hull.
function enforceConvexity(poly, cx, cy) {
    const n = poly.length;
    if (n < 3) return;

    // Compute convex hull (Andrew's monotone chain)
    const pts = poly.map(p => ({ x: p[0], y: p[1] }));
    pts.sort((a, b) => a.x - b.x || a.y - b.y);
    const hull = [];
    for (const p of pts) {
        while (hull.length >= 2) {
            const a = hull[hull.length - 2], b = hull[hull.length - 1];
            if ((b.x - a.x) * (p.y - a.y) - (b.y - a.y) * (p.x - a.x) <= 0) hull.pop();
            else break;
        }
        hull.push(p);
    }
    const lower = hull.length + 1;
    for (let i = pts.length - 2; i >= 0; i--) {
        const p = pts[i];
        while (hull.length >= lower) {
            const a = hull[hull.length - 2], b = hull[hull.length - 1];
            if ((b.x - a.x) * (p.y - a.y) - (b.y - a.y) * (p.x - a.x) <= 0) hull.pop();
            else break;
        }
        hull.push(p);
    }
    hull.pop();
    if (hull.length < 3) return;

    // Check if already convex: hull has same number of points as input
    if (hull.length === n) return; // all points on hull = already convex

    // Use hull centroid as reference — guaranteed inside the hull.
    // Cell center (cx, cy) can be outside when pulls are extreme.
    let hcx = 0, hcy = 0;
    for (const p of hull) { hcx += p.x; hcy += p.y; }
    hcx /= hull.length; hcy /= hull.length;

    // Resample: for each original vertex, cast a ray from hull centroid
    // at the vertex's angle and find where it intersects the hull.
    const hLen = hull.length;
    for (let i = 0; i < n; i++) {
        const angle = Math.atan2(poly[i][1] - hcy, poly[i][0] - hcx);
        const rdx = Math.cos(angle), rdy = Math.sin(angle);

        let bestT = Infinity;
        for (let j = 0; j < hLen; j++) {
            const k = (j + 1) % hLen;
            const ex = hull[k].x - hull[j].x, ey = hull[k].y - hull[j].y;
            const denom = rdx * ey - rdy * ex;
            if (Math.abs(denom) < 0.0001) continue;

            const fx = hull[j].x - hcx, fy = hull[j].y - hcy;
            const t = (fx * ey - fy * ex) / denom;
            const s = (fx * rdy - fy * rdx) / denom;

            if (t > 0.001 && s >= -0.001 && s <= 1.001 && t < bestT) {
                bestT = t;
            }
        }

        if (bestT < Infinity) {
            poly[i][0] = hcx + rdx * bestT;
            poly[i][1] = hcy + rdy * bestT;
        }
    }
}

// ─── Contact solver ──────────────────────────────────────────
// The heart of MK5. Pairwise bisector clipping.
//
// Key rule: CELLS DON'T SHRINK. When a cell can't achieve its
// target area through rest-poly expansion alone, it pushes back
// by shifting bisectors outward (per-pair bias) and by physically
// repelling overlapping neighbors. Minimum area is enforced hard.

const VERTS = 24;          // circle vertex resolution
const MIN_AREA_FRAC = 0.8; // cell never goes below 80% of target area
const BIAS_RATE = 0.15;    // how fast bisector bias adapts per frame
const REPEL_STRENGTH = 8;  // pixels/frame of repulsion force

function solveCells(cells, dt) {
    const n = cells.length;

    // ── Phase 0: Repulsion ───────────────────────────────────
    // If two cells are closer than their combined radii, push
    // them apart BEFORE clipping. This prevents the bisector
    // from landing inside a cell's center.
    for (let i = 0; i < n; i++) {
        for (let j = i + 1; j < n; j++) {
            const a = cells[i], b = cells[j];
            const dx = b.x - a.x;
            const dy = b.y - a.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < 0.001) { b.x += 1; continue; }

            const rA = a.effectiveRadius();
            const rB = b.effectiveRadius();
            const minDist = (rA + rB) * 0.45 + GAP;

            if (dist < minDist) {
                const overlap = minDist - dist;
                const push = overlap * REPEL_STRENGTH * dt * 0.1;
                const nx = dx / dist, ny = dy / dist;

                // Weight pushback by inverse area — smaller cells are lighter
                const totalArea = a.area + b.area;
                const ratioA = b.area / totalArea; // A moves more if B is bigger
                const ratioB = a.area / totalArea;

                if (!a._dragging) { a.x -= nx * push * ratioA; a.y -= ny * push * ratioA; }
                if (!b._dragging) { b.x += nx * push * ratioB; b.y += ny * push * ratioB; }
            }
        }
    }

    // ── Phase 1: Generate rest polygons ──────────────────────
    // Pass all OTHER cells as neighbors so the rest shape stretches
    // toward them. This is purely cosmetic — centers don't move.
    //
    // Temporal smoothing: blend each vertex of the new rest poly
    // toward the previous frame's rest poly. This prevents the
    // stretch from snapping on/off at boundary distances, which
    // caused cells to flicker between "sharp" and "relaxed."
    // The rest poly always has exactly VERTS vertices, so the
    // blend is 1:1 per vertex — no count mismatch.
    const SMOOTH_RATE = 0.25; // per-frame blend toward new rest poly
    for (const c of cells) {
        const neighbors = cells.filter(o => o !== c);
        const freshPoly = c.generateRestPoly(VERTS, neighbors);

        if (c._prevRestPoly && c._prevRestPoly.length === VERTS) {
            for (let i = 0; i < VERTS; i++) {
                freshPoly[i][0] = c._prevRestPoly[i][0] + (freshPoly[i][0] - c._prevRestPoly[i][0]) * SMOOTH_RATE;
                freshPoly[i][1] = c._prevRestPoly[i][1] + (freshPoly[i][1] - c._prevRestPoly[i][1]) * SMOOTH_RATE;
            }
        }

        // Enforce convexity AFTER temporal smoothing — the blend
        // can create concavity even if both inputs were convex.
        // This is the final gate: nothing past here is ever concave.
        enforceConvexity(freshPoly, c.x, c.y);

        c._prevRestPoly = freshPoly.map(p => [p[0], p[1]]);
        c.restPoly = freshPoly;
        c.polygon = copyPoly(c.restPoly);
    }

    // ── Phase 2: Pairwise bisector clip with bias ────────────
    // Each pair has a bias value that shifts the bisector when
    // one cell is being compressed too much. Bias persists
    // across frames (stored on cell pairs via a map).
    for (let iter = 0; iter < AREA_ITERS; iter++) {
        // Reset polygons to (potentially scaled) rest polys
        for (const c of cells) {
            c.polygon = copyPoly(c.restPoly);
        }

        for (let i = 0; i < n; i++) {
            for (let j = i + 1; j < n; j++) {
                const a = cells[i], b = cells[j];
                const dx = b.x - a.x;
                const dy = b.y - a.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                const rA = a.effectiveRadius();
                const rB = b.effectiveRadius();

                // Skip if too far apart — range accounts for gravitational stretch
                const interactionRange = (rA + rB) * (1.6 + GRAVITY_REACH * 0.5) + GAP;
                if (dist > interactionRange) continue;
                if (dist < 0.001) continue;

                // Weighted bisector position
                // bias shifts it: positive bias favors A (pushes bisector toward B)
                // BUT bias is suppressed when either cell is hovered — hover
                // expansion is intentional and neighbors should yield.
                const wA = Math.sqrt(a.area);
                const wB = Math.sqrt(b.area);
                const biasKey = Math.min(a.id, b.id) * 10000 + Math.max(a.id, b.id);
                if (!pairBias.has(biasKey)) pairBias.set(biasKey, 0);
                const eitherHovered = a.hoverMix > 0.1 || b.hoverMix > 0.1;
                const bias = eitherHovered ? 0 : pairBias.get(biasKey);

                const t = wA / (wA + wB);
                const biasShift = bias * dist * 0.5;
                const mx = a.x + dx * t + (dx / dist) * biasShift;
                const my = a.y + dy * t + (dy / dist) * biasShift;

                const nx = dx / dist;
                const ny = dy / dist;

                a.polygon = clipByHalfPlane(a.polygon,
                    mx - nx * GAP / 2, my - ny * GAP / 2, nx, ny);
                b.polygon = clipByHalfPlane(b.polygon,
                    mx + nx * GAP / 2, my + ny * GAP / 2, -nx, -ny);
            }
        }

        // Area correction: expand rest poly if clipped too small
        if (iter < AREA_ITERS - 1) {
            for (const c of cells) {
                if (c.polygon.length < 3) continue;
                const actual = polygonArea(c.polygon);
                if (actual < c.area * 0.97) {
                    const scale = Math.sqrt(c.area / Math.max(actual, 1));
                    scalePoly(c.restPoly, c.x, c.y, Math.min(scale, 1.4));
                }
            }
        }
    }

    // ── Phase 3: Update pair biases ──────────────────────────
    // After all clipping, check each cell's achieved area.
    // If undersized, shift biases on all its contacts to favor it.
    const areaRatios = new Map();
    for (const c of cells) {
        if (c.polygon.length < 3) { areaRatios.set(c.id, 0); continue; }
        areaRatios.set(c.id, polygonArea(c.polygon) / c.area);
    }

    for (let i = 0; i < n; i++) {
        for (let j = i + 1; j < n; j++) {
            const a = cells[i], b = cells[j];
            const biasKey = Math.min(a.id, b.id) * 10000 + Math.max(a.id, b.id);
            if (!pairBias.has(biasKey)) continue;

            const ratioA = areaRatios.get(a.id) || 0;
            const ratioB = areaRatios.get(b.id) || 0;

            let bias = pairBias.get(biasKey);

            // If either cell is hovered, fast-decay bias — hover expansion
            // is intentional and neighbors should yield, not fight back.
            if (a.hoverMix > 0.1 || b.hoverMix > 0.1) {
                bias *= 0.5;
            } else {
                // If A is undersized, push bisector toward B (positive bias)
                // If B is undersized, push bisector toward A (negative bias)
                if (ratioA < MIN_AREA_FRAC) bias += BIAS_RATE * (MIN_AREA_FRAC - ratioA);
                if (ratioB < MIN_AREA_FRAC) bias -= BIAS_RATE * (MIN_AREA_FRAC - ratioB);

                // Decay bias toward zero when both cells are happy
                if (ratioA > 0.95 && ratioB > 0.95) bias *= 0.9;
            }

            // Clamp bias
            bias = Math.max(-0.4, Math.min(0.4, bias));
            pairBias.set(biasKey, bias);
        }
    }

    // ── Phase 4: Viewport clip ───────────────────────────────
    for (const c of cells) {
        if (c.polygon.length < 3) continue;
        const margin = 2;
        c.polygon = clipByHalfPlane(c.polygon, margin, 0, -1, 0);
        c.polygon = clipByHalfPlane(c.polygon, W - margin, 0, 1, 0);
        c.polygon = clipByHalfPlane(c.polygon, 0, margin, 0, -1);
        c.polygon = clipByHalfPlane(c.polygon, 0, H - margin, 0, 1);
    }

    // ── Phase 5: Hard minimum area enforcement ───────────────
    // If after everything a cell is still too small, push it
    // away from the densest direction. Last resort.
    for (const c of cells) {
        if (c.polygon.length < 3) continue;
        const actual = polygonArea(c.polygon);
        const minArea = c.area * MIN_AREA_FRAC;
        if (actual < minArea && !c._dragging) {
            // Find average direction to nearby cells, flee from it
            let fleeDx = 0, fleeDy = 0;
            for (const other of cells) {
                if (other === c) continue;
                const dx = c.x - other.x;
                const dy = c.y - other.y;
                const d = Math.sqrt(dx * dx + dy * dy) || 1;
                const rSum = c.effectiveRadius() + other.effectiveRadius();
                if (d < rSum * 2) {
                    fleeDx += (dx / d) * (rSum / d);
                    fleeDy += (dy / d) * (rSum / d);
                }
            }
            const fleeDist = Math.sqrt(fleeDx * fleeDx + fleeDy * fleeDy);
            if (fleeDist > 0.01) {
                const push = REPEL_STRENGTH * dt * (1 - actual / minArea);
                c.x += (fleeDx / fleeDist) * push;
                c.y += (fleeDy / fleeDist) * push;
            }
        }
    }
}

// Persistent per-pair bisector bias (survives across frames)
const pairBias = new Map();

// ─── Rendering ───────────────────────────────────────────────

function drawRoundedPolygon(ctx, polygon, radius) {
    if (!polygon || polygon.length < 3) return;

    let area = 0;
    for (let i = 0; i < polygon.length; i++) {
        const j = (i + 1) % polygon.length;
        area += polygon[i][0] * polygon[j][1];
        area -= polygon[j][0] * polygon[i][1];
    }
    area = Math.abs(area) / 2;

    if (area < 100 || radius <= 0) {
        ctx.beginPath();
        ctx.moveTo(polygon[0][0], polygon[0][1]);
        for (let i = 1; i < polygon.length; i++)
            ctx.lineTo(polygon[i][0], polygon[i][1]);
        ctx.closePath();
        return;
    }

    const n = polygon.length;
    const radii = [];
    for (let i = 0; i < n; i++) {
        const prev = polygon[(i - 1 + n) % n];
        const curr = polygon[i];
        const next = polygon[(i + 1) % n];

        const d1 = Math.hypot(prev[0] - curr[0], prev[1] - curr[1]);
        const d2 = Math.hypot(next[0] - curr[0], next[1] - curr[1]);
        const maxR = Math.min(d1, d2) * 0.5;

        const v1x = prev[0] - curr[0], v1y = prev[1] - curr[1];
        const v2x = next[0] - curr[0], v2y = next[1] - curr[1];
        const len1 = Math.hypot(v1x, v1y) || 1;
        const len2 = Math.hypot(v2x, v2y) || 1;
        const dot = (v1x * v2x + v1y * v2y) / (len1 * len2);
        const angle = Math.acos(Math.max(-1, Math.min(1, dot)));
        const maxByAngle = Math.min(d1, d2) * Math.tan(angle / 2);

        radii[i] = Math.max(0, Math.min(radius, maxR, maxByAngle));
    }

    ctx.beginPath();
    let started = false;
    for (let i = 0; i < n; i++) {
        const prev = polygon[(i - 1 + n) % n];
        const curr = polygon[i];
        const next = polygon[(i + 1) % n];
        const r = radii[i];

        const d1 = Math.hypot(prev[0] - curr[0], prev[1] - curr[1]);
        const d2 = Math.hypot(next[0] - curr[0], next[1] - curr[1]);

        if (r < 0.5 || d1 < 0.5 || d2 < 0.5) {
            if (!started) { ctx.moveTo(curr[0], curr[1]); started = true; }
            else ctx.lineTo(curr[0], curr[1]);
        } else {
            const dx1 = (prev[0] - curr[0]) / d1, dy1 = (prev[1] - curr[1]) / d1;
            const dx2 = (next[0] - curr[0]) / d2, dy2 = (next[1] - curr[1]) / d2;
            const sx = curr[0] + dx1 * r, sy = curr[1] + dy1 * r;
            const ex = curr[0] + dx2 * r, ey = curr[1] + dy2 * r;

            if (!started) { ctx.moveTo(sx, sy); started = true; }
            else ctx.lineTo(sx, sy);
            ctx.arcTo(curr[0], curr[1], ex, ey, r);
        }
    }
    ctx.closePath();
}

function darken(hex, f) {
    const r = parseInt(hex.slice(1, 3), 16);
    const g = parseInt(hex.slice(3, 5), 16);
    const b = parseInt(hex.slice(5, 7), 16);
    return `rgb(${r * (1 - f)|0},${g * (1 - f)|0},${b * (1 - f)|0})`;
}

function lighten(hex, f) {
    const r = parseInt(hex.slice(1, 3), 16);
    const g = parseInt(hex.slice(3, 5), 16);
    const b = parseInt(hex.slice(5, 7), 16);
    return `rgb(${Math.min(255, r + (255 - r) * f)|0},${Math.min(255, g + (255 - g) * f)|0},${Math.min(255, b + (255 - b) * f)|0})`;
}

function drawCell(cell) {
    const poly = cell.polygon;
    if (!poly || poly.length < 3) return;

    const c = polygonCentroid(poly);
    const r = cell.effectiveRadius();

    ctx.save();
    ctx.globalAlpha = 1.0;

    // Fill with radial gradient
    drawRoundedPolygon(ctx, poly, CORNER_RADIUS);
    const grad = ctx.createRadialGradient(
        c.x - r * 0.15, c.y - r * 0.15, 0,
        c.x, c.y, r * 1.2
    );
    grad.addColorStop(0, lighten(cell.color, 0.2));
    grad.addColorStop(0.6, cell.color);
    grad.addColorStop(1, darken(cell.color, 0.3));
    ctx.fillStyle = grad;
    ctx.fill();

    // Border — inner stroke
    drawRoundedPolygon(ctx, poly, CORNER_RADIUS);
    ctx.save();
    ctx.clip();
    drawRoundedPolygon(ctx, poly, CORNER_RADIUS);
    const borderW = cell.hoverMix > 0.1 ? 2 : 1;
    ctx.lineWidth = borderW * 2; // doubled, half clipped outside
    ctx.strokeStyle = `rgba(255,255,255,${0.15 + cell.hoverMix * 0.25})`;
    ctx.stroke();
    ctx.restore();

    // Hover glow
    if (cell.hoverMix > 0.05) {
        drawRoundedPolygon(ctx, poly, CORNER_RADIUS);
        ctx.shadowColor = cell.color;
        ctx.shadowBlur = 20 * cell.hoverMix;
        ctx.strokeStyle = `rgba(255,255,255,${0.1 * cell.hoverMix})`;
        ctx.lineWidth = 1;
        ctx.stroke();
        ctx.shadowBlur = 0;
    }

    // Label
    ctx.fillStyle = `rgba(255,255,255,${0.4 + cell.hoverMix * 0.4})`;
    ctx.font = '600 11px ui-monospace, monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(cell.id, c.x, c.y);

    ctx.restore();
}

let debugMode = false;

function render(cells) {
    ctx.clearRect(0, 0, W, H);
    // Draw non-hovered first, hovered last
    const hovered = cells.filter(c => c.hoverMix > 0.5);
    const rest = cells.filter(c => c.hoverMix <= 0.5);
    for (const c of rest) drawCell(c);
    for (const c of hovered) drawCell(c);

    if (debugMode) renderDebug(cells);
}

function renderDebug(cells) {
    for (const c of cells) {
        if (!c._debugPulls) continue;

        // Draw line from cell center to nearest border point
        const d0 = c._debugPulls[0];
        if (d0) {
            ctx.beginPath();
            ctx.moveTo(c.x, c.y);
            ctx.lineTo(d0.borderPx, d0.borderPy);
            ctx.strokeStyle = 'rgba(255, 255, 0, 0.6)';
            ctx.lineWidth = 2;
            ctx.setLineDash([6, 4]);
            ctx.stroke();
            ctx.setLineDash([]);

            // Mark nearest border point
            ctx.beginPath();
            ctx.arc(d0.borderPx, d0.borderPy, 5, 0, Math.PI * 2);
            ctx.fillStyle = 'yellow';
            ctx.fill();

            // Mark focal point (magenta diamond)
            if (d0.focalX !== undefined) {
                ctx.save();
                ctx.translate(d0.focalX, d0.focalY);
                ctx.rotate(Math.PI / 4);
                ctx.fillStyle = 'magenta';
                ctx.fillRect(-4, -4, 8, 8);
                ctx.restore();
            }
        }

        // Draw per-vertex vectors
        for (const d of c._debugPulls) {
            // Cell-to-cell pull (cyan)
            if (Math.abs(d.cpx) > 0.5 || Math.abs(d.cpy) > 0.5) {
                ctx.beginPath();
                ctx.moveTo(d.bx, d.by);
                ctx.lineTo(d.bx + d.cpx, d.by + d.cpy);
                ctx.strokeStyle = 'rgba(0, 255, 255, 0.5)';
                ctx.lineWidth = 1;
                ctx.stroke();
            }

            // Border pull (yellow)
            if (Math.abs(d.bpx) > 0.5 || Math.abs(d.bpy) > 0.5) {
                ctx.beginPath();
                ctx.moveTo(d.bx, d.by);
                ctx.lineTo(d.bx + d.bpx, d.by + d.bpy);
                ctx.strokeStyle = 'rgba(255, 255, 0, 0.7)';
                ctx.lineWidth = 1.5;
                ctx.stroke();
            }

            // Combined pull (white)
            if (Math.abs(d.px) > 0.5 || Math.abs(d.py) > 0.5) {
                ctx.beginPath();
                ctx.moveTo(d.bx, d.by);
                ctx.lineTo(d.bx + d.px, d.by + d.py);
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
                ctx.lineWidth = 1;
                ctx.stroke();

                // Arrowhead
                ctx.beginPath();
                ctx.arc(d.bx + d.px, d.by + d.py, 2, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
                ctx.fill();
            }
        }

        // Draw rest poly outline (before clipping)
        if (c.restPoly && c.restPoly.length > 2) {
            ctx.beginPath();
            ctx.moveTo(c.restPoly[0][0], c.restPoly[0][1]);
            for (let i = 1; i < c.restPoly.length; i++)
                ctx.lineTo(c.restPoly[i][0], c.restPoly[i][1]);
            ctx.closePath();
            ctx.strokeStyle = 'rgba(255, 100, 100, 0.4)';
            ctx.lineWidth = 1;
            ctx.setLineDash([3, 3]);
            ctx.stroke();
            ctx.setLineDash([]);
        }

        // Cell center dot
        ctx.beginPath();
        ctx.arc(c.x, c.y, 3, 0, Math.PI * 2);
        ctx.fillStyle = 'white';
        ctx.fill();
    }
}

// ─── Interaction ─────────────────────────────────────────────

let cells = [];
let dragCell = null;
let dragOffX = 0, dragOffY = 0;
let hoveredCell = null;
let mouseX = -999, mouseY = -999;

function findCellAt(px, py) {
    // Check in reverse (top cells first)
    for (let i = cells.length - 1; i >= 0; i--) {
        if (cells[i].containsPoint(px, py)) return cells[i];
    }
    return null;
}

canvas.addEventListener('pointerdown', e => {
    const rect = canvas.getBoundingClientRect();
    const px = e.clientX - rect.left;
    const py = e.clientY - rect.top;
    const cell = findCellAt(px, py);
    if (cell) {
        dragCell = cell;
        dragCell._dragging = true;
        dragOffX = cell.x - px;
        dragOffY = cell.y - py;
        canvas.setPointerCapture(e.pointerId);
    }
});

canvas.addEventListener('pointermove', e => {
    const rect = canvas.getBoundingClientRect();
    mouseX = e.clientX - rect.left;
    mouseY = e.clientY - rect.top;
    if (dragCell) {
        dragCell.x = mouseX + dragOffX;
        dragCell.y = mouseY + dragOffY;
    }
});

canvas.addEventListener('pointerup', () => {
    if (dragCell) dragCell._dragging = false;
    dragCell = null;
});
canvas.addEventListener('pointerleave', () => { mouseX = -999; mouseY = -999; });

// ─── Init & Loop ─────────────────────────────────────────────

function initCells(count) {
    cells = [];
    const cx = W / 2, cy = H / 2;
    const baseRadius = Math.min(W, H) * 0.06;
    for (let i = 0; i < count; i++) {
        const angle = (i / count) * Math.PI * 2;
        const spread = Math.min(W, H) * 0.25;
        const x = cx + Math.cos(angle) * spread;
        const y = cy + Math.sin(angle) * spread;
        const r = baseRadius * (0.8 + Math.random() * 0.4);
        cells.push(new Cell(i, x, y, r));
    }
}

let lastTime = 0;
function animate(time) {
    const dt = Math.min((time - lastTime) / 16, 3);
    lastTime = time;

    // Update hover
    const newHovered = dragCell || findCellAt(mouseX, mouseY);
    for (const c of cells) {
        const target = (c === newHovered) ? 1 : 0;
        c.hoverMix += (target - c.hoverMix) * (1 - Math.exp(-dt * (target > 0.5 ? 0.3 : 0.08)));
        // Hover area boost
        c.area = c.baseArea * (1 + c.hoverMix * 0.6);
    }

    // Solve contacts
    solveCells(cells, dt);

    // Render
    render(cells);

    // Info
    info.textContent = `mk5 · voroboids · ${cells.length} cells · ${pairBias.size} contacts · gap ${GAP}px`;

    requestAnimationFrame(animate);
}

// ─── Controls ────────────────────────────────────────────────

document.getElementById('addBtn').addEventListener('click', () => {
    const id = cells.length;
    const r = Math.min(W, H) * 0.06 * (0.8 + Math.random() * 0.4);
    const x = W / 2 + (Math.random() - 0.5) * 200;
    const y = H / 3;
    const c = new Cell(id, x, y, r);
    cells.push(c);
});

document.getElementById('removeBtn').addEventListener('click', () => {
    if (cells.length > 1) {
        cells.pop();
        pairBias.clear(); // stale pairs
    }
});

document.getElementById('resetBtn').addEventListener('click', () => {
    pairBias.clear();
    initCells(8);
});

document.getElementById('gapBtn').addEventListener('click', () => {
    const gaps = [0, 2, 4, 8, 16];
    const idx = (gaps.indexOf(GAP) + 1) % gaps.length;
    GAP = gaps[idx];
    document.getElementById('gapBtn').textContent = `Gap: ${GAP}`;
});

// Pull (gravity reach) — slider + number field stay in sync
const pullSlider = document.getElementById('pullSlider');
const pullNum = document.getElementById('pullNum');
function setPull(val) {
    GRAVITY_REACH = val;
    pullSlider.value = Math.min(val, parseFloat(pullSlider.max));
    pullNum.value = val;
}
pullSlider.addEventListener('input', () => setPull(parseFloat(pullSlider.value)));
pullNum.addEventListener('input', () => setPull(parseFloat(pullNum.value) || 0));

// Border pull — slider + number field stay in sync
const borderSlider = document.getElementById('borderSlider');
const borderNum = document.getElementById('borderNum');
function setBorder(val) {
    BORDER_PULL = val;
    borderSlider.value = Math.min(val, parseFloat(borderSlider.max));
    borderNum.value = val;
}
borderSlider.addEventListener('input', () => setBorder(parseFloat(borderSlider.value)));
borderNum.addEventListener('input', () => setBorder(parseFloat(borderNum.value) || 0));

// Focus (focal distance) — slider + number field
const focusSlider = document.getElementById('focusSlider');
const focusNum = document.getElementById('focusNum');
function setFocus(val) {
    BORDER_FOCUS = val;
    focusSlider.value = Math.min(val, parseFloat(focusSlider.max));
    focusNum.value = val;
}
focusSlider.addEventListener('input', () => setFocus(parseFloat(focusSlider.value)));
focusNum.addEventListener('input', () => setFocus(parseFloat(focusNum.value) || 1));

// Debug toggle
document.getElementById('debugBtn').addEventListener('click', () => {
    debugMode = !debugMode;
    document.getElementById('debugBtn').classList.toggle('active', debugMode);
});

// ─── Start ───────────────────────────────────────────────────
initCells(8);
requestAnimationFrame(animate);

</script>
