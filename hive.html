<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hive</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: #0a0a0f;
    color: #e0e0e0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    display: flex; flex-direction: column;
  }
  .stage { position: relative; flex: 1; min-height: 0; }
  canvas { display: block; width: 100%; height: 100%; cursor: default; }
  .back {
    position: absolute; top: 14px; left: 16px; z-index: 3;
    color: #667; text-decoration: none; font-size: 13px; letter-spacing: .02em;
  }
  .back:hover { color: #aab; }

  /* The meter row — the theorem, watchable. Always on in this build. */
  .meters {
    position: absolute; left: 16px; bottom: 14px; z-index: 3;
    font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 11px;
    color: #5a6; background: rgba(10,10,16,.72); border: 1px solid #1e2230;
    border-radius: 6px; padding: 5px 9px; line-height: 1.5;
    pointer-events: none; white-space: nowrap;
  }
  .meters b { color: #8fca9f; font-weight: 600; }
  .meters .bad { color: #e07a6a; }
  .meters .soft { color: #c9b26a; }

  .bar {
    display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
    padding: 10px 16px; background: #0d0d14; border-top: 1px solid #1a1a26;
    z-index: 2;
  }
  .group { display: flex; align-items: center; gap: 7px; }
  .lbl { font-size: 10px; letter-spacing: .09em; text-transform: uppercase; color: #556; }
  .scene-btn, .inner-btn, .btn {
    background: #16161f; color: #99a; border: 1px solid #262636;
    border-radius: 6px; padding: 5px 12px; font-size: 12px; cursor: pointer;
  }
  .scene-btn:hover, .inner-btn:hover, .btn:hover { color: #ccd; border-color: #3a3a52; }
  .scene-btn.active, .inner-btn.active { background: #2b2b48; color: #cfd0ff; border-color: #4a4a7a; }
  input[type=range] { width: 84px; accent-color: #6a6af0; }
  .val { font-size: 11px; color: #778; font-family: ui-monospace, Menlo, monospace; min-width: 3ch; }
</style>
</head>
<body>
  <div class="stage">
    <a class="back" href="index.html">&larr; Back</a>
    <canvas id="c"></canvas>
    <div class="meters" id="meters">
      area err <b id="mArea">–</b> · gap <b id="mGap">–</b> · overlap <b id="mOver">–</b> · rect <b id="mRect">–</b> · seeds <b id="mSeeds">–</b> · solve <b id="mIter">–</b> · fields <b id="mInner">–</b>
    </div>
  </div>
  <div class="bar">
    <div class="group"><span class="lbl">Scene</span>
      <button class="scene-btn" data-scene="flock">Flock</button>
      <button class="scene-btn" data-scene="bento">Bento</button>
      <button class="scene-btn" data-scene="hero">Hero</button>
      <button class="scene-btn" data-scene="sidebar">Sidebar</button>
      <button class="scene-btn" data-scene="frame">Frame</button>
    </div>
    <div class="group"><span class="lbl">Elements</span>
      <input type="range" id="count" min="4" max="30" value="12"><span class="val" id="countVal">12</span>
    </div>
    <div class="group"><span class="lbl">Gap</span>
      <input type="range" id="gap" min="0" max="28" value="10"><span class="val" id="gapVal">10</span>
    </div>
    <div class="group"><span class="lbl">Corners</span>
      <input type="range" id="corner" min="0" max="34" value="14"><span class="val" id="cornerVal">14</span>
    </div>
    <div class="group"><span class="lbl">Hover</span>
      <input type="range" id="hover" min="100" max="260" value="160"><span class="val" id="hoverVal">1.6&times;</span>
    </div>
    <div class="group"><span class="lbl">Fields</span>
      <input type="range" id="fields" min="0" max="100" value="55"><span class="val" id="fieldsVal">55</span>
    </div>
    <div class="group"><span class="lbl">Inside</span>
      <button class="inner-btn active" data-inner="flock">Organic</button>
      <button class="inner-btn" data-inner="bento">Grid</button>
    </div>
    <div class="group"><span class="lbl">Swirl</span>
      <input type="range" id="swirl" min="0" max="100" value="45"><span class="val" id="swirlVal">45</span>
    </div>
    <div class="group"><span class="lbl">Stagger</span>
      <input type="range" id="stagger" min="0" max="100" value="30"><span class="val" id="staggerVal">.30s</span>
    </div>
    <div class="group">
      <button class="btn" id="add">+ Element</button>
      <button class="btn" id="remove">&minus; Element</button>
    </div>
  </div>

<script>
(function () {
'use strict';

/* ============================================================== SOLVE
 * Sealed. Nothing aesthetic lives in here; no knob in this section is a
 * design knob. Behavior-matched to the validated reference in SEED.md.
 *
 * The three pictures to hold:
 *  1. BIDDING. Every seed i bids |x - s_i|^2 - w_i for every point x of
 *     the canvas; every point goes to the lowest bidder. Seed i's cell is
 *     where it wins. All boundaries fall out of this one rule, so the
 *     tiling is watertight at every instant, whatever the weights are.
 *  2. AUCTION. The solver raises the weight of any seed holding less area
 *     than its claim and lowers the overweight ones. A theorem says the
 *     auction always clears: weights giving every seed exactly its
 *     claimed area exist, and damped Newton finds them from any start.
 *  3. ONE SMOOTH FUNCTION. The diagram is a single continuous function
 *     of seed positions and weights. Move a seed and the picture
 *     deforms; it cannot tear, gap, or pop.
 *
 * Two more pictures this file adds on top, without touching the math:
 *  4. LATTICE. Equal-weight seeds on a grid ARE a grid of exact
 *     rectangles. An element at rest is a formation of lattice seeds.
 *  5. NESTING. A straight edge in one diagram forces the cells on both
 *     sides to pair up across it (the straight-edge lemma, SEED.md), so
 *     "rigid outside, organic inside" is never one diagram. It is two:
 *     the cell's own diagram runs again inside the cell, with the cell
 *     as its domain. The solver is the same function, called with a
 *     smaller rectangle.
 */

function ringArea(pts) {
  let a = 0;
  for (let k = 0, n = pts.length; k < n; k++) {
    const p = pts[k], q = pts[k + 1 === n ? 0 : k + 1];
    a += p[0] * q[1] - q[0] * p[1];
  }
  return a / 2;
}

function clipHalfPlane(poly, ax, ay, b, lab) {
  const pts = poly.pts, labs = poly.labs, n = pts.length;
  const oP = [], oL = [];
  let A = pts[n - 1], aL = labs[n - 1];
  let av = ax * A[0] + ay * A[1] - b;
  for (let k = 0; k < n; k++) {
    const B = pts[k], bL = labs[k];
    const bv = ax * B[0] + ay * B[1] - b;
    if (av <= 0) {
      if (bv <= 0) { oP.push(B); oL.push(bL); }
      else {
        const t = av / (av - bv);
        oP.push([A[0] + t * (B[0] - A[0]), A[1] + t * (B[1] - A[1])]);
        oL.push(lab);
      }
    } else if (bv <= 0) {
      const t = av / (av - bv);
      oP.push([A[0] + t * (B[0] - A[0]), A[1] + t * (B[1] - A[1])]);
      oL.push(aL);
      oP.push(B); oL.push(bL);
    }
    A = B; av = bv; aL = bL;
  }
  return { pts: oP, labs: oL };
}

// Same diagram as the reference, with prunable geometry: seeds are bucketed
// in a spatial hash and each cell clips nearest-first, ring by ring, stopping
// once no remaining seed's bisector can reach it. The bisector toward j sits
// at d/2 + (w_i - w_j)/(2d) from s_i — a provable bound, so the output is
// identical to the all-pairs version (areas agree to 1e-10 px²), just faster.
// A NON-CONVEX domain (a field whose border a shard has pushed through, a
// travelling blob) arrives triangulated: each cell is clipped to the convex
// bounds as before, then to every triangle, and the pieces are summed. The
// theorem never asked for convexity — it integrates a lower envelope over
// whatever region it is given — only the clipper did.
function computeDiagram(seeds, weights, boundsPts, tris) {
  const n = seeds.length;
  const cells = new Array(n);
  const areas = new Float64Array(n);
  const baseLabs = boundsPts.map((_, k) => -1 - k);
  const pot = new Float64Array(n);
  let wmin = Infinity, wmax = -Infinity;
  let bx0 = Infinity, by0 = Infinity, bx1 = -Infinity, by1 = -Infinity;
  for (const p of boundsPts) { bx0 = Math.min(bx0, p[0]); by0 = Math.min(by0, p[1]); bx1 = Math.max(bx1, p[0]); by1 = Math.max(by1, p[1]); }
  for (let i = 0; i < n; i++) {
    pot[i] = seeds[i][0] * seeds[i][0] + seeds[i][1] * seeds[i][1] - weights[i];
    if (weights[i] < wmin) wmin = weights[i];
    if (weights[i] > wmax) wmax = weights[i];
  }
  const maxDw = wmax - wmin;
  const cs = Math.max(8, Math.sqrt((bx1 - bx0) * (by1 - by0) / Math.max(1, n)));
  const gw = Math.ceil((bx1 - bx0) / cs) + 1, gh = Math.ceil((by1 - by0) / cs) + 1;
  const buckets = new Array(gw * gh);
  for (let k = 0; k < buckets.length; k++) buckets[k] = [];
  const bxi = new Int32Array(n), byi = new Int32Array(n);
  for (let i = 0; i < n; i++) {
    bxi[i] = Math.min(gw - 1, Math.max(0, Math.floor((seeds[i][0] - bx0) / cs)));
    byi[i] = Math.min(gh - 1, Math.max(0, Math.floor((seeds[i][1] - by0) / cs)));
    buckets[byi[i] * gw + bxi[i]].push(i);
  }
  const cand = [];
  const maxRing = Math.max(gw, gh);
  for (let i = 0; i < n; i++) {
    const sx = seeds[i][0], sy = seeds[i][1], wi = weights[i];
    let poly = { pts: boundsPts, labs: baseLabs };
    let rFar = 0;
    for (const p of boundsPts) rFar = Math.max(rFar, Math.hypot(p[0] - sx, p[1] - sy));
    let dead = false;
    for (let ring = 0; ring <= maxRing && !dead; ring++) {
      const ringMin = (ring - 1) * cs;                       // nearest a seed in this ring can be
      if (ring > 1 && ringMin / 2 - maxDw / (2 * ringMin) > rFar) break;
      cand.length = 0;
      const x0 = bxi[i] - ring, x1 = bxi[i] + ring, y0 = byi[i] - ring, y1 = byi[i] + ring;
      for (let yy = Math.max(0, y0); yy <= Math.min(gh - 1, y1); yy++) {
        for (let xx = Math.max(0, x0); xx <= Math.min(gw - 1, x1); xx++) {
          if (ring > 0 && xx !== x0 && xx !== x1 && yy !== y0 && yy !== y1) continue;
          for (const j of buckets[yy * gw + xx]) if (j !== i) cand.push(j);
        }
      }
      cand.sort((a, b) => ((seeds[a][0] - sx) ** 2 + (seeds[a][1] - sy) ** 2) - ((seeds[b][0] - sx) ** 2 + (seeds[b][1] - sy) ** 2));
      for (const j of cand) {
        const d = Math.hypot(seeds[j][0] - sx, seeds[j][1] - sy);
        if (d / 2 + (wi - weights[j]) / (2 * d) > rFar) continue;   // exact per pair
        poly = clipHalfPlane(poly, seeds[j][0] - sx, seeds[j][1] - sy, (pot[j] - pot[i]) / 2, j);
        if (poly.pts.length < 3) { dead = true; break; }
        rFar = 0;
        for (const p of poly.pts) rFar = Math.max(rFar, Math.hypot(p[0] - sx, p[1] - sy));
      }
    }
    if (poly.pts.length < 3) { cells[i] = { pts: [], labs: [] }; areas[i] = 0; }
    else if (!tris) { cells[i] = poly; areas[i] = Math.abs(ringArea(poly.pts)); }
    else {
      const pieces = [];
      let a = 0;
      for (const tri of tris) {
        let q = poly;
        for (let e = 0; e < 3 && q.pts.length >= 3; e++) q = clipHalfPlane(q, tri[e].ax, tri[e].ay, tri[e].b, WALL_TRI);
        if (q.pts.length >= 3) { pieces.push(q); a += Math.abs(ringArea(q.pts)); }
      }
      if (!pieces.length) { cells[i] = { pts: [], labs: [], pieces }; areas[i] = 0; }
      else { const o = unionOutline(pieces); cells[i] = { pts: o.pts, labs: o.labs, pieces }; areas[i] = a; }
    }
  }
  return { cells, areas };
}

const WALL_TRI = -1000;   // label of an edge cut by a domain triangle: a wall, or a seam between two pieces

// Ear-clip a simple polygon into triangles, each as three inward half-planes
// in clipHalfPlane's form (ax*x + ay*y <= b). Null if the polygon is not
// simple enough to clip — the caller then falls back to its convex bounds.
function triangulate(poly) {
  const n = poly.length;
  if (n < 3) return null;
  const o = ringArea(poly) > 0 ? 1 : -1;
  const cross = (a, b, c) => (b[0] - a[0]) * (c[1] - a[1]) - (b[1] - a[1]) * (c[0] - a[0]);
  const inTri = (p, a, b, c) => o * cross(a, b, p) >= -1e-9 && o * cross(b, c, p) >= -1e-9 && o * cross(c, a, p) >= -1e-9;
  const idx = poly.map((_, i) => i);
  const tris = [];
  let guard = 0;
  while (idx.length > 3 && guard++ < 4 * n) {
    let found = false;
    for (let k = 0; k < idx.length; k++) {
      const m = idx.length;
      const i0 = idx[(k + m - 1) % m], i1 = idx[k], i2 = idx[(k + 1) % m];
      const a = poly[i0], b = poly[i1], c = poly[i2];
      if (o * cross(a, b, c) <= 1e-9) continue;                 // reflex or flat: not an ear
      let ok = true;
      for (const j of idx) {
        if (j === i0 || j === i1 || j === i2) continue;
        if (inTri(poly[j], a, b, c)) { ok = false; break; }
      }
      if (!ok) continue;
      tris.push([a, b, c]); idx.splice(k, 1); found = true; break;
    }
    if (!found) return null;
  }
  if (idx.length === 3) tris.push([poly[idx[0]], poly[idx[1]], poly[idx[2]]]);
  // a polygon that is not simple can ear-clip into triangles that do not
  // cover it; refuse those rather than leave a hole in someone's domain
  let cover = 0;
  for (const t of tris) cover += Math.abs(ringArea(t));
  const want = Math.abs(ringArea(poly));
  if (Math.abs(cover - want) > 1e-6 * want + 1e-6) return null;
  return tris.map(t => {
    const hp = [];
    for (let e = 0; e < 3; e++) {
      const p = t[e], q = t[(e + 1) % 3];
      hp.push({ ax: o * (q[1] - p[1]), ay: -o * (q[0] - p[0]), b: o * ((q[1] - p[1]) * p[0] - (q[0] - p[0]) * p[1]) });
    }
    return hp;
  });
}

// The outline of a union of pieces that share edges exactly (pieces of one
// cell cut by a triangulation, a shard cut by a box): drop every edge whose
// reverse is also present, chain the rest into loops, keep the labels.
function unionOutline(pieces) {
  const loops = unionOutlines(pieces);
  let best = null, bestA = -1;
  for (const l of loops) { const a = Math.abs(ringArea(l.pts)); if (a > bestA) { bestA = a; best = l; } }
  return best || { pts: [], labs: [] };
}
function unionOutlines(pieces) {
  const edges = [];
  for (const { pts, labs } of pieces) {
    for (let k = 0, m = pts.length; k < m; k++) edges.push({ a: pts[k], b: pts[k + 1 === m ? 0 : k + 1], lab: labs[k], dead: false });
  }
  const same = (p, q) => Math.abs(p[0] - q[0]) < 1e-5 && Math.abs(p[1] - q[1]) < 1e-5;
  for (let i = 0; i < edges.length; i++) {
    if (edges[i].dead) continue;
    for (let j = i + 1; j < edges.length; j++) {
      if (edges[j].dead) continue;
      if (same(edges[i].a, edges[j].b) && same(edges[i].b, edges[j].a)) { edges[i].dead = edges[j].dead = true; break; }
    }
  }
  const loops = [];
  for (const e0 of edges) {
    if (e0.dead) continue;
    const pts = [e0.a], labs = [e0.lab];
    let cur = e0; cur.dead = true;
    for (let guard = 0; guard < edges.length; guard++) {
      let next = null, bd = 1e-3;
      for (const e of edges) {
        if (e.dead) continue;
        const d = Math.hypot(e.a[0] - cur.b[0], e.a[1] - cur.b[1]);
        if (d < bd) { bd = d; next = e; }
      }
      if (!next) break;
      next.dead = true;
      pts.push(next.a); labs.push(next.lab);
      cur = next;
      if (Math.hypot(cur.b[0] - e0.a[0], cur.b[1] - e0.a[1]) < 1e-3) break;
    }
    if (pts.length >= 3) loops.push({ pts, labs });
  }
  return loops;
}

function buildJacobian(diagram, seeds) {
  const n = seeds.length;
  const A = [];
  for (let i = 0; i < n; i++) A.push(new Float64Array(n));
  for (let i = 0; i < n; i++) {
    const parts = diagram.cells[i].pieces || [diagram.cells[i]];
    for (const { pts, labs } of parts) {
      for (let k = 0, m = pts.length; k < m; k++) {
        const j = labs[k];
        if (j < 0) continue;
        const p = pts[k], q = pts[k + 1 === m ? 0 : k + 1];
        const L = Math.hypot(q[0] - p[0], q[1] - p[1]);
        const d = Math.hypot(seeds[j][0] - seeds[i][0], seeds[j][1] - seeds[i][1]);
        A[i][j] -= L / (2 * d);
      }
    }
  }
  for (let i = 0; i < n; i++) {
    for (let j = i + 1; j < n; j++) A[i][j] = A[j][i] = (A[i][j] + A[j][i]) / 2;
  }
  for (let i = 0; i < n; i++) {
    let s = 0;
    for (let j = 0; j < n; j++) if (j !== i) s += A[i][j];
    A[i][i] = -s;
  }
  return A;
}

function solvePinned(A, g) {
  const n = g.length, m = n - 1;
  const M = [];
  for (let i = 0; i < m; i++) {
    const row = new Float64Array(m + 1);
    for (let j = 0; j < m; j++) row[j] = A[i][j];
    row[m] = g[i];
    M.push(row);
  }
  for (let c = 0; c < m; c++) {
    let piv = c;
    for (let r = c + 1; r < m; r++) if (Math.abs(M[r][c]) > Math.abs(M[piv][c])) piv = r;
    if (piv !== c) { const t = M[c]; M[c] = M[piv]; M[piv] = t; }
    const pv = M[c][c] || 1e-30;
    for (let r = c + 1; r < m; r++) {
      const f = M[r][c] / pv;
      if (f === 0) continue;
      for (let j = c; j <= m; j++) M[r][j] -= f * M[c][j];
    }
  }
  const x = new Float64Array(n);
  for (let c = m - 1; c >= 0; c--) {
    let s = M[c][m];
    for (let j = c + 1; j < m; j++) s -= M[c][j] * x[j];
    x[c] = s / (M[c][c] || 1e-30);
  }
  return x;
}

function norm2(v) { let s = 0; for (const x of v) s += x * x; return Math.sqrt(s); }
function minOf(v) { let m = Infinity; for (const x of v) if (x < m) m = x; return m; }

function solveWeights(seeds, targets, boundsPts, w0, opts = {}) {
  const n = seeds.length;
  const tol = opts.tol !== undefined ? opts.tol : 1e-6;
  const maxIter = opts.maxIter !== undefined ? opts.maxIter : 50;
  // opts.domain: a simple polygon inside boundsPts to solve on instead
  const tris = opts.domain ? triangulate(opts.domain) : null;
  const domainArea = Math.abs(ringArea(tris ? opts.domain : boundsPts));

  let tSum = 0;
  for (const t of targets) {
    if (!(t > 0)) throw new Error('every claim must be positive');
    tSum += t;
  }
  const tgt = Float64Array.from(targets, t => t * domainArea / tSum);

  let w = w0 ? Float64Array.from(w0) : new Float64Array(n);
  let evals = 0;
  let diag = computeDiagram(seeds, w, boundsPts, tris); evals++;
  if (w0 && minOf(diag.areas) <= 0) {
    // Stale warm start: some seed's old weight leaves it no cell. Rather than
    // discard everyone's warm weights (a cold solve, 5-6 iterations), lift
    // only the empty seeds to the strongest bid around and let Newton pull
    // them back — a few warm iterations instead of a cold restart.
    // lift each empty seed to the strongest weight among its 8 nearest seeds:
    // enough to win a cell locally, not enough to grab a whole neighbourhood
    const empties = [];
    for (let i = 0; i < n; i++) if (diag.areas[i] <= 0) empties.push(i);
    const lifted = new Float64Array(n);
    for (const i of empties) {
      const near = [];
      for (let j = 0; j < n; j++) if (j !== i && diag.areas[j] > 0) near.push([Math.hypot(seeds[j][0] - seeds[i][0], seeds[j][1] - seeds[i][1]), j]);
      near.sort((a, b) => a[0] - b[0]);
      let wl = -Infinity;
      for (let k = 0; k < Math.min(8, near.length); k++) wl = Math.max(wl, w[near[k][1]]);
      lifted[i] = isFinite(wl) ? wl : 0;
    }
    for (const i of empties) w[i] = lifted[i];
    diag = computeDiagram(seeds, w, boundsPts, tris); evals++;
    if (minOf(diag.areas) <= 0) {                  // still empty: the true cold restart
      w = new Float64Array(n);
      diag = computeDiagram(seeds, w, boundsPts, tris); evals++;
    }
  }

  const eps0 = 0.5 * Math.min(minOf(tgt), minOf(diag.areas));

  const g = new Float64Array(n);
  const refreshResidual = () => {
    let mr = 0;
    for (let i = 0; i < n; i++) {
      g[i] = tgt[i] - diag.areas[i];
      const r = Math.abs(g[i]) / tgt[i];
      if (r > mr) mr = r;
    }
    return mr;
  };
  let maxRel = refreshResidual();
  let gn = norm2(g);
  let iter = 0;
  let converged = maxRel <= tol;

  while (!converged && iter < maxIter) {
    const dw = solvePinned(buildJacobian(diag, seeds), g);
    let accepted = false;
    let t = 1;
    for (let bt = 0; bt < 40 && !accepted; bt++, t /= 2) {
      const wt = new Float64Array(n);
      for (let i = 0; i < n; i++) wt[i] = w[i] + t * dw[i];
      const dt = computeDiagram(seeds, wt, boundsPts, tris); evals++;
      let gnT = 0, mn = Infinity;
      for (let i = 0; i < n; i++) {
        const gi = tgt[i] - dt.areas[i];
        gnT += gi * gi;
        if (dt.areas[i] < mn) mn = dt.areas[i];
      }
      gnT = Math.sqrt(gnT);
      if (mn >= eps0 && gnT <= (1 - t / 2) * gn) {
        w = wt; diag = dt; gn = gnT; accepted = true;
      }
    }
    iter++;
    if (!accepted) break;
    maxRel = refreshResidual();
    converged = maxRel <= tol;
  }

  let mean = 0;
  for (let i = 0; i < n; i++) mean += w[i];
  mean /= n;
  for (let i = 0; i < n; i++) w[i] -= mean;

  return { weights: w, iterations: iter, evals, maxRelErr: maxRel, converged, diagram: diag, nonConvex: !!tris };
}


/* ============================================================== LATTICE
 * Twelve columns — the web's own grid — and as many rows as the aspect
 * asks for. A scene is a set of rectangles in lattice units. An element
 * that covers k lattice cells is a body of k seeds; at rest each seed sits
 * at its cell's center with claim 1, and the diagram IS the grid. The
 * pitch belongs to the hive (every hive has its own lattice); what lives
 * here is the pure part: rectangles, splits, and deterministic salt.
 */

function rectArea(r) { return (r[2] - r[0]) * (r[3] - r[1]); }


// Deterministic per-identity variation (no Math.random on steady paths,
// so a resize can never scramble anything).
function hash01(i, k) {
  const x = Math.sin(i * 127.1 + k * 311.7) * 43758.5453;
  return x - Math.floor(x);
}

// Split a lattice rectangle into n integer rectangles, largest-first,
// along its longer side, at a ratio that varies by a deterministic salt.
function guillotine(rect, n, salt) {
  const rects = [rect.slice()];
  let guard = 0;
  while (rects.length < n && guard < 400) {
    guard++;
    rects.sort((a, b) => rectArea(b) - rectArea(a));
    const idx = rects.findIndex(r => (r[2] - r[0]) > 1 || (r[3] - r[1]) > 1);
    if (idx < 0) break;
    const r = rects.splice(idx, 1)[0];
    const w = r[2] - r[0], h = r[3] - r[1];
    const ratio = 0.36 + 0.28 * hash01(guard, salt);
    const vertical = w > h || (w === h && hash01(guard, salt + 7) < 0.5);
    if (vertical && w > 1) {
      const k = Math.min(w - 1, Math.max(1, Math.round(w * ratio)));
      rects.push([r[0], r[1], r[0] + k, r[3]], [r[0] + k, r[1], r[2], r[3]]);
    } else if (h > 1) {
      const k = Math.min(h - 1, Math.max(1, Math.round(h * ratio)));
      rects.push([r[0], r[1], r[2], r[1] + k], [r[0], r[1] + k, r[2], r[3]]);
    } else {
      const k = Math.min(w - 1, Math.max(1, Math.round(w * ratio)));
      rects.push([r[0], r[1], r[0] + k, r[3]], [r[0] + k, r[1], r[2], r[3]]);
    }
  }
  return rects;
}

// Share m rectangles across several regions in proportion to their area.
function distribute(regions, m, salt) {
  regions = regions.filter(r => rectArea(r) > 0);
  if (m <= 0 || !regions.length) return [];
  if (m < regions.length) {
    regions.sort((a, b) => rectArea(b) - rectArea(a));
    return regions.slice(0, m);
  }
  const total = regions.reduce((s, r) => s + rectArea(r), 0);
  const counts = regions.map(r => Math.max(1, Math.floor(m * rectArea(r) / total)));
  let assigned = counts.reduce((s, c) => s + c, 0);
  while (assigned < m) { // remainder to the region with most area per rect
    let best = 0, bestScore = -1;
    regions.forEach((r, i) => { const s = rectArea(r) / counts[i]; if (s > bestScore) { bestScore = s; best = i; } });
    counts[best]++; assigned++;
  }
  while (assigned > m) {
    let best = -1, bestScore = Infinity;
    regions.forEach((r, i) => { if (counts[i] > 1) { const s = rectArea(r) / counts[i]; if (s < bestScore) { bestScore = s; best = i; } } });
    if (best < 0) break;
    counts[best]--; assigned--;
  }
  const out = [];
  regions.forEach((r, i) => out.push(...guillotine(r, Math.min(counts[i], rectArea(r)), salt + i * 13)));
  return out;
}


/* ============================================================== SCENES
 * Pure (cols, rows, n) -> { content: rect[], voids: rect[] } in lattice
 * units, with content.length === n. Voids are margins, columns, pools of
 * whitespace — bodies like any other, with no ink.
 */

const scenes = {
  flock: null,

  bento(C, R, n) {
    return { content: guillotine([0, 0, C, R], n, 1), voids: [] };
  },

  hero(C, R, n) {
    const col = Math.max(1, Math.round(C * 0.22));          // reading column (void)
    const hero = [col, 1, Math.round(C * 0.72), R - 1];
    const strips = [
      [col, 0, C, 1],                                       // top run
      [hero[2], 1, C, R - 1],                               // right column
      [col, R - 1, C, R],                                   // bottom run
    ];
    const content = [hero, ...distribute(strips, n - 1, 2)];
    return { content, voids: [[0, 0, col, R]] };
  },

  sidebar(C, R, n) {
    const c = Math.max(2, Math.round(C * 0.45));
    return { content: guillotine([0, 0, c, R], n, 3), voids: [[c, 0, C, R]] };
  },

  frame(C, R, n) {
    const ring = [
      [0, 0, C, 1], [0, R - 1, C, R],                       // top, bottom
      [0, 1, 2, R - 1], [C - 2, 1, C, R - 1],               // left, right
    ];
    return { content: distribute(ring, n, 4), voids: [[2, 1, C - 2, R - 1]] };
  },
};


/* ============================================================== GARMENT
 * Display only. A body renders as the union of its seeds' cells: edges
 * between two seeds of the same body are seams and vanish; the rest chain
 * into the body's outline. Inset, rounded, dressed — never fed back.
 */

function pointInPolygon(x, y, pts) {
  let inside = false;
  for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
    const xi = pts[i][0], yi = pts[i][1], xj = pts[j][0], yj = pts[j][1];
    if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) inside = !inside;
  }
  return inside;
}

// Chain a body's foreign edges into closed loops.
function bodyOutlines(subIdx, cells, ownerOf, bodyId) {
  const edges = [];
  for (const i of subIdx) {
    const { pts, labs } = cells[i];
    for (let k = 0, m = pts.length; k < m; k++) {
      const j = labs[k];
      if (j >= 0 && ownerOf[j] === bodyId) continue;       // a seam
      edges.push({ a: pts[k], b: pts[k + 1 === m ? 0 : k + 1], used: false });
    }
  }
  const loops = [];
  for (const e0 of edges) {
    if (e0.used) continue;
    const loop = [e0.a];
    let cur = e0; cur.used = true;
    for (let guard = 0; guard < edges.length; guard++) {
      let next = null, best = 0.25;
      for (const e of edges) {
        if (e.used) continue;
        const d = Math.hypot(e.a[0] - cur.b[0], e.a[1] - cur.b[1]);
        if (d < best) { best = d; next = e; }
      }
      if (!next) break;
      next.used = true;
      loop.push(next.a);
      cur = next;
      if (Math.hypot(cur.b[0] - e0.a[0], cur.b[1] - e0.a[1]) < 0.25) break;
    }
    if (loop.length >= 3) loops.push(loop);
  }
  return loops;
}

// A body's outline is chained from its sub-cells' edges, so every seam
// junction leaves a duplicate vertex and every straight run arrives split
// into collinear pieces. Both are invisible in the polygon and fatal in the
// garment: insetPolygon cannot offset a zero-length edge, so it drops that
// corner — which renders as a chamfer chopped across it. Reduce the loop to
// its real corners before dressing it.
function simplifyLoop(pts, epsLen = 0.05, epsSin = 1e-3) {
  const a = [];
  for (const p of pts) {
    const q = a[a.length - 1];
    if (!q || Math.hypot(p[0] - q[0], p[1] - q[1]) > epsLen) a.push(p);
  }
  while (a.length > 1 && Math.hypot(a[0][0] - a[a.length - 1][0], a[0][1] - a[a.length - 1][1]) <= epsLen) a.pop();
  if (a.length < 3) return a;
  const out = [];
  for (let i = 0; i < a.length; i++) {
    const p = a[(i + a.length - 1) % a.length], c = a[i], n = a[(i + 1) % a.length];
    const ux = c[0] - p[0], uy = c[1] - p[1], vx = n[0] - c[0], vy = n[1] - c[1];
    const lu = Math.hypot(ux, uy), lv = Math.hypot(vx, vy);
    if (lu < epsLen || lv < epsLen) continue;
    if (Math.abs(ux * vy - uy * vx) / (lu * lv) > epsSin) out.push(c);   // a real corner
  }
  return out.length >= 3 ? out : a;
}

// Inset a simple polygon by d: offset every edge inward and intersect
// neighbors. Callers clamp d well below the polygon's inradius. d may be an
// array, one distance per edge (edge k runs pts[k] -> pts[k+1]); negative
// distances offset outward.
function insetPolygon(pts, d) {
  const n = pts.length;
  if (n < 3) return pts;
  const dk = k => Array.isArray(d) ? d[k] : d;
  if (!Array.isArray(d) && d === 0) return pts;
  const orient = ringArea(pts) > 0 ? 1 : -1;
  const lines = [];
  for (let k = 0; k < n; k++) {
    const p = pts[k], q = pts[(k + 1) % n];
    let nx = (q[1] - p[1]) * orient, ny = (p[0] - q[0]) * orient;
    const len = Math.hypot(nx, ny);
    if (len < 1e-9) { lines.push(null); continue; }
    nx /= len; ny /= len;
    lines.push({ nx, ny, c: nx * p[0] + ny * p[1] - dk(k) });
  }
  const out = [];
  for (let k = 0; k < n; k++) {
    const l1 = lines[(k + n - 1) % n], l2 = lines[k];
    if (!l1 || !l2) continue;
    const det = l1.nx * l2.ny - l1.ny * l2.nx;
    if (Math.abs(det) < 1e-6) { out.push([pts[k][0] - l2.nx * dk(k), pts[k][1] - l2.ny * dk(k)]); continue; }
    out.push([(l1.c * l2.ny - l2.c * l1.ny) / det, (l1.nx * l2.c - l2.nx * l1.c) / det]);
  }
  return out;
}

// Rounded path with the tangent budgeted, not just the radius. r may be an
// array, one radius per vertex; 0 leaves that corner sharp.
function roundedPath(ctx, pts, r) {
  const n = pts.length;
  ctx.beginPath();
  const rk = k => Array.isArray(r) ? r[k] : r;
  if (!Array.isArray(r) && r <= 0.5) {
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (let k = 1; k < n; k++) ctx.lineTo(pts[k][0], pts[k][1]);
    ctx.closePath();
    return;
  }
  let started = false;
  for (let k = 0; k < n; k++) {
    const p0 = pts[(k + n - 1) % n], p1 = pts[k], p2 = pts[(k + 1) % n];
    const v1x = p0[0] - p1[0], v1y = p0[1] - p1[1];
    const v2x = p2[0] - p1[0], v2y = p2[1] - p1[1];
    const l1 = Math.hypot(v1x, v1y), l2 = Math.hypot(v2x, v2y);
    if (l1 < 1e-6 || l2 < 1e-6) continue;
    const dot = (v1x * v2x + v1y * v2y) / (l1 * l2);
    const theta = Math.acos(Math.min(1, Math.max(-1, dot)));
    const tanHalf = Math.tan(theta / 2);
    const tang = Math.min(rk(k) / (tanHalf || 1e9), l1 / 2, l2 / 2);
    const rr = tang * tanHalf;
    const t1x = p1[0] + (v1x / l1) * tang, t1y = p1[1] + (v1y / l1) * tang;
    const t2x = p1[0] + (v2x / l2) * tang, t2y = p1[1] + (v2y / l2) * tang;
    if (!started) { ctx.moveTo(t1x, t1y); started = true; } else ctx.lineTo(t1x, t1y);
    if (rr > 0.1 && theta < Math.PI - 0.02) ctx.arcTo(p1[0], p1[1], t2x, t2y, rr);
    else ctx.lineTo(t2x, t2y);
  }
  ctx.closePath();
}

// Inscribed pole: the largest-inscribed-circle center, climbed from a
// point known to be inside and never allowed to leave the polygon.
function inscribedPole(pts, startX, startY) {
  const n = pts.length;
  const minDist = (x, y) => {
    let md = Infinity;
    for (let k = 0; k < n; k++) {
      const p = pts[k], q = pts[(k + 1) % n];
      const ex = q[0] - p[0], ey = q[1] - p[1];
      const L2 = ex * ex + ey * ey || 1e-9;
      let t = ((x - p[0]) * ex + (y - p[1]) * ey) / L2;
      t = Math.max(0, Math.min(1, t));
      md = Math.min(md, Math.hypot(x - (p[0] + t * ex), y - (p[1] + t * ey)));
    }
    return md;
  };
  let cx = startX, cy = startY;
  if (startX === undefined || !pointInPolygon(cx, cy, pts)) {
    cx = 0; cy = 0; for (const p of pts) { cx += p[0]; cy += p[1]; } cx /= n; cy /= n;
    if (!pointInPolygon(cx, cy, pts)) { cx = pts[0][0]; cy = pts[0][1]; }
  }
  let best = minDist(cx, cy), step = Math.max(4, best);
  for (let it = 0; it < 18; it++) {
    let moved = false;
    for (const [dx, dy] of [[step, 0], [-step, 0], [0, step], [0, -step]]) {
      const x = cx + dx, y = cy + dy;
      if (!pointInPolygon(x, y, pts)) continue;
      const d = minDist(x, y);
      if (d > best) { best = d; cx = x; cy = y; moved = true; break; }
    }
    if (!moved) step /= 2;
    if (step < 0.5) break;
  }
  return { x: cx, y: cy, r: best };
}

function shade(hex, amt) {
  const num = parseInt(hex.slice(1), 16);
  const r = Math.min(255, Math.max(0, (num >> 16) + amt));
  const g = Math.min(255, Math.max(0, ((num >> 8) & 0xff) + amt));
  const b = Math.min(255, Math.max(0, (num & 0xff) + amt));
  return `#${((r << 16) | (g << 8) | b).toString(16).padStart(6, '0')}`;
}


/* ============================================================== METERS */

// Exact scanline rasterization of the picture's polygons, even-odd, so a
// notched cell counts right: 0 = gap, 2+ = overlap.
function rasterCheck(cells, W, H) {
  const S = 2;
  const gw = Math.floor((W - S / 2 - 1e-6) / S) + 1;
  const gh = Math.floor((H - S / 2 - 1e-6) / S) + 1;
  const cov = new Uint8Array(gw * gh);
  const xs = [];
  for (const cell of cells) {
    const pts = cell.pts;
    if (pts.length < 3) continue;
    let y0 = Infinity, y1 = -Infinity;
    for (const p of pts) { y0 = Math.min(y0, p[1]); y1 = Math.max(y1, p[1]); }
    const r0 = Math.max(0, Math.ceil((y0 - S / 2) / S)), r1 = Math.min(gh - 1, Math.floor((y1 - S / 2) / S));
    for (let ry = r0; ry <= r1; ry++) {
      const y = ry * S + S / 2;
      xs.length = 0;
      for (let k = 0; k < pts.length; k++) {
        const p = pts[k], q = pts[(k + 1) % pts.length];
        if ((p[1] <= y) !== (q[1] <= y)) xs.push(p[0] + (y - p[1]) * (q[0] - p[0]) / (q[1] - p[1]));
      }
      xs.sort((a, b) => a - b);
      for (let m = 0; m + 1 < xs.length; m += 2) {
        const c0 = Math.max(0, Math.ceil((xs[m] - S / 2) / S)), c1 = Math.min(gw - 1, Math.floor((xs[m + 1] - S / 2) / S));
        for (let cx2 = c0; cx2 <= c1; cx2++) cov[ry * gw + cx2]++;
      }
    }
  }
  let gap = 0, over = 0;
  for (let k = 0; k < cov.length; k++) { if (cov[k] === 0) gap++; else if (cov[k] > 1) over++; }
  return { gap: gap * S * S, over: over * S * S };
}


/* ============================================================== HIVE
 * One domain, one auction, one crystal, one scene. The page is a hive. A
 * FIELD is a body whose cell holds another hive — the same class, one
 * level down, its domain the cell it lives in. Nothing about a field is a
 * second mechanism: it steers, claims, solves, locks and dresses exactly
 * as the page does, in its own coordinates. The page only ever tells it
 * how big its cell is this frame.
 *
 * So "rigid perimeter, loose cells within" is not a special state. It is
 * the page's crystal at 1 and the field's crystal at 0. All crystals at 1
 * is a nested grid; all at 0 is organic all the way down. Same numbers.
 *
 * All rates per second; dt in seconds.
 */

const CLAIM_MIN = 0.02;
const SEED_MARGIN = 10;
const SEED_MIN_SEP = 5;
const ACTIVE_MIN = 0.12;   // a lattice seed joins the field once it is worth this much of a slot
const MAX_DEPTH = 2;       // page > field > field-in-a-field; enough to prove the recursion
const MAX_MEMBERS = 9;     // the largest roster a field shows

const PALETTE = [
  '#6366f1', '#06b6d4', '#10b981', '#f59e0b', '#ec4899', '#8b5cf6',
  '#eab308', '#3b82f6', '#ef4444', '#14b8a6', '#a855f7', '#f97316',
  '#64748b', '#d946ef', '#84cc16', '#dc2626', '#2563eb', '#d97706',
  '#7c3aed', '#0d9488', '#e11d48', '#65a30d', '#4f46e5', '#fb923c',
  '#22d3d8', '#c026d3', '#a16207', '#475569', '#be123c', '#059669',
];
const NAMES = [
  'Drift', 'Ember', 'Tide', 'Moss', 'Petal', 'Aurora', 'Dune', 'Jazz',
  'Coal', 'Mint', 'Haze', 'Coral', 'Storm', 'Neon', 'Sage', 'Ruby',
  'Sky', 'Amber', 'Dusk', 'Reef', 'Rose', 'Zest', 'Night', 'Peach',
  'Wave', 'Pulse', 'Bronze', 'Steel', 'Crimson', 'Fern',
];

function easeInOutCubic(u) {
  return u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
}

function makeSub(body, x, y) {
  return { body, x, y, claim: CLAIM_MIN, w: 0 };  // w: warm-start weight
}

// Greedy nearest assignment + 2-opt on squared travel.
function assignStations(points, stations) {
  const nA = points.length, nS = stations.length;
  const pairs = [];
  for (let i = 0; i < nA; i++) for (let j = 0; j < nS; j++) {
    const dx = points[i].x - stations[j].x, dy = points[i].y - stations[j].y;
    pairs.push({ i, j, d: dx * dx + dy * dy });
  }
  pairs.sort((a, b) => a.d - b.d);
  const gotS = new Array(nA).fill(-1), taken = new Array(nS).fill(false);
  for (const p of pairs) if (gotS[p.i] < 0 && !taken[p.j]) { gotS[p.i] = p.j; taken[p.j] = true; }
  const d2 = (a, s) => { const dx = a.x - s.x, dy = a.y - s.y; return dx * dx + dy * dy; };
  for (let pass = 0; pass < 30; pass++) {
    let improved = false;
    for (let i = 0; i < nA; i++) for (let j = i + 1; j < nA; j++) {
      const si = stations[gotS[i]], sj = stations[gotS[j]];
      if (d2(points[i], sj) + d2(points[j], si) + 0.5 < d2(points[i], si) + d2(points[j], sj)) {
        const t = gotS[i]; gotS[i] = gotS[j]; gotS[j] = t; improved = true;
      }
    }
    if (!improved) break;
  }
  return gotS;
}

// Inset an outline by d without letting a feature shorter than d turn
// inside out: an inset edge that runs against its original is a collapsed
// feature, so drop it from the source and inset again. Then reduce the
// result to its real corners. Small shards need this; rectangles never do.
function insetClean(pts, d) {
  let src = simplifyLoop(pts, 1.5, 0.02);
  for (let iter = 0; iter < 8 && src.length >= 3; iter++) {
    const out = insetPolygon(src, d);
    if (out.length !== src.length) return simplifyLoop(out, 1.0, 0.01);
    let flipped = -1;
    for (let k = 0; k < src.length; k++) {
      const k1 = (k + 1) % src.length;
      const dot = (out[k1][0] - out[k][0]) * (src[k1][0] - src[k][0]) + (out[k1][1] - out[k][1]) * (src[k1][1] - src[k][1]);
      if (dot < 0) { flipped = k; break; }
    }
    if (flipped < 0) return simplifyLoop(out, 1.0, 0.01);
    src = src.filter((_, k) => k !== flipped && k !== (flipped + 1) % src.length);
  }
  return [];
}

// The domain a field hands its hive: its outline inset by the padding,
// provided the result is a polygon the clipper can triangulate; failing
// that, a smaller padding; failing that, the plain content box.
function domainFor(cell, pad, box) {
  for (const d of [pad, pad / 2, 0]) {
    // only duplicates and exact collinears go: a corner rounded off here
    // would leave a sliver between the hive's leaves and the neighbours'
    const poly = d > 0 ? insetClean(cell, d) : simplifyLoop(cell, 0.05, 1e-5);
    if (poly.length >= 3 && Math.abs(ringArea(poly)) > 0.5 * Math.abs(ringArea(cell)) && triangulate(poly)) return poly;
  }
  return box;
}

class Hive {
  constructor(opts = {}) {
    this.depth = opts.depth || 0;
    this.shift = opts.shift || 0;                  // identity offset: names, colours, salts
    this.style = Object.assign({ calm: 1, labels: true }, opts.style || {});
    this.minCount = opts.minCount !== undefined ? opts.minCount : 1;
    this.scene = opts.scene || 'flock';

    this.bodies = [];
    this.nextId = 0;

    // the domain and its lattice
    this.W = opts.W || 320; this.H = opts.H || 240;
    this.COLS = this.wantCols(); this.ROWS = this.wantRows();
    this.PW = this.W / this.COLS; this.PH = this.H / this.ROWS;
    this.ox = 0; this.oy = 0;                      // origin in the parent's px
    this.absX = 0; this.absY = 0;                  // origin in canvas px
    this.domainPoly = null;                        // the cell this hive lives in, when not a rectangle
    this.domainSig = '';
    this.domainIsCell = true;
    this.shards = [];                              // this frame's shards: members carving into this hive's cells
    this.stable = true;                            // false while the cell this hive lives in is liquid
    this.dormant = false;                          // too small to run this frame
    this.layoutAt = -1;                            // time a re-layout was requested, or -1

    // The lattice is a REST STATE, not a travel mechanism. crystal is 0
    // while anything is moving — every element a single seed, organic and
    // cheap — and eases to 1 once everything has arrived, locking the grid.
    this.crystal = 0; this.crystalTarget = 0;

    this.solved = null;                            // this hive's ONE authoritative tessellation
    this.solvedSubs = [];                          // the flat seed list it was made from
    this.ownerOf = [];                             // flat index -> body id
    this.lastSig = null;
    this.hoveredId = -1;
    this.drag = { body: null, px: 0, py: 0 };
    this.swirlSign = 1;
    this.t = 0;
    this.solveMs = 0; this.lastIters = 0; this.rectPct = 100;
  }

  // --- lattice ----------------------------------------------------------

  // The page has the web's twelve columns; a field has as many as its width
  // affords, and always enough slots for the largest roster it can hold.
  wantCols() { return this.depth === 0 ? 12 : Math.max(2, Math.min(8, Math.round(this.W / 110))); }
  wantRows() {
    const C = this.wantCols();
    const lo = this.depth === 0 ? 4 : Math.max(1, Math.ceil(MAX_MEMBERS / C));
    return Math.max(lo, Math.min(10, Math.round(C * this.H / this.W)));
  }
  slotCenter(c, r) { return [this.PW * (c + 0.5), this.PH * (r + 0.5)]; }
  rectCenter(r) { return [this.PW * (r[0] + r[2]) / 2, this.PH * (r[1] + r[3]) / 2]; }

  // The domain changes size: scale everything and the lattice stays a
  // lattice, rectangles exact, mid-drag included. The PITCH follows the size
  // every time; the lattice DIMENSIONS only change together with a new
  // layout, so a seated formation is inside the domain at every instant,
  // whatever the size does in between — a field's cell breathes every frame
  // while the page is liquid, and its content stretches with it, then
  // reflows once the page has locked.
  setSize(W, H) {
    const oldW = this.W, oldH = this.H;
    this.W = W; this.H = H;
    if (!this.bodies.length) {            // nothing seated: the lattice can follow at once
      this.COLS = this.wantCols(); this.ROWS = this.wantRows();
      this.PW = W / this.COLS; this.PH = H / this.ROWS;
      return;
    }
    this.PW = W / this.COLS; this.PH = H / this.ROWS;
    if (oldW > 0) {
      const kx = W / oldW, ky = H / oldH;
      for (const b of this.bodies) {
        b.x *= kx; b.y *= ky;
        b.anchorX *= kx; b.anchorY *= ky;
        for (const s of b.subs) s.w *= kx * ky;
        if (b.path) {
          b.path.sx *= kx; b.path.cx *= kx; b.path.sy *= ky; b.path.cy *= ky;
          if (b.rect) { const [ex, ey] = this.rectCenter(b.rect); b.path.ex = ex; b.path.ey = ey; }
          else { b.path.ex *= kx; b.path.ey *= ky; }
        }
        this.refreshFormation(b);
      }
    }
    if (this.wantCols() !== this.COLS || this.wantRows() !== this.ROWS) this.layoutAt = this.t;
  }

  relayout() {
    const C = this.wantCols(), R = this.wantRows();
    if (C === this.COLS && R === this.ROWS) return;
    this.COLS = C; this.ROWS = R;
    this.PW = this.W / C; this.PH = this.H / R;
    this.enterScene(this.scene);
  }

  // --- bodies -----------------------------------------------------------

  makeBody(x, y, opts = {}) {
    const id = this.nextId++, k = id + this.shift;
    const b = {
      id,
      name: NAMES[k % NAMES.length],
      color: PALETTE[k % PALETTE.length],
      isVoid: !!opts.isVoid,

      // The body's own position: ONE spring, whatever its slot count. Seeds
      // are derived from it every frame, never integrated separately, so a
      // formation cannot shear or open up.
      x, y, vx: 0, vy: 0,

      rect: null,                 // lattice rect when seated
      offs: [[0, 0]],             // seed offsets from the body centre at full crystal
      core: 0,                    // the seed carrying the whole claim while melted
      subs: [],

      path: null, journey: null, progress: 1,
      leaving: false,

      // Total claim in lattice-cell units: a 6-slot element claims 6.
      claim: opts.claim !== undefined ? opts.claim : CLAIM_MIN,
      claim0: CLAIM_MIN,
      claimTarget: 1,
      baseClaim: 0.8 + hash01(k, 2) * 0.7,   // its size as a free single seed

      // What kind of element this is, is the element's own: a gallery holds
      // cells, a card does not. The Fields slider sets how many are galleries.
      kindRoll: hash01(k, 21),
      hive: null,                 // a field: the hive living inside this cell
      loops: null, bigSeed: -1,   // this frame's simplified union outline

      hoverMix: 0,
      anchorX: x, anchorY: y,
      wanderPhase: hash01(k, 1) * Math.PI * 2,
    };
    b.subs.push(makeSub(b, x, y));
    return b;
  }

  // Describe a body's formation: the offsets of its lattice slots from the
  // rect centre. Derived, so a resize re-derives it for free.
  refreshFormation(b) {
    if (!b.rect) { b.offs = [[0, 0]]; b.core = 0; b.subs.length = 1; return; }
    const [ex, ey] = this.rectCenter(b.rect);
    const offs = [];
    for (let r = b.rect[1]; r < b.rect[3]; r++) {
      for (let c = b.rect[0]; c < b.rect[2]; c++) {
        const [sx, sy] = this.slotCenter(c, r);
        offs.push([sx - ex, sy - ey]);
      }
    }
    // The core is the slot nearest the centre. While the field is liquid it
    // carries the body's entire claim, so a melted element is ONE seed — one
    // smooth convex cell — sitting where its rectangle will be.
    let core = 0;
    for (let i = 1; i < offs.length; i++) {
      if (Math.hypot(offs[i][0], offs[i][1]) < Math.hypot(offs[core][0], offs[core][1])) core = i;
    }
    b.offs = offs; b.core = core;
    while (b.subs.length < offs.length) b.subs.push(makeSub(b, b.x, b.y));
    b.subs.length = offs.length;
  }

  // --- seating: the one verb, spoken for a whole formation at once -------

  seatBody(b, rect, timing) {
    b.rect = rect;
    this.refreshFormation(b);
    b.claim0 = b.claim;
    b.claimTarget = b.offs.length;      // one lattice cell per slot
    b.leaving = false;

    const [ex, ey] = this.rectCenter(rect);
    const dist = Math.hypot(ex - b.x, ey - b.y);
    const k = b.id + this.shift;
    const bend = config.swirl * 0.55 * this.swirlSign * (0.7 + 0.6 * hash01(k, 12));
    const ddx = ex - b.x, ddy = ey - b.y;
    b.path = { sx: b.x, sy: b.y, ex, ey, cx: (b.x + ex) / 2 - ddy * bend, cy: (b.y + ey) / 2 + ddx * bend };
    b.journey = timing || {
      t0: this.t,
      delay: config.stagger * hash01(k, 11),
      dur: Math.min(2.2, 0.9 + dist / 520) * (0.9 + 0.2 * hash01(k, 13)),
    };
    b.progress = 0;
  }

  // Release a body back to the flock: one seed, its own resting size.
  releaseBody(b) {
    b.rect = null;
    this.refreshFormation(b);
    b.claim0 = b.claim;
    b.claimTarget = b.baseClaim;
    b.path = null; b.journey = null; b.progress = 1;
    b.leaving = false;
  }

  retireBody(b, dur = 0.6) {
    // shrink in place, as one seed, and be gone
    b.leaving = true; b.rect = null; b.hive = null;
    this.refreshFormation(b);
    b.path = { sx: b.x, sy: b.y, ex: b.x, ey: b.y, cx: b.x, cy: b.y };
    b.journey = { t0: this.t, delay: 0, dur };
    b.progress = 0;
    b.claim0 = b.claim;
    b.claimTarget = CLAIM_MIN;
  }

  // A gallery seated in a roomy rect becomes a field: a hive inside the
  // cell, sized for the rect it is about to lock into, showing as many
  // members as the room allows. Members are identities like any other —
  // they persist across the page's scenes, so a gallery keeps its cards
  // while the page rearranges around it. A gallery in a cramped rect shows
  // as a plain card, the way a page collapses a section that has no room.
  setField(b, rect) {
    const slots = rectArea(rect);
    const gallery = b.kindRoll < config.fieldDensity * (this.depth === 0 ? 1 : 0.5);
    const k = gallery && this.depth < MAX_DEPTH && slots >= 4 ? Math.min(MAX_MEMBERS, Math.round(slots * 0.5 + 1)) : 0;
    if (k < 3) { b.hive = null; return; }
    if (!b.hive) {
      b.hive = new Hive({
        depth: this.depth + 1,
        shift: (b.id + this.shift) * 5 + 3,
        scene: config.inner,
        style: { calm: 0.45, labels: false },
        W: (rect[2] - rect[0]) * this.PW,
        H: (rect[3] - rect[1]) * this.PH,
      });
    }
    b.hive.setCount(k);
  }

  // --- scenes -----------------------------------------------------------

  enterScene(name) {
    this.scene = name;
    const content = this.bodies.filter(b => !b.isVoid && !b.leaving);
    const spec = scenes[name] ? scenes[name](this.COLS, this.ROWS, content.length) : null;

    if (!spec || spec.content.length < content.length) {
      // no rigid border anywhere, so no fields either
      for (const b of this.bodies) {
        if (b.isVoid) this.retireBody(b, 0.5);
        else { b.hive = null; this.releaseBody(b); }
      }
      return;
    }

    this.swirlSign = -this.swirlSign;
    const centers = spec.content.map(r => { const [x, y] = this.rectCenter(r); return { x, y }; });
    const gotS = assignStations(content, centers);
    let slowest = 0.9;
    content.forEach((b, k) => {
      const rect = spec.content[gotS[k]];
      this.seatBody(b, rect);
      this.setField(b, rect);
      slowest = Math.max(slowest, b.journey.delay + b.journey.dur);
    });

    // Whitespace has no identity to carry across a page: a margin does not
    // travel, it dissolves here and forms there. While the field is liquid
    // every body is a single seed, so this is one blob fading out and another
    // growing in — no comb of void seeds threading between the cells. The new
    // void grows on the slowest traveller's clock, so it never opens ahead of
    // the elements vacating it.
    for (const v of this.bodies.filter(b => b.isVoid && !b.leaving)) this.retireBody(v, slowest);
    spec.voids.forEach(r => {
      const [x, y] = this.rectCenter(r);
      const v = this.makeBody(x, y, { isVoid: true, claim: CLAIM_MIN });
      this.bodies.push(v);
      this.seatBody(v, r, { t0: this.t, delay: 0, dur: slowest });
    });
  }

  // --- insertion / removal ----------------------------------------------

  addBody() {
    const k = this.nextId + this.shift;
    const b = this.makeBody(this.W * (0.35 + hash01(k, 5) * 0.3), this.H * (0.35 + hash01(k, 6) * 0.3), { claim: CLAIM_MIN });
    b.claim0 = CLAIM_MIN; b.claimTarget = b.baseClaim;
    this.bodies.push(b);
    this.enterScene(this.scene);
  }

  removeBody() {
    const content = this.bodies.filter(b => !b.isVoid && !b.leaving);
    if (content.length <= this.minCount) return;
    this.retireBody(content[content.length - 1]);
  }

  setCount(k) {
    let n = this.bodies.filter(b => !b.isVoid && !b.leaving).length;
    while (n < k) { this.addBody(); n++; }
    while (n > k && n > this.minCount) { this.removeBody(); n--; }
  }

  reap() {
    const done = b => b.leaving && b.claim <= CLAIM_MIN * 1.5 && b.progress >= 0.999;
    // a dissolved void just disappears; a removed element re-layouts the rest
    const contentGone = this.bodies.some(b => done(b) && !b.isVoid);
    this.bodies = this.bodies.filter(b => !done(b));
    if (contentGone) this.enterScene(this.scene);
  }

  // --- steering ---------------------------------------------------------

  steer(dt, t) {
    const drag = this.drag, W = this.W, H = this.H;
    for (const b of this.bodies) {
      const k = b.id + this.shift;
      if (b.journey) {
        const j = b.journey;
        const u = Math.min(1, Math.max(0, (t - j.t0 - j.delay) / j.dur));
        b.progress = easeInOutCubic(u);
      }
      if (b === drag.body) { b.x = drag.px; b.y = drag.py; b.vx = 0; b.vy = 0; continue; }
      let ax = 0, ay = 0;
      if (b.path) {
        // follow the journey's carrot with a lightly under-damped spring: the
        // bezier gives the path, the spring the lag and overshoot that read
        // as alive. The resting wobble fades out as the lattice locks, so a
        // crystallised layout is the grid, not a grid breathing by a pixel.
        const e = b.progress, m = 1 - e, p = b.path;
        const px = m * m * p.sx + 2 * m * e * p.cx + e * e * p.ex;
        const py = m * m * p.sy + 2 * m * e * p.cy + e * e * p.ey;
        const k1 = 62 * (0.9 + 0.2 * hash01(k, 3)), k2 = 13.5;
        const wob = 2.5 * (1 - this.crystal);
        ax = (px + Math.sin(t * 0.6 + k * 1.7) * wob - b.x) * k1 - b.vx * k2;
        ay = (py + Math.cos(t * 0.5 + k * 2.3) * wob - b.y) * k1 - b.vy * k2;
      } else {
        // free drift: wander + weak centering + soft Lloyd toward its own
        // cell's pole — the hive reading its field.
        // A field's members drift calmer than the page: alive, not restless.
        // A hovered one holds still — you are holding it, and the shard it
        // pushes through the border should not wander out from under you.
        const calm = this.style.calm * (1 - b.hoverMix);
        b.wanderPhase += (Math.sin(t * 0.7 + k * 2.1) + Math.sin(t * 1.31 + k * 0.73)) * 0.9 * dt;
        ax = Math.cos(b.wanderPhase) * 46 * calm - b.vx * 1.4;
        ay = Math.sin(b.wanderPhase) * 46 * calm - b.vy * 1.4;
        ax += (W / 2 - b.x) * 0.06 + (b.anchorX - b.x) * 0.9;
        ay += (H / 2 - b.y) * 0.06 + (b.anchorY - b.y) * 0.9;
      }
      b.vx += ax * dt; b.vy += ay * dt;
      const sp = Math.hypot(b.vx, b.vy), maxSp = b.path ? 900 : 130 * this.style.calm;
      if (sp > maxSp) { b.vx *= maxSp / sp; b.vy *= maxSp / sp; }
      b.x += b.vx * dt; b.y += b.vy * dt;
    }
  }

  // Bodies push apart while the field is liquid, so a traveller never wedges
  // between two neighbours. Once the lattice locks there is nothing to push
  // and pushing would only spoil the grid.
  separate(dt) {
    if (this.crystal > 0.995) return;
    const bodies = this.bodies, drag = this.drag;
    let claimSum = 0;
    for (const b of bodies) claimSum += b.claim;
    const areaPer = (this.W * this.H) / Math.max(1e-9, claimSum);
    const rad = bodies.map(b => Math.sqrt(b.claim * areaPer / Math.PI));
    const F = 2600 * (1 - this.crystal);
    for (let i = 0; i < bodies.length; i++) {
      const A = bodies[i];
      for (let j = i + 1; j < bodies.length; j++) {
        const B = bodies[j];
        const R = 0.85 * (rad[i] + rad[j]);
        const dx = B.x - A.x, dy = B.y - A.y, d = Math.hypot(dx, dy);
        if (d > 1e-6 && d < R) {
          const f = F * (1 - d / R) * dt / d;
          if (A !== drag.body) { A.vx -= dx * f; A.vy -= dy * f; }
          if (B !== drag.body) { B.vx += dx * f; B.vy += dy * f; }
        }
      }
    }
  }

  // Preconditions for the seeds that reach the solve — strictly inside the
  // domain, pairwise distinct — enforced on the BODY, so a formation moves as
  // one. Its own seeds are distinct by construction: they only enter the
  // field once the crystal fraction has spread them past the minimum.
  enforcePreconditions() {
    const bodies = this.bodies, drag = this.drag, W = this.W, H = this.H;
    const poly = this.domainPolyActive();
    let cx = W / 2, cy = H / 2;
    if (poly) { cx = 0; cy = 0; for (const p of poly) { cx += p[0]; cy += p[1]; } cx /= poly.length; cy /= poly.length; }
    for (const b of bodies) {
      b.x = Math.min(W - SEED_MARGIN, Math.max(SEED_MARGIN, b.x));
      b.y = Math.min(H - SEED_MARGIN, Math.max(SEED_MARGIN, b.y));
      if (poly && !pointInPolygon(b.x, b.y, poly)) {
        // the box is not the domain: a body in a corner the cell does not
        // reach walks back toward the middle until it is inside
        for (let k = 0; k < 6 && !pointInPolygon(b.x, b.y, poly); k++) { b.x += (cx - b.x) * 0.5; b.y += (cy - b.y) * 0.5; }
        if (!pointInPolygon(b.x, b.y, poly)) { b.x = cx; b.y = cy; }
        b.vx *= 0.5; b.vy *= 0.5;
      }
    }
    for (let i = 0; i < bodies.length; i++) {
      for (let j = i + 1; j < bodies.length; j++) {
        const A = bodies[i], B = bodies[j];
        let dx = B.x - A.x, dy = B.y - A.y, d = Math.hypot(dx, dy);
        if (d < SEED_MIN_SEP) {
          if (d < 1e-6) { dx = 1; dy = 0; d = 1; }
          const push = (SEED_MIN_SEP - d) / 2 / d;
          if (A !== drag.body) { A.x -= dx * push; A.y -= dy * push; }
          if (B !== drag.body) { B.x += dx * push; B.y += dy * push; }
        }
      }
    }
  }

  easeClaims(dt, t) {
    const k = 1 - Math.exp(-6 * dt);
    for (const b of this.bodies) {
      const hovered = b.id === this.hoveredId;
      const hm = 1 - Math.exp(-(hovered ? 10 : 5) * dt);
      b.hoverMix += ((hovered ? 1 : 0) - b.hoverMix) * hm;
      if (b.journey && b.path) {
        // size travels with position: the same eased progress
        b.claim = b.claim0 + (b.claimTarget - b.claim0) * b.progress;
      } else {
        let target = b.claimTarget;
        if (!b.rect && !b.isVoid && !b.leaving) target *= 1 + 0.05 * Math.sin(t * 0.8 + (b.id + this.shift) * 2.9);
        b.claim += (target - b.claim) * k;
      }
      if (b.claim < CLAIM_MIN) b.claim = CLAIM_MIN;
    }
  }

  // Seeds are PLACED, not integrated: the body's position plus its formation
  // offsets scaled by the crystal fraction, and the body's claim shared out
  // the same way. Melted, every element is one seed holding its whole claim —
  // a single smooth convex cell, nothing to segment. Crystallised, the
  // offsets are exact lattice slots and the union is the exact rectangle.
  // Everything between is one continuous interpolation of the same numbers.
  placeSeeds() {
    const crystal = this.crystal;
    for (const b of this.bodies) {
      const n = b.subs.length;
      // hover only reshapes the field while the page is liquid; a locked
      // element lights up instead of reflowing its neighbours
      const hover = 1 + (config.hoverBoost - 1) * b.hoverMix * (1 - crystal);
      const coreShare = n - (n - 1) * crystal;          // n when melted, 1 when locked
      const otherShare = Math.max(CLAIM_MIN, crystal);  // ~0 when melted, 1 when locked
      for (let i = 0; i < n; i++) {
        const s = b.subs[i];
        s.x = b.x + b.offs[i][0] * crystal;
        s.y = b.y + b.offs[i][1] * crystal;
        // A lattice seed joins the field only once the crystal has spread it
        // a real distance from the core. Its floor share scales with the
        // body's claim, so a big claim melted into a small formation could
        // otherwise push a seed over the entry gate while it still sits on
        // the core — two coincident seeds, two identical cells, an overlap.
        const spread = i === b.core ? Infinity : crystal * Math.hypot(b.offs[i][0], b.offs[i][1]);
        s.claim = spread >= SEED_MIN_SEP ? b.claim * hover * (i === b.core ? coreShare : otherShare) / n : 0;
      }
    }
  }

  // --- the solve --------------------------------------------------------

  domainPts() {
    const poly = this.domainPolyActive();
    let x0 = 0, y0 = 0, x1 = this.W, y1 = this.H;
    if (poly) for (const p of poly) { x0 = Math.min(x0, p[0]); y0 = Math.min(y0, p[1]); x1 = Math.max(x1, p[0]); y1 = Math.max(y1, p[1]); }
    return [[x0, y0], [x1, y0], [x1, y1], [x0, y1]];
  }
  domainPolyActive() { return this.crystal === 0 && this.domainPoly ? this.domainPoly : null; }

  // One solve, warm, exact; skipped when nothing moved. Only seeds worth
  // something enter the field. While the page is liquid a body's lattice
  // seeds sit at the claim floor and stay out, so travel solves ~one seed per
  // element; they fade in as the crystal spreads them, each carving a cell
  // interior to its own body, where the seam hides it.
  solve() {
    const subs = [];
    for (const b of this.bodies) for (const s of b.subs) subs.push(s);
    const active = subs.filter(s => s.claim >= ACTIVE_MIN);
    if (active.length < 2) { this.solved = null; this.solvedSubs = []; this.ownerOf = []; this.lastSig = null; return; }
    const seeds = active.map(s => [s.x, s.y]);
    const claims = active.map(s => s.claim);
    const domain = this.domainPolyActive();
    this.exact = this.domainIsCell !== false && (!this.domainPoly || !!domain);   // false: solved on a box that is not the cell
    let sig = active.length + '|' + (this.W * 8 | 0) + 'x' + (this.H * 8 | 0) + '|' + (domain ? this.domainSig : '') + '|';
    for (let i = 0; i < active.length; i++) sig += (seeds[i][0] * 8 | 0) + ',' + (seeds[i][1] * 8 | 0) + ',' + (claims[i] * 1e4 | 0) + ';';
    if (sig === this.lastSig && this.solved && this.solved.converged) return;
    const t0 = performance.now();
    // Newton amortized across frames: at most 2 iterations per frame, warm
    // weights carried forward, so a hard mid-transition solve costs a few
    // frames of small area error (the meter shows it) instead of one 60 ms
    // frame. The diagram is watertight at every step regardless; at rest
    // this converges to 1e-6 within a frame or two and then costs nothing.
    const sol = solveWeights(seeds, claims, this.domainPts(), active.map(s => s.w), { maxIter: 2, domain });
    this.solveMs = performance.now() - t0;
    this.lastIters = sol.iterations;
    active.forEach((s, i) => { s.w = sol.weights[i]; });
    this.solved = sol;
    this.solvedSubs = active;
    this.ownerOf = active.map(s => s.body.id);
    this.lastSig = sig;
  }

  // --- the frame --------------------------------------------------------

  // The parent calls this with the cell this hive lives in, every frame.
  // The parent hands over the cell this hive lives in, as a polygon in the
  // parent's px (already inset by the padding). A rectangle is the plain
  // domain; anything else — a travelling blob, a border with a shard
  // through it — is the solve's non-convex domain, exact, when the interior
  // is organic. A grid inside stretches to the box instead and the parent's
  // border clips it: rectangles cannot follow a curve, and need not.
  // frame: [x, y, w, h], the box this hive's coordinates live in — the
  // content box of its rectangle once the page is locked, the outline's box
  // while it travels. poly: the domain, which may reach OUTSIDE the frame
  // when a shard has pushed through the border; the frame does not follow
  // it, so nothing inside shifts when the border yields.
  fit(frame, poly, stable, parentAbsX, parentAbsY) {
    const [x0, y0, w, h] = frame;
    this.ox = x0; this.oy = y0;
    this.absX = parentAbsX + x0; this.absY = parentAbsY + y0;
    this.stable = stable;
    if (Math.abs(w - this.W) > 1e-9 || Math.abs(h - this.H) > 1e-9) this.setSize(w, h);
    const isRect = poly.length === 4 && poly.every(p => (Math.abs(p[0] - x0) < 1e-6 || Math.abs(p[0] - x0 - w) < 1e-6) && (Math.abs(p[1] - y0) < 1e-6 || Math.abs(p[1] - y0 - h) < 1e-6));
    if (isRect) { this.domainPoly = null; this.domainSig = ''; return; }
    this.domainPoly = poly.map(p => [p[0] - x0, p[1] - y0]);
    let sig = '';
    for (const p of this.domainPoly) sig += (p[0] * 8 | 0) + ',' + (p[1] * 8 | 0) + ';';
    this.domainSig = sig;
  }

  // A field's cell this frame, as a polygon in this hive's px: its outline,
  // returned as the exact rectangle whenever the outline IS its rectangle
  // (locked, arrived, and nothing nearby retiring or pressing).
  cellPoly(b) {
    if (!b.loops || !b.loops.length) return null;
    let big = b.loops[0], bigA = Math.abs(ringArea(big));
    for (const l of b.loops) { const a = Math.abs(ringArea(l)); if (a > bigA) { bigA = a; big = l; } }
    if (this.crystal === 1 && b.rect && b.progress >= 0.999 && big.length === 4) {
      const x0 = b.rect[0] * this.PW, y0 = b.rect[1] * this.PH, x1 = b.rect[2] * this.PW, y1 = b.rect[3] * this.PH;
      const near = (v, t) => Math.abs(v - t) < 0.05;
      if (big.every(p => (near(p[0], x0) || near(p[0], x1)) && (near(p[1], y0) || near(p[1], y1)))) return [[x0, y0], [x1, y0], [x1, y1], [x0, y1]];
    }
    return big;
  }

  step(dt, t) {
    this.t = t;
    // a pending re-layout waits for stillness: the cell locked, no drag, and
    // the size quiet for a moment — content reflows when the card has landed
    if (this.layoutAt >= 0 && this.stable && !this.drag.body && t - this.layoutAt > 0.15) {
      this.layoutAt = -1;
      this.relayout();
    }
    this.reap();

    // 1. the hive moves — one spring per body, whatever its slot count
    this.steer(dt, t);
    this.separate(dt);
    this.enforcePreconditions();
    this.easeClaims(dt, t);

    // 2. crystal: the lattice locks in only when the whole page has arrived
    // and nothing is being dragged. Any disturbance melts it back to one seed
    // per element — organic while it travels, exact once it lands. Melting is
    // quick (you touch it, it goes liquid); locking is gentle (it settles).
    const seated = this.bodies.filter(b => b.rect && !b.leaving);
    const settled = seated.length > 0 && !this.drag.body && seated.every(b => b.progress >= 0.999);
    this.crystalTarget = settled ? 1 : 0;
    const step = dt / (this.crystalTarget > this.crystal ? 0.55 : 0.13);   // lock 0.55 s, melt 0.13 s
    this.crystal += Math.max(-step, Math.min(step, this.crystalTarget - this.crystal));
    this.crystal = Math.max(0, Math.min(1, this.crystal));
    // a locked lattice sits exactly on its slots, so the grid is exact
    if (this.crystal === 1) for (const b of seated) { b.x = b.path.ex; b.y = b.path.ey; b.vx = 0; b.vy = 0; }

    // 3. the field condenses
    this.placeSeeds();
    this.solve();
    this.computeOutlines();

    // 4. the fields: each one told the size of its cell, then run in full.
    // Nothing flows back up — the page's tessellation is settled before any
    // field looks at it, and a field cannot reshape the cell it lives in.
    for (const b of this.bodies) {
      if (!b.hive) continue;
      const cell = this.cellPoly(b);
      if (!cell) { b.hive.dormant = true; continue; }
      // the frame: the cell's box; the cell is exactly a rectangle when locked
      let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
      for (const p of cell) { x0 = Math.min(x0, p[0]); y0 = Math.min(y0, p[1]); x1 = Math.max(x1, p[0]); y1 = Math.max(y1, p[1]); }
      const locked = cell.length === 4 && cell.every(p => (p[0] === x0 || p[0] === x1) && (p[1] === y0 || p[1] === y1));
      // no padding: the cell IS the hive inside's whole world, so a member
      // at the edge meets the neighbour across the one gap, like any cell
      if (x1 - x0 < 48 || y1 - y0 < 48) { b.hive.dormant = true; continue; }
      const frame = [x0, y0, x1 - x0, y1 - y0];
      const box = [[x0, y0], [x1, y0], [x1, y1], [x0, y1]];
      const dom = locked ? box : domainFor(cell, 0, box);
      b.hive.dormant = false;
      b.hive.fit(frame, dom, this.crystal === 1, this.absX, this.absY);
      b.hive.domainIsCell = locked || dom !== box;   // false: the clipper could not take the cell, the box stands in
      b.hive.step(dt, t);
    }

    // 5. the shards: the voronoi conquers the rectangle
    this.computeShards();
  }

  // SHARDS. A member asking for more than its rest share (hover, drag) does
  // not negotiate with the page — there are no two sides here. It bids ONE-
  // SIDED: against every page seed at its frozen weight, with a weight of its
  // own that starts at a tie on the content box's edge and grows with the
  // pressure. The region it wins is cut by its siblings' bisectors (its own
  // auction's weights, so it attaches seamlessly to its inner cell) and by
  // the page seeds' bisectors — true Voronoi facets — minus the box. A few
  // vertices. The rectangle yields by difference and never pushes back: its
  // claim stays exact in the auction underneath, and the area carved out of
  // it is metered, not hidden. Zero pressure, zero shard: rest is untouched.
  computeShards() {
    this.shards = [];
    if (!this.solved || this.crystal < 1) return;
    const subs = this.solvedSubs, w = this.solved.weights;
    const pageBid = (x, y) => {
      let m = Infinity;
      for (let k = 0; k < subs.length; k++) { const dx = x - subs[k].x, dy = y - subs[k].y; const v = dx * dx + dy * dy - w[k]; if (v < m) m = v; }
      return m;
    };
    const pot = new Float64Array(subs.length);
    for (let k = 0; k < subs.length; k++) pot[k] = subs[k].x * subs[k].x + subs[k].y * subs[k].y - w[k];
    for (const b of this.bodies) {
      const h = b.hive;
      if (!h || h.dormant || h.crystal !== 0 || !h.solved || !b.rect) continue;
      const rect = [b.rect[0] * this.PW, b.rect[1] * this.PH, b.rect[2] * this.PW, b.rect[3] * this.PH];
      const box = rect;
      const kids = h.solvedSubs, kw = h.solved.weights;
      for (let i = 0; i < kids.length; i++) {
        const m = kids[i].body;
        if (m.isVoid || m.hoverMix < 0.02) continue;
        const cell = h.solved.diagram.cells[i];
        if (!cell || cell.pts.length < 3) continue;
        const sx = kids[i].x + h.ox, sy = kids[i].y + h.oy;
        // the tie: along the stretch of the box's edge this cell touches, the
        // smallest weight at which the member wins a point of the page
        let W0 = Infinity;
        for (let k = 0, n = cell.pts.length; k < n; k++) {
          if (cell.labs[k] >= 0) continue;                       // an edge with a sibling, not the wall
          const p = cell.pts[k], q = cell.pts[k + 1 === n ? 0 : k + 1];
          for (let t = 0; t <= 8; t++) {
            const u = t / 8, x = h.ox + p[0] + (q[0] - p[0]) * u, y = h.oy + p[1] + (q[1] - p[1]) * u;
            const v = (x - sx) * (x - sx) + (y - sy) * (y - sy) - pageBid(x, y);
            if (v < W0) W0 = v;
          }
        }
        if (!isFinite(W0)) continue;                               // the cell does not touch the box's edge
        // pressure is a DEPTH — how far past the field's edge the shard's tip
        // reaches, half the cell's own scale at the hover slider's full boost.
        // The weight that buys it depends on which frozen seeds stand in the
        // way, so find it by bisection; the shard's own walls may close it
        // off sooner, and then the pressure saturates.
        const scale = (config.hoverBoost - 1) * 0.5 * Math.sqrt(h.solved.diagram.areas[i]);
        const depth = m.hoverMix * scale;
        if (!(depth > 0)) continue;
        const sibHp = [];
        for (let j = 0; j < kids.length; j++) {
          if (j === i) continue;
          const jx = kids[j].x + h.ox, jy = kids[j].y + h.oy;
          sibHp.push([jx - sx, jy - sy, ((jx * jx + jy * jy - kw[j]) - (sx * sx + sy * sy - kw[i])) / 2]);
        }
        const region = (P) => {
          const potM = sx * sx + sy * sy - (W0 + P);
          let poly = { pts: this.domainPts(), labs: [-1, -2, -3, -4] };
          for (const [ax, ay, bb] of sibHp) { if (poly.pts.length < 3) break; poly = clipHalfPlane(poly, ax, ay, bb, -5); }
          for (let k = 0; k < subs.length && poly.pts.length >= 3; k++) poly = clipHalfPlane(poly, subs[k].x - sx, subs[k].y - sy, (pot[k] - potM) / 2, -6);
          return poly.pts.length >= 3 ? poly : null;
        };
        // minus the field's rectangle: the eight convex pieces around it (a
        // 3x3 less its centre), so neighbouring pieces share an edge exactly
        // and chain back into one outline
        const minus = (poly, bx) => {
          const pieces = [];
          const cut = (hp) => { let q = poly; for (const [ax, ay, bb] of hp) { if (q.pts.length < 3) break; q = clipHalfPlane(q, ax, ay, bb, -7); } if (q.pts.length >= 3) pieces.push(q); };
          const L = [1, 0, bx[0]], R = [-1, 0, -bx[2]], T = [0, 1, bx[1]], B = [0, -1, -bx[3]];
          const M = [[-1, 0, -bx[0]], [1, 0, bx[2]]], V = [[0, -1, -bx[1]], [0, 1, bx[3]]];
          cut([L, T]); cut([...M, T]); cut([R, T]);
          cut([L, ...V]); cut([R, ...V]);
          cut([L, B]); cut([...M, B]); cut([R, B]);
          return pieces;
        };
        const reach = (poly) => {
          let d = 0;
          if (poly) for (const q of poly.pts) d = Math.max(d, rect[0] - q[0], q[0] - rect[2], rect[1] - q[1], q[1] - rect[3]);
          return d;
        };
        let dNear = Infinity;
        for (let k = 0; k < subs.length; k++) dNear = Math.min(dNear, Math.hypot(subs[k].x - sx, subs[k].y - sy));
        const shardAt = (want) => {
          let lo = 0, hi = 8 * dNear * (want + (rect[2] - rect[0]) / 6);
          let poly = region(hi);
          if (reach(poly) > want) {
            for (let it = 0; it < 14; it++) {
              const mid = (lo + hi) / 2, pm = region(mid);
              if (reach(pm) >= want) { hi = mid; poly = pm; } else lo = mid;
            }
          }
          if (!poly) return null;
          const pieces = minus(poly, box);
          if (!pieces.length) return null;
          return { poly, pieces };
        };
        const shown = shardAt(depth);
        if (!shown) continue;
        let beyond = 0;
        for (const pc of shown.pieces) beyond += Math.abs(ringArea(pc.pts));
        // the shard: the region the member wins beyond its field, in this
        // hive's px. The picture joins it to the member's cell and cuts it
        // out of whatever it lies over; nothing else needs to know.
        this.shards.push({ field: b, member: m, F: shown.poly.pts, pieces: shown.pieces, beyond, hv: m.hoverMix });
      }
    }
  }

  // Hit-test in this hive's px: the bid run backward on this frame's truth.
  hitTest(x, y) {
    if (!this.solved) return -1;
    if (!this.domainPoly && (x < 0 || y < 0 || x > this.W || y > this.H)) return -1;
    let best = Infinity, id = -1;
    const subs = this.solvedSubs, w = this.solved.weights;
    for (let i = 0; i < subs.length; i++) {
      const s = subs[i];
      const dx = x - s.x, dy = y - s.y;
      const bid = dx * dx + dy * dy - w[i];
      if (bid < best) { best = bid; id = s.body.isVoid ? -1 : s.body.id; }
    }
    return id;
  }

  // The chain of bodies under a point, outermost first: the page's element,
  // then the member inside it, and so on down.
  hitPath(x, y) {
    const id = this.hitTest(x, y);
    if (id < 0) return [];
    const b = this.bodies.find(bb => bb.id === id);
    if (!b) return [];
    const path = [{ hive: this, body: b }];
    if (b.hive && !b.hive.dormant) path.push(...b.hive.hitPath(x - b.hive.ox, y - b.hive.oy));
    return path;
  }

  walk(fn) {
    fn(this);
    for (const b of this.bodies) if (b.hive) b.hive.walk(fn);
  }

  // One pass over the frame's tessellation: every body's union outline,
  // reduced to its real corners, holes dropped. The fields and the garment
  // both read it, so they cannot disagree about a body's shape.
  computeOutlines() {
    for (const b of this.bodies) { b.loops = null; b.holes = null; b.bigSeed = -1; }
    if (!this.solved) { this.rectPct = 100; return; }
    const cells = this.solved.diagram.cells, areas = this.solved.diagram.areas;
    const idx = new Map();
    this.solvedSubs.forEach((s, i) => { if (!idx.has(s.body)) idx.set(s.body, []); idx.get(s.body).push(i); });
    let axisLen = 0, totalLen = 0;
    for (const [b, subIdx] of idx) {
      const loops = bodyOutlines(subIdx, cells, this.ownerOf, b.id).map(l => simplifyLoop(l)).filter(l => l.length >= 3);
      const la = loops.map(l => Math.abs(ringArea(l)));
      const cen = loops.map(l => { let x = 0, y = 0; for (const p of l) { x += p[0]; y += p[1]; } return [x / l.length, y / l.length]; });
      const hole = loops.map((l, i) => loops.some((o, j) => j !== i && la[j] > la[i] && pointInPolygon(cen[i][0], cen[i][1], o)));
      b.loops = loops.filter((l, i) => !hole[i]);
      b.holes = loops.filter((l, i) => hole[i]);
      b.bigSeed = subIdx.reduce((a, i) => cells[i] && areas[i] > areas[a] ? i : a, subIdx[0]);
      for (const loop of b.loops) {
        for (let k = 0; k < loop.length; k++) {
          const p = loop[k], q = loop[(k + 1) % loop.length];
          const dx = Math.abs(q[0] - p[0]), dy = Math.abs(q[1] - p[1]), L = Math.hypot(dx, dy);
          totalLen += L; if (Math.min(dx, dy) < 0.05) axisLen += L;
        }
      }
    }
    this.rectPct = totalLen > 0 ? 100 * axisLen / totalLen : 100;
  }

  // --- the leaves -------------------------------------------------------
  // The picture is the tree's leaves: every cell that is not a field, as
  // convex pieces in root px with the chain of bodies it belongs to. A field
  // contributes nothing of its own — its members are the leaves, and their
  // aligned outer edges are its rectangle. One list, one dressing, one gap.
  collectLeaves(out, ox, oy, fade) {
    if (!this.solved) return;
    const cells = this.solved.diagram.cells;
    const idx = new Map();
    this.solvedSubs.forEach((s, i) => { if (!idx.has(s.body)) idx.set(s.body, []); idx.get(s.body).push(i); });
    for (const [b, subIdx] of idx) {
      const f = fade * Math.max(0, Math.min(1, (b.claim - CLAIM_MIN) / 0.14));
      const h = b.hive;
      const own = () => {
        const pieces = [];
        for (const i of subIdx) {
          const c = cells[i];
          for (const pc of (c.pieces || [c])) if (pc.pts.length >= 3) pieces.push({ pts: pc.pts.map(p => [p[0] + ox, p[1] + oy]), labs: pc.labs });
        }
        return pieces;
      };
      if (h && !h.dormant && h.solved) {
        const n0 = out.length;
        h.collectLeaves(out, ox + h.ox, oy + h.oy, f);
        if (out.length > n0) {
          const big = this.cellPoly(b);
          const cellPoly = big && big.length >= 3 ? big.map(p => [p[0] + ox, p[1] + oy]) : null;
          // a grid inside a travelling cell was solved on its box: keep it to
          // the cell itself, whatever shape the cell is in this frame
          const tris = !h.exact && cellPoly ? triangulate(simplifyLoop(cellPoly)) : null;
          const hull = !h.exact && cellPoly && !tris ? convexHull(cellPoly) : null;
          // a hole in the cell (a foreign cell a melting formation encloses
          // for a frame) is not the hive's ground: cut it out of its leaves
          const holes = [];
          if (b.holes) for (const hl of b.holes) { const t = triangulate(simplifyLoop(hl)); if (t) for (const tri of t) holes.push(tri); }
          for (let k = n0; k < out.length; k++) {
            out[k].path.unshift({ hive: this, body: b });
            if (tris) out[k].pieces = clipPiecesToTriangles(out[k].pieces, tris);
            else if (hull) out[k].pieces = clipPieces(out[k].pieces, hull);
            for (const tri of holes) {
              const poly = triPoly(tri, ox, oy);
              if (!poly) continue;
              const cut = subtractConvex(out[k].pieces, poly);
              if (cut) out[k].pieces = cut;
            }
          }
          // mid-ramp a cell can be in two pieces for a frame; the hive inside
          // lives in the largest, and what is left is still this body's ink
          if (cellPoly && b.loops && b.loops.length > 1) {
            const stray = own().filter(pc => { let x = 0, y = 0; for (const q of pc.pts) { x += q[0]; y += q[1]; } return !pointInPolygon(x / pc.pts.length, y / pc.pts.length, cellPoly); });
            if (stray.length) out.push({ path: [{ hive: this, body: b }], body: b, color: b.color, hv: b.hoverMix, fade: f, isVoid: b.isVoid, labels: false, pieces: stray, loops: null, touched: false });
          }
          continue;
        }
      }
      const pieces = own();
      if (!pieces.length) continue;
      out.push({ path: [{ hive: this, body: b }], body: b, color: b.color, hv: b.hoverMix, fade: f, isVoid: b.isVoid, labels: this.style.labels, pieces, loops: null, touched: false });
    }
  }

  // Every shard in the tree, in root px.
  collectShards(out, ox, oy) {
    for (const sh of this.shards) {
      out.push({ member: sh.member, hv: sh.hv, beyond: sh.beyond,
        F: sh.F.map(p => [p[0] + ox, p[1] + oy]),
