        pieces: sh.pieces.map(pc => ({ pts: pc.pts.map(p => [p[0] + ox, p[1] + oy]), labs: pc.labs })) });
    }
    for (const b of this.bodies) if (b.hive && !b.hive.dormant) b.hive.collectShards(out, ox + b.hive.ox, oy + b.hive.oy);
  }
}

/* ============================================================== THE PICTURE
 * Display only, and one path for everything on screen. The leaves are
 * gathered, the shards are joined to their members and cut out of whatever
 * they lie over, every leaf is chained into its outline, and every outline
 * is dressed the same way: inset by half the gap, rounded, filled, stroked,
 * numbered. Hit-testing and the gap meter read the same leaves.
 */

function convexHull(pts) {
  if (pts.length < 3) return pts.slice();
  const p = pts.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
  const lo = [];
  for (const q of p) { while (lo.length >= 2 && cross(lo[lo.length - 2], lo[lo.length - 1], q) <= 0) lo.pop(); lo.push(q); }
  const hi = [];
  for (let i = p.length - 1; i >= 0; i--) { const q = p[i]; while (hi.length >= 2 && cross(hi[hi.length - 2], hi[hi.length - 1], q) <= 0) hi.pop(); hi.push(q); }
  lo.pop(); hi.pop();
  const h = lo.concat(hi);
  return h.length >= 3 ? h : pts.slice();
}

// A convex polygon as inward half-planes in clipHalfPlane's form.
function halfPlanes(poly) {
  const o = ringArea(poly) > 0 ? 1 : -1, hp = [];
  for (let k = 0, n = poly.length; k < n; k++) {
    const p = poly[k], q = poly[(k + 1) % n];
    hp.push([o * (q[1] - p[1]), -o * (q[0] - p[0]), o * ((q[1] - p[1]) * p[0] - (q[0] - p[0]) * p[1])]);
  }
  return hp;
}

function clipPieces(pieces, convex) {
  const hp = halfPlanes(convex), out = [];
  for (let pc of pieces) {
    for (const [ax, ay, b] of hp) { if (pc.pts.length < 3) break; pc = clipHalfPlane(pc, ax, ay, b, -8); }
    if (pc.pts.length >= 3) out.push(pc);
  }
  return out;
}

// A triangle from triangulate() back as a polygon, translated: the three
// vertices are the intersections of its half-planes.
function triPoly(tri, ox, oy) {
  const pts = [];
  for (let e = 0; e < 3; e++) {
    const a = tri[e], b = tri[(e + 1) % 3];
    const det = a.ax * b.ay - a.ay * b.ax;
    if (Math.abs(det) < 1e-12) return null;
    pts.push([(a.b * b.ay - b.b * a.ay) / det + ox, (a.ax * b.b - b.ax * a.b) / det + oy]);
  }
  return pts;
}

// pieces kept to a simple polygon, given triangulated: each piece is cut by
// every triangle and the bits share their edges exactly, so they chain back.
function clipPiecesToTriangles(pieces, tris) {
  const out = [];
  for (const pc of pieces) {
    for (const tri of tris) {
      let q = pc;
      for (let e = 0; e < 3 && q.pts.length >= 3; e++) q = clipHalfPlane(q, tri[e].ax, tri[e].ay, tri[e].b, -8);
      if (q.pts.length >= 3 && Math.abs(ringArea(q.pts)) > 1e-6) out.push(q);
    }
  }
  return out;
}

// pieces minus a convex polygon F: a piece F does not reach is kept as it
// is; one it does is replaced by the wedges outside F's edges — outside edge
// k and inside edges 0..k-1 — which are disjoint, convex, and share their
// edges exactly. Returns null when nothing was cut.
function subtractConvex(pieces, F) {
  const hp = halfPlanes(F);
  let changed = false;
  const out = [];
  for (const pc of pieces) {
    let inside = pc;
    for (const [ax, ay, b] of hp) { if (inside.pts.length < 3) break; inside = clipHalfPlane(inside, ax, ay, b, -8); }
    if (inside.pts.length < 3 || Math.abs(ringArea(inside.pts)) < 1e-6) { out.push(pc); continue; }
    changed = true;
    for (let k = 0; k < hp.length; k++) {
      let q = clipHalfPlane(pc, -hp[k][0], -hp[k][1], -hp[k][2], -8);
      for (let j = 0; j < k && q.pts.length >= 3; j++) q = clipHalfPlane(q, hp[j][0], hp[j][1], hp[j][2], -8);
      if (q.pts.length >= 3 && Math.abs(ringArea(q.pts)) > 1e-6) out.push(q);
    }
  }
  return changed ? out : null;
}

// Where one piece's vertex sits on another piece's edge, split the edge
// there, so a union of pieces chains by exact reverse edges.
function splitAtVertices(pieces) {
  const verts = [];
  for (const pc of pieces) for (const v of pc.pts) verts.push(v);
  return pieces.map(pc => {
    const pts = [], labs = [], n = pc.pts.length;
    for (let k = 0; k < n; k++) {
      const a = pc.pts[k], b = pc.pts[(k + 1) % n];
      pts.push(a); labs.push(pc.labs[k]);
      const ex = b[0] - a[0], ey = b[1] - a[1], L2 = ex * ex + ey * ey;
      if (L2 < 1e-12) continue;
      const cuts = [];
      for (const v of verts) {
        const t = ((v[0] - a[0]) * ex + (v[1] - a[1]) * ey) / L2;
        if (t <= 1e-7 || t >= 1 - 1e-7) continue;
        const px = a[0] + t * ex - v[0], py = a[1] + t * ey - v[1];
        if (px * px + py * py < 1e-8) cuts.push([t, v]);
      }
      cuts.sort((u, v) => u[0] - v[0]);
      let last = -1;
      for (const [t, v] of cuts) { if (t - last < 1e-7) continue; pts.push(v); labs.push(pc.labs[k]); last = t; }
    }
    return { pts, labs };
  });
}

// Chain a leaf's pieces into its outline(s): real corners only, holes dropped.
function leafOutlines(pieces) {
  const loops = unionOutlines(splitAtVertices(pieces)).map(l => simplifyLoop(l.pts, 0.05, 1e-5)).filter(l => l.length >= 3);
  const areas = loops.map(l => Math.abs(ringArea(l)));
  const cen = loops.map(l => { let x = 0, y = 0; for (const p of l) { x += p[0]; y += p[1]; } return [x / l.length, y / l.length]; });
  return loops.filter((l, i) => !loops.some((o, j) => j !== i && areas[j] > areas[i] && pointInPolygon(cen[i][0], cen[i][1], o)));
}

// The frame's picture: leaves gathered, shards applied, outlines chained.
function buildPicture(root) {
  const leaves = [];
  root.collectLeaves(leaves, 0, 0, 1);
  const shards = [];
  root.collectShards(shards, 0, 0);
  // Strongest first. Where two shards meet, the stronger keeps the ground:
  // each shard is reduced by every stronger one before it joins its member
  // or cuts anyone, so shards never overlap and never leave a hole.
  shards.sort((a, b) => b.hv - a.hv || a.member.id - b.member.id);
  const done = [];
  for (const sh of shards) {
    let eff = [{ pts: sh.F, labs: sh.F.map(() => -9) }], mine = sh.pieces;
    for (const F of done) {
      eff = subtractConvex(eff, F) || eff;
      mine = subtractConvex(mine, F) || mine;
    }
    done.push(sh.F);
    const owner = leaves.find(l => l.body === sh.member);
    if (owner) { owner.pieces.push(...mine); owner.touched = true; }
    for (const f of eff) {
      let fx0 = Infinity, fy0 = Infinity, fx1 = -Infinity, fy1 = -Infinity;
      for (const p of f.pts) { fx0 = Math.min(fx0, p[0]); fy0 = Math.min(fy0, p[1]); fx1 = Math.max(fx1, p[0]); fy1 = Math.max(fy1, p[1]); }
      for (const leaf of leaves) {
        if (leaf.body === sh.member) continue;
        let lx0 = Infinity, ly0 = Infinity, lx1 = -Infinity, ly1 = -Infinity;
        for (const pc of leaf.pieces) for (const p of pc.pts) { lx0 = Math.min(lx0, p[0]); ly0 = Math.min(ly0, p[1]); lx1 = Math.max(lx1, p[0]); ly1 = Math.max(ly1, p[1]); }
        if (lx1 < fx0 || lx0 > fx1 || ly1 < fy0 || ly0 > fy1) continue;
        const cut = subtractConvex(leaf.pieces, f.pts);
        if (cut) { leaf.pieces = cut; leaf.touched = true; }
      }
    }
  }
  let carved = 0;
  for (const sh of shards) carved += sh.beyond;
  for (const leaf of leaves) leaf.loops = leafOutlines(leaf.pieces);
  return { leaves, shards, carved };
}

// The chain of bodies under a point, from the picture: outermost first.
function hitLeaves(picture, x, y) {
  if (!picture) return null;
  for (const leaf of picture.leaves) {
    for (const loop of leaf.loops) if (pointInPolygon(x, y, loop)) return leaf.isVoid ? [] : leaf.path;
  }
  return null;
}

// Dress and paint every leaf the same way. ctx is in root px.
function paintPicture(ctx, picture, hoveredPath) {
  const halfGap = config.gap / 2, corner = config.cornerRadius;
  const anchorK = 1 - Math.exp(-9 / 60);
  const hoveredBody = hoveredPath && hoveredPath.length ? hoveredPath[hoveredPath.length - 1].body : null;
  const paint = (leaf) => {
    if (leaf.isVoid || !leaf.loops.length) return;
    const b = leaf.body, hv = leaf.hv, fade = leaf.fade;
    const inner = leaf.path[leaf.path.length - 1].hive;
    // A locked element cannot reflow its neighbours on hover — a real page
    // does not either — so it lifts instead, growing into its own gap.
    const lift = 0.5 * hv * inner.crystal;
    let bx0 = Infinity, by0 = Infinity, bx1 = -Infinity, by1 = -Infinity;
    for (const l of leaf.loops) for (const p of l) { bx0 = Math.min(bx0, p[0]); by0 = Math.min(by0, p[1]); bx1 = Math.max(bx1, p[0]); by1 = Math.max(by1, p[1]); }
    let big = leaf.loops[0], bigA = 0;
    for (const l of leaf.loops) { const a = Math.abs(ringArea(l)); if (a > bigA) { bigA = a; big = l; } }
    let poleR = 0, anchored = false;
    for (const loop of leaf.loops) {
      const rawPole = inscribedPole(loop, inner.absX + b.anchorX, inner.absY + b.anchorY);
      const inset = Math.min(halfGap * (1 - lift), 0.45 * rawPole.r);
      const pts = insetPolygon(loop, inset);
      if (pts.length < 3) continue;
      const pole = inscribedPole(pts, rawPole.x, rawPole.y);
      if (!anchored && loop === big) {
        b.anchorX += ((pole.x - inner.absX) - b.anchorX) * anchorK;
        b.anchorY += ((pole.y - inner.absY) - b.anchorY) * anchorK;
        poleR = pole.r; anchored = true;
      }
      ctx.save();
      roundedPath(ctx, pts, corner);
      ctx.clip();
      const grad = ctx.createLinearGradient(bx0, by0, bx1, by1);
      grad.addColorStop(0, shade(leaf.color, -14));
      grad.addColorStop(1, shade(leaf.color, -68));
      ctx.globalAlpha = (0.52 + 0.38 * hv) * fade;
      ctx.fillStyle = grad;
      ctx.fillRect(bx0, by0, bx1 - bx0, by1 - by0);
      ctx.globalAlpha = fade;
      roundedPath(ctx, pts, corner);
      ctx.strokeStyle = `rgba(255,255,255,${0.16 + 0.5 * hv})`;
      ctx.lineWidth = (1 + hv * 2.4) * 2;
      if (hv > 0.02) { ctx.shadowColor = `rgba(255,255,255,${0.45 * hv})`; ctx.shadowBlur = 16 * hv; }
      ctx.stroke();
      ctx.restore();
    }
    if (anchored && poleR > (leaf.labels ? 20 : 17)) {
      const ax = inner.absX + b.anchorX, ay = inner.absY + b.anchorY;
      ctx.save();
      ctx.fillStyle = '#fff';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      if (leaf.labels) {
        ctx.globalAlpha = 0.16 * fade;
        ctx.font = `700 ${Math.round(poleR * 1.4)}px system-ui, sans-serif`;
        ctx.fillText(String(b.id + 1), ax, ay);
        ctx.globalAlpha = (0.55 + 0.45 * hv) * fade;
        ctx.font = `500 ${Math.max(11, Math.min(14, poleR * 0.24))}px system-ui, sans-serif`;
        ctx.fillText(b.name, ax, ay + poleR * 0.62);
      } else {
        ctx.globalAlpha = 0.22 * fade;
        ctx.font = `700 ${Math.round(poleR * 0.8)}px system-ui, sans-serif`;
        ctx.fillText(String(b.id + 1), ax, ay);
      }
      ctx.restore();
    }
  };
  let hovered = null;
  for (const leaf of picture.leaves) { if (leaf.body === hoveredBody) hovered = leaf; else paint(leaf); }
  if (hovered) paint(hovered);
}



/* ============================================================== KERNEL LOOP */

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, dpr = 1;

const config = {
  count: 12,
  gap: 10,
  cornerRadius: 14,
  hoverBoost: 1.6,
  swirl: 0.45,
  stagger: 0.30,
  fieldDensity: 0.55,      // the share of elements that are galleries
  inner: 'flock',          // what a gallery's hive does: organic, or a grid of its own
  scene: 'bento',
};

const meterEls = {
  area: document.getElementById('mArea'),
  gap: document.getElementById('mGap'),
  over: document.getElementById('mOver'),
  rect: document.getElementById('mRect'),
  seeds: document.getElementById('mSeeds'),
  iter: document.getElementById('mIter'),
  inner: document.getElementById('mInner'),
};

// The page: the root hive. Every field is a hive inside one of its cells.
const root = new Hive({ depth: 0, minCount: 3, scene: config.scene, W: 320, H: 240 });

let dragHive = null;                 // the hive whose body is being dragged
let picture = null;                  // this frame's leaves — the one picture
let mouseX = -1e9, mouseY = -1e9;
let simTime = 0;
let raster = { gap: 0, over: 0 };
let frame = 0;

let lastT = 0;
function tick(nowMs) {
  const now = nowMs / 1000;
  let dt = lastT ? now - lastT : 1 / 60;
  lastT = now;
  if (dt > 0.05) dt = 0.05;
  simTime += dt;
  frame++;

  // 1-5. the page, and every hive inside it
  root.step(dt, simTime);

  // 6. the picture: leaves gathered, shards joined and cut, outlines chained
  picture = buildPicture(root);

  // 7. hover: the chain of bodies under the pointer, page first
  root.walk(h => { h.hoveredId = -1; });
  const path = hitLeaves(picture, mouseX, mouseY) || root.hitPath(mouseX, mouseY);
  for (const e of path) e.hive.hoveredId = e.body.id;
  canvas.style.cursor = dragHive ? 'grabbing' : (path.length ? 'grab' : 'default');

  // 8. the garment: one dressing for every leaf
  ctx.clearRect(0, 0, W, H);
  paintPicture(ctx, picture, path);

  // 9. meters — the page's own row, plus the worst of the fields. Gap and
  // overlap are measured on the picture itself, shards included.
  if (root.solved) {
    if (frame % 12 === 0) raster = rasterCheck(picture.leaves.flatMap(l => l.loops.map(pts => ({ pts }))), W, H);
    const errPct = root.solved.maxRelErr * 100;
    meterEls.area.textContent = errPct < 1e-4 ? errPct.toExponential(1) + '%' : errPct.toFixed(3) + '%';
    meterEls.area.className = errPct <= 1e-4 ? '' : 'bad';
    meterEls.gap.textContent = raster.gap + 'px²';
    meterEls.gap.className = raster.gap <= 64 ? '' : 'bad';
    meterEls.over.textContent = raster.over + 'px²';
    meterEls.over.className = raster.over <= 64 ? '' : 'bad';
    meterEls.rect.textContent = root.rectPct.toFixed(root.rectPct >= 99.95 ? 0 : 1) + '%';
    meterEls.rect.className = root.rectPct >= 99.95 ? '' : 'soft';
    const c = root.crystal;
    meterEls.seeds.textContent = root.solvedSubs.length + (c === 1 ? ' locked' : c === 0 ? ' liquid' : ' ' + Math.round(c * 100) + '%');
    meterEls.iter.textContent = root.lastIters + 'it ' + root.solveMs.toFixed(1) + 'ms';
    meterEls.iter.className = root.lastIters <= 10 ? '' : 'bad';
  }
  let fields = 0, innerErr = 0, innerMs = 0, innerLocked = 0;
  const carved = picture.carved;
  root.walk(h => {
    if (h.depth === 0 || h.dormant || !h.solved) return;
    fields++; innerMs += h.solveMs; innerErr = Math.max(innerErr, h.solved.maxRelErr);
    if (h.crystal === 1) innerLocked++;
  });
  if (fields) {
    const e = innerErr * 100;
    meterEls.inner.textContent = fields + (innerLocked ? ' (' + innerLocked + ' locked)' : '') + ' · err ' + (e < 1e-4 ? e.toExponential(1) : e.toFixed(3)) + '% · ' + innerMs.toFixed(1) + 'ms' + (carved > 0 ? ' · carved ' + Math.round(carved) + 'px²' : '');
    meterEls.inner.className = innerErr * 100 <= 1e-4 ? '' : 'bad';
  } else {
    meterEls.inner.textContent = '0';
    meterEls.inner.className = '';
  }

  requestAnimationFrame(tick);
}

/* --------------------------------------------------------------- I/O */

function resize() {
  const rect = canvas.parentElement.getBoundingClientRect();
  dpr = window.devicePixelRatio || 1;
  W = Math.max(320, rect.width);
  H = Math.max(240, rect.height);
  canvas.width = W * dpr; canvas.height = H * dpr;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  root.fit([0, 0, W, H], [[0, 0], [W, 0], [W, H], [0, H]], true, 0, 0);
}

function pointerPos(e) {
  const r = canvas.getBoundingClientRect();
  return [e.clientX - r.left, e.clientY - r.top];
}

canvas.addEventListener('pointermove', (e) => {
  [mouseX, mouseY] = pointerPos(e);
  if (dragHive) { dragHive.drag.px = mouseX - dragHive.absX; dragHive.drag.py = mouseY - dragHive.absY; }
});
canvas.addEventListener('pointerleave', () => { mouseX = -1e9; mouseY = -1e9; });
canvas.addEventListener('pointerdown', (e) => {
  const [x, y] = pointerPos(e);
  const path = hitLeaves(picture, x, y) || root.hitPath(x, y);
  if (!path.length) return;
  // a grab takes the innermost cell under the pointer — a member moves inside
  // its field, a plain element moves across the page; shift takes the page's
  // element whatever is inside it. Either way the hive it belongs to melts:
  // the dragged body becomes one seed and so does everything around it, so
  // it moves through a liquid field, not a rigid grid.
  const hit = e.shiftKey ? path[0] : path[path.length - 1];
  dragHive = hit.hive;
  dragHive.drag.body = hit.body;
  dragHive.drag.px = x - dragHive.absX; dragHive.drag.py = y - dragHive.absY;
  canvas.setPointerCapture(e.pointerId);
});
const endDrag = () => { if (dragHive) { dragHive.drag.body = null; dragHive = null; } };
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);

document.querySelectorAll('.scene-btn').forEach(b => b.addEventListener('click', () => {
  config.scene = b.dataset.scene;
  document.querySelectorAll('.scene-btn').forEach(el => el.classList.toggle('active', el.dataset.scene === config.scene));
  root.enterScene(config.scene);
}));
document.querySelectorAll('.inner-btn').forEach(b => b.addEventListener('click', () => {
  config.inner = b.dataset.inner;
  document.querySelectorAll('.inner-btn').forEach(el => el.classList.toggle('active', el.dataset.inner === config.inner));
  root.walk(h => { if (h.depth > 0) h.enterScene(config.inner); });
}));

const bindSlider = (id, fn) => { const el = document.getElementById(id); el.addEventListener('input', () => fn(+el.value)); };
bindSlider('count', v => {
  document.getElementById('countVal').textContent = v;
  root.setCount(v);
});
bindSlider('gap', v => { config.gap = v; document.getElementById('gapVal').textContent = v; });
bindSlider('corner', v => { config.cornerRadius = v; document.getElementById('cornerVal').textContent = v; });
bindSlider('hover', v => { config.hoverBoost = v / 100; document.getElementById('hoverVal').textContent = (v / 100).toFixed(1) + '×'; });
bindSlider('fields', v => {
  config.fieldDensity = v / 100;
  document.getElementById('fieldsVal').textContent = v;
  // re-roster the fields in place: no need to reflow the page for it
  for (const b of root.bodies) if (b.rect && !b.isVoid && !b.leaving) root.setField(b, b.rect);
});
bindSlider('swirl', v => { config.swirl = v / 100; document.getElementById('swirlVal').textContent = v; });
bindSlider('stagger', v => { config.stagger = v / 100; document.getElementById('staggerVal').textContent = '.' + String(v).padStart(2, '0') + 's'; });
document.getElementById('add').addEventListener('click', () => {
  const n = Math.min(30, root.bodies.filter(b => !b.isVoid && !b.leaving).length + 1);
  document.getElementById('count').value = String(n);
  document.getElementById('countVal').textContent = String(n);
  root.addBody();
});
document.getElementById('remove').addEventListener('click', () => {
  root.removeBody();
  const n = Math.max(4, root.bodies.filter(b => !b.isVoid && !b.leaving).length);
  document.getElementById('count').value = String(n);
  document.getElementById('countVal').textContent = String(n);
});

/* --------------------------------------------------------------- START */

function init() {
  resize();
  for (let i = 0; i < config.count; i++) {
    const th = (i / config.count) * Math.PI * 2 + hash01(i, 7);
    const r = Math.min(W, H) * (0.18 + hash01(i, 8) * 0.2);
    const b = root.makeBody(W / 2 + Math.cos(th) * r, H / 2 + Math.sin(th) * r, { claim: 1 });
    root.bodies.push(b);
  }
  root.enterScene(config.scene);
  document.querySelectorAll('.scene-btn').forEach(el => el.classList.toggle('active', el.dataset.scene === config.scene));
  requestAnimationFrame(tick);
}

window.addEventListener('resize', resize);
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();

})();
</script>
