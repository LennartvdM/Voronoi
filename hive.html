<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hive</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: #0a0a0f;
    color: #e0e0e0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    display: flex; flex-direction: column;
  }
  .stage { position: relative; flex: 1; min-height: 0; }
  canvas { display: block; width: 100%; height: 100%; cursor: default; }
  .back {
    position: absolute; top: 14px; left: 16px; z-index: 3;
    color: #667; text-decoration: none; font-size: 13px; letter-spacing: .02em;
  }
  .back:hover { color: #aab; }

  /* The meter row — the theorem, watchable. Always on in this build. */
  .meters {
    position: absolute; left: 16px; bottom: 14px; z-index: 3;
    font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 11px;
    color: #5a6; background: rgba(10,10,16,.72); border: 1px solid #1e2230;
    border-radius: 6px; padding: 5px 9px; line-height: 1.5;
    pointer-events: none; white-space: nowrap;
  }
  .meters b { color: #8fca9f; font-weight: 600; }
  .meters .bad { color: #e07a6a; }
  .meters .soft { color: #c9b26a; }

  .bar {
    display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
    padding: 10px 16px; background: #0d0d14; border-top: 1px solid #1a1a26;
    z-index: 2;
  }
  .group { display: flex; align-items: center; gap: 7px; }
  .lbl { font-size: 10px; letter-spacing: .09em; text-transform: uppercase; color: #556; }
  .scene-btn, .btn {
    background: #16161f; color: #99a; border: 1px solid #262636;
    border-radius: 6px; padding: 5px 12px; font-size: 12px; cursor: pointer;
  }
  .scene-btn:hover, .btn:hover { color: #ccd; border-color: #3a3a52; }
  .scene-btn.active { background: #2b2b48; color: #cfd0ff; border-color: #4a4a7a; }
  input[type=range] { width: 84px; accent-color: #6a6af0; }
  .val { font-size: 11px; color: #778; font-family: ui-monospace, Menlo, monospace; min-width: 3ch; }
</style>
</head>
<body>
  <div class="stage">
    <a class="back" href="index.html">&larr; Back</a>
    <canvas id="c"></canvas>
    <div class="meters" id="meters">
      area err <b id="mArea">–</b> · gap <b id="mGap">–</b> · overlap <b id="mOver">–</b> · rect <b id="mRect">–</b> · seeds <b id="mSeeds">–</b> · solve <b id="mIter">–</b>
    </div>
  </div>
  <div class="bar">
    <div class="group"><span class="lbl">Scene</span>
      <button class="scene-btn" data-scene="flock">Flock</button>
      <button class="scene-btn" data-scene="bento">Bento</button>
      <button class="scene-btn" data-scene="hero">Hero</button>
      <button class="scene-btn" data-scene="sidebar">Sidebar</button>
      <button class="scene-btn" data-scene="frame">Frame</button>
    </div>
    <div class="group"><span class="lbl">Elements</span>
      <input type="range" id="count" min="4" max="30" value="12"><span class="val" id="countVal">12</span>
    </div>
    <div class="group"><span class="lbl">Gap</span>
      <input type="range" id="gap" min="0" max="28" value="10"><span class="val" id="gapVal">10</span>
    </div>
    <div class="group"><span class="lbl">Corners</span>
      <input type="range" id="corner" min="0" max="34" value="14"><span class="val" id="cornerVal">14</span>
    </div>
    <div class="group"><span class="lbl">Hover</span>
      <input type="range" id="hover" min="100" max="260" value="160"><span class="val" id="hoverVal">1.6&times;</span>
    </div>
    <div class="group"><span class="lbl">Fields</span>
      <input type="range" id="fields" min="0" max="100" value="55"><span class="val" id="fieldsVal">55</span>
    </div>
    <div class="group"><span class="lbl">Swirl</span>
      <input type="range" id="swirl" min="0" max="100" value="45"><span class="val" id="swirlVal">45</span>
    </div>
    <div class="group"><span class="lbl">Stagger</span>
      <input type="range" id="stagger" min="0" max="100" value="30"><span class="val" id="staggerVal">.30s</span>
    </div>
    <div class="group">
      <button class="btn" id="add">+ Element</button>
      <button class="btn" id="remove">&minus; Element</button>
    </div>
  </div>

<script>
(function () {
'use strict';

/* ============================================================== SOLVE
 * Sealed. Nothing aesthetic lives in here; no knob in this section is a
 * design knob. Behavior-matched to the validated reference in SEED.md.
 *
 * The three pictures to hold:
 *  1. BIDDING. Every seed i bids |x - s_i|^2 - w_i for every point x of
 *     the canvas; every point goes to the lowest bidder. Seed i's cell is
 *     where it wins. All boundaries fall out of this one rule, so the
 *     tiling is watertight at every instant, whatever the weights are.
 *  2. AUCTION. The solver raises the weight of any seed holding less area
 *     than its claim and lowers the overweight ones. A theorem says the
 *     auction always clears: weights giving every seed exactly its
 *     claimed area exist, and damped Newton finds them from any start.
 *  3. ONE SMOOTH FUNCTION. The diagram is a single continuous function
 *     of seed positions and weights. Move a seed and the picture
 *     deforms; it cannot tear, gap, or pop.
 *
 * And the fourth picture this file adds on top, without touching the
 * math: a LATTICE of equal-weight seeds is a grid of exact rectangles.
 * An element is a BODY of lattice seeds in formation. At rest every
 * boundary is axis-aligned by construction; in motion the same seeds
 * travel and the field stays watertight. Chameleon at rest, alive when
 * it moves.
 */

function ringArea(pts) {
  let a = 0;
  for (let k = 0, n = pts.length; k < n; k++) {
    const p = pts[k], q = pts[k + 1 === n ? 0 : k + 1];
    a += p[0] * q[1] - q[0] * p[1];
  }
  return a / 2;
}

function clipHalfPlane(poly, ax, ay, b, lab) {
  const pts = poly.pts, labs = poly.labs, n = pts.length;
  const oP = [], oL = [];
  let A = pts[n - 1], aL = labs[n - 1];
  let av = ax * A[0] + ay * A[1] - b;
  for (let k = 0; k < n; k++) {
    const B = pts[k], bL = labs[k];
    const bv = ax * B[0] + ay * B[1] - b;
    if (av <= 0) {
      if (bv <= 0) { oP.push(B); oL.push(bL); }
      else {
        const t = av / (av - bv);
        oP.push([A[0] + t * (B[0] - A[0]), A[1] + t * (B[1] - A[1])]);
        oL.push(lab);
      }
    } else if (bv <= 0) {
      const t = av / (av - bv);
      oP.push([A[0] + t * (B[0] - A[0]), A[1] + t * (B[1] - A[1])]);
      oL.push(aL);
      oP.push(B); oL.push(bL);
    }
    A = B; av = bv; aL = bL;
  }
  return { pts: oP, labs: oL };
}

// Same diagram as the reference, with prunable geometry: seeds are bucketed
// in a spatial hash and each cell clips nearest-first, ring by ring, stopping
// once no remaining seed's bisector can reach it. The bisector toward j sits
// at d/2 + (w_i - w_j)/(2d) from s_i — a provable bound, so the output is
// identical to the all-pairs version (areas agree to 1e-10 px²), just faster.
function computeDiagram(seeds, weights, boundsPts) {
  const n = seeds.length;
  const cells = new Array(n);
  const areas = new Float64Array(n);
  const baseLabs = boundsPts.map((_, k) => -1 - k);
  const pot = new Float64Array(n);
  let wmin = Infinity, wmax = -Infinity;
  let bx0 = Infinity, by0 = Infinity, bx1 = -Infinity, by1 = -Infinity;
  for (const p of boundsPts) { bx0 = Math.min(bx0, p[0]); by0 = Math.min(by0, p[1]); bx1 = Math.max(bx1, p[0]); by1 = Math.max(by1, p[1]); }
  for (let i = 0; i < n; i++) {
    pot[i] = seeds[i][0] * seeds[i][0] + seeds[i][1] * seeds[i][1] - weights[i];
    if (weights[i] < wmin) wmin = weights[i];
    if (weights[i] > wmax) wmax = weights[i];
  }
  const maxDw = wmax - wmin;
  const cs = Math.max(8, Math.sqrt((bx1 - bx0) * (by1 - by0) / Math.max(1, n)));
  const gw = Math.ceil((bx1 - bx0) / cs) + 1, gh = Math.ceil((by1 - by0) / cs) + 1;
  const buckets = new Array(gw * gh);
  for (let k = 0; k < buckets.length; k++) buckets[k] = [];
  const bxi = new Int32Array(n), byi = new Int32Array(n);
  for (let i = 0; i < n; i++) {
    bxi[i] = Math.min(gw - 1, Math.max(0, Math.floor((seeds[i][0] - bx0) / cs)));
    byi[i] = Math.min(gh - 1, Math.max(0, Math.floor((seeds[i][1] - by0) / cs)));
    buckets[byi[i] * gw + bxi[i]].push(i);
  }
  const cand = [];
  const maxRing = Math.max(gw, gh);
  for (let i = 0; i < n; i++) {
    const sx = seeds[i][0], sy = seeds[i][1], wi = weights[i];
    let poly = { pts: boundsPts, labs: baseLabs };
    let rFar = 0;
    for (const p of boundsPts) rFar = Math.max(rFar, Math.hypot(p[0] - sx, p[1] - sy));
    let dead = false;
    for (let ring = 0; ring <= maxRing && !dead; ring++) {
      const ringMin = (ring - 1) * cs;                       // nearest a seed in this ring can be
      if (ring > 1 && ringMin / 2 - maxDw / (2 * ringMin) > rFar) break;
      cand.length = 0;
      const x0 = bxi[i] - ring, x1 = bxi[i] + ring, y0 = byi[i] - ring, y1 = byi[i] + ring;
      for (let yy = Math.max(0, y0); yy <= Math.min(gh - 1, y1); yy++) {
        for (let xx = Math.max(0, x0); xx <= Math.min(gw - 1, x1); xx++) {
          if (ring > 0 && xx !== x0 && xx !== x1 && yy !== y0 && yy !== y1) continue;
          for (const j of buckets[yy * gw + xx]) if (j !== i) cand.push(j);
        }
      }
      cand.sort((a, b) => ((seeds[a][0] - sx) ** 2 + (seeds[a][1] - sy) ** 2) - ((seeds[b][0] - sx) ** 2 + (seeds[b][1] - sy) ** 2));
      for (const j of cand) {
        const d = Math.hypot(seeds[j][0] - sx, seeds[j][1] - sy);
        if (d / 2 + (wi - weights[j]) / (2 * d) > rFar) continue;   // exact per pair
        poly = clipHalfPlane(poly, seeds[j][0] - sx, seeds[j][1] - sy, (pot[j] - pot[i]) / 2, j);
        if (poly.pts.length < 3) { dead = true; break; }
        rFar = 0;
        for (const p of poly.pts) rFar = Math.max(rFar, Math.hypot(p[0] - sx, p[1] - sy));
      }
    }
    if (poly.pts.length < 3) { cells[i] = { pts: [], labs: [] }; areas[i] = 0; }
    else { cells[i] = poly; areas[i] = Math.abs(ringArea(poly.pts)); }
  }
  return { cells, areas };
}

function buildJacobian(diagram, seeds) {
  const n = seeds.length;
  const A = [];
  for (let i = 0; i < n; i++) A.push(new Float64Array(n));
  for (let i = 0; i < n; i++) {
    const { pts, labs } = diagram.cells[i];
    for (let k = 0, m = pts.length; k < m; k++) {
      const j = labs[k];
      if (j < 0) continue;
      const p = pts[k], q = pts[k + 1 === m ? 0 : k + 1];
      const L = Math.hypot(q[0] - p[0], q[1] - p[1]);
      const d = Math.hypot(seeds[j][0] - seeds[i][0], seeds[j][1] - seeds[i][1]);
      A[i][j] -= L / (2 * d);
    }
  }
  for (let i = 0; i < n; i++) {
    for (let j = i + 1; j < n; j++) A[i][j] = A[j][i] = (A[i][j] + A[j][i]) / 2;
  }
  for (let i = 0; i < n; i++) {
    let s = 0;
    for (let j = 0; j < n; j++) if (j !== i) s += A[i][j];
    A[i][i] = -s;
  }
  return A;
}

function solvePinned(A, g) {
  const n = g.length, m = n - 1;
  const M = [];
  for (let i = 0; i < m; i++) {
    const row = new Float64Array(m + 1);
    for (let j = 0; j < m; j++) row[j] = A[i][j];
    row[m] = g[i];
    M.push(row);
  }
  for (let c = 0; c < m; c++) {
    let piv = c;
    for (let r = c + 1; r < m; r++) if (Math.abs(M[r][c]) > Math.abs(M[piv][c])) piv = r;
    if (piv !== c) { const t = M[c]; M[c] = M[piv]; M[piv] = t; }
    const pv = M[c][c] || 1e-30;
    for (let r = c + 1; r < m; r++) {
      const f = M[r][c] / pv;
      if (f === 0) continue;
      for (let j = c; j <= m; j++) M[r][j] -= f * M[c][j];
    }
  }
  const x = new Float64Array(n);
  for (let c = m - 1; c >= 0; c--) {
    let s = M[c][m];
    for (let j = c + 1; j < m; j++) s -= M[c][j] * x[j];
    x[c] = s / (M[c][c] || 1e-30);
  }
  return x;
}

function norm2(v) { let s = 0; for (const x of v) s += x * x; return Math.sqrt(s); }
function minOf(v) { let m = Infinity; for (const x of v) if (x < m) m = x; return m; }

function solveWeights(seeds, targets, boundsPts, w0, opts = {}) {
  const n = seeds.length;
  const tol = opts.tol !== undefined ? opts.tol : 1e-6;
  const maxIter = opts.maxIter !== undefined ? opts.maxIter : 50;
  const domainArea = Math.abs(ringArea(boundsPts));

  let tSum = 0;
  for (const t of targets) {
    if (!(t > 0)) throw new Error('every claim must be positive');
    tSum += t;
  }
  const tgt = Float64Array.from(targets, t => t * domainArea / tSum);

  let w = w0 ? Float64Array.from(w0) : new Float64Array(n);
  let evals = 0;
  let diag = computeDiagram(seeds, w, boundsPts); evals++;
  if (w0 && minOf(diag.areas) <= 0) {
    // Stale warm start: some seed's old weight leaves it no cell. Rather than
    // discard everyone's warm weights (a cold solve, 5-6 iterations), lift
    // only the empty seeds to the strongest bid around and let Newton pull
    // them back — a few warm iterations instead of a cold restart.
    // lift each empty seed to the strongest weight among its 8 nearest seeds:
    // enough to win a cell locally, not enough to grab a whole neighbourhood
    const empties = [];
    for (let i = 0; i < n; i++) if (diag.areas[i] <= 0) empties.push(i);
    const lifted = new Float64Array(n);
    for (const i of empties) {
      const near = [];
      for (let j = 0; j < n; j++) if (j !== i && diag.areas[j] > 0) near.push([Math.hypot(seeds[j][0] - seeds[i][0], seeds[j][1] - seeds[i][1]), j]);
      near.sort((a, b) => a[0] - b[0]);
      let wl = -Infinity;
      for (let k = 0; k < Math.min(8, near.length); k++) wl = Math.max(wl, w[near[k][1]]);
      lifted[i] = isFinite(wl) ? wl : 0;
    }
    for (const i of empties) w[i] = lifted[i];
    diag = computeDiagram(seeds, w, boundsPts); evals++;
    if (minOf(diag.areas) <= 0) {                  // still empty: the true cold restart
      w = new Float64Array(n);
      diag = computeDiagram(seeds, w, boundsPts); evals++;
    }
  }

  const eps0 = 0.5 * Math.min(minOf(tgt), minOf(diag.areas));

  const g = new Float64Array(n);
  const refreshResidual = () => {
    let mr = 0;
    for (let i = 0; i < n; i++) {
      g[i] = tgt[i] - diag.areas[i];
      const r = Math.abs(g[i]) / tgt[i];
      if (r > mr) mr = r;
    }
    return mr;
  };
  let maxRel = refreshResidual();
  let gn = norm2(g);
  let iter = 0;
  let converged = maxRel <= tol;

  while (!converged && iter < maxIter) {
    const dw = solvePinned(buildJacobian(diag, seeds), g);
    let accepted = false;
    let t = 1;
    for (let bt = 0; bt < 40 && !accepted; bt++, t /= 2) {
      const wt = new Float64Array(n);
      for (let i = 0; i < n; i++) wt[i] = w[i] + t * dw[i];
      const dt = computeDiagram(seeds, wt, boundsPts); evals++;
      let gnT = 0, mn = Infinity;
      for (let i = 0; i < n; i++) {
        const gi = tgt[i] - dt.areas[i];
        gnT += gi * gi;
        if (dt.areas[i] < mn) mn = dt.areas[i];
      }
      gnT = Math.sqrt(gnT);
      if (mn >= eps0 && gnT <= (1 - t / 2) * gn) {
        w = wt; diag = dt; gn = gnT; accepted = true;
      }
    }
    iter++;
    if (!accepted) break;
    maxRel = refreshResidual();
    converged = maxRel <= tol;
  }

  let mean = 0;
  for (let i = 0; i < n; i++) mean += w[i];
  mean /= n;
  for (let i = 0; i < n; i++) w[i] -= mean;

  return { weights: w, iterations: iter, evals, maxRelErr: maxRel, converged, diagram: diag };
}

/* ============================================================== LATTICE
 * Twelve columns — the web's own grid — and as many rows as the aspect
 * asks for. A scene is a set of rectangles in lattice units. An element
 * that covers k lattice cells is a body of k seeds; at rest each seed sits
 * at its cell's center with claim 1, and the diagram IS the grid.
 */

const COLS = 12;
let ROWS = 7, PW = 0, PH = 0;   // pitch in px, set on resize

function slotCenter(c, r) { return [PW * (c + 0.5), PH * (r + 0.5)]; }
function rectArea(r) { return (r[2] - r[0]) * (r[3] - r[1]); }
function rectCenter(r) { return [PW * (r[0] + r[2]) / 2, PH * (r[1] + r[3]) / 2]; }

// Deterministic per-identity variation (no Math.random on steady paths,
// so a resize can never scramble anything).
function hash01(i, k) {
  const x = Math.sin(i * 127.1 + k * 311.7) * 43758.5453;
  return x - Math.floor(x);
}

// Split a lattice rectangle into n integer rectangles, largest-first,
// along its longer side, at a ratio that varies by a deterministic salt.
function guillotine(rect, n, salt) {
  const rects = [rect.slice()];
  let guard = 0;
  while (rects.length < n && guard < 400) {
    guard++;
    rects.sort((a, b) => rectArea(b) - rectArea(a));
    const idx = rects.findIndex(r => (r[2] - r[0]) > 1 || (r[3] - r[1]) > 1);
    if (idx < 0) break;
    const r = rects.splice(idx, 1)[0];
    const w = r[2] - r[0], h = r[3] - r[1];
    const ratio = 0.36 + 0.28 * hash01(guard, salt);
    const vertical = w > h || (w === h && hash01(guard, salt + 7) < 0.5);
    if (vertical && w > 1) {
      const k = Math.min(w - 1, Math.max(1, Math.round(w * ratio)));
      rects.push([r[0], r[1], r[0] + k, r[3]], [r[0] + k, r[1], r[2], r[3]]);
    } else if (h > 1) {
      const k = Math.min(h - 1, Math.max(1, Math.round(h * ratio)));
      rects.push([r[0], r[1], r[2], r[1] + k], [r[0], r[1] + k, r[2], r[3]]);
    } else {
      const k = Math.min(w - 1, Math.max(1, Math.round(w * ratio)));
      rects.push([r[0], r[1], r[0] + k, r[3]], [r[0] + k, r[1], r[2], r[3]]);
    }
  }
  return rects;
}

// Share m rectangles across several regions in proportion to their area.
function distribute(regions, m, salt) {
  regions = regions.filter(r => rectArea(r) > 0);
  if (m <= 0 || !regions.length) return [];
  if (m < regions.length) {
    regions.sort((a, b) => rectArea(b) - rectArea(a));
    return regions.slice(0, m);
  }
  const total = regions.reduce((s, r) => s + rectArea(r), 0);
  const counts = regions.map(r => Math.max(1, Math.floor(m * rectArea(r) / total)));
  let assigned = counts.reduce((s, c) => s + c, 0);
  while (assigned < m) { // remainder to the region with most area per rect
    let best = 0, bestScore = -1;
    regions.forEach((r, i) => { const s = rectArea(r) / counts[i]; if (s > bestScore) { bestScore = s; best = i; } });
    counts[best]++; assigned++;
  }
  while (assigned > m) {
    let best = -1, bestScore = Infinity;
    regions.forEach((r, i) => { if (counts[i] > 1) { const s = rectArea(r) / counts[i]; if (s < bestScore) { bestScore = s; best = i; } } });
    if (best < 0) break;
    counts[best]--; assigned--;
  }
  const out = [];
  regions.forEach((r, i) => out.push(...guillotine(r, Math.min(counts[i], rectArea(r)), salt + i * 13)));
  return out;
}

/* ============================================================== SCENES
 * Pure (cols, rows, n) -> { content: rect[], voids: rect[] } in lattice
 * units, with content.length === n. Voids are margins, columns, pools of
 * whitespace — bodies like any other, with no ink.
 */

const scenes = {
  flock: null,

  bento(C, R, n) {
    return { content: guillotine([0, 0, C, R], n, 1), voids: [] };
  },

  hero(C, R, n) {
    const col = Math.max(1, Math.round(C * 0.22));          // reading column (void)
    const hero = [col, 1, Math.round(C * 0.72), R - 1];
    const strips = [
      [col, 0, C, 1],                                       // top run
      [hero[2], 1, C, R - 1],                               // right column
      [col, R - 1, C, R],                                   // bottom run
    ];
    const content = [hero, ...distribute(strips, n - 1, 2)];
    return { content, voids: [[0, 0, col, R]] };
  },

  sidebar(C, R, n) {
    const c = Math.max(2, Math.round(C * 0.45));
    return { content: guillotine([0, 0, c, R], n, 3), voids: [[c, 0, C, R]] };
  },

  frame(C, R, n) {
    const ring = [
      [0, 0, C, 1], [0, R - 1, C, R],                       // top, bottom
      [0, 1, 2, R - 1], [C - 2, 1, C, R - 1],               // left, right
    ];
    return { content: distribute(ring, n, 4), voids: [[2, 1, C - 2, R - 1]] };
  },
};

/* ============================================================== BODIES
 * The hive layer. A body owns its seeds, its claim, and its intent; the
 * math never touches any of this. All rates per second; dt in seconds.
 */

const CLAIM_MIN = 0.02;
const SEED_MARGIN = 10;
const SEED_MIN_SEP = 5;

const PALETTE = [
  '#6366f1', '#06b6d4', '#10b981', '#f59e0b', '#ec4899', '#8b5cf6',
  '#eab308', '#3b82f6', '#ef4444', '#14b8a6', '#a855f7', '#f97316',
  '#64748b', '#d946ef', '#84cc16', '#dc2626', '#2563eb', '#d97706',
  '#7c3aed', '#0d9488', '#e11d48', '#65a30d', '#4f46e5', '#fb923c',
  '#22d3d8', '#c026d3', '#a16207', '#475569', '#be123c', '#059669',
];
const NAMES = [
  'Drift', 'Ember', 'Tide', 'Moss', 'Petal', 'Aurora', 'Dune', 'Jazz',
  'Coal', 'Mint', 'Haze', 'Coral', 'Storm', 'Neon', 'Sage', 'Ruby',
  'Sky', 'Amber', 'Dusk', 'Reef', 'Rose', 'Zest', 'Night', 'Peach',
  'Wave', 'Pulse', 'Bronze', 'Steel', 'Crimson', 'Fern',
];

let nextId = 0;
function makeBody(x, y, opts = {}) {
  const id = opts.id !== undefined ? opts.id : nextId++;
  const b = {
    id,
    name: NAMES[id % NAMES.length],
    color: PALETTE[id % PALETTE.length],
    isVoid: !!opts.isVoid,

    // The body's own position: ONE spring, whatever its slot count. Seeds
    // are derived from it every frame, never integrated separately, so a
    // formation cannot shear or open up.
    x, y, vx: 0, vy: 0,

    rect: null,                 // lattice rect when seated
    offs: [[0, 0]],             // seed offsets from the body centre at full crystal
    core: 0,                    // the seed carrying the whole claim while melted
    subs: [],

    path: null, journey: null, progress: 1,
    leaving: false,

    // Total claim in lattice-cell units: a 6-slot element claims 6.
    claim: opts.claim !== undefined ? opts.claim : CLAIM_MIN,
    claim0: CLAIM_MIN,
    claimTarget: 1,
    baseClaim: 0.8 + hash01(id, 2) * 0.7,   // its size as a free single seed

    px: x, py: y,                // last frame's position: members ride the delta
    members: [], inner: null,   // a field's roster and its inner tessellation
    loops: null,                // this frame's simplified union outline

    hoverMix: 0,
    anchorX: x, anchorY: y,
    wanderPhase: hash01(id, 1) * Math.PI * 2,
  };
  b.subs.push(makeSub(b, x, y));
  return b;
}

function makeSub(body, x, y) {
  return { body, x, y, claim: CLAIM_MIN, w: 0 };  // w: warm-start weight
}

function easeInOutCubic(u) {
  return u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
}

// --- seating: the one verb, spoken for a whole formation at once -------

let swirlSign = 1;

// Describe a body's formation: the offsets of its lattice slots from the
// rect centre. Derived, so a resize re-derives it for free.
function refreshFormation(b) {
  if (!b.rect) { b.offs = [[0, 0]]; b.core = 0; b.subs.length = 1; return; }
  const [ex, ey] = rectCenter(b.rect);
  const offs = [];
  for (let r = b.rect[1]; r < b.rect[3]; r++) {
    for (let c = b.rect[0]; c < b.rect[2]; c++) {
      const [sx, sy] = slotCenter(c, r);
      offs.push([sx - ex, sy - ey]);
    }
  }
  // The core is the slot nearest the centre. While the field is liquid it
  // carries the body's entire claim, so a melted element is ONE seed — one
  // smooth convex cell — sitting where its rectangle will be.
  let core = 0;
  for (let i = 1; i < offs.length; i++) {
    if (Math.hypot(offs[i][0], offs[i][1]) < Math.hypot(offs[core][0], offs[core][1])) core = i;
  }
  b.offs = offs; b.core = core;
  while (b.subs.length < offs.length) b.subs.push(makeSub(b, b.x, b.y));
  b.subs.length = offs.length;
}

function seatBody(b, rect, t, timing) {
  b.rect = rect;
  refreshFormation(b);
  b.claim0 = b.claim;
  b.claimTarget = b.offs.length;      // one lattice cell per slot
  b.leaving = false;

  const [ex, ey] = rectCenter(rect);
  const dist = Math.hypot(ex - b.x, ey - b.y);
  const bend = config.swirl * 0.55 * swirlSign * (0.7 + 0.6 * hash01(b.id, 12));
  const ddx = ex - b.x, ddy = ey - b.y;
  b.path = { sx: b.x, sy: b.y, ex, ey, cx: (b.x + ex) / 2 - ddy * bend, cy: (b.y + ey) / 2 + ddx * bend };
  b.journey = timing || {
    t0: t,
    delay: config.stagger * hash01(b.id, 11),
    dur: Math.min(2.2, 0.9 + dist / 520) * (0.9 + 0.2 * hash01(b.id, 13)),
  };
  b.progress = 0;
}

// Release a body back to the flock: one seed, its own resting size.
function releaseBody(b) {
  b.rect = null;
  refreshFormation(b);
  b.claim0 = b.claim;
  b.claimTarget = b.baseClaim;
  b.path = null; b.journey = null; b.progress = 1;
  b.leaving = false;
}

// --- steering ---------------------------------------------------------

function steerBodies(bodies, dt, t, W, H) {
  for (const b of bodies) {
    if (b.journey) {
      const j = b.journey;
      const u = Math.min(1, Math.max(0, (t - j.t0 - j.delay) / j.dur));
      b.progress = easeInOutCubic(u);
    }
    if (b === drag.body) { b.x = drag.px; b.y = drag.py; b.vx = 0; b.vy = 0; continue; }
    let ax = 0, ay = 0;
    if (b.path) {
      // follow the journey's carrot with a lightly under-damped spring: the
      // bezier gives the path, the spring the lag and overshoot that read
      // as alive. The resting wobble fades out as the lattice locks, so a
      // crystallised layout is the grid, not a grid breathing by a pixel.
      const e = b.progress, m = 1 - e, p = b.path;
      const px = m * m * p.sx + 2 * m * e * p.cx + e * e * p.ex;
      const py = m * m * p.sy + 2 * m * e * p.cy + e * e * p.ey;
      const k1 = 62 * (0.9 + 0.2 * hash01(b.id, 3)), k2 = 13.5;
      const wob = 2.5 * (1 - crystal);
      ax = (px + Math.sin(t * 0.6 + b.id * 1.7) * wob - b.x) * k1 - b.vx * k2;
      ay = (py + Math.cos(t * 0.5 + b.id * 2.3) * wob - b.y) * k1 - b.vy * k2;
    } else {
      // free drift: wander + weak centering + soft Lloyd toward its own
      // cell's pole — the hive reading its field
      b.wanderPhase += (Math.sin(t * 0.7 + b.id * 2.1) + Math.sin(t * 1.31 + b.id * 0.73)) * 0.9 * dt;
      ax = Math.cos(b.wanderPhase) * 46 - b.vx * 1.4;
      ay = Math.sin(b.wanderPhase) * 46 - b.vy * 1.4;
      ax += (W / 2 - b.x) * 0.06 + (b.anchorX - b.x) * 0.9;
      ay += (H / 2 - b.y) * 0.06 + (b.anchorY - b.y) * 0.9;
    }
    b.vx += ax * dt; b.vy += ay * dt;
    const sp = Math.hypot(b.vx, b.vy), maxSp = b.path ? 900 : 130;
    if (sp > maxSp) { b.vx *= maxSp / sp; b.vy *= maxSp / sp; }
    b.x += b.vx * dt; b.y += b.vy * dt;
  }
}

// Bodies push apart while the field is liquid, so a traveller never wedges
// between two neighbours. Once the lattice locks there is nothing to push
// and pushing would only spoil the grid.
function separate(bodies, dt, W, H) {
  if (crystal > 0.995) return;
  let claimSum = 0;
  for (const b of bodies) claimSum += b.claim;
  const areaPer = (W * H) / Math.max(1e-9, claimSum);
  const rad = bodies.map(b => Math.sqrt(b.claim * areaPer / Math.PI));
  const F = 2600 * (1 - crystal);
  for (let i = 0; i < bodies.length; i++) {
    const A = bodies[i];
    for (let j = i + 1; j < bodies.length; j++) {
      const B = bodies[j];
      const R = 0.85 * (rad[i] + rad[j]);
      const dx = B.x - A.x, dy = B.y - A.y, d = Math.hypot(dx, dy);
      if (d > 1e-6 && d < R) {
        const f = F * (1 - d / R) * dt / d;
        if (A !== drag.body) { A.vx -= dx * f; A.vy -= dy * f; }
        if (B !== drag.body) { B.vx += dx * f; B.vy += dy * f; }
      }
    }
  }
}

// Preconditions for the seeds that reach the solve — strictly inside the
// domain, pairwise distinct — enforced on the BODY, so a formation moves as
// one. Its own seeds are distinct by construction: they only enter the
// field once the crystal fraction has spread them past the minimum.
function enforcePreconditions(bodies, W, H) {
  for (const b of bodies) {
    b.x = Math.min(W - SEED_MARGIN, Math.max(SEED_MARGIN, b.x));
    b.y = Math.min(H - SEED_MARGIN, Math.max(SEED_MARGIN, b.y));
  }
  for (let i = 0; i < bodies.length; i++) {
    for (let j = i + 1; j < bodies.length; j++) {
      const A = bodies[i], B = bodies[j];
      let dx = B.x - A.x, dy = B.y - A.y, d = Math.hypot(dx, dy);
      if (d < SEED_MIN_SEP) {
        if (d < 1e-6) { dx = 1; dy = 0; d = 1; }
        const push = (SEED_MIN_SEP - d) / 2 / d;
        if (A !== drag.body) { A.x -= dx * push; A.y -= dy * push; }
        if (B !== drag.body) { B.x += dx * push; B.y += dy * push; }
      }
    }
  }
}

// Seeds are PLACED, not integrated: the body's position plus its formation
// offsets scaled by the crystal fraction, and the body's claim shared out
// the same way. Melted, every element is one seed holding its whole claim —
// a single smooth convex cell, nothing to segment. Crystallised, the
// offsets are exact lattice slots and the union is the exact rectangle.
// Everything between is one continuous interpolation of the same numbers.
function placeSeeds(bodies) {
  for (const b of bodies) {
    const n = b.subs.length;
    // hover only reshapes the field while the page is liquid; a locked
    // element lights up instead of reflowing its neighbours
    const hover = 1 + (config.hoverBoost - 1) * b.hoverMix * (1 - crystal);
    const coreShare = n - (n - 1) * crystal;          // n when melted, 1 when locked
    const otherShare = Math.max(CLAIM_MIN, crystal);  // ~0 when melted, 1 when locked
    for (let i = 0; i < n; i++) {
      const s = b.subs[i];
      s.x = b.x + b.offs[i][0] * crystal;
      s.y = b.y + b.offs[i][1] * crystal;
      s.claim = b.claim * hover * (i === b.core ? coreShare : otherShare) / n;
    }
  }
}

function easeClaims(bodies, dt, t, hoveredId) {
  const k = 1 - Math.exp(-6 * dt);
  for (const b of bodies) {
    const hm = 1 - Math.exp(-(b.id === hoveredId ? 10 : 5) * dt);
    b.hoverMix += ((b.id === hoveredId ? 1 : 0) - b.hoverMix) * hm;
    if (b.journey && b.path) {
      // size travels with position: the same eased progress
      b.claim = b.claim0 + (b.claimTarget - b.claim0) * b.progress;
    } else {
      let target = b.claimTarget;
      if (!b.rect && !b.isVoid && !b.leaving) target *= 1 + 0.05 * Math.sin(t * 0.8 + b.id * 2.9);
      b.claim += (target - b.claim) * k;
    }
    if (b.claim < CLAIM_MIN) b.claim = CLAIM_MIN;
  }
}


/* ============================================================== FIELDS
 * A field is an element that holds other cells. Its outer border is the
 * rigid rectangle the lattice locks; inside, its members divide it with
 * ordinary Voronoi boundaries — organic, squished against a straight edge.
 *
 * This is not a new mechanism. A power diagram clipped to a convex domain
 * already has exactly that shape: bisectors inside, the domain's own edges
 * outside. So a field is the SAME sealed solver run once more, one level
 * down, with the field's own polygon as its domain. Nesting, not machinery.
 */

// Andrew's monotone chain. The inner domain must be convex (step 4 of the
// solver assumes it); a locked field is a rectangle and a melted one is a
// single convex cell, so the hull only differs from the union during the
// half-second lock ramp, and the garment clips that away.
function convexHull(pts) {
  if (pts.length < 3) return pts.slice();
  const p = pts.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
  const lo = [];
  for (const q of p) { while (lo.length >= 2 && cross(lo[lo.length - 2], lo[lo.length - 1], q) <= 0) lo.pop(); lo.push(q); }
  const hi = [];
  for (let i = p.length - 1; i >= 0; i--) { const q = p[i]; while (hi.length >= 2 && cross(hi[hi.length - 2], hi[hi.length - 1], q) <= 0) hi.pop(); hi.push(q); }
  lo.pop(); hi.pop();
  const h = lo.concat(hi);
  return h.length >= 3 ? h : pts.slice();
}

function polyCentroid(pts) {
  let a = 0, cx = 0, cy = 0;
  for (let i = 0; i < pts.length; i++) {
    const p = pts[i], q = pts[(i + 1) % pts.length];
    const f = p[0] * q[1] - q[0] * p[1];
    a += f; cx += (p[0] + q[0]) * f; cy += (p[1] + q[1]) * f;
  }
  if (Math.abs(a) < 1e-9) { let x = 0, y = 0; for (const p of pts) { x += p[0]; y += p[1]; } return [x / pts.length, y / pts.length]; }
  return [cx / (3 * a), cy / (3 * a)];
}

// Grow or shrink a field's roster. Members are identities like any other:
// they persist across scenes, so a gallery keeps its cards when the page
// rearranges and the field it lives in changes shape.
function setMembers(b, k) {
  if (k < 2) { b.members = []; b.inner = null; return; }
  while (b.members.length > k) b.members.pop();
  while (b.members.length < k) {
    const i = b.members.length, mid = b.id * 31 + i;
    b.members.push({
      color: PALETTE[(b.id * 5 + i * 3 + 1) % PALETTE.length],
      x: b.x + (hash01(mid, 41) - 0.5) * 40,
      y: b.y + (hash01(mid, 42) - 0.5) * 40,
      claim: 0.75 + hash01(mid, 43) * 0.6,
      w: 0, phase: hash01(mid, 44) * Math.PI * 2,
    });
  }
}

// Members ride along with their field, then relax inside whatever shape it
// currently has: a light Lloyd step toward each cell's own centroid keeps
// them evenly spread, and a slow wander keeps the interior alive even while
// the outer rectangle is locked rigid.
function updateFields(dt, t) {
  for (const b of bodies) {
    const loops = b.loops;
    if (!b.members.length || !loops || !loops.length) { b.inner = null; continue; }
    let big = loops[0], bigA = Math.abs(ringArea(loops[0]));
    for (const l of loops) { const a = Math.abs(ringArea(l)); if (a > bigA) { bigA = a; big = l; } }
    const domain = convexHull(big);
    if (domain.length < 3 || bigA < 400) { b.inner = null; continue; }

    const [dcx, dcy] = polyCentroid(domain);
    const reach = Math.sqrt(bigA);
    for (const m of b.members) {
      m.x += b.x - b.px; m.y += b.y - b.py;            // carried by the field
      m.phase += dt * 0.55;
      m.x += Math.cos(m.phase) * reach * 0.035 * dt;
      m.y += Math.sin(m.phase * 1.13) * reach * 0.035 * dt;
      if (!pointInPolygon(m.x, m.y, domain)) {          // never leave the field
        m.x += (dcx - m.x) * 0.5; m.y += (dcy - m.y) * 0.5;
        if (!pointInPolygon(m.x, m.y, domain)) { m.x = dcx; m.y = dcy; }
      }
    }
    // pairwise epsilon-separation, same precondition the outer field has
    for (let i = 0; i < b.members.length; i++) {
      for (let j = i + 1; j < b.members.length; j++) {
        const A = b.members[i], B = b.members[j];
        let dx = B.x - A.x, dy = B.y - A.y, d = Math.hypot(dx, dy);
        if (d < SEED_MIN_SEP) {
          if (d < 1e-6) { dx = 1; dy = 0; d = 1; }
          const push = (SEED_MIN_SEP - d) / 2 / d;
          A.x -= dx * push; A.y -= dy * push; B.x += dx * push; B.y += dy * push;
        }
      }
    }

    let sol;
    try {
      sol = solveWeights(b.members.map(m => [m.x, m.y]), b.members.map(m => m.claim),
                         domain, b.members.map(m => m.w), { maxIter: 2 });
    } catch (e) { b.inner = null; continue; }
    b.members.forEach((m, i) => { m.w = sol.weights[i]; });
    b.inner = { cells: sol.diagram.cells, domain };

    // Lloyd: drift each member toward its own cell's centre of area
    b.members.forEach((m, i) => {
      const c = sol.diagram.cells[i];
      if (!c || c.pts.length < 3) return;
      const [px, py] = polyCentroid(c.pts);
      m.x += (px - m.x) * Math.min(1, 2.2 * dt);
      m.y += (py - m.y) * Math.min(1, 2.2 * dt);
    });
  }
}

/* ============================================================== GARMENT
 * Display only. A body renders as the union of its seeds' cells: edges
 * between two seeds of the same body are seams and vanish; the rest chain
 * into the body's outline. Inset, rounded, dressed — never fed back.
 */

function pointInPolygon(x, y, pts) {
  let inside = false;
  for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
    const xi = pts[i][0], yi = pts[i][1], xj = pts[j][0], yj = pts[j][1];
    if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) inside = !inside;
  }
  return inside;
}

// Chain a body's foreign edges into closed loops.
function bodyOutlines(subIdx, cells, ownerOf, bodyId) {
  const edges = [];
  for (const i of subIdx) {
    const { pts, labs } = cells[i];
    for (let k = 0, m = pts.length; k < m; k++) {
      const j = labs[k];
      if (j >= 0 && ownerOf[j] === bodyId) continue;       // a seam
      edges.push({ a: pts[k], b: pts[k + 1 === m ? 0 : k + 1], used: false });
    }
  }
  const loops = [];
  for (const e0 of edges) {
    if (e0.used) continue;
    const loop = [e0.a];
    let cur = e0; cur.used = true;
    for (let guard = 0; guard < edges.length; guard++) {
      let next = null, best = 0.25;
      for (const e of edges) {
        if (e.used) continue;
        const d = Math.hypot(e.a[0] - cur.b[0], e.a[1] - cur.b[1]);
        if (d < best) { best = d; next = e; }
      }
      if (!next) break;
      next.used = true;
      loop.push(next.a);
      cur = next;
      if (Math.hypot(cur.b[0] - e0.a[0], cur.b[1] - e0.a[1]) < 0.25) break;
    }
    if (loop.length >= 3) loops.push(loop);
  }
  return loops;
}

// A body's outline is chained from its sub-cells' edges, so every seam
// junction leaves a duplicate vertex and every straight run arrives split
// into collinear pieces. Both are invisible in the polygon and fatal in the
// garment: insetPolygon cannot offset a zero-length edge, so it drops that
// corner — which renders as a chamfer chopped across it. Reduce the loop to
// its real corners before dressing it.
function simplifyLoop(pts, epsLen = 0.05, epsSin = 1e-3) {
  const a = [];
  for (const p of pts) {
    const q = a[a.length - 1];
    if (!q || Math.hypot(p[0] - q[0], p[1] - q[1]) > epsLen) a.push(p);
  }
  while (a.length > 1 && Math.hypot(a[0][0] - a[a.length - 1][0], a[0][1] - a[a.length - 1][1]) <= epsLen) a.pop();
  if (a.length < 3) return a;
  const out = [];
  for (let i = 0; i < a.length; i++) {
    const p = a[(i + a.length - 1) % a.length], c = a[i], n = a[(i + 1) % a.length];
    const ux = c[0] - p[0], uy = c[1] - p[1], vx = n[0] - c[0], vy = n[1] - c[1];
    const lu = Math.hypot(ux, uy), lv = Math.hypot(vx, vy);
    if (lu < epsLen || lv < epsLen) continue;
    if (Math.abs(ux * vy - uy * vx) / (lu * lv) > epsSin) out.push(c);   // a real corner
  }
  return out.length >= 3 ? out : a;
}

// Inset a simple polygon by d: offset every edge inward and intersect
// neighbors. Callers clamp d well below the polygon's inradius.
function insetPolygon(pts, d) {
  const n = pts.length;
  if (d <= 0 || n < 3) return pts;
  const orient = ringArea(pts) > 0 ? 1 : -1;
  const lines = [];
  for (let k = 0; k < n; k++) {
    const p = pts[k], q = pts[(k + 1) % n];
    let nx = (q[1] - p[1]) * orient, ny = (p[0] - q[0]) * orient;
    const len = Math.hypot(nx, ny);
    if (len < 1e-9) { lines.push(null); continue; }
    nx /= len; ny /= len;
    lines.push({ nx, ny, c: nx * p[0] + ny * p[1] - d });
  }
  const out = [];
  for (let k = 0; k < n; k++) {
    const l1 = lines[(k + n - 1) % n], l2 = lines[k];
    if (!l1 || !l2) continue;
    const det = l1.nx * l2.ny - l1.ny * l2.nx;
    if (Math.abs(det) < 1e-6) { out.push([pts[k][0] - l2.nx * d, pts[k][1] - l2.ny * d]); continue; }
    out.push([(l1.c * l2.ny - l2.c * l1.ny) / det, (l1.nx * l2.c - l2.nx * l1.c) / det]);
  }
  return out;
}

// Rounded path with the tangent budgeted, not just the radius.
function roundedPath(ctx, pts, r) {
  const n = pts.length;
  ctx.beginPath();
  if (r <= 0.5) {
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (let k = 1; k < n; k++) ctx.lineTo(pts[k][0], pts[k][1]);
    ctx.closePath();
    return;
  }
  let started = false;
  for (let k = 0; k < n; k++) {
    const p0 = pts[(k + n - 1) % n], p1 = pts[k], p2 = pts[(k + 1) % n];
    const v1x = p0[0] - p1[0], v1y = p0[1] - p1[1];
    const v2x = p2[0] - p1[0], v2y = p2[1] - p1[1];
    const l1 = Math.hypot(v1x, v1y), l2 = Math.hypot(v2x, v2y);
    if (l1 < 1e-6 || l2 < 1e-6) continue;
    const dot = (v1x * v2x + v1y * v2y) / (l1 * l2);
    const theta = Math.acos(Math.min(1, Math.max(-1, dot)));
    const tanHalf = Math.tan(theta / 2);
    const tang = Math.min(r / (tanHalf || 1e9), l1 / 2, l2 / 2);
    const rr = tang * tanHalf;
    const t1x = p1[0] + (v1x / l1) * tang, t1y = p1[1] + (v1y / l1) * tang;
    const t2x = p1[0] + (v2x / l2) * tang, t2y = p1[1] + (v2y / l2) * tang;
    if (!started) { ctx.moveTo(t1x, t1y); started = true; } else ctx.lineTo(t1x, t1y);
    if (rr > 0.1 && theta < Math.PI - 0.02) ctx.arcTo(p1[0], p1[1], t2x, t2y, rr);
    else ctx.lineTo(t2x, t2y);
  }
  ctx.closePath();
}

// Inscribed pole: the largest-inscribed-circle center, climbed from a
// point known to be inside and never allowed to leave the polygon.
function inscribedPole(pts, startX, startY) {
  const n = pts.length;
  const minDist = (x, y) => {
    let md = Infinity;
    for (let k = 0; k < n; k++) {
      const p = pts[k], q = pts[(k + 1) % n];
      const ex = q[0] - p[0], ey = q[1] - p[1];
      const L2 = ex * ex + ey * ey || 1e-9;
      let t = ((x - p[0]) * ex + (y - p[1]) * ey) / L2;
      t = Math.max(0, Math.min(1, t));
      md = Math.min(md, Math.hypot(x - (p[0] + t * ex), y - (p[1] + t * ey)));
    }
    return md;
  };
  let cx = startX, cy = startY;
  if (startX === undefined || !pointInPolygon(cx, cy, pts)) {
    cx = 0; cy = 0; for (const p of pts) { cx += p[0]; cy += p[1]; } cx /= n; cy /= n;
    if (!pointInPolygon(cx, cy, pts)) { cx = pts[0][0]; cy = pts[0][1]; }
  }
  let best = minDist(cx, cy), step = Math.max(4, best);
  for (let it = 0; it < 18; it++) {
    let moved = false;
    for (const [dx, dy] of [[step, 0], [-step, 0], [0, step], [0, -step]]) {
      const x = cx + dx, y = cy + dy;
      if (!pointInPolygon(x, y, pts)) continue;
      const d = minDist(x, y);
      if (d > best) { best = d; cx = x; cy = y; moved = true; break; }
    }
    if (!moved) step /= 2;
    if (step < 0.5) break;
  }
  return { x: cx, y: cy, r: best };
}

function shade(hex, amt) {
  const num = parseInt(hex.slice(1), 16);
  const r = Math.min(255, Math.max(0, (num >> 16) + amt));
  const g = Math.min(255, Math.max(0, ((num >> 8) & 0xff) + amt));
  const b = Math.min(255, Math.max(0, (num & 0xff) + amt));
  return `#${((r << 16) | (g << 8) | b).toString(16).padStart(6, '0')}`;
}

/* ============================================================== METERS */

const meterEls = {
  area: document.getElementById('mArea'),
  gap: document.getElementById('mGap'),
  over: document.getElementById('mOver'),
  rect: document.getElementById('mRect'),
  seeds: document.getElementById('mSeeds'),
  iter: document.getElementById('mIter'),
};

// Exact scanline rasterization of the SOLVED cells (convex): 0 = gap, 2+ = overlap.
function rasterCheck(cells, W, H) {
  const S = 2;
  const gw = Math.floor((W - S / 2 - 1e-6) / S) + 1;
  const gh = Math.floor((H - S / 2 - 1e-6) / S) + 1;
  const cov = new Uint8Array(gw * gh);
  for (const cell of cells) {
    const pts = cell.pts;
    if (pts.length < 3) continue;
    let y0 = Infinity, y1 = -Infinity;
    for (const p of pts) { y0 = Math.min(y0, p[1]); y1 = Math.max(y1, p[1]); }
    const r0 = Math.max(0, Math.ceil((y0 - S / 2) / S)), r1 = Math.min(gh - 1, Math.floor((y1 - S / 2) / S));
    for (let ry = r0; ry <= r1; ry++) {
      const y = ry * S + S / 2;
      let xin = Infinity, xout = -Infinity;
      for (let k = 0; k < pts.length; k++) {
        const p = pts[k], q = pts[(k + 1) % pts.length];
        if ((p[1] <= y) !== (q[1] <= y)) {
          const x = p[0] + (y - p[1]) * (q[0] - p[0]) / (q[1] - p[1]);
          xin = Math.min(xin, x); xout = Math.max(xout, x);
        }
      }
      if (xin > xout) continue;
      const c0 = Math.max(0, Math.ceil((xin - S / 2) / S)), c1 = Math.min(gw - 1, Math.floor((xout - S / 2) / S));
      for (let cx2 = c0; cx2 <= c1; cx2++) cov[ry * gw + cx2]++;
    }
  }
  let gap = 0, over = 0;
  for (let k = 0; k < cov.length; k++) { if (cov[k] === 0) gap++; else if (cov[k] > 1) over++; }
  return { gap: gap * S * S, over: over * S * S };
}

/* ============================================================== KERNEL LOOP */

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, dpr = 1;

const config = {
  count: 12,
  gap: 10,
  cornerRadius: 14,
  hoverBoost: 1.6,
  swirl: 0.45,
  stagger: 0.30,
  fieldDensity: 0.55,
  scene: 'bento',
};

let bodies = [];
let solved = null;                  // the frame's ONE authoritative tessellation
let solvedSubs = [];                // the flat seed list the solve was made from
let ownerOf = [];                   // flat index -> body id
let hoveredId = -1;

// The lattice is a REST STATE, not a travel mechanism. crystal is 0 while
// anything is moving — every element is a single seed, organic and cheap —
// and eases to 1 once the whole page has arrived, locking the exact grid.
let crystal = 0, crystalTarget = 0;
const ACTIVE_MIN = 0.12;            // a seed joins the field once it is worth this much of a lattice cell

const drag = { body: null, px: 0, py: 0 };
let mouseX = -1e9, mouseY = -1e9;
let simTime = 0;
let raster = { gap: 0, over: 0 };
let rectPct = 100;
let frame = 0;
let solveMs = 0, lastIters = 0;
let lastSig = null;

function domainPts() { return [[0, 0], [W, 0], [W, H], [0, H]]; }

// --- scene entry --------------------------------------------------------

function enterScene(name) {
  config.scene = name;
  document.querySelectorAll('.scene-btn').forEach(el => el.classList.toggle('active', el.dataset.scene === name));

  const content = bodies.filter(b => !b.isVoid && !b.leaving);
  const spec = scenes[name] ? scenes[name](COLS, ROWS, content.length) : null;

  if (!spec) {
    for (const b of bodies) {
      if (b.isVoid) retireBody(b, 0.5);
      else { setMembers(b, 0); releaseBody(b); }   // no rigid border, no field
    }
    return;
  }

  swirlSign = -swirlSign;
  const centers = spec.content.map(r => { const [x, y] = rectCenter(r); return { x, y }; });
  const gotS = assignStations(content, centers);
  let slowest = 0.9;
  content.forEach((b, k) => {
    const rect = spec.content[gotS[k]];
    seatBody(b, rect, simTime);
    // Roomy rects become fields: a rigid rectangle holding loose cells.
    // Small ones stay single elements, the way a page mixes a gallery
    // section with plain cards.
    // Roomy rects become fields; small ones stay single cards, so a page
    // reads as sections among elements rather than one uniform mush.
    const slots = rectArea(rect);
    setMembers(b, slots >= 4 ? Math.min(7, Math.round(slots * 0.45 * config.fieldDensity)) : 0);
    slowest = Math.max(slowest, b.journey.delay + b.journey.dur);
  });

  // Whitespace has no identity to carry across a page: a margin does not
  // travel, it dissolves here and forms there. While the field is liquid
  // every body is a single seed, so this is one blob fading out and another
  // growing in — no comb of void seeds threading between the cells. The new
  // void grows on the slowest traveller's clock, so it never opens ahead of
  // the elements vacating it.
  for (const v of bodies.filter(b => b.isVoid && !b.leaving)) retireBody(v, slowest);
  spec.voids.forEach(r => {
    const [x, y] = rectCenter(r);
    const v = makeBody(x, y, { isVoid: true, claim: CLAIM_MIN });
    bodies.push(v);
    seatBody(v, r, simTime, { t0: simTime, delay: 0, dur: slowest });
  });
}

function retireBody(b, dur = 0.6) {
  // shrink in place, as one seed, and be gone
  b.leaving = true; b.rect = null;
  refreshFormation(b);
  b.path = { sx: b.x, sy: b.y, ex: b.x, ey: b.y, cx: b.x, cy: b.y };
  b.journey = { t0: simTime, delay: 0, dur };
  b.progress = 0;
  b.claim0 = b.claim;
  b.claimTarget = CLAIM_MIN;
}

// Greedy nearest assignment + 2-opt on squared travel.
function assignStations(points, stations) {
  const nA = points.length, nS = stations.length;
  const pairs = [];
  for (let i = 0; i < nA; i++) for (let j = 0; j < nS; j++) {
    const dx = points[i].x - stations[j].x, dy = points[i].y - stations[j].y;
    pairs.push({ i, j, d: dx * dx + dy * dy });
  }
  pairs.sort((a, b) => a.d - b.d);
  const gotS = new Array(nA).fill(-1), taken = new Array(nS).fill(false);
  for (const p of pairs) if (gotS[p.i] < 0 && !taken[p.j]) { gotS[p.i] = p.j; taken[p.j] = true; }
  const d2 = (a, s) => { const dx = a.x - s.x, dy = a.y - s.y; return dx * dx + dy * dy; };
  for (let pass = 0; pass < 30; pass++) {
    let improved = false;
    for (let i = 0; i < nA; i++) for (let j = i + 1; j < nA; j++) {
      const si = stations[gotS[i]], sj = stations[gotS[j]];
      if (d2(points[i], sj) + d2(points[j], si) + 0.5 < d2(points[i], si) + d2(points[j], sj)) {
        const t = gotS[i]; gotS[i] = gotS[j]; gotS[j] = t; improved = true;
      }
    }
    if (!improved) break;
  }
  return gotS;
}

// --- insertion / removal ----------------------------------------------

function addBody() {
  const b = makeBody(W * (0.35 + hash01(nextId, 5) * 0.3), H * (0.35 + hash01(nextId, 6) * 0.3), { claim: CLAIM_MIN });
  b.claim0 = CLAIM_MIN; b.claimTarget = b.baseClaim;
  bodies.push(b);
  enterScene(config.scene);
}

function removeBody() {
  const content = bodies.filter(b => !b.isVoid && !b.leaving);
  if (content.length <= 3) return;
  retireBody(content[content.length - 1]);
}

function reap() {
  const done = b => b.leaving && b.claim <= CLAIM_MIN * 1.5 && b.progress >= 0.999;
  // a dissolved void just disappears; a removed element re-layouts the rest
  const contentGone = bodies.some(b => done(b) && !b.isVoid);
  bodies = bodies.filter(b => !done(b));
  if (contentGone) enterScene(config.scene);
}

// --- the frame --------------------------------------------------------

let lastT = 0;
function tick(nowMs) {
  const now = nowMs / 1000;
  let dt = lastT ? now - lastT : 1 / 60;
  lastT = now;
  if (dt > 0.05) dt = 0.05;
  simTime += dt;
  frame++;

  reap();

  // 1. the hive moves — one spring per body, whatever its slot count
  steerBodies(bodies, dt, simTime, W, H);
  separate(bodies, dt, W, H);
  enforcePreconditions(bodies, W, H);
  easeClaims(bodies, dt, simTime, hoveredId);

  // 2. crystal: the lattice locks in only when the whole page has arrived
  // and nothing is being dragged. Any disturbance melts it back to one seed
  // per element — organic while it travels, exact once it lands. Melting is
  // quick (you touch it, it goes liquid); locking is gentle (it settles).
  const seated = bodies.filter(b => b.rect && !b.leaving);
  const settled = seated.length > 0 && !drag.body && seated.every(b => b.progress >= 0.999);
  crystalTarget = settled ? 1 : 0;
  const step = dt / (crystalTarget > crystal ? 0.55 : 0.13);   // lock 0.55 s, melt 0.13 s
  crystal += Math.max(-step, Math.min(step, crystalTarget - crystal));
  crystal = Math.max(0, Math.min(1, crystal));
  // a locked lattice sits exactly on its slots, so the grid is exact
  if (crystal === 1) for (const b of seated) { b.x = b.path.ex; b.y = b.path.ey; b.vx = 0; b.vy = 0; }

  placeSeeds(bodies);
  const subs = [];
  for (const b of bodies) for (const s of b.subs) subs.push(s);

  // 3. the field condenses — one solve, warm, exact; skipped when nothing moved.
  // Only seeds worth something enter the field. While the page is liquid a
  // body's lattice seeds sit at the claim floor and stay out, so travel
  // solves ~one seed per element; they fade in as the crystal spreads them,
  // each carving a cell interior to its own body, where the seam hides it.
  const active = subs.filter(s => s.claim >= ACTIVE_MIN);
  const seeds = active.map(s => [s.x, s.y]);
  const claims = active.map(s => s.claim);
  let sig = active.length + '|';
  for (let i = 0; i < active.length; i++) sig += (seeds[i][0] * 8 | 0) + ',' + (seeds[i][1] * 8 | 0) + ',' + (claims[i] * 1e4 | 0) + ';';
  if (active.length >= 2 && (sig !== lastSig || !solved || !solved.converged)) {
    const t0 = performance.now();
    // Newton amortized across frames: at most 3 iterations per frame, warm
    // weights carried forward, so a hard mid-transition solve costs a few
    // frames of small area error (the meter shows it) instead of one 60 ms
    // frame. The diagram is watertight at every step regardless; at rest
    // this converges to 1e-6 within a frame or two and then costs nothing.
    const sol = solveWeights(seeds, claims, domainPts(), active.map(s => s.w), { maxIter: 2 });
    solveMs = performance.now() - t0;
    lastIters = sol.iterations;
    active.forEach((s, i) => { s.w = sol.weights[i]; });
    solved = sol;
    solvedSubs = active;
    ownerOf = active.map(s => s.body.id);
    lastSig = sig;
  }

  // 4. hover: the bid run backward on this frame's truth
  hoveredId = hitTest(mouseX, mouseY);
  canvas.style.cursor = drag.body ? 'grabbing' : (hoveredId >= 0 ? 'grab' : 'default');

  // 5. outlines, then the fields' inner tessellations, then the garment
  computeOutlines();
  updateFields(dt, simTime);
  render();
  for (const b of bodies) { b.px = b.x; b.py = b.y; }

  // 6. meters
  if (frame % 12 === 0) raster = rasterCheck(solved.diagram.cells, W, H);
  const errPct = solved.maxRelErr * 100;
  meterEls.area.textContent = errPct < 1e-4 ? errPct.toExponential(1) + '%' : errPct.toFixed(3) + '%';
  meterEls.area.className = errPct <= 1e-4 ? '' : 'bad';
  meterEls.gap.textContent = raster.gap + 'px²';
  meterEls.gap.className = raster.gap <= 64 ? '' : 'bad';
  meterEls.over.textContent = raster.over + 'px²';
  meterEls.over.className = raster.over <= 64 ? '' : 'bad';
  meterEls.rect.textContent = rectPct.toFixed(rectPct >= 99.95 ? 0 : 1) + '%';
  meterEls.rect.className = rectPct >= 99.95 ? '' : 'soft';
  meterEls.seeds.textContent = solvedSubs.length + (crystal === 1 ? ' locked' : crystal === 0 ? ' liquid' : ' ' + Math.round(crystal * 100) + '%');
  meterEls.iter.textContent = lastIters + 'it ' + solveMs.toFixed(1) + 'ms';
  meterEls.iter.className = lastIters <= 10 ? '' : 'bad';

  requestAnimationFrame(tick);
}

function hitTest(x, y) {
  if (!solved || x < 0 || y < 0 || x > W || y > H) return -1;
  let best = Infinity, id = -1;
  for (let i = 0; i < solvedSubs.length; i++) {
    const s = solvedSubs[i];
    const dx = x - s.x, dy = y - s.y;
    const bid = dx * dx + dy * dy - solved.weights[i];
    if (bid < best) { best = bid; id = s.body.isVoid ? -1 : s.body.id; }
  }
  return id;
}

// One pass over the frame's tessellation: every body's union outline,
// reduced to its real corners, holes dropped. The field solve and the
// garment both read it, so they cannot disagree about a body's shape.
function computeOutlines() {
  const cells = solved.diagram.cells;
  const idx = new Map();
  solvedSubs.forEach((s, i) => { if (!idx.has(s.body)) idx.set(s.body, []); idx.get(s.body).push(i); });
  for (const b of bodies) { b.loops = null; b.bigSeed = -1; }
  let axisLen = 0, totalLen = 0;
  for (const [b, subIdx] of idx) {
    const loops = bodyOutlines(subIdx, cells, ownerOf, b.id).map(l => simplifyLoop(l)).filter(l => l.length >= 3);
    const areas = loops.map(l => Math.abs(ringArea(l)));
    const cen = loops.map(l => { let x = 0, y = 0; for (const p of l) { x += p[0]; y += p[1]; } return [x / l.length, y / l.length]; });
    b.loops = loops.filter((l, i) => !loops.some((o, j) => j !== i && areas[j] > areas[i] && pointInPolygon(cen[i][0], cen[i][1], o)));
    b.bigSeed = subIdx.reduce((a, i) => cells[i] && solved.diagram.areas[i] > solved.diagram.areas[a] ? i : a, subIdx[0]);
    for (const loop of b.loops) {
      for (let k = 0; k < loop.length; k++) {
        const p = loop[k], q = loop[(k + 1) % loop.length];
        const dx = Math.abs(q[0] - p[0]), dy = Math.abs(q[1] - p[1]), L = Math.hypot(dx, dy);
        totalLen += L; if (Math.min(dx, dy) < 0.05) axisLen += L;
      }
    }
  }
  rectPct = totalLen > 0 ? 100 * axisLen / totalLen : 100;
}

function render() {
  ctx.clearRect(0, 0, W, H);
  const halfGap = config.gap / 2;
  const anchorK = 1 - Math.exp(-9 / 60);

  // A field's members: ordinary cells of an ordinary power diagram, whose
  // domain happens to be a rectangle. Their shared edges are Voronoi
  // bisectors; their outer edges are the field's border, because that is
  // where the domain ends.
  const drawMembers = (b, fade) => {
    const g = Math.max(1.5, config.gap * 0.4);
    b.members.forEach((m, i) => {
      const c = b.inner.cells[i];
      if (!c || c.pts.length < 3) return;
      const loop = simplifyLoop(c.pts);
      if (loop.length < 3) return;
      const raw = inscribedPole(loop, m.x, m.y);
      const pts = insetPolygon(loop, Math.min(g / 2, 0.42 * raw.r));
      if (pts.length < 3) return;
      const pole = inscribedPole(pts, raw.x, raw.y);
      const r = Math.min(config.cornerRadius * 0.65, pole.r * 0.8);
      let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
      for (const p of pts) { x0 = Math.min(x0, p[0]); y0 = Math.min(y0, p[1]); x1 = Math.max(x1, p[0]); y1 = Math.max(y1, p[1]); }

      ctx.save();
      roundedPath(ctx, pts, r); ctx.clip();
      const grad = ctx.createLinearGradient(x0, y0, x1, y1);
      grad.addColorStop(0, shade(m.color, -8));
      grad.addColorStop(1, shade(m.color, -60));
      ctx.globalAlpha = (0.58 + 0.34 * b.hoverMix) * fade;
      ctx.fillStyle = grad;
      ctx.fillRect(x0, y0, x1 - x0, y1 - y0);
      ctx.restore();

      ctx.save();
      roundedPath(ctx, pts, r); ctx.clip();
      ctx.globalAlpha = fade;
      roundedPath(ctx, pts, r);
      ctx.strokeStyle = `rgba(255,255,255,${0.12 + 0.2 * b.hoverMix})`;
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.restore();

      if (pole.r > 17) {
        ctx.save();
        ctx.globalAlpha = 0.22 * fade;
        ctx.fillStyle = '#fff';
        ctx.font = `700 ${Math.round(pole.r * 0.8)}px system-ui, sans-serif`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(String(i + 1), pole.x, pole.y);
        ctx.restore();
      }
    });
  };

  const drawBody = (b) => {
    const visible = b.loops;
    if (!visible || !visible.length || b.isVoid || b.bigSeed < 0) return;
    const bigPts = solved.diagram.cells[b.bigSeed].pts;
    let sx = 0, sy = 0;
    for (const p of bigPts) { sx += p[0]; sy += p[1]; }
    sx /= bigPts.length || 1; sy /= bigPts.length || 1;

    const hv = b.hoverMix;
    const isField = !!(b.inner && b.members.length);
    const fade = Math.max(0, Math.min(1, (b.claim - CLAIM_MIN) / 0.14));
    let bx0 = Infinity, by0 = Infinity, bx1 = -Infinity, by1 = -Infinity;
    for (const l of visible) for (const p of l) { bx0 = Math.min(bx0, p[0]); by0 = Math.min(by0, p[1]); bx1 = Math.max(bx1, p[0]); by1 = Math.max(by1, p[1]); }
    let poleR = 0, anchored = false;

    for (const loop of visible) {
      const rawPole = inscribedPole(loop, sx, sy);
      // A locked element cannot reflow its neighbours on hover — a real page
      // does not either — so it lifts instead, growing into its own gap.
      const inset = Math.min(halfGap * (1 - 0.5 * hv * crystal), 0.45 * rawPole.r);
      const pts = insetPolygon(loop, inset);
      if (pts.length < 3) continue;
      const pole = inscribedPole(pts, rawPole.x, rawPole.y);
      if (!anchored && pointInPolygon(sx, sy, loop)) {
        b.anchorX += (pole.x - b.anchorX) * anchorK;
        b.anchorY += (pole.y - b.anchorY) * anchorK;
        poleR = pole.r; anchored = true;
      }

      ctx.save();
      roundedPath(ctx, pts, config.cornerRadius);
      ctx.clip();                       // the field's rigid border, in one line
      if (isField) drawMembers(b, fade);
      else {
        const grad = ctx.createLinearGradient(bx0, by0, bx1, by1);
        grad.addColorStop(0, shade(b.color, -14));
        grad.addColorStop(1, shade(b.color, -68));
        ctx.globalAlpha = (0.52 + 0.38 * hv) * fade;
        ctx.fillStyle = grad;
        ctx.fillRect(bx0, by0, bx1 - bx0, by1 - by0);
      }
      ctx.restore();

      ctx.save();
      roundedPath(ctx, pts, config.cornerRadius);
      ctx.clip();
      ctx.globalAlpha = fade;
      roundedPath(ctx, pts, config.cornerRadius);
      ctx.strokeStyle = `rgba(255,255,255,${(isField ? 0.10 : 0.16) + 0.5 * hv})`;
      ctx.lineWidth = (1 + hv * 2.4) * 2;
      if (hv > 0.02) { ctx.shadowColor = `rgba(255,255,255,${0.45 * hv})`; ctx.shadowBlur = 16 * hv; }
      ctx.stroke();
      ctx.restore();
    }

    if (!isField && anchored && poleR > 20) {
      ctx.save();
      ctx.globalAlpha = 0.16 * fade;
      ctx.fillStyle = '#fff';
      ctx.font = `700 ${Math.round(poleR * 1.4)}px system-ui, sans-serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(String(b.id + 1), b.anchorX, b.anchorY);
      ctx.globalAlpha = (0.55 + 0.45 * hv) * fade;
      ctx.font = `500 ${Math.max(11, Math.min(14, poleR * 0.24))}px system-ui, sans-serif`;
      ctx.fillText(b.name, b.anchorX, b.anchorY + poleR * 0.62);
      ctx.restore();
    }
  };

  let hovered = null;
  for (const b of bodies) { if (b.id === hoveredId) hovered = b; else drawBody(b); }
  if (hovered) drawBody(hovered);
}

/* --------------------------------------------------------------- I/O */

function resize() {
  const rect = canvas.parentElement.getBoundingClientRect();
  const oldW = W, oldH = H;
  dpr = window.devicePixelRatio || 1;
  W = Math.max(320, rect.width);
  H = Math.max(240, rect.height);
  canvas.width = W * dpr; canvas.height = H * dpr;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const oldRows = ROWS;
  ROWS = Math.max(4, Math.min(10, Math.round(COLS * H / W)));
  PW = W / COLS; PH = H / ROWS;
  if (oldW > 0 && bodies.length) {
    // A lattice scaled is still a lattice: scale every seed, path and
    // offset and the rectangles stay exact for free, mid-drag included.
    // Only a change in row count needs a new layout — and not per event.
    const kx = W / oldW, ky = H / oldH;
    for (const b of bodies) {
      b.x *= kx; b.y *= ky; b.vx = 0; b.vy = 0;
      b.anchorX *= kx; b.anchorY *= ky;
      for (const s of b.subs) { s.w *= kx * ky; }
      if (b.path) {
        b.path.sx *= kx; b.path.cx *= kx; b.path.sy *= ky; b.path.cy *= ky;
        if (b.rect) { const [ex, ey] = rectCenter(b.rect); b.path.ex = ex; b.path.ey = ey; }
        else { b.path.ex *= kx; b.path.ey *= ky; }
      }
      refreshFormation(b);          // slots re-derive from the new pitch
    }
    if (ROWS !== oldRows) {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => enterScene(config.scene), 150);
    }
  }
}
let resizeTimer = null;

function pointerPos(e) {
  const r = canvas.getBoundingClientRect();
  return [e.clientX - r.left, e.clientY - r.top];
}

canvas.addEventListener('pointermove', (e) => {
  [mouseX, mouseY] = pointerPos(e);
  if (drag.body) { drag.px = mouseX; drag.py = mouseY; }
});
canvas.addEventListener('pointerleave', () => { mouseX = -1e9; mouseY = -1e9; });
canvas.addEventListener('pointerdown', (e) => {
  const [x, y] = pointerPos(e);
  const id = hitTest(x, y);
  if (id < 0) return;
  const b = bodies.find(bb => bb.id === id);
  if (!b) return;
  // a grab melts the page: the dragged element becomes one seed and so does
  // everything else, so it moves through a liquid field, not a rigid grid
  drag.body = b; drag.px = x; drag.py = y;
  canvas.setPointerCapture(e.pointerId);
});
const endDrag = () => { drag.body = null; };
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);

document.querySelectorAll('.scene-btn').forEach(b => b.addEventListener('click', () => enterScene(b.dataset.scene)));

const bindSlider = (id, fn) => { const el = document.getElementById(id); el.addEventListener('input', () => fn(+el.value)); };
bindSlider('count', v => {
  document.getElementById('countVal').textContent = v;
  let n = bodies.filter(b => !b.isVoid && !b.leaving).length;
  while (n < v) { addBody(); n++; }
  while (n > v) { removeBody(); n--; }
});
bindSlider('gap', v => { config.gap = v; document.getElementById('gapVal').textContent = v; });
bindSlider('corner', v => { config.cornerRadius = v; document.getElementById('cornerVal').textContent = v; });
bindSlider('hover', v => { config.hoverBoost = v / 100; document.getElementById('hoverVal').textContent = (v / 100).toFixed(1) + '×'; });
bindSlider('fields', v => {
  config.fieldDensity = v / 100;
  document.getElementById('fieldsVal').textContent = v;
  enterScene(config.scene);
});
bindSlider('swirl', v => { config.swirl = v / 100; document.getElementById('swirlVal').textContent = v; });
bindSlider('stagger', v => { config.stagger = v / 100; document.getElementById('staggerVal').textContent = '.' + String(v).padStart(2, '0') + 's'; });
document.getElementById('add').addEventListener('click', () => {
  const n = Math.min(30, bodies.filter(b => !b.isVoid && !b.leaving).length + 1);
  document.getElementById('count').value = String(n);
  document.getElementById('countVal').textContent = String(n);
  addBody();
});
document.getElementById('remove').addEventListener('click', () => {
  removeBody();
  const n = Math.max(4, bodies.filter(b => !b.isVoid && !b.leaving).length);
  document.getElementById('count').value = String(n);
  document.getElementById('countVal').textContent = String(n);
});

/* --------------------------------------------------------------- START */

function init() {
  resize();
  for (let i = 0; i < config.count; i++) {
    const th = (i / config.count) * Math.PI * 2 + hash01(i, 7);
    const r = Math.min(W, H) * (0.18 + hash01(i, 8) * 0.2);
    const b = makeBody(W / 2 + Math.cos(th) * r, H / 2 + Math.sin(th) * r, { claim: 1 });
    bodies.push(b);
  }
  enterScene(config.scene);
  requestAnimationFrame(tick);
}

window.addEventListener('resize', resize);
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();

})();
</script>
</body>
</html>
