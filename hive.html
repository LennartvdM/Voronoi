<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hive</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: #0a0a0f;
    color: #e0e0e0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    display: flex; flex-direction: column;
  }
  .stage { position: relative; flex: 1; min-height: 0; }
  canvas { display: block; width: 100%; height: 100%; cursor: default; }
  .back {
    position: absolute; top: 14px; left: 16px; z-index: 3;
    color: #667; text-decoration: none; font-size: 13px; letter-spacing: .02em;
  }
  .back:hover { color: #aab; }

  /* The meter row — the theorem, watchable. Always on in this build. */
  .meters {
    position: absolute; left: 16px; bottom: 14px; z-index: 3;
    font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 11px;
    color: #5a6; background: rgba(10,10,16,.72); border: 1px solid #1e2230;
    border-radius: 6px; padding: 5px 9px; line-height: 1.5;
    pointer-events: none; white-space: nowrap;
  }
  .meters b { color: #8fca9f; font-weight: 600; }
  .meters .bad { color: #e07a6a; }

  .bar {
    display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
    padding: 10px 16px; background: #0d0d14; border-top: 1px solid #1a1a26;
    z-index: 2;
  }
  .group { display: flex; align-items: center; gap: 7px; }
  .lbl { font-size: 10px; letter-spacing: .09em; text-transform: uppercase; color: #556; }
  .scene-btn, .btn {
    background: #16161f; color: #99a; border: 1px solid #262636;
    border-radius: 6px; padding: 5px 12px; font-size: 12px; cursor: pointer;
  }
  .scene-btn:hover, .btn:hover { color: #ccd; border-color: #3a3a52; }
  .scene-btn.active { background: #2b2b48; color: #cfd0ff; border-color: #4a4a7a; }
  input[type=range] { width: 90px; accent-color: #6a6af0; }
  .val { font-size: 11px; color: #778; font-family: ui-monospace, Menlo, monospace; min-width: 3ch; }
</style>
</head>
<body>
  <div class="stage">
    <a class="back" href="index.html">&larr; Back</a>
    <canvas id="c"></canvas>
    <div class="meters" id="meters">
      area err <b id="mArea">–</b> · gap <b id="mGap">–</b> · overlap <b id="mOver">–</b> · solve <b id="mIter">–</b>
    </div>
  </div>
  <div class="bar">
    <div class="group"><span class="lbl">Scene</span>
      <button class="scene-btn" data-scene="flock">Flock</button>
      <button class="scene-btn" data-scene="bento">Bento</button>
      <button class="scene-btn" data-scene="hero">Hero</button>
      <button class="scene-btn" data-scene="sidebar">Sidebar</button>
      <button class="scene-btn" data-scene="frame">Frame</button>
    </div>
    <div class="group"><span class="lbl">Cells</span>
      <input type="range" id="count" min="4" max="42" value="14"><span class="val" id="countVal">14</span>
    </div>
    <div class="group"><span class="lbl">Gap</span>
      <input type="range" id="gap" min="0" max="28" value="10"><span class="val" id="gapVal">10</span>
    </div>
    <div class="group"><span class="lbl">Corners</span>
      <input type="range" id="corner" min="0" max="34" value="16"><span class="val" id="cornerVal">16</span>
    </div>
    <div class="group"><span class="lbl">Hover</span>
      <input type="range" id="hover" min="100" max="320" value="215"><span class="val" id="hoverVal">2.2&times;</span>
    </div>
    <div class="group">
      <button class="btn" id="add">+ Cell</button>
      <button class="btn" id="remove">&minus; Cell</button>
    </div>
  </div>

<script>
(function () {
'use strict';

/* ============================================================== SOLVE
 * Sealed. Nothing aesthetic lives in here; no knob in this section is
 * a design knob. Behavior-matched to the validated reference in SEED.md.
 *
 * The three pictures to hold:
 *  1. BIDDING. Every agent i bids |x - s_i|^2 - w_i for every point x of
 *     the canvas; every point goes to the lowest bidder. Agent i's cell
 *     is where it wins. All boundaries fall out of this one rule, so the
 *     tiling is watertight at every instant, whatever the weights are.
 *  2. AUCTION. The solver raises the weight of any agent holding less
 *     area than its claim and lowers the overweight ones. A theorem says
 *     the auction always clears: weights giving every agent exactly its
 *     claimed area exist, and damped Newton finds them from any start.
 *  3. ONE SMOOTH FUNCTION. The diagram is a single continuous function
 *     of seed positions and weights. Move a seed and the picture
 *     deforms; it cannot tear, gap, or pop.
 */

function ringArea(pts) {
  let a = 0;
  for (let k = 0, n = pts.length; k < n; k++) {
    const p = pts[k], q = pts[k + 1 === n ? 0 : k + 1];
    a += p[0] * q[1] - q[0] * p[1];
  }
  return a / 2;
}

// Sutherland-Hodgman clip of a labeled polygon to ax*x + ay*y <= b.
// labs[k] labels edge pts[k]->pts[k+1]: neighbor index >= 0 or negative wall id.
function clipHalfPlane(poly, ax, ay, b, lab) {
  const pts = poly.pts, labs = poly.labs, n = pts.length;
  const oP = [], oL = [];
  let A = pts[n - 1], aL = labs[n - 1];
  let av = ax * A[0] + ay * A[1] - b;
  for (let k = 0; k < n; k++) {
    const B = pts[k], bL = labs[k];
    const bv = ax * B[0] + ay * B[1] - b;
    if (av <= 0) {
      if (bv <= 0) { oP.push(B); oL.push(bL); }
      else {
        const t = av / (av - bv);
        oP.push([A[0] + t * (B[0] - A[0]), A[1] + t * (B[1] - A[1])]);
        oL.push(lab);
      }
    } else if (bv <= 0) {
      const t = av / (av - bv);
      oP.push([A[0] + t * (B[0] - A[0]), A[1] + t * (B[1] - A[1])]);
      oL.push(aL);
      oP.push(B); oL.push(bL);
    }
    A = B; av = bv; aL = bL;
  }
  return { pts: oP, labs: oL };
}

// Agent i beats j at x iff x.(s_j - s_i) <= (pot_j - pot_i)/2, pot_k = |s_k|^2 - w_k.
function computeDiagram(seeds, weights, boundsPts) {
  const n = seeds.length;
  const cells = new Array(n);
  const areas = new Float64Array(n);
  const baseLabs = boundsPts.map((_, k) => -1 - k);
  const pot = new Float64Array(n);
  for (let i = 0; i < n; i++) {
    pot[i] = seeds[i][0] * seeds[i][0] + seeds[i][1] * seeds[i][1] - weights[i];
  }
  for (let i = 0; i < n; i++) {
    let poly = { pts: boundsPts, labs: baseLabs };
    for (let j = 0; j < n; j++) {
      if (j === i || poly.pts.length < 3) continue;
      poly = clipHalfPlane(poly,
        seeds[j][0] - seeds[i][0], seeds[j][1] - seeds[i][1],
        (pot[j] - pot[i]) / 2, j);
    }
    if (poly.pts.length < 3) { cells[i] = { pts: [], labs: [] }; areas[i] = 0; }
    else { cells[i] = poly; areas[i] = Math.abs(ringArea(poly.pts)); }
  }
  return { cells, areas };
}

// Jacobian d(areas)/d(weights): weighted graph Laplacian read off shared edges.
// Rows sum to zero — only weight differences matter.
function buildJacobian(diagram, seeds) {
  const n = seeds.length;
  const A = [];
  for (let i = 0; i < n; i++) A.push(new Float64Array(n));
  for (let i = 0; i < n; i++) {
    const { pts, labs } = diagram.cells[i];
    for (let k = 0, m = pts.length; k < m; k++) {
      const j = labs[k];
      if (j < 0) continue;
      const p = pts[k], q = pts[k + 1 === m ? 0 : k + 1];
      const L = Math.hypot(q[0] - p[0], q[1] - p[1]);
      const d = Math.hypot(seeds[j][0] - seeds[i][0], seeds[j][1] - seeds[i][1]);
      A[i][j] -= L / (2 * d);
    }
  }
  for (let i = 0; i < n; i++) {
    for (let j = i + 1; j < n; j++) A[i][j] = A[j][i] = (A[i][j] + A[j][i]) / 2;
  }
  for (let i = 0; i < n; i++) {
    let s = 0;
    for (let j = 0; j < n; j++) if (j !== i) s += A[i][j];
    A[i][i] = -s;
  }
  return A;
}

// Solve A x = g with x[n-1] pinned to 0 (removes the shared-constant nullspace).
function solvePinned(A, g) {
  const n = g.length, m = n - 1;
  const M = [];
  for (let i = 0; i < m; i++) {
    const row = new Float64Array(m + 1);
    for (let j = 0; j < m; j++) row[j] = A[i][j];
    row[m] = g[i];
    M.push(row);
  }
  for (let c = 0; c < m; c++) {
    let piv = c;
    for (let r = c + 1; r < m; r++) if (Math.abs(M[r][c]) > Math.abs(M[piv][c])) piv = r;
    if (piv !== c) { const t = M[c]; M[c] = M[piv]; M[piv] = t; }
    const pv = M[c][c] || 1e-30;
    for (let r = c + 1; r < m; r++) {
      const f = M[r][c] / pv;
      if (f === 0) continue;
      for (let j = c; j <= m; j++) M[r][j] -= f * M[c][j];
    }
  }
  const x = new Float64Array(n);
  for (let c = m - 1; c >= 0; c--) {
    let s = M[c][m];
    for (let j = c + 1; j < m; j++) s -= M[c][j] * x[j];
    x[c] = s / (M[c][c] || 1e-30);
  }
  return x;
}

function norm2(v) { let s = 0; for (const x of v) s += x * x; return Math.sqrt(s); }
function minOf(v) { let m = Infinity; for (const x of v) if (x < m) m = x; return m; }

// Damped Newton on the concave dual, KMT floor + sufficient-decrease.
function solveWeights(seeds, targets, boundsPts, w0, opts = {}) {
  const n = seeds.length;
  const tol = opts.tol !== undefined ? opts.tol : 1e-6;
  const maxIter = opts.maxIter !== undefined ? opts.maxIter : 50;
  const domainArea = Math.abs(ringArea(boundsPts));

  let tSum = 0;
  for (const t of targets) {
    if (!(t > 0)) throw new Error('every claim must be positive');
    tSum += t;
  }
  const tgt = Float64Array.from(targets, t => t * domainArea / tSum);

  let w = w0 ? Float64Array.from(w0) : new Float64Array(n);
  let evals = 0;
  let diag = computeDiagram(seeds, w, boundsPts); evals++;
  if (w0 && minOf(diag.areas) <= 0) {
    // Stale warm start: fall back to plain Voronoi (all-zero weights), which
    // gives every interior seed a nonempty cell.
    w = new Float64Array(n);
    diag = computeDiagram(seeds, w, boundsPts); evals++;
  }

  const eps0 = 0.5 * Math.min(minOf(tgt), minOf(diag.areas));

  const g = new Float64Array(n);
  const refreshResidual = () => {
    let mr = 0;
    for (let i = 0; i < n; i++) {
      g[i] = tgt[i] - diag.areas[i];
      const r = Math.abs(g[i]) / tgt[i];
      if (r > mr) mr = r;
    }
    return mr;
  };
  let maxRel = refreshResidual();
  let gn = norm2(g);
  let iter = 0;
  let converged = maxRel <= tol;

  while (!converged && iter < maxIter) {
    const dw = solvePinned(buildJacobian(diag, seeds), g);
    let accepted = false;
    let t = 1;
    for (let bt = 0; bt < 40 && !accepted; bt++, t /= 2) {
      const wt = new Float64Array(n);
      for (let i = 0; i < n; i++) wt[i] = w[i] + t * dw[i];
      const dt = computeDiagram(seeds, wt, boundsPts); evals++;
      let gnT = 0, mn = Infinity;
      for (let i = 0; i < n; i++) {
        const gi = tgt[i] - dt.areas[i];
        gnT += gi * gi;
        if (dt.areas[i] < mn) mn = dt.areas[i];
      }
      gnT = Math.sqrt(gnT);
      if (mn >= eps0 && gnT <= (1 - t / 2) * gn) {
        w = wt; diag = dt; gn = gnT; accepted = true;
      }
    }
    iter++;
    if (!accepted) break; // diagram is still watertight; areas merely drift
    maxRel = refreshResidual();
    converged = maxRel <= tol;
  }

  let mean = 0;
  for (let i = 0; i < n; i++) mean += w[i];
  mean /= n;
  for (let i = 0; i < n; i++) w[i] -= mean;

  return { weights: w, iterations: iter, evals, maxRelErr: maxRel, converged, diagram: diag };
}

/* ============================================================== AGENTS
 * The hive layer. Agents own position, area claim, and intent — the math
 * above never touches any of this. All rates are per second; dt is
 * seconds everywhere in this file.
 */

const CLAIM_MIN = 0.02;        // relative claim floor — zero never reaches the solve
const SEED_MARGIN = 12;        // seeds stay strictly inside the domain by this much
const SEED_MIN_SEP = 5;        // pairwise epsilon-separation, enforced upstream

const PALETTE = [
  '#6366f1', '#06b6d4', '#10b981', '#f59e0b', '#ec4899', '#8b5cf6',
  '#eab308', '#3b82f6', '#ef4444', '#14b8a6', '#a855f7', '#f97316',
  '#64748b', '#d946ef', '#84cc16', '#dc2626', '#2563eb', '#d97706',
  '#7c3aed', '#0d9488', '#e11d48', '#65a30d', '#4f46e5', '#fb923c',
  '#22d3d8', '#c026d3', '#a16207', '#475569', '#be123c', '#059669',
  '#9333ea', '#0891b2', '#ca8a04', '#db2777', '#16a34a', '#ea580c',
  '#4338ca', '#0e7490', '#b91c1c', '#15803d', '#7e22ce', '#c2410c'
];
const NAMES = [
  'Drift', 'Ember', 'Tide', 'Moss', 'Petal', 'Aurora', 'Dune', 'Jazz',
  'Coal', 'Mint', 'Haze', 'Coral', 'Storm', 'Neon', 'Sage', 'Ruby',
  'Sky', 'Amber', 'Dusk', 'Reef', 'Rose', 'Zest', 'Night', 'Peach',
  'Wave', 'Pulse', 'Bronze', 'Steel', 'Crimson', 'Fern', 'Iris', 'Ash',
  'Lark', 'Plum', 'Glow', 'Frost', 'Ochre', 'Kelp', 'Vela', 'Onyx',
  'Milo', 'Juno'
];

// Deterministic per-identity variation (no Math.random on steady paths,
// so a resize can never scramble the flock).
function hash01(i, k) {
  const x = Math.sin(i * 127.1 + k * 311.7) * 43758.5453;
  return x - Math.floor(x);
}

let nextId = 0;
function makeAgent(x, y, opts = {}) {
  const id = opts.id !== undefined ? opts.id : nextId++;
  return {
    id,
    name: NAMES[id % NAMES.length],
    color: PALETTE[id % PALETTE.length],
    isVoid: !!opts.isVoid,

    // position + motion (the agent's sovereign state)
    x, y, vx: 0, vy: 0,
    station: null,             // {x,y} when a scene has seated this agent
    wanderPhase: hash01(id, 1) * Math.PI * 2,

    // claims — relative units; the solve rescales internally
    baseClaim: opts.baseClaim !== undefined ? opts.baseClaim
      : 0.8 + hash01(id, 2) * 0.7,   // some cells are simply bigger characters
    claim: opts.claim !== undefined ? opts.claim : CLAIM_MIN,
    targetClaim: opts.targetClaim !== undefined ? opts.targetClaim : 1,
    leaving: false,            // ramping out; deleted at the floor

    // garment state (display-only)
    anchorX: x, anchorY: y,    // smoothed inscribed pole — content rides this
    hoverMix: 0,
  };
}

// --- steering ---------------------------------------------------------

function steerAgents(agents, dt, t, W, H, mode) {
  for (const a of agents) {
    if (a === drag.agent) continue; // a dragged agent is in the owner's hand

    let ax = 0, ay = 0;
    if (a.station) {
      // Arrive: a lightly under-damped spring — settles in about a second
      // with a small overshoot, which is most of what reads as "alive".
      const k1 = 24 * (0.85 + 0.3 * hash01(a.id, 3));
      const k2 = 8.6;
      // the station itself breathes a little
      const bx = a.station.x + Math.sin(t * 0.6 + a.id * 1.7) * 2.5;
      const by = a.station.y + Math.cos(t * 0.5 + a.id * 2.3) * 2.5;
      ax += (bx - a.x) * k1 - a.vx * k2;
      ay += (by - a.y) * k1 - a.vy * k2;
    } else {
      // Free drift: wander + weak centering. Separation is below, shared.
      a.wanderPhase += (Math.sin(t * 0.7 + a.id * 2.1) + Math.sin(t * 1.31 + a.id * 0.73)) * 0.9 * dt;
      const ws = 46;
      ax += Math.cos(a.wanderPhase) * ws - a.vx * 1.4;
      ay += Math.sin(a.wanderPhase) * ws - a.vy * 1.4;
      ax += (W / 2 - a.x) * 0.06;
      ay += (H / 2 - a.y) * 0.06;
      // soft Lloyd: drift toward your own cell's pole — the hive reading its
      // field. Settles spiky cells into rounder ones without a scene's help.
      ax += (a.anchorX - a.x) * 0.9;
      ay += (a.anchorY - a.y) * 0.9;
    }
    a.vx += ax * dt;
    a.vy += ay * dt;

    const sp = Math.hypot(a.vx, a.vy), maxSp = a.station ? 900 : 130;
    if (sp > maxSp) { a.vx *= maxSp / sp; a.vy *= maxSp / sp; }
    a.x += a.vx * dt;
    a.y += a.vy * dt;
  }

  // Soft mutual separation in free drift (keeps the flock loose, not a knot).
  if (mode === 'flock') {
    const R = 110, F = 240;
    for (let i = 0; i < agents.length; i++) {
      for (let j = i + 1; j < agents.length; j++) {
        const A = agents[i], B = agents[j];
        const dx = B.x - A.x, dy = B.y - A.y;
        const d = Math.hypot(dx, dy);
        if (d > 0 && d < R) {
          const f = F * (1 - d / R) * dt / d;
          if (A !== drag.agent) { A.x -= dx * f; A.y -= dy * f; }
          if (B !== drag.agent) { B.x += dx * f; B.y += dy * f; }
        }
      }
    }
  }
}

// --- preconditions: guaranteed here, every frame, before the solve ----

function enforcePreconditions(agents, W, H) {
  for (const a of agents) {
    a.x = Math.min(W - SEED_MARGIN, Math.max(SEED_MARGIN, a.x));
    a.y = Math.min(H - SEED_MARGIN, Math.max(SEED_MARGIN, a.y));
  }
  // pairwise epsilon-separation (coincident seeds fail silently in the solve)
  for (let i = 0; i < agents.length; i++) {
    for (let j = i + 1; j < agents.length; j++) {
      const A = agents[i], B = agents[j];
      let dx = B.x - A.x, dy = B.y - A.y;
      let d = Math.hypot(dx, dy);
      if (d < SEED_MIN_SEP) {
        if (d < 1e-6) { dx = 1; dy = 0; d = 1; } // exact overlap: pick a direction
        const push = (SEED_MIN_SEP - d) / 2 / d;
        const bx = dx * push, by = dy * push;
        if (A !== drag.agent) { A.x -= bx; A.y -= by; }
        if (B !== drag.agent) { B.x += bx; B.y += by; }
        else { A.x -= bx * 2; A.y -= by * 2; }
      }
    }
  }
  for (const a of agents) { // clamp again in case separation pushed outward
    a.x = Math.min(W - SEED_MARGIN, Math.max(SEED_MARGIN, a.x));
    a.y = Math.min(H - SEED_MARGIN, Math.max(SEED_MARGIN, a.y));
  }
}

// --- claims -----------------------------------------------------------

function easeClaims(agents, dt, t, hoverBoost, hoveredId) {
  const k = 1 - Math.exp(-6 * dt);
  for (const a of agents) {
    // hover is a temporary area claim — the one verb, again
    const hm = 1 - Math.exp(-(a.id === hoveredId ? 10 : 5) * dt);
    a.hoverMix += ((a.id === hoveredId ? 1 : 0) - a.hoverMix) * hm;

    let target = a.leaving ? CLAIM_MIN : a.targetClaim;
    if (!a.station && !a.isVoid && !a.leaving) {
      target *= 1 + 0.05 * Math.sin(t * 0.8 + a.id * 2.9); // idle breathing
    }
    a.claim += (target - a.claim) * k;
    if (a.claim < CLAIM_MIN) a.claim = CLAIM_MIN;
  }
}

/* ============================================================== SCENES
 * A scene is a claim table: stations with claims, some of them void.
 * Pure (W, H, count) -> { content: [{x,y,claim}], voids: [{x,y,claim}] }.
 * Assignment of agents to stations is greedy nearest + 2-opt.
 */

const scenes = {
  flock: null, // no stations: agents drift on their base claims

  bento(W, H, n) {
    const cols = Math.ceil(Math.sqrt(n * W / H));
    const rows = Math.ceil(n / cols);
    const content = [];
    for (let i = 0; i < n; i++) {
      const c = i % cols, r = Math.floor(i / cols);
      const rowCount = (r === rows - 1) ? n - cols * (rows - 1) : cols;
      const cw = W / rowCount;
      content.push({
        x: cw * ((i - r * cols) + 0.5),
        y: (H / rows) * (r + 0.5),
        claim: 1 + 0.55 * ((i * 7) % 3) / 2, // deterministic size hierarchy
      });
    }
    return { content, voids: [] };
  },

  hero(W, H, n) {
    const content = [{ x: W * 0.56, y: H * 0.46, claim: n * 0.42 }]; // the hero
    const m = n - 1;
    for (let i = 0; i < m; i++) {
      const t = m === 1 ? 0.5 : i / (m - 1);
      // one run along the top, then down the right, then along the bottom
      let x, y;
      if (t < 0.38) { const u = t / 0.38; x = W * (0.34 + u * 0.56); y = H * 0.1; }
      else if (t < 0.62) { const u = (t - 0.38) / 0.24; x = W * 0.92; y = H * (0.24 + u * 0.5); }
      else { const u = (t - 0.62) / 0.38; x = W * (0.9 - u * 0.56); y = H * 0.88; }
      content.push({ x, y, claim: 1 });
    }
    return { content, voids: [{ x: W * 0.13, y: H * 0.5, claim: n * 0.28 }] };
  },

  sidebar(W, H, n) {
    const content = [];
    const rows = Math.ceil(n / 2);
    for (let i = 0; i < n; i++) {
      const col = i % 2, row = Math.floor(i / 2);
      content.push({
        x: W * (0.09 + col * 0.14),
        y: H * ((row + 0.5) / rows),
        claim: 1,
      });
    }
    // mk8's sidebar crushed twelve cells into slivers with a hand-tuned void
    // weight. Here the void simply claims 55%; content divides 45% exactly.
    return { content, voids: [{ x: W * 0.66, y: H * 0.5, claim: n * 1.22 }] };
  },

  frame(W, H, n) {
    const content = [];
    const perim = 2 * (W + H);
    for (let i = 0; i < n; i++) {
      const t = (i / n) * perim;
      let x, y;
      if (t < W) { x = t; y = H * 0.09; }
      else if (t < W + H) { x = W * 0.92; y = t - W; }
      else if (t < 2 * W + H) { x = 2 * W + H - t; y = H * 0.91; }
      else { x = W * 0.08; y = perim - t; }
      content.push({
        x: Math.min(W * 0.92, Math.max(W * 0.08, x)),
        y: Math.min(H * 0.91, Math.max(H * 0.09, y)),
        claim: 1,
      });
    }
    return { content, voids: [{ x: W / 2, y: H / 2, claim: n * 0.72 }] };
  },
};

// Greedy nearest assignment + 2-opt on squared travel. Policy, not law.
function assignStations(agents, stations) {
  const nA = agents.length, nS = stations.length;
  const pairs = [];
  for (let i = 0; i < nA; i++) {
    for (let j = 0; j < nS; j++) {
      const dx = agents[i].x - stations[j].x, dy = agents[i].y - stations[j].y;
      pairs.push({ i, j, d: dx * dx + dy * dy });
    }
  }
  pairs.sort((a, b) => a.d - b.d);
  const gotS = new Array(nA).fill(-1), taken = new Array(nS).fill(false);
  for (const p of pairs) {
    if (gotS[p.i] < 0 && !taken[p.j]) { gotS[p.i] = p.j; taken[p.j] = true; }
  }
  const d2 = (a, s) => {
    const dx = a.x - s.x, dy = a.y - s.y; return dx * dx + dy * dy;
  };
  for (let pass = 0; pass < 30; pass++) {
    let improved = false;
    for (let i = 0; i < nA; i++) {
      for (let j = i + 1; j < nA; j++) {
        const si = stations[gotS[i]], sj = stations[gotS[j]];
        if (d2(agents[i], sj) + d2(agents[j], si) + 0.5 <
            d2(agents[i], si) + d2(agents[j], sj)) {
          const t = gotS[i]; gotS[i] = gotS[j]; gotS[j] = t;
          improved = true;
        }
      }
    }
    if (!improved) break;
  }
  return gotS;
}

/* ============================================================== GARMENT
 * Display only. Everything here stays inside the solved polygon and is
 * never fed back into agents or the solve.
 */

// Cells from the solve are convex, so an exact inset is just clipping the
// cell by each of its own edges pushed inward.
function insetConvex(pts, d) {
  if (d <= 0 || pts.length < 3) return pts;
  const orient = ringArea(pts) > 0 ? 1 : -1;
  let poly = { pts, labs: pts.map(() => 0) };
  const n = pts.length;
  for (let k = 0; k < n; k++) {
    const p = pts[k], q = pts[(k + 1) % n];
    let nx = (q[1] - p[1]) * orient, ny = (p[0] - q[0]) * orient;
    const len = Math.hypot(nx, ny);
    if (len < 1e-9) continue;
    nx /= len; ny /= len; // outward normal
    const b = nx * p[0] + ny * p[1] - d; // keep nx*x + ny*y <= b
    poly = clipHalfPlane(poly, nx, ny, b, 0);
    if (poly.pts.length < 3) return [];
  }
  return poly.pts;
}

// Rounded path with the tangent budgeted, not just the radius: the arc's
// tangent length is r/tan(theta/2), and it must not consume more than half
// of either adjoining edge — mk8 clamped the radius alone and acute cells
// collapsed into lens shapes.
function roundedPath(ctx, pts, r) {
  const n = pts.length;
  ctx.beginPath();
  if (r <= 0.5) {
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (let k = 1; k < n; k++) ctx.lineTo(pts[k][0], pts[k][1]);
    ctx.closePath();
    return;
  }
  let started = false;
  for (let k = 0; k < n; k++) {
    const p0 = pts[(k + n - 1) % n], p1 = pts[k], p2 = pts[(k + 1) % n];
    const v1x = p0[0] - p1[0], v1y = p0[1] - p1[1];
    const v2x = p2[0] - p1[0], v2y = p2[1] - p1[1];
    const l1 = Math.hypot(v1x, v1y), l2 = Math.hypot(v2x, v2y);
    if (l1 < 1e-6 || l2 < 1e-6) continue;
    const dot = (v1x * v2x + v1y * v2y) / (l1 * l2);
    const theta = Math.acos(Math.min(1, Math.max(-1, dot)));
    const tanHalf = Math.tan(theta / 2);
    const tang = Math.min(r / (tanHalf || 1e9), l1 / 2, l2 / 2); // the budget
    const rr = tang * tanHalf;
    const t1x = p1[0] + (v1x / l1) * tang, t1y = p1[1] + (v1y / l1) * tang;
    const t2x = p1[0] + (v2x / l2) * tang, t2y = p1[1] + (v2y / l2) * tang;
    if (!started) { ctx.moveTo(t1x, t1y); started = true; }
    else ctx.lineTo(t1x, t1y);
    if (rr > 0.1) ctx.arcTo(p1[0], p1[1], t2x, t2y, rr);
    else ctx.lineTo(t2x, t2y);
  }
  ctx.closePath();
}

// Inscribed pole (approximate Chebyshev center): the content anchor.
// Hill-climb on min distance to edges from the centroid; convex cells make
// this well-behaved and cheap.
function inscribedPole(pts) {
  const n = pts.length;
  let cx = 0, cy = 0;
  for (const p of pts) { cx += p[0]; cy += p[1]; }
  cx /= n; cy /= n;
  const minDist = (x, y) => {
    let md = Infinity;
    for (let k = 0; k < n; k++) {
      const p = pts[k], q = pts[(k + 1) % n];
      const ex = q[0] - p[0], ey = q[1] - p[1];
      const L = Math.hypot(ex, ey) || 1e-9;
      md = Math.min(md, Math.abs((x - p[0]) * ey - (y - p[1]) * ex) / L);
    }
    return md;
  };
  let best = minDist(cx, cy), step = Math.sqrt(best) * 2 + 4;
  for (let it = 0; it < 14; it++) {
    let moved = false;
    for (const [dx, dy] of [[step, 0], [-step, 0], [0, step], [0, -step]]) {
      const d = minDist(cx + dx, cy + dy);
      if (d > best) { best = d; cx += dx; cy += dy; moved = true; break; }
    }
    if (!moved) step /= 2;
    if (step < 0.5) break;
  }
  return { x: cx, y: cy, r: best };
}

function shade(hex, amt) {
  const num = parseInt(hex.slice(1), 16);
  const r = Math.min(255, Math.max(0, (num >> 16) + amt));
  const g = Math.min(255, Math.max(0, ((num >> 8) & 0xff) + amt));
  const b = Math.min(255, Math.max(0, (num & 0xff) + amt));
  return `#${((r << 16) | (g << 8) | b).toString(16).padStart(6, '0')}`;
}

/* ============================================================== METERS
 * The theorem, watchable. gap/overlap by exact scanline rasterization of
 * the SOLVED polygons (pre-garment) — convex cells, no antialiasing noise.
 */

const meterEls = {
  area: document.getElementById('mArea'),
  gap: document.getElementById('mGap'),
  over: document.getElementById('mOver'),
  iter: document.getElementById('mIter'),
};

function rasterCheck(cells, W, H) {
  const S = 2; // rasterize at half resolution; report px^2 at full scale
  // sample only pixel centers STRICTLY inside the domain — a center exactly
  // on the boundary crosses no edges and would count as a phantom gap row
  const gw = Math.floor((W - S / 2 - 1e-6) / S) + 1;
  const gh = Math.floor((H - S / 2 - 1e-6) / S) + 1;
  const cov = new Uint8Array(gw * gh);
  for (const cell of cells) {
    const pts = cell.pts;
    if (pts.length < 3) continue;
    let y0 = Infinity, y1 = -Infinity;
    for (const p of pts) { y0 = Math.min(y0, p[1]); y1 = Math.max(y1, p[1]); }
    // sample at pixel centers (ry*S + S/2); a pixel belongs to whichever cell
    // its center falls in, so shared boundaries never double- or zero-count
    const r0 = Math.max(0, Math.ceil((y0 - S / 2) / S));
    const r1 = Math.min(gh - 1, Math.floor((y1 - S / 2) / S));
    for (let ry = r0; ry <= r1; ry++) {
      const y = ry * S + S / 2;
      let xin = Infinity, xout = -Infinity;
      for (let k = 0; k < pts.length; k++) {
        const p = pts[k], q = pts[(k + 1) % pts.length];
        if ((p[1] <= y) !== (q[1] <= y)) {
          const x = p[0] + (y - p[1]) * (q[0] - p[0]) / (q[1] - p[1]);
          xin = Math.min(xin, x); xout = Math.max(xout, x);
        }
      }
      if (xin > xout) continue;
      const c0 = Math.max(0, Math.ceil((xin - S / 2) / S));
      const c1 = Math.min(gw - 1, Math.floor((xout - S / 2) / S));
      for (let cx2 = c0; cx2 <= c1; cx2++) cov[ry * gw + cx2]++;
    }
  }
  let gap = 0, over = 0;
  for (let k = 0; k < cov.length; k++) {
    if (cov[k] === 0) gap++;
    else if (cov[k] > 1) over++;
  }
  return { gap: gap * S * S, over: over * S * S };
}

/* ============================================================== KERNEL LOOP */

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, dpr = 1;

const config = {
  count: 14,
  gap: 10,
  cornerRadius: 16,
  hoverBoost: 2.15,   // hover multiplies the hovered agent's claim
  scene: 'bento',
};

let agents = [];
let solved = null;          // the frame's ONE authoritative tessellation
let weights = null;         // warm-start memory, parallel to agents[]
let hoveredId = -1;
const drag = { agent: null, px: 0, py: 0 };
let mouseX = -1e9, mouseY = -1e9;
let simTime = 0;
let raster = { gap: 0, over: 0 };
let frame = 0;
let solveMs = 0;

function domainPts() { return [[0, 0], [W, 0], [W, H], [0, H]]; }

// --- scene entry: the one verb, spoken n times ------------------------

function enterScene(name) {
  config.scene = name;
  document.querySelectorAll('.scene-btn').forEach(b =>
    b.classList.toggle('active', b.dataset.scene === name));

  const contentAgents = agents.filter(a => !a.isVoid && !a.leaving);
  const spec = scenes[name] ? scenes[name](W, H, contentAgents.length) : null;

  if (!spec) { // flock: release stations, retire voids, resume base claims
    for (const a of agents) {
      a.station = null;
      if (a.isVoid) a.leaving = true;
      else a.targetClaim = a.baseClaim;
    }
    return;
  }

  const gotS = assignStations(contentAgents, spec.content);
  contentAgents.forEach((a, k) => {
    const s = spec.content[gotS[k]];
    a.station = { x: s.x, y: s.y };
    a.targetClaim = s.claim;
    a.leaving = false;
  });

  // Reconcile void agents against void stations: reuse, spawn, retire.
  const liveVoids = agents.filter(a => a.isVoid && !a.leaving);
  spec.voids.forEach((s, k) => {
    let v = liveVoids[k];
    if (!v) {
      v = makeAgent(s.x + hash01(k, 9) * 8, s.y + hash01(k, 10) * 8,
        { isVoid: true, claim: CLAIM_MIN });
      agents.push(v);
    }
    v.station = { x: s.x, y: s.y };
    v.targetClaim = s.claim;
    v.leaving = false;
  });
  for (let k = spec.voids.length; k < liveVoids.length; k++) liveVoids[k].leaving = true;
}

// --- insertion / removal: the same math, per SEED ---------------------

function addAgent(x, y) {
  const a = makeAgent(
    x !== undefined ? x : W * (0.35 + hash01(nextId, 5) * 0.3),
    y !== undefined ? y : H * (0.35 + hash01(nextId, 6) * 0.3),
    { claim: CLAIM_MIN });
  a.targetClaim = a.baseClaim;
  agents.push(a);
  enterScene(config.scene); // reseat everyone around the newcomer
}

function removeAgent() {
  const content = agents.filter(a => !a.isVoid && !a.leaving);
  if (content.length <= 3) return;
  content[content.length - 1].leaving = true;
  // stations recompute once it is gone (see reap() below)
}

function reap() {
  let reaped = false;
  agents = agents.filter(a => {
    if (a.leaving && a.claim <= CLAIM_MIN * 1.05) { reaped = true; return false; }
    return true;
  });
  if (reaped) enterScene(config.scene);
}

// --- the frame --------------------------------------------------------

let lastT = 0;
function tick(nowMs) {
  const now = nowMs / 1000;                     // seconds — the one convention
  let dt = lastT ? now - lastT : 1 / 60;
  lastT = now;
  if (dt > 0.05) dt = 0.05;
  simTime += dt;
  frame++;

  reap();

  // 1. the hive moves
  steerAgents(agents, dt, simTime, W, H, config.scene);
  if (drag.agent) { drag.agent.x = drag.px; drag.agent.y = drag.py; }
  enforcePreconditions(agents, W, H);
  easeClaims(agents, dt, simTime, config.hoverBoost, hoveredId);

  // 2. the field condenses: one solve, warm-started, exact
  const seeds = agents.map(a => [a.x, a.y]);
  const claims = agents.map(a =>
    a.claim * (a.id === hoveredId || a.hoverMix > 0.001
      ? 1 + (config.hoverBoost - 1) * a.hoverMix : 1));
  const w0 = (weights && weights.length === agents.length) ? weights : null;
  const t0 = performance.now();
  const sol = solveWeights(seeds, claims, domainPts(), w0);
  solveMs = performance.now() - t0;
  weights = sol.weights;
  solved = sol;

  // 3. hover = the bid run backward on this frame's truth
  hoveredId = hitTest(mouseX, mouseY);
  canvas.style.cursor = drag.agent ? 'grabbing' : (hoveredId >= 0 ? 'grab' : 'default');

  // 4. garment + render
  render();

  // 5. meters
  if (frame % 12 === 0) raster = rasterCheck(sol.diagram.cells, W, H);
  const errPct = sol.maxRelErr * 100;
  meterEls.area.textContent = errPct < 1e-4 ? errPct.toExponential(1) + '%' : errPct.toFixed(3) + '%';
  meterEls.area.className = errPct <= 1e-4 ? '' : 'bad';
  meterEls.gap.textContent = raster.gap + 'px²';
  meterEls.gap.className = raster.gap <= 64 ? '' : 'bad';
  meterEls.over.textContent = raster.over + 'px²';
  meterEls.over.className = raster.over <= 64 ? '' : 'bad';
  meterEls.iter.textContent = sol.iterations + 'it ' + solveMs.toFixed(2) + 'ms';
  meterEls.iter.className = sol.iterations <= 10 ? '' : 'bad';

  requestAnimationFrame(tick);
}

// A point's owner is its lowest bidder — same weights the frame renders.
function hitTest(x, y) {
  if (!solved || x < 0 || y < 0 || x > W || y > H) return -1;
  let best = Infinity, id = -1;
  for (let i = 0; i < agents.length; i++) {
    const a = agents[i];
    const dx = x - a.x, dy = y - a.y;
    const bid = dx * dx + dy * dy - solved.weights[i];
    if (bid < best) { best = bid; id = a.isVoid ? -1 : a.id; }
  }
  return id;
}

function render() {
  ctx.clearRect(0, 0, W, H);
  const cells = solved.diagram.cells;
  const halfGap = config.gap / 2;

  let hoveredIdx = -1;
  for (let i = 0; i < agents.length; i++) {
    if (agents[i].id === hoveredId) { hoveredIdx = i; break; }
  }

  const drawCell = (i) => {
    const a = agents[i];
    if (a.isVoid) return;
    const raw = cells[i].pts;
    if (raw.length < 3) return;
    const pts = insetConvex(raw, halfGap);
    if (pts.length < 3) return;

    const pole = inscribedPole(pts);
    const k = 1 - Math.exp(-9 * (1 / 60)); // anchor smoothing, calmer than the cell
    a.anchorX += (pole.x - a.anchorX) * k;
    a.anchorY += (pole.y - a.anchorY) * k;

    const hv = a.hoverMix;
    const fade = a.leaving || a.claim < 0.12 ? Math.max(0, (a.claim - CLAIM_MIN) / 0.1) : 1;

    ctx.save();
    roundedPath(ctx, pts, config.cornerRadius);
    ctx.clip();

    // fill: the cell's color, dimmed at rest, lifted on hover
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (const p of pts) {
      x0 = Math.min(x0, p[0]); y0 = Math.min(y0, p[1]);
      x1 = Math.max(x1, p[0]); y1 = Math.max(y1, p[1]);
    }
    const grad = ctx.createLinearGradient(x0, y0, x1, y1);
    grad.addColorStop(0, shade(a.color, -14));
    grad.addColorStop(1, shade(a.color, -68));
    ctx.globalAlpha = (0.52 + 0.38 * hv) * fade;
    ctx.fillStyle = grad;
    ctx.fillRect(x0, y0, x1 - x0, y1 - y0);

    // identity: a big quiet numeral, and the agent's name at the pole
    const rr = Math.min(pole.r, (y1 - y0) / 2);
    if (rr > 22) {
      ctx.globalAlpha = 0.16 * fade;
      ctx.fillStyle = '#fff';
      ctx.font = `700 ${Math.round(rr * 1.5)}px system-ui, sans-serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(String(a.id + 1), a.anchorX, a.anchorY);
      ctx.globalAlpha = (0.55 + 0.45 * hv) * fade;
      ctx.font = `500 ${Math.max(11, Math.min(14, rr * 0.24))}px system-ui, sans-serif`;
      ctx.fillText(a.name, a.anchorX, a.anchorY + rr * 0.62);
    }

    // inner stroke: clip and stroke the same path at doubled width, so
    // exactly half the line lands inside — the one mk8 trick worth keeping
    ctx.globalAlpha = fade;
    roundedPath(ctx, pts, config.cornerRadius);
    ctx.strokeStyle = `rgba(255,255,255,${0.16 + 0.5 * hv})`;
    ctx.lineWidth = (1 + hv * 2.4) * 2;
    if (hv > 0.02) {
      ctx.shadowColor = `rgba(255,255,255,${0.45 * hv})`;
      ctx.shadowBlur = 16 * hv;
    }
    ctx.stroke();
    ctx.restore();
  };

  for (let i = 0; i < agents.length; i++) if (i !== hoveredIdx) drawCell(i);
  if (hoveredIdx >= 0) drawCell(hoveredIdx); // hovered draws last
}

/* --------------------------------------------------------------- I/O */

function resize() {
  const rect = canvas.parentElement.getBoundingClientRect();
  const oldW = W, oldH = H;
  dpr = window.devicePixelRatio || 1;
  W = Math.max(320, rect.width);
  H = Math.max(240, rect.height);
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (oldW > 0 && agents.length) {
    for (const a of agents) { // carry the flock along; never re-roll it
      a.x *= W / oldW; a.y *= H / oldH;
      a.anchorX *= W / oldW; a.anchorY *= H / oldH;
    }
    enterScene(config.scene); // stations re-derive from the new canvas
  }
}

function pointerPos(e) {
  const r = canvas.getBoundingClientRect();
  return [e.clientX - r.left, e.clientY - r.top];
}

canvas.addEventListener('pointermove', (e) => {
  [mouseX, mouseY] = pointerPos(e);
  if (drag.agent) { drag.px = mouseX; drag.py = mouseY; }
});
canvas.addEventListener('pointerleave', () => { mouseX = -1e9; mouseY = -1e9; });
canvas.addEventListener('pointerdown', (e) => {
  const [x, y] = pointerPos(e);
  const id = hitTest(x, y);
  if (id < 0) return;
  drag.agent = agents.find(a => a.id === id) || null;
  if (drag.agent) {
    drag.px = x; drag.py = y;
    canvas.setPointerCapture(e.pointerId);
  }
});
const endDrag = () => { drag.agent = null; };
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);

document.querySelectorAll('.scene-btn').forEach(b =>
  b.addEventListener('click', () => enterScene(b.dataset.scene)));

const bindSlider = (id, fn) => {
  const el = document.getElementById(id);
  el.addEventListener('input', () => fn(+el.value));
};
bindSlider('count', v => {
  document.getElementById('countVal').textContent = v;
  let content = agents.filter(a => !a.isVoid && !a.leaving).length;
  while (content < v) { addAgent(); content++; }
  while (content > v) { removeAgent(); content--; }
});
bindSlider('gap', v => {
  config.gap = v;
  document.getElementById('gapVal').textContent = v;
});
bindSlider('corner', v => {
  config.cornerRadius = v;
  document.getElementById('cornerVal').textContent = v;
});
bindSlider('hover', v => {
  config.hoverBoost = v / 100;
  document.getElementById('hoverVal').textContent = (v / 100).toFixed(1) + '×';
});
document.getElementById('add').addEventListener('click', () => {
  document.getElementById('count').value = String(Math.min(42,
    agents.filter(a => !a.isVoid && !a.leaving).length + 1));
  addAgent();
  document.getElementById('countVal').textContent =
    document.getElementById('count').value;
});
document.getElementById('remove').addEventListener('click', () => {
  removeAgent();
  const n = Math.max(4, agents.filter(a => !a.isVoid && !a.leaving).length - 1);
  document.getElementById('count').value = String(n);
  document.getElementById('countVal').textContent = String(n);
});

/* --------------------------------------------------------------- START */

function init() {
  resize();
  // Spawn the founding flock in a loose ring (spawn may be random; every
  // frame after this is deterministic in the identities).
  for (let i = 0; i < config.count; i++) {
    const th = (i / config.count) * Math.PI * 2 + hash01(i, 7);
    const r = Math.min(W, H) * (0.18 + hash01(i, 8) * 0.2);
    const a = makeAgent(W / 2 + Math.cos(th) * r, H / 2 + Math.sin(th) * r);
    a.claim = a.baseClaim; // the founders arrive full-grown
    a.targetClaim = a.baseClaim;
    agents.push(a);
  }
  enterScene(config.scene);
  requestAnimationFrame(tick);
}

window.addEventListener('resize', resize);
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();

})();
</script>
</body>
</html>
